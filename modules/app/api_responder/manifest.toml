version = "1.0.0"
hardware_targets = ["bcm2712"]

# API responder — the minimal API-plane module. An API endpoint is a pure
# transform (request in, store reads, response out) served by a fluxor module
# over the store's request/response seam (the same seam sandbox exec uses).
# api_ingress writes /api-req/<id> and reads /api-resp/<id>; this module
# handles the op. `count:<prefix>` is a real store transform (it LISTs the
# store); `healthz` is the trivial case.

# Cadence-independent: it does no tick-based timekeeping, just polls its watch.
timer_class = "agnostic"

# The store pushes namespace.change events onto this input port. A module cannot
# open a channel itself, so the graph allocates one by self-wiring `status` ->
# `changes` (a 1-node cycle); the module passes the resulting channel handle to
# SUBSCRIBE and drains pushed events from it.
[[ports]]
name = "changes"
direction = "input"
content_type = "OctetStream"
buffer_size = 4096

# The self-edge source. The module never writes it — its sole role is to make
# the graph allocate the `changes` channel above (see fluxor-api.yaml).
[[ports]]
name = "status"
direction = "output"
content_type = "OctetStream"
buffer_size = 4096

[[resources]]
requires_contract = "storage.namespace"
access = "write"

[[resources]]
requires_contract = "storage.object"
access = "write"

[observability]
exempt = "Control-plane API responder — provider-driven, emits no telemetry stream"
