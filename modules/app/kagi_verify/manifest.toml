name = "kagi_verify"
version = "0.1.0"
description = "Chronicle connector for kagi's token_verify — record in, verified identity out"
type = "Transformer"
entry = "mod.rs"
edition = "2021"
hardware_targets = ["bcm2712", "linux"]

# The kagi seam, as a connector.
#
# Every Chronicle chain in this repo has the same shape: a SOURCE produces
# records, a DECISION decides one record at a time, and a CONNECTOR moves bytes
# to something outside the graph and hands back a record. `store_source` and
# `store_effect` are that pair for the control-plane store. This is the same
# role for kagi's `token_verify`: it decides NOTHING about authorization, it
# carries a credential out and a verified identity back.
#
# Why a connector and not a decision: verification is a signature check against
# a loaded key, which is neither a fold nor a comparison and could not be
# params. Why not a nanocloud module doing the check itself: kagi owns the
# identity protocols, and a second JOSE verifier here is a second place for "is
# this credential genuine" to be answered differently. The wire is kagi's own
# `auth_wire`, compiled from its published `kagi-common` tree rather than
# restated, so there is one definition of the wire.
#
# In:  a Chronicle record frame on `request_in`.
#        `credential_field` (default 8) holds the compact JWS; empty is legal
#        and yields `verify_err::MALFORMED` without troubling the verifier.
#        Fields 30..=39 are CARRY: echoed onto the reply with their number and
#        type, untouched. Ten of them, which is the whole correlation budget a
#        filter stage has.
# Out: one exchange per record to kagi's `token_verify` (a REQUESTER:
#      `request_out` -> `token_verify.request_in`, `token_verify.response_out`
#      -> `response_in`), and a Chronicle record on `response_out`:
#        1 = the request's own field 1 (i64), echoed
#        2 = status (i64, `verify_err`, 0 = OK; 255 = no typed answer)
#        3 = subject (bytes)     4 = issuer (bytes)
#        5 = audience (bytes)    6 = scope (bytes)
#        7 = expires_at (i64)    8 = suite (i64)
#        30..=39 = carry, echoed
#
# THE CALL. kagi's typed-operation shape (`typed_exchange.rs`, compiled from
# kagi-common): a request HEAD, method POST, empty target, headers and peer,
# granting a whole answer's response credit, its body exactly one
# `MSG_VERIFY_REQ` envelope; the answer a 200 whose body is one
# `MSG_VERIFY_RESP` envelope, a refusal verdict included. The exchange id is
# the correlation: the call's counter and this module's request port, so two
# connectors wired to one verifier each take only their own answers. An
# exchange that ends any other way — a refusal status, an ABORT, a body that
# is not one `MSG_VERIFY_RESP` — gives status 255, which is not OK, so the
# chain refuses it as it refuses a credential that did not verify; it is never
# dropped. A call the verifier loses to `LINK DOWN` is sent again, whole, after
# its `LINK UP`.
#
# `status` is a `verify_err` code, NOT an HTTP status. Mapping a refusal to a
# response is an authorization decision and belongs in params, which is the
# whole point of handing back the typed reason rather than a 401.
#
# KEY DELIVERY. kagi's verifier is PUSHED its keys on `verify_key` and answers
# ST_NO_KEY until one lands; nanocloud keeps its truth in the store, where
# `kagi_mint` stores the key kagi's `token_mint` announces as a `MSG_KEY_ADD`
# frame (at `/authn-keys/sa` by default). `key_paths` names the key sets this
# verifier trusts — up to four store keys, `,`-separated (default
# `/authn-keys/sa`): a cell's own ServiceAccount issuer and the key its mint
# signs with, when the two are kept apart, and a provisioned issuer beside
# them. Each frame is forwarded VERBATIM — never parsed, because the frame is
# kagi's and the moment nanocloud interprets it there are two readings of it —
# as one record of ONE `MSG_KEYSET_SNAPSHOT` on `key_out` (`[count u16]` then
# each frame's `KeyRecord` payload, its envelope checked and dropped). kagi
# takes a snapshot as the whole keyset, so the set is replaced, never
# accumulated: a key that leaves its path stops verifying at the next refresh.
# Re-read every few seconds and re-sent only when it changed. A path whose
# read the store has not decided publishes nothing that pass (a set without
# that key would refuse its every credential meanwhile); an absent path is
# simply not in the set; a frame that is not one whole `MSG_KEY_ADD` is left
# out (kagi refuses a snapshot with one bad record, all of it).
#
# `issuer`: the issuers a credential may name — one, or up to four
# `,`-separated. One is kagi's to hold the credential to (`expected_issuer`);
# with several, kagi is asked for none and the issuer it verified is held to
# the list here, a credential naming another refused WRONG_ISSUER. Empty
# accepts any issuer whose key is in the set.
#
# The store reads are direct `storage.object` GETs rather than a `store_source`
# edge: the keys are read on a timer, forwarded whole, and never watched, so a
# subscription and a graph edge would buy nothing. (A source CAN carry an
# opaque value — a `paths` entry of `.` is the whole record — which is what the
# endpoint addresses and this same key frame use elsewhere.)
#
# One request in flight at a time, by construction. The alternative is a
# correlation table, and the table is only worth its bounds check when the
# verifier is the chain's bottleneck — it is not; a signature check is
# microseconds and the store round-trips around it are not.
#
# NOT DONE, deliberately: proof-of-possession binding. `VerifyRequest` carries
# `method`/`uri` so a DPoP-style proof can be bound to the request it was
# presented with, and kagi's wire says they are "empty when the credential is
# not presented with a proof". This sends them empty: the API plane carries a
# bearer credential and no proof, so there is nothing for them to bind.
timer_class = "agnostic"

[[ports]]
name = "request_in"
direction = "input"
content_type = "OctetStream"
buffer_size = 16384
max_record = 8192
required = true
# Whole records: this module reads one frame per step and needs the boundary
# kept, so it asks for mailbox delivery on its own input.
framed = true

[[ports]]
name = "response_in"
direction = "input"
content_type = "ExchangeResponse"
buffer_size = 8192
max_record = 8192

[[ports]]
name = "request_out"
direction = "output"
content_type = "ExchangeRequest"
buffer_size = 8192
max_record = 8192

[[ports]]
name = "key_out"
direction = "output"
content_type = "OctetStream"
buffer_size = 16384
max_record = 8192

[[ports]]
name = "response_out"
direction = "output"
content_type = "OctetStream"
buffer_size = 16384
max_record = 8192

# READ-ONLY on the store. This module fetches only the verification keys
# named by `key_paths` and writes nothing: a connector that
# could write the keyset is a connector that could install a key it then
# accepts tokens against.
[[resources]]
requires_contract = "storage.object"
access = "read"

[observability]
metrics = ["verify_sent", "verify_ok", "verify_refused", "verify_dropped", "key_published"]
