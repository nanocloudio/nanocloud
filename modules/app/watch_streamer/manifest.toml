version = "1.0.0"
hardware_targets = ["bcm2712"]

# watch_streamer — ?watch=true as a PIC module. The k8s watch contract is a
# direct projection of storage.namespace: LIST at a fence revision, then the
# changes since it. This module serves it as long-poll over the
# request/response seam — given a prefix + a `since` revision it calls the
# storage.namespace CHANGES op (a synchronous windowed change-read) and
# returns the events newer than `since` plus the new fence; the client loops
# with the fence for the next batch. Pure store transform.

# Cadence-independent: it does no tick-based timekeeping, just polls its watch.
timer_class = "agnostic"

# The store pushes namespace.change events (on /watch-req/) onto this input port.
# A module cannot open a channel itself, so the graph allocates one by self-wiring
# `status` -> `changes` (a 1-node cycle); the module passes the resulting channel
# handle to SUBSCRIBE and drains pushed events from it.
[[ports]]
name = "changes"
direction = "input"
content_type = "OctetStream"
buffer_size = 4096

# The self-edge source. The module never writes it — its sole role is to make
# the graph allocate the `changes` channel above (see fluxor-watch.yaml).
[[ports]]
name = "status"
direction = "output"
content_type = "OctetStream"
buffer_size = 4096

[[resources]]
requires_contract = "storage.namespace"
access = "write"

[[resources]]
requires_contract = "storage.object"
access = "write"

[observability]
exempt = "Control-plane watch streamer — provider-driven, emits no telemetry stream"
