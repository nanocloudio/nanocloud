version = "1.0.0"
hardware_targets = ["bcm2712", "linux"]

# Store effect — the request/response half of the store connector.
#
# `store_source` is the subscription half: the store pushes and the graph runs.
# This is the other shape — a pipeline asks for a key and gets an answer, the
# client-side mirror of wave's `s3` driven mode, and what the apiserver read
# path needs. Deliberately SMALL: the smallest connector that can serve a read,
# rather than ten ops built ahead of a caller for them.
#
# Wire (Chronicle v1 record frames, both ports):
#   request_in   1 = cid (i64)    correlation, echoed verbatim
#                2 = op  (i64)    0 = NOOP, 1 = GET, 2 = EXISTS, 3 = PUT,
#                                 4 = DELETE. NOOP answers 204 and touches
#                                 nothing: a decision always yields an outcome
#                                 and Chronicle has no conditional fork, so
#                                 "no store operation needed" must be one.
#                                 17 = TAKE: answer the value and delete it,
#                                 conditional on the revision read (404 when
#                                 absent or taken first) — a single-use claim
#                                 in one step.
#                3, 17, 18 = KEY PARTS (bytes), joined after `key_prefix`. An
#                     owner key `<ns>/<owner>` is two projected fields and a
#                     literal separator, and the VM cannot concatenate.
#                4..16, then 80..99 = value PARTS (bytes), joined in field
#                     order (4..16 first) — PUT only.
#                     The VM cannot concatenate, so joining bytes is done here;
#                     it is the writev of this seam and carries no domain
#                     meaning. Absent parts contribute nothing.
#                30..39 = CARRY-THROUGH (bytes), echoed verbatim into the reply.
#                     What lets a linear graph do read-then-decide: without
#                     Chronicle's effect call/join (another repo's item, not
#                     built) the reply is all a downstream decision sees, so the
#                     request's own context would be lost across the effect.
#                     Narrow on purpose — bounded, opaque, one effect only.
#   response_out 1 = cid    (i64)
#                2 = status (i64)  200 found | 404 absent | 400 malformed
#                3 = value  (bytes) the object, empty for EXISTS or 404
#
# The status is the STORE's, not this module's opinion of it — the registry
# example's "a 404 for a missing blob is loam's 404" applied here: the graph
# never learns whether an object exists, so it cannot disagree with the store.
# FIELD MAP (disjoint on purpose, so widening one range can never start
# silently consuming another's fields):
#     1,2,3   cid / op / key
#     4..16   value parts
#     80..99  twenty more value parts, joined after 16 — a record of more
#             parts than thirteen (a Pod's node ask)
#     17,18   extra key parts, joined after field 3
#     25..27  three MORE key parts, for keys the first three cannot build —
#             `/authz/<subject>/<verb>/<resource>` is five parts and two
#             literal separators. The gap before the carry range at 30 is
#             deliberate: widening either range must never start echoing the
#             other's fields.
#     20..22  reserved for store_source's expansion trailer
#     30..39  carry-through (echoed with their TYPE)
#     40..49  `paths` projected from a GET, as bytes
#     50..58  `ints` projected from a GET, as i64 (absent -> 0) — at most
#             nine; a tenth path is not projected, and a decision reading
#             its field would silently produce nothing
#     28      expected revision (i64) for REPLACE / a conditional DELETE
#     59      reply: the key's store revision (i64, 0 = absent), every reply,
#             when `revision = 1`
# Ops: 0 NOOP, 1 GET, 2 EXISTS, 3 PUT (204 when unchanged), 4 DELETE,
# 7 LIST (the key is a PREFIX; answers 200 with the children's last segments
# joined by `list_sep`, default ","). LIST is the request-driven counterpart to
# `store_source`'s `list_children`: a collection GET needs the names under a
# prefix and the VM has no iteration, so walking one is a connector's job by
# construction. An empty prefix answers 200 with an EMPTY value, never 404 —
# the collection exists and is empty, and 404 tells a client the resource kind
# is unknown. A listing that would overflow the reply REFUSES with 500 rather
# than answering a short list, which reads as a complete one — and so does one
# whose object cannot be read, for the same reason.
# `list_values = 1` answers the children's VALUES instead of their names, and
# `list_open`/`list_close` wrap the result in literals: together they build a
# Kubernetes `List` envelope without a store round trip per item and without a
# VM that can concatenate. The literals are PARAMS because which envelope a
# listing wears is the graph's choice, not this module's.
# 5 PATCH (set the scalar at dotted path field 19 to field 4 — an i64 is
# rendered as digits — inside the object at the key; 404 when absent, 413 when
# it exists but is past a record),
# 6 MERGE (upsert the joined `k=v;…` value parts into the flat record at the
# key, leaving every other key alone; an empty value removes a key). With an
# expected revision in field 28 the merge is into THAT record: 409 when it
# moved or is gone, so a merge never recreates a record another writer
# removed.
# 12 COUNT (the key is a PREFIX; answers 200 with the number of keys under it
# at field 45). `count_where` (a decision container, `{hex: …}`) counts only the children a decision
# keeps: each child is handed to it as a reply would answer it — field 3 the
# key's tail past the prefix, the request's carry (30..39, 254), this node's
# `paths` / `ints` projected out of the child — and counts when the decision
# constructs a message. A walk that fails, a child present but unreadable, or
# a decision that does not decide answers 500: a short count reads as a
# complete one. The container is small (CW_CONT); one past it is refused at
# load, and every COUNT answers 500.
# `wall = 1` hands the fused decision the wall clock (Unix ms) at field 60.
# `flat = 1` reads `k=v;k=v` records for `paths`/`ints`.
# 18 DROP_EACH (one key under several collections: for each name in the
# value, comma-separated, delete-if-present `<key_prefix><name>/<key>`; 200).
# A Pod's node records, keyed by its uid in a dozen collections, go together.
# 8 CREATE (PUT under the store's ABSENT precondition: 200 created, 409 the key
# already existed), 9 REPLACE (PUT under ETAG: conditional on field 28, or on
# the body's `rv_path` when 28 is absent; 409 when the key moved; an ordinary
# PUT when no revision is stated). The precondition is evaluated by the store
# at ONE linearization point — a probe followed by a write is the race these
# exist to close. DELETE with field 28 set is conditional the same way.
# `rv_path = <a.b>` stamps the key's store revision into GET and LIST-values
# answers at that two-segment path (`metadata.resourceVersion`), as a string.
# Key parts (3, 17, 18, 25..27) may be INTEGERS and render as decimal, like
# value parts: an allocator keys its claim by the address it computed. `ints`
# paths take `.` (the whole value) and `!<mod>` (`.!ip4`), as in store_source.
timer_class = "agnostic"

# The fused decision (`decision` param) runs Chronicle's engine with the whole
# pinned CEL extension surface — the same `full` feature set Chronicle's own
# `decision` module builds with, so a param that runs there runs here.
[[variant]]
name     = "full"
features = ["strings", "math", "encoders", "bindings"]
default  = true

[[ports]]
name = "request_in"
direction = "input"
content_type = "OctetStream"
buffer_size = 16384
max_record = 8192
required = true
# NOT declared `framed`: either edge shape works. On a byte stream the module
# self-frames (peeks the record header and consumes exactly one record); on a
# mailbox (`buffer_group`) it reads the record whole. Wire a stream from a
# producer that emits a page of records per step (store_source), so a page is
# not stalled a record at a time.

[[ports]]
name = "response_out"
direction = "output"
content_type = "OctetStream"
# Four records of reply ahead of the next stage. A control plane wires this
# port some fifty times, and every ring comes out of the runtime's one 8 MiB
# channel arena: a wider ring here is what leaves no room for the rest.
buffer_size = 32768
max_record = 8192
# Optional: a TERMINAL writer has nobody to answer, and requiring a sink would
# put a `debug` node in a production graph purely to swallow replies. Wire it
# when a later stage needs the status; leave it unwired at the end of a chain.
required = false
# NOT declared `framed`. Whether this edge needs mailbox delivery is the
# CONSUMER's property, not this port's: a Chronicle engine SELF-FRAMES over a
# byte stream (io_core::admit_frame peeks, reads the length out of the header,
# and consumes exactly that many bytes), so a mailbox channel breaks it — its
# partial read is illegal there and records vanish silently. A consumer that
# reads whole records instead (this repo's modules, `debug`) does need mailbox,
# and declares it on its own INPUT port.

[[resources]]
requires_contract = "storage.object"
access = "write"

# OP_LIST walks a prefix, which is the namespace contract, not the object one.
# READ only: this module lists and reads through it, and never subscribes or
# writes a namespace.
[[resources]]
requires_contract = "storage.namespace"
access = "read"

[observability]
exempt = "a read-only store effect at the graph edge — observed through the store it reads and the engine it answers"
