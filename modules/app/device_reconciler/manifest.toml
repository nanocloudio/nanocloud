version = "1.0.0"
hardware_targets = ["bcm2712"]

# Device reconciler: provisions a SPIFFE identity for every Device CR. It
# consumes the control-plane store through the standard fluxor storage
# contracts — `storage.namespace` LIST/SUBSCRIBE + `storage.object` GET/PUT —
# driving the watch -> recompute -> conditional-write loop: SUBSCRIBE
# /devices.nanocloud.io/ (and /cert-resp/), write a /cert-req/ for each
# Device, and once cert_manager mints /cert-resp/, project the provisioned
# identity at /deviceidentities.nanocloud.io/<ns>/<name>. Reuses cert_manager
# unchanged as the issuer — no new capability surface.

# Cadence-independent: it does no tick-based timekeeping, just polls its watch.
timer_class = "agnostic"

# The store pushes namespace.change events onto this input port (its channel is
# the SUBSCRIBE sink); the module reads them to detect change and re-reconcile.
# A module cannot open a channel itself, so the graph allocates one for this
# port by self-wiring `status` → `changes` (a 1-node cycle); the module passes
# the resulting channel handle to SUBSCRIBE and drains pushed events from it.
[[ports]]
name = "changes"
direction = "input"
content_type = "OctetStream"
buffer_size = 4096

# The self-edge source. The module never writes it — its sole role is to make
# the graph allocate the `changes` channel above (see fluxor-device.yaml).
[[ports]]
name = "status"
direction = "output"
content_type = "OctetStream"
buffer_size = 4096

[[resources]]
requires_contract = "storage.namespace"
access = "write"

[[resources]]
requires_contract = "storage.object"
access = "write"

# Module-scope observability — exempt: it emits no sustained byte stream; its
# observable is the reconcile count and the identity keys it writes.
[observability]
exempt = "Control-plane reconciler — provider-driven, emits no telemetry stream"
