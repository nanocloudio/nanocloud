version = "1.0.0"
hardware_targets = ["bcm2712"]

# CNI IPAM — the CNI IP-allocation logic as a PIC module. Pure store
# transform, no host facts: watch /ipam-request/<uid>, allocate the lowest
# free host IP from the pool CIDR, and record the lease. Only the *decision*
# (which IP) is made here; the *effect* (attaching the veth, setting the
# address) is the node's network backend, which reads the lease.

# Cadence-independent: it does no tick-based timekeeping, just polls its watch.
timer_class = "agnostic"

# The store pushes namespace.change events onto this input port. A module cannot
# open a channel itself, so the graph allocates one by self-wiring `status` ->
# `changes` (a 1-node cycle); the module passes the resulting channel handle to
# SUBSCRIBE and drains pushed events from it.
[[ports]]
name = "changes"
direction = "input"
content_type = "OctetStream"
buffer_size = 4096

# The self-edge source. The module never writes it — its sole role is to make
# the graph allocate the `changes` channel above (see fluxor-ipam.yaml).
[[ports]]
name = "status"
direction = "output"
content_type = "OctetStream"
buffer_size = 4096

[[resources]]
requires_contract = "storage.namespace"
access = "write"

[[resources]]
requires_contract = "storage.object"
access = "write"

[observability]
exempt = "Control-plane IPAM — provider-driven, emits no telemetry stream"
