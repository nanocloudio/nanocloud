version = "1.0.0"
hardware_targets = ["bcm2712"]

# Authn — the identity-extraction decision as a PIC module (the API plane's
# auth chain: tls → api_ingress → authn → rbac_gate → ...). The TLS handshake
# and the mTLS peer identity (SPIFFE-style) are the fluxor `tls` foundation's
# job — a host fact. The *logic* here is mapping a credential — an mTLS peer
# identity, or a bearer ServiceAccount token — to a Kubernetes identity. This
# module watches /authn-req/, resolves a peer identity through /peer-ids/, and
# verifies a bearer token against the keyset published at /authn-keys/.

# Cadence-independent: it does no tick-based timekeeping, just polls its watch.
timer_class = "agnostic"

# The store pushes namespace.change events onto this input port. A module cannot
# open a channel itself, so the graph allocates one by self-wiring `status` ->
# `changes` (a 1-node cycle); the module passes the resulting channel handle to
# SUBSCRIBE and drains pushed events from it.
[[ports]]
name = "changes"
direction = "input"
content_type = "OctetStream"
buffer_size = 4096

# The self-edge source. The module never writes it — its sole role is to make
# the graph allocate the `changes` channel above (see fluxor-authn.yaml).
[[ports]]
name = "status"
direction = "output"
content_type = "OctetStream"
buffer_size = 4096

[[resources]]
requires_contract = "storage.namespace"
access = "write"

[[resources]]
requires_contract = "storage.object"
access = "write"

[observability]
exempt = "Control-plane authenticator — provider-driven, emits no telemetry stream"
