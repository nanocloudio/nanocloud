version = "1.0.0"
hardware_targets = ["bcm2712", "linux"]
# mod.rs is a SYMLINK to ../store_effect/mod.rs: the same source, built with
# `stamp_heap`. (A symlink, not `entry = "../store_effect/mod.rs"`: the build's
# staleness check walks the module's own directory, so an entry outside it
# never rebuilt.)
timer_class = "agnostic"

# Store stamped — store_effect with a 4 MiB heap: one controller object on
# it at a time. A writer whose whole-object writes follow a document
# `schema` (`stamp = 1`): a Pod or ReplicaSet it creates is stamped with a
# uid and creationTimestamp, and keeps them when rewritten, as an object the
# API created does — the stamp builds the object on the heap. And a READER of
# controller objects past a record (a Pod with a real template): its GET
# projections and COUNT predicates read the object whole there, up to the
# API's largest (3 MiB), where store_effect would answer them empty. A write
# that SPLICES a template (fields 70/71) holds more at once and is
# store_big's (16 MiB). store_effect has none. A separate module TYPE, not a variant: one graph
# image carries one build of a type. Params, ports and frame are
# store_effect's; see its manifest.

[[variant]]
name     = "full"
features = ["strings", "math", "encoders", "bindings", "stamp_heap"]
default  = true

[[ports]]
name = "request_in"
direction = "input"
content_type = "OctetStream"
buffer_size = 16384
max_record = 8192
required = true
# NOT declared `framed`: either edge shape works. On a byte stream the module
# self-frames (peeks the record header and consumes exactly one record); on a
# mailbox (`buffer_group`) it reads the record whole. Wire a stream from a
# producer that emits a page of records per step (store_source), so a page is
# not stalled a record at a time.

[[ports]]
name = "response_out"
direction = "output"
content_type = "OctetStream"
buffer_size = 65536
max_record = 8192
# Optional: a TERMINAL writer has nobody to answer, and requiring a sink would
# put a `debug` node in a production graph purely to swallow replies. Wire it
# when a later stage needs the status; leave it unwired at the end of a chain.
required = false
# NOT declared `framed`. Whether this edge needs mailbox delivery is the
# CONSUMER's property, not this port's: a Chronicle engine SELF-FRAMES over a
# byte stream (io_core::admit_frame peeks, reads the length out of the header,
# and consumes exactly that many bytes), so a mailbox channel breaks it — its
# partial read is illegal there and records vanish silently. A consumer that
# reads whole records instead (this repo's modules, `debug`) does need mailbox,
# and declares it on its own INPUT port.

[[resources]]
requires_contract = "storage.object"
access = "write"

# OP_LIST walks a prefix, which is the namespace contract, not the object one.
# READ only: this module lists and reads through it, and never subscribes or
# writes a namespace.
[[resources]]
requires_contract = "storage.namespace"
access = "read"

[observability]
exempt = "a read-only store effect at the graph edge — observed through the store it reads and the engine it answers"
