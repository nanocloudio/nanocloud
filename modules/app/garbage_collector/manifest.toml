version = "1.0.0"
hardware_targets = ["bcm2712"]

# Garbage collector — the ownerRef cascade as a PIC
# module. It SUBSCRIBEs the workload prefixes and deletes any object whose owner
# no longer exists — a ReplicaSet whose Deployment is gone, a Pod whose
# ReplicaSet is gone. Over successive passes this cascades: delete a Deployment
# and its ReplicaSet then its Pods are collected. The delete half of the
# workload lifecycle, complementing deployment_reconciler + replicaset_reconciler.

# Cadence-independent: it does no tick-based timekeeping, just polls its watch.
timer_class = "agnostic"

# The store pushes namespace.change events onto this input port. A module cannot
# open a channel itself, so the graph allocates one by self-wiring `status` ->
# `changes` (a 1-node cycle); the module passes the resulting channel handle to
# SUBSCRIBE and drains pushed events from it.
[[ports]]
name = "changes"
direction = "input"
content_type = "OctetStream"
buffer_size = 4096

# The self-edge source. The module never writes it — its sole role is to make
# the graph allocate the `changes` channel above (see fluxor-workload-lifecycle.yaml).
[[ports]]
name = "status"
direction = "output"
content_type = "OctetStream"
buffer_size = 4096

[[resources]]
requires_contract = "storage.namespace"
access = "write"

[[resources]]
requires_contract = "storage.object"
access = "write"

# Module-scope observability — exempt: it emits no sustained byte stream; its
# observable is the orphaned keys it removes.
[observability]
exempt = "Control-plane GC — provider-driven, emits no telemetry stream"
