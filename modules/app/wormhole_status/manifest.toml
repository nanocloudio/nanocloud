name = "wormhole_status"
version = "0.1.0"
description = "Wormhole's VIP bindings → one flat row per Service, its phase and address per family, for the load-balancer status chain"
type = "Transformer"
entry = "mod.rs"
edition = "2021"
hardware_targets = ["bcm2712", "linux"]

# The read half of the Wormhole projection (rfc_lb_vip §6.1, §11.6): the ONE
# writer of `/wh-vip/`.
#
# A Service's `status.loadBalancer` says its address is reachable, which only
# the VIP's admitted readiness can say. Wormhole's VIP controller keeps that
# readiness as a `VipBinding` record (WHR1 kind 5, Wormhole's §11.6 layout)
# per Service address family at
#   /wh/<tenant hex>/<service hex>/vip/<4|6>
# (the identities wormhole_emit derives; Wormhole writes these keys, never
# nanocloud — wormhole_emit writes only `…/gen/` and `…/active` of a
# Service). The VM cannot decode a binary record, so this module does, with
# Wormhole's own strict decoder (`target/fluxor/wormhole-common/traffic/`,
# through `_shared/wormhole_traffic.rs`), and states what it says:
#   /wh-vip/<ns>/<svc> = p4=<phase>;a4=<address>;p6=<phase>;a6=<address>
# a phase as its §11.6 number (ACTIVE = 6, DRAINING = 7, …), 0 and no address
# for a family with no binding, and `e<4|6>=invalid` for one that does not
# decode, is another Service's, or is of the other family. Whether the status
# may name the address is the chain's (wormhole.plan `wh_status`: ACTIVE or
# DRAINING); this module decides nothing.
#
# Which Services: those wormhole_emit has published (`/wh-status/<ns>/<svc>`,
# its index), so a binding is only ever read for a Service nanocloud
# declared. A row whose Service is no longer declared, or that has no
# binding left, is deleted. Put-if-changed, one write a pass.
#
# No parameters.
# Reads the clock only to look again when a subscription was refused or a
# pass failed.
timer_class = "wall_clock"

[[ports]]
name = "status"
direction = "output"
content_type = "OctetStream"

[[resources]]
requires_contract = "storage.namespace"
access = "read"

[[resources]]
requires_contract = "storage.object"
access = "write"

# Both subscriptions ring the module's one kernel event.
[[resources]]
requires_contract = "event"
access = "write"

[observability]
exempt = "control-plane projection — one store action per change, observed through `/wh-vip/` and the Service status it feeds"

# Store subscriptions an instance opens: /wh/ (Wormhole's records) and
# /wh-status/ (what is declared) — its inputs, never /wh-vip/, its output.
[capacities]
store_subscriptions = 2
store_subscribers = 1
