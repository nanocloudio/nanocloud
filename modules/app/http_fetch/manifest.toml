name = "http_fetch"
version = "1.0.0"
description = "Chronicle connector for an HTTP origin — a record in, a GET out on the net pair, the answer back as a record or a digest-verified file"
type = "Transformer"
entry = "mod.rs"
edition = "2021"
hardware_targets = ["bcm2712", "linux"]

# `store_effect`'s role for a remote HTTP origin: a registry, an artifact
# server. The chain decides WHAT to fetch (params — the OCI distribution API is
# `image.uproc`); this carries one GET at a time over its net pair (through
# `tls` in client mode, or straight to `linux_net`) and hands back what the
# chain asked of the answer. It knows no API: the path, the Accept header, the
# file name, the digest and the JSON members to read are the record's.
#
# In (`request_in`, a byte stream, self-framed, or a mailbox):
#   1      = correlation (i64), echoed
#   2      = sink (i64): 1 the answer's JSON members come back in the reply;
#            2 the body lands in `<dir>/<file>`, sha256-verified, fsynced;
#            0 = no request (a decision's filter)
#   3..6   = the path, in parts joined in field order
#   7      = Accept
#   8..10  = the file name (sink 2), in parts
#   11     = the expected sha256, 64 hex (required for sink 2; checked for 1
#            when present)
#   12, 22 = skip: a store key, in two parts (a prefix and a name); when it
#            exists the request is answered
#            304 without a byte on the wire. Level-triggered chains re-offer
#            work each scan — this is how a layer is fetched once.
#   13     = expected size (i64): the body must be exactly that; with the
#            `chunk_bytes` param a file is fetched in Range chunks of it
#   14..21 = JSON queries over the body (sink 1), each answered at 40..47:
#            dotted paths, `a[].b[!mod]` collect, `a[k=v].b` select — see
#            `_shared/jsonq.rs`
#   30..39 = carry, echoed with number and type
# Out (`response_out`): 1 correlation, 2 status (the HTTP status; 304 skipped;
#   422 digest or size mismatch; 0 when the origin could not be reached after
#   retries), 3 bytes received (i64), 4 Content-Type, 5 the sha256 of the
#   body as 64 hex (a 200 answered in the reply; empty otherwise) — what a
#   manifest fetched by tag IS, so its chain keys it by digest — 40..47 the
#   answers, 30..39 carry.
#
# A 401 with a Bearer challenge (`WWW-Authenticate: Bearer realm=…,service=…,
# scope=…` — the OCI distribution token flow, RFC 6750) is answered here, not
# by the chain: one GET to the realm (it may be another authority; a `ca_dns`
# tls names each dial by it) for `?service=…&scope=…`, with `Authorization:
# Basic` from the `credentials` param's store key when it names one (the
# value `user:password`; anonymous otherwise — secrets are never config), its
# `token` / `access_token` held and the request sent again with
# `Authorization: Bearer`. The held token rides every later request; one
# refresh per request, re-armed by each 2xx, so a Range pull outlives a
# token's expiry. No token from the realm answers 401.
#
# A body comes framed by Content-Length or the chunked transfer coding.
#
# A transport failure (no connection, a dropped stream, a timeout) is retried
# with exponential backoff before it is answered 0: six attempts once the
# origin has answered some of the request (a transfer cut off mid-way resumes
# from what it has), two while it has answered nothing at all — an origin
# that is not there is the chain's to back off from (an image pull's
# ImagePullBackOff, image_back.uproc), not this connector's to wait out while
# every request behind it waits too. An HTTP answer is final and goes
# straight back.
timer_class = "wall_clock"

[[ports]]
name = "net_in"
direction = "input"
content_type = "NetProto"
buffer_size = 65536
max_record = 8600
required = true

[[ports]]
name = "net_out"
direction = "output"
content_type = "NetProto"
buffer_size = 16384
max_record = 8600
required = true

[[ports]]
name = "request_in"
index = 1
direction = "input"
content_type = "OctetStream"
buffer_size = 16384
max_record = 8192

[[ports]]
name = "response_out"
index = 1
direction = "output"
content_type = "OctetStream"
buffer_size = 16384
max_record = 8192

[[resources]]
requires_contract = "storage.object"
access = "read"

[[resources]]
requires_contract = "fs"
access = "write"

[observability]
exempt = "control-plane fetch connector — discrete request/answer records, not a sustained byte data path"
