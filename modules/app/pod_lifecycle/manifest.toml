version = "1.0.0"
hardware_targets = ["bcm2712"]

# Pod lifecycle — the kubelet DECISION half as a module. It is the state
# machine over pod specs — the "what to run, in what lifecycle phase"
# decision. It watches /pod-specs/ (what the control plane wants running, with
# the materialized bundle) and
# /sandbox-status/ (what the sandbox is doing), and drives the effect the way
# every other module does: it projects /sandboxes/ (consumed by
# sandbox_runner, which owns the privileged runtime EFFECT) and writes
# /pod-lifecycle-status/ back. Decision here, effect (namespace surgery) there
# — the module never touches a privileged surface, so it needs only the
# storage contracts.
#
# The full pipeline: nanocloud materializes the bundle + projects /pod-specs/ ->
# pod_lifecycle projects /sandboxes/ -> sandbox_runner drives the oci contract +
# writes /sandbox-status/ -> pod_lifecycle maps that to a pod phase.

# Wall-clock timekeeping: kill-with-grace escalation and restart-backoff
# deadlines are measured against the monotonic
# clock (`dev_millis`, TIMER::MILLIS — uptime ms), not a step count, so a
# variable/relaxed scheduler cadence only changes when we sample, never the
# elapsed we measure. Safe on an adaptive-tick domain.
timer_class = "wall_clock"

# The store pushes namespace.change events onto this input port. A module cannot
# open a channel itself, so the graph allocates one by self-wiring `status` ->
# `changes` (a 1-node cycle); the module passes the resulting channel handle to
# SUBSCRIBE and drains pushed events from it.
[[ports]]
name = "changes"
direction = "input"
content_type = "OctetStream"
buffer_size = 4096

# The self-edge source. The module never writes it — its sole role is to make
# the graph allocate the `changes` channel above (see fluxor-podlifecycle.yaml).
[[ports]]
name = "status"
direction = "output"
content_type = "OctetStream"
buffer_size = 4096

[[resources]]
requires_contract = "storage.namespace"
access = "write"

[[resources]]
requires_contract = "storage.object"
access = "write"

[observability]
exempt = "Control-plane decision state machine — provider-driven, emits no telemetry stream"
