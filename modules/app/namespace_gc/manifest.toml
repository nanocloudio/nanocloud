version = "1.0.0"
hardware_targets = ["bcm2712"]

# Namespace GC — the namespace controller's teardown as a
# PIC module. It SUBSCRIBEs /namespaces/, and for a namespace marked
# phase=Terminating deletes every object under it across all namespaced resource
# prefixes (/pods/<ns>/, /deployments.apps/<ns>/, /configmaps/<ns>/, …), then —
# once empty — removes the namespace record itself (the finalizer). Objects in
# other namespaces are untouched.

# Cadence-independent: it does no tick-based timekeeping, just polls its watch.
timer_class = "agnostic"

# The store pushes namespace.change events onto this input port. A module cannot
# open a channel itself, so the graph allocates one by self-wiring `status` ->
# `changes` (a 1-node cycle); the module passes the resulting channel handle to
# SUBSCRIBE and drains pushed events from it.
[[ports]]
name = "changes"
direction = "input"
content_type = "OctetStream"
buffer_size = 4096

# The self-edge source. The module never writes it — its sole role is to make
# the graph allocate the `changes` channel above (see fluxor-namespace-gc.yaml).
[[ports]]
name = "status"
direction = "output"
content_type = "OctetStream"
buffer_size = 4096

[[resources]]
requires_contract = "storage.namespace"
access = "write"

[[resources]]
requires_contract = "storage.object"
access = "write"

# Module-scope observability — exempt: it emits no sustained byte stream; its
# observable is the objects it deletes when a namespace terminates.
[observability]
exempt = "Control-plane namespace GC — provider-driven, emits no telemetry stream"
