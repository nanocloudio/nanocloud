version = "1.0.0"
hardware_targets = ["bcm2712"]

# Route compiler (an edge-route compiler reconciler, sibling of
# proxy_compiler). Watches /routes/ (+ /route-status/ for the validated gate)
# and /endpoints/, resolves each Route's service to its ready backends, and
# emits ONE KEY PER ROUTE carrying the full backend set to
# /dataplane/edge/<ns>/<name>. The `http`-module edge SUBSCRIBEs that prefix
# and populates its DynRoute table. Decision here, effect there — a pure
# store-transform.

# Cadence-independent: no tick-based timekeeping — polls its watches and
# re-compiles on change.
timer_class = "agnostic"

# The store pushes namespace.change events onto this input port. A module
# cannot open a channel itself, so the graph allocates one by self-wiring
# `status` -> `changes` (a 1-node cycle); the module passes the resulting
# channel handle to SUBSCRIBE and drains pushed events from it.
[[ports]]
name = "changes"
direction = "input"
content_type = "OctetStream"
buffer_size = 4096

# The self-edge source. The module never writes it — its sole role is to
# make the graph allocate the `changes` channel above
# (see fluxor-route-compiler.yaml).
[[ports]]
name = "status"
direction = "output"
content_type = "OctetStream"
buffer_size = 4096

# The control-plane store — routes + status + endpoints in, compiled edge
# rows out. A compiler is a writer (unlike the http edge consumer, which
# holds only a read grant): it owns the /dataplane/edge/ prefix and its
# own /route-compiler-status key.
[[resources]]
requires_contract = "storage.namespace"
access = "write"

[[resources]]
requires_contract = "storage.object"
access = "write"

[observability]
exempt = "Control-plane compiler — provider-driven, emits no telemetry stream"
