version = "1.0.0"
hardware_targets = ["bcm2712"]

# cert_manager — nanocloud's ONE-SHOT cert minting service as a PIC module (NOT the reconciler-style cert-manager.io controller:
# a request mints a fresh cert+key on the spot and returns it). On start it
# self-generates a CA keypair, deposits the CA private key in the kernel
# KEY_VAULT (contract 0x0010, an infra contract), and publishes a self-signed CA
# cert at /ca-cert. Each /cert-req/ mints a leaf keypair, builds a real X.509
# certificate (in-module ASN.1 DER), signs the TBS with the CA key BY HANDLE
# (the CA private key never re-enters the module), and returns /cert-resp/ with
# the leaf cert + key. No new capability surface — existing fluxor crypto only.

# Cadence-independent: it does no tick-based timekeeping, just polls its watch.
timer_class = "agnostic"

# The store pushes namespace.change events onto this input port. A module cannot
# open a channel itself, so the graph allocates one by self-wiring `status` ->
# `changes` (a 1-node cycle); the module passes the resulting channel handle to
# SUBSCRIBE and drains pushed events from it.
[[ports]]
name = "changes"
direction = "input"
content_type = "OctetStream"
buffer_size = 4096

# The self-edge source. The module never writes it — its sole role is to make
# the graph allocate the `changes` channel above (see fluxor-cert-manager.yaml).
[[ports]]
name = "status"
direction = "output"
content_type = "OctetStream"
buffer_size = 4096

# KEY_VAULT (contract 0x0010) is an infra contract — implicitly granted, so it
# needs no requires_contract entry.
[[resources]]
requires_contract = "storage.namespace"
access = "write"

[[resources]]
requires_contract = "storage.object"
access = "write"

# Module-scope observability — exempt: it emits no sustained byte stream; its
# observable is the certificates it mints.
[observability]
exempt = "Control-plane cert minter — provider-driven, emits no telemetry stream"
