version = "1.0.0"
hardware_targets = ["bcm2712"]

# Kubernetes request decoder — the typed seam between wave's HTTP fan-out and
# Chronicle's engines.
#
# Chronicle's record frame is flat, so it cannot read `metadata.name` out of
# nested Kubernetes JSON, scan a header block for a name, or split a value on a
# space. Those are ordinary domain concerns, and domain logic lives in compiled
# per-domain modules composed as graph nodes — the relationship wave's `s3` has
# to the OCI registry example. This is nanocloud's counterpart.
#
# It no longer includes PATH SPLITTING as a reason. `rd::UNTIL_OPT` reads a
# delimited field and may run out, so N reads take a path of up to N segments
# and pad the rest — the thing that was missing was never iteration, it was a
# reader allowed to reach the end. That work could move to a decode program;
# the JSON and header work could not, so the module stays either way.
#
# It reshapes bytes and decides nothing: no routing, no authorization, no
# admission meaning. Those stay in params, which is what keeps the logic data.
#
# In:  wave HttpRequest envelope on `req_in`
#        [conn_id u16][stream_id u16][method u8][flags u8]
#        [path_len u16][hdr_len u16][body_len u16] then path, headers, body
# Out: a Chronicle v1 record frame on `record_out`
#        [count u8] then count x [number u8][type u8][len u16 LE][payload]
#        1 = wave_request_id  (i64) — the first FOUR envelope bytes, opaque
#        2 = method           (i64)
#        3 = resource         (bytes)
#        4 = namespace        (bytes)
#        5 = name             (bytes)
#        6 = body             (bytes, truncated at `max_body`)
#        7 = store key         (bytes) `/<resource>/<ns>/<name>`
#        8 = credential        (bytes) bearer token, scheme stripped, may be empty
#        9 = request target    (bytes) the path, WITHOUT the query string
#       10 = query            (bytes) everything after the first `?`
#       11 = watch            (i64)   1 when the query says `watch=true`
#       12 = peer             (bytes) `peer:<fingerprint-hex>`, the verified mTLS
#            peer. The PREFIX is the security property: two authentication
#            methods that could produce the same subject string would let a
#            binding written for one silently grant the other. Empty on
#            plaintext. Read from wave's peer-identity TRAILER (flag
#            0x02), which sits past `body_len` where a client cannot reach it —
#            a header carrying this would be forgeable.
#
# `passthrough = 1` also emits a frame for a path that is NOT a Kubernetes
# resource path — discovery documents and the like — with resource, namespace,
# name and key EMPTY and the target at 9. Off by default: such a frame is a lie
# to anything that reads it as a resource, and it is only safe in a graph whose
# first decision answers by TARGET and refuses everything it does not know.
#
# Field 1 is the four correlation bytes carried whole and never re-split, per
# webhook.md's "shared invocation context": conn_id alone mis-routes as soon as
# a client opens parallel HTTP/2 streams.

timer_class = "agnostic"

[[ports]]
name = "req_in"
direction = "input"
content_type = "HttpRequest"
buffer_size = 16384
max_record = 8192
required = true

[[ports]]
name = "record_out"
direction = "output"
content_type = "OctetStream"
buffer_size = 16384
max_record = 8192
required = true
# NOT declared `framed`. Whether this edge needs mailbox delivery is the
# CONSUMER's property, not this port's: a Chronicle engine SELF-FRAMES over a
# byte stream (io_core::admit_frame peeks, reads the length out of the header,
# and consumes exactly that many bytes), so a mailbox channel breaks it — its
# partial read is illegal there and records vanish silently. A consumer that
# reads whole records instead (this repo's modules, `debug`) does need mailbox,
# and declares it on its own INPUT port.

[observability]
exempt = "a pure byte reshaper on the request path — observed through the wave envelope it consumes and the engine it feeds"
