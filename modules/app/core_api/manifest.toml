version = "1.0.0"
hardware_targets = ["bcm2712"]

# core_api — core/v1 CRUD as a PIC module (the last link of the API write
# path: … → admission → core_api). A k8s API handler is a pure transform — request in, store
# read/CAS-write, response out. core_api serves get/list/create/ update/delete
# on objects keyed at /<resource>/<ns>/<name> in the store.

# Cadence-independent: it does no tick-based timekeeping, just polls its watch.
timer_class = "agnostic"

# The store pushes namespace.change events onto this input port. A module cannot
# open a channel itself, so the graph allocates one by self-wiring `status` ->
# `changes` (a 1-node cycle); the module passes the resulting channel handle to
# SUBSCRIBE and drains pushed events from it.
[[ports]]
name = "changes"
direction = "input"
content_type = "OctetStream"
buffer_size = 4096

# The self-edge source. The module never writes it — its sole role is to make
# the graph allocate the `changes` channel above (see fluxor-coreapi.yaml).
[[ports]]
name = "status"
direction = "output"
content_type = "OctetStream"
buffer_size = 4096

[[resources]]
requires_contract = "storage.namespace"
access = "write"

[[resources]]
requires_contract = "storage.object"
access = "write"

[observability]
exempt = "Control-plane CRUD handler — provider-driven, emits no telemetry stream"
