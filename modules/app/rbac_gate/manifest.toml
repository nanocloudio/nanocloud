version = "1.0.0"
hardware_targets = ["bcm2712"]

# RBAC gate — the authorization decision as a PIC module. Given an
# authenticated identity plus the (verb, resource) it wants, decide allow/deny
# against the RBAC objects in the store: resolve RoleBindings → Roles → rules.
# A pure store transform, no host facts.
#
# Two seams, and a graph wires whichever it needs: a request/response lane in
# the store (`/authz-req/` → `/authz-resp/`), and the `request_in`/
# `response_out` connector pair the Chronicle request chain drives, where the
# answer is a NUMBER and the 403 it implies stays in params. Walking the
# binding set is the part a rules VM cannot do, which is why this is a module
# at all.

# Cadence-independent: it does no tick-based timekeeping, just polls its watch.
timer_class = "agnostic"

# The store pushes namespace.change events onto this input port. A module cannot
# open a channel itself, so the graph allocates one by self-wiring `status` ->
# `changes` (a 1-node cycle); the module passes the resulting channel handle to
# SUBSCRIBE and drains pushed events from it.
[[ports]]
name = "changes"
direction = "input"
content_type = "OctetStream"
buffer_size = 4096

# The self-edge source. The module never writes it — its sole role is to make
# the graph allocate the `changes` channel above (see fluxor-rbac.yaml).
[[ports]]
name = "status"
direction = "output"
content_type = "OctetStream"
buffer_size = 4096

# The CONNECTOR seam, alongside the store one above.
#
# Walking every RoleBinding and resolving its Role is exactly what Chronicle's
# VM cannot do — it has no iteration, by construction — so authorization over a
# SET is a connector's job for the same reason `store_source` walks a prefix.
# What this pair does NOT carry is the meaning: it answers "did any rule match"
# as a number, and whether an unmatched request is a 403 (it is — deny by
# default) is a decision in params.
#
# In:  a Chronicle record frame on `request_in`
#        3 = identity (bytes)   4 = verb (bytes)   5 = resource (bytes)
#        30..=39 = carry, echoed with number and type
# Out: a Chronicle record frame on `response_out`
#        2 = allowed (i64, 1 or 0)
#        30..=39 = carry
#
# Both ports are OPTIONAL: unwired they stay -1 and the module is the
# store-seam responder it has always been, which is how the modules-based
# apiserver graph and the Chronicle one can both run during the cutover.
[[ports]]
name = "request_in"
direction = "input"
content_type = "OctetStream"
buffer_size = 16384
max_record = 8192
# A whole record per step: the boundary must be kept.
framed = true

[[ports]]
name = "response_out"
direction = "output"
content_type = "OctetStream"
buffer_size = 16384
max_record = 8192

[[resources]]
requires_contract = "storage.namespace"
access = "write"

[[resources]]
requires_contract = "storage.object"
access = "write"

[observability]
exempt = "Control-plane authorizer — provider-driven, emits no telemetry stream"
