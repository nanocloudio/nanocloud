version = "1.0.0"
hardware_targets = ["bcm2712"]

# ReplicaSet reconciler — the second link of the workload
# chain as a PIC module. It drives the control-plane store through the standard
# fluxor storage contracts (storage.namespace SUBSCRIBE/LIST + storage.object
# GET/PUT/DELETE) in the watch -> recompute -> reconcile loop: SUBSCRIBE
# /replicasets.apps/ and /pods/, and for each ReplicaSet ensure exactly
# `replicas` Pods exist under /pods/<ns>/<rs>-<ordinal> — creating the missing,
# deleting the surplus (scale-down). Together with deployment_reconciler this is
# Deployment -> ReplicaSet -> Pods, all as cooperating modules over the store.

# Cadence-independent: it does no tick-based timekeeping, just polls its watch.
timer_class = "agnostic"

# The store pushes namespace.change events onto this input port. A module cannot
# open a channel itself, so the graph allocates one by self-wiring `status` ->
# `changes` (a 1-node cycle); the module passes the resulting channel handle to
# SUBSCRIBE and drains pushed events from it.
[[ports]]
name = "changes"
direction = "input"
content_type = "OctetStream"
buffer_size = 4096

# The self-edge source. The module never writes it — its sole role is to make
# the graph allocate the `changes` channel above (see fluxor-replicaset.yaml).
[[ports]]
name = "status"
direction = "output"
content_type = "OctetStream"
buffer_size = 4096

[[resources]]
requires_contract = "storage.namespace"
access = "write"

[[resources]]
requires_contract = "storage.object"
access = "write"

# Module-scope observability — exempt: it emits no sustained byte stream; its
# observable is the reconcile count and the pod keys it writes/removes.
[observability]
exempt = "Control-plane reconciler — provider-driven, emits no telemetry stream"
