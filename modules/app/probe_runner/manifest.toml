version = "1.0.0"
hardware_targets = ["bcm2712"]

# Probe runner — the probes DECISION half; no new fluxor surface). It reads
# probe configs off /pod-specs/ (compact `lprobe=` / `rprobe=` fields), drives
# exec probes through the existing /sandbox-exec/ request seam (sandbox_runner
# owns the workload EXEC effect), applies the per-probe
# period/timeout/threshold cadence in its own step time, and writes the
# verdicts to /probe-status/<uid> (this module's ONLY owned prefix).
# pod_lifecycle folds `live=0` into its restart decision; `ready` feeds the
# readiness plumbing. tcp probes are parsed but not implemented (no nanocloud
# module has a dial surface today — see mod.rs header).

# Wall-clock timekeeping: probe periods, timeouts and thresholds are measured
# against the monotonic clock (`dev_millis`, TIMER::MILLIS — uptime ms), not a
# step count, so a variable/relaxed scheduler cadence only changes when we
# sample, never the elapsed we measure. Safe on an adaptive-tick domain.
timer_class = "wall_clock"

# The store pushes namespace.change events onto this input port. A module cannot
# open a channel itself, so the graph allocates one by self-wiring `status` ->
# `changes` (a 1-node cycle); the module passes the resulting channel handle to
# SUBSCRIBE and drains pushed events from it.
[[ports]]
name = "changes"
direction = "input"
content_type = "OctetStream"
buffer_size = 4096

# The self-edge source. The module never writes it — its sole role is to make
# the graph allocate the `changes` channel above (see fluxor-podlifecycle.yaml).
[[ports]]
name = "status"
direction = "output"
content_type = "OctetStream"
buffer_size = 4096

[[resources]]
requires_contract = "storage.namespace"
access = "write"

[[resources]]
requires_contract = "storage.object"
access = "write"

[observability]
exempt = "Control-plane probe reconciler — provider-driven, emits no telemetry stream"
