version = "1.0.0"
hardware_targets = ["bcm2712"]

# Admission — the mutating/validating admission gate as a PIC module. Every
# mutating request crosses admission before the store: validate required
# fields, apply defaults (mutating the object), and enforce quota — all a pure
# function of the request plus policy + counts read from the store. No host
# facts.
#
# Two seams, and a graph wires whichever it needs: a request/response lane in
# the store (`/admit-req/` → `/admit-resp/`), and the `request_in`/
# `response_out` connector pair the Chronicle request chain drives, which
# answers a status plus the object as admitted while what a refusal does to the
# request stays in params. Counting live objects for a quota is the part a
# rules VM cannot do, which is why this is a module at all.

# Cadence-independent: it does no tick-based timekeeping, just polls its watch.
timer_class = "agnostic"

# The store pushes namespace.change events onto this input port. A module cannot
# open a channel itself, so the graph allocates one by self-wiring `status` ->
# `changes` (a 1-node cycle); the module passes the resulting channel handle to
# SUBSCRIBE and drains pushed events from it.
[[ports]]
name = "changes"
direction = "input"
content_type = "OctetStream"
buffer_size = 4096

# The self-edge source. The module never writes it — its sole role is to make
# the graph allocate the `changes` channel above (see fluxor-admission.yaml).
[[ports]]
name = "status"
direction = "output"
content_type = "OctetStream"
buffer_size = 4096

# The CONNECTOR seam, alongside the store one above — the same shape
# `rbac_gate` has.
#
# Admission reads a POLICY and COUNTS live objects for quota: a store lookup and
# a prefix walk, neither of which Chronicle's VM can do. What it does not carry
# is the meaning — it answers a status and the (possibly defaulted) object, and
# what a 403 does to the request is params.
#
# In:  a Chronicle record frame on `request_in`
#        3 = verb (bytes)      EMPTY means "not a mutating request": the object
#                              is returned unchanged and no policy is consulted,
#                              because a read has no object to validate and a
#                              required-field rule would reject it
#        4 = resource (bytes)  5 = namespace (bytes)  6 = object (bytes, JSON)
#        30..=39 = carry
# Out: 2 = status (i64, 200 or 403), 3 = the object as admitted (defaults
#      applied) or the refusal reason, 30..=39 = carry
#
# Both ports are OPTIONAL: unwired they stay -1 and this is the store-seam
# responder it has always been.
[[ports]]
name = "request_in"
direction = "input"
content_type = "OctetStream"
buffer_size = 16384
max_record = 8192
framed = true

[[ports]]
name = "response_out"
direction = "output"
content_type = "OctetStream"
buffer_size = 16384
max_record = 8192

[[resources]]
requires_contract = "storage.namespace"
access = "write"

[[resources]]
requires_contract = "storage.object"
access = "write"

[observability]
exempt = "Control-plane admission controller — provider-driven, emits no telemetry stream"
