version = "1.0.0"
hardware_targets = ["bcm2712"]

# crypto_signer — the cert_manager foundation: it proves that a nanocloud APP
# module can do real cryptography with EXISTING fluxor capabilities — no new
# capability surface. On start it generates a P-256 keypair (SDK
# p256::ecdh_keygen + the kernel CSPRNG), STOREs the private key in the kernel
# KEY_VAULT (contract 0x0010, an infra contract — no requires_contract
# needed), and wipes the in-module copy. Then, over the request/response seam,
# it signs each /sign-req/ by handle (KEY_VAULT SIGN — the private key never
# re-enters the module) and self-verifies with p256::ecdsa_verify. This is
# exactly the TLS module's identity-key mechanism, reused. cert_manager = this
# + in-module DER.

# Cadence-independent: it does no tick-based timekeeping, just polls its watch.
timer_class = "agnostic"

# The store pushes namespace.change events onto this input port. A module cannot
# open a channel itself, so the graph allocates one by self-wiring `status` ->
# `changes` (a 1-node cycle); the module passes the resulting channel handle to
# SUBSCRIBE and drains pushed events from it.
[[ports]]
name = "changes"
direction = "input"
content_type = "OctetStream"
buffer_size = 4096

# The self-edge source. The module never writes it — its sole role is to make
# the graph allocate the `changes` channel above (see fluxor-crypto-signer.yaml).
[[ports]]
name = "status"
direction = "output"
content_type = "OctetStream"
buffer_size = 4096

# KEY_VAULT (contract 0x0010) is an infra contract — implicitly granted, so it
# needs no requires_contract entry.
[[resources]]
requires_contract = "storage.namespace"
access = "write"

[[resources]]
requires_contract = "storage.object"
access = "write"

# Module-scope observability — exempt: it emits no sustained byte stream; its
# observable is the signatures it writes.
[observability]
exempt = "Control-plane signer — provider-driven, emits no telemetry stream"
