version = "1.0.0"
hardware_targets = ["bcm2712"]

# HorizontalPodAutoscaler — a feedback controller as a
# PIC module. It SUBSCRIBEs /hpa/ and /hpa-metrics/, and for each HPA computes
# desired = ceil(currentReplicas * currentCPU / targetCPU), clamped to
# [min, max], and writes it back onto the target Deployment's replicas= field.
# The new replica count then cascades through deployment_reconciler ->
# replicaset_reconciler -> Pods. Metrics-driven (it does NOT watch the Deployment
# it writes, so scaling can't run away); the loop advances on each metrics update.

# Cadence-independent: it does no tick-based timekeeping, just polls its watch.
timer_class = "agnostic"

# The store pushes namespace.change events onto this input port. A module cannot
# open a channel itself, so the graph allocates one by self-wiring `status` ->
# `changes` (a 1-node cycle); the module passes the resulting channel handle to
# SUBSCRIBE and drains pushed events from it.
[[ports]]
name = "changes"
direction = "input"
content_type = "OctetStream"
buffer_size = 4096

# The self-edge source. The module never writes it — its sole role is to make
# the graph allocate the `changes` channel above (see fluxor-autoscale.yaml).
[[ports]]
name = "status"
direction = "output"
content_type = "OctetStream"
buffer_size = 4096

[[resources]]
requires_contract = "storage.namespace"
access = "write"

[[resources]]
requires_contract = "storage.object"
access = "write"

# Module-scope observability — exempt: it emits no sustained byte stream; its
# observable is the replica counts it writes onto Deployments.
[observability]
exempt = "Control-plane autoscaler — provider-driven, emits no telemetry stream"
