version = "1.0.0"
hardware_targets = ["bcm2712"]

# Volume manager — the mount-PLANNING decision as a PIC module. Attaching a
# pod's volumes is two things: the decision (resolve each mount's claim to its
# bound device + filesystem, and flag any unbound claim as pending) and the
# effect (the mount syscall). Only the decision is a pure store transform, so
# only it lives here; the node's storage backend performs the mount. This
# module watches
# /volume-requests/ and /volumes/ (bound PV/PVC → device) and writes the
# resolved mount plan to /volume-plan/.

# Cadence-independent: it does no tick-based timekeeping, just polls its watches.
timer_class = "agnostic"

# The store pushes namespace.change events onto this input port. A module cannot
# open a channel itself, so the graph allocates one by self-wiring `status` ->
# `changes` (a 1-node cycle); the module passes the resulting channel handle to
# SUBSCRIBE and drains pushed events from it.
[[ports]]
name = "changes"
direction = "input"
content_type = "OctetStream"
buffer_size = 4096

# The self-edge source. The module never writes it — its sole role is to make
# the graph allocate the `changes` channel above (see fluxor-volume.yaml).
[[ports]]
name = "status"
direction = "output"
content_type = "OctetStream"
buffer_size = 4096

[[resources]]
requires_contract = "storage.namespace"
access = "write"

[[resources]]
requires_contract = "storage.object"
access = "write"

[observability]
exempt = "Control-plane mount planner — provider-driven, emits no telemetry stream"
