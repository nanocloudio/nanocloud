name = "wormhole_ledger"
version = "0.1.0"
description = "Wormhole's region controller ledger → one store row per FailoverExplain entry, the rows `nanocloud explain failovers` reads"
type = "Transformer"
entry = "mod.rs"
edition = "2021"
hardware_targets = ["bcm2712", "linux"]

# The write half of the explain projection (rfc_lb_vip §19.1, §19.3): the ONE
# writer of `/wh-ledger/`.
#
# Wormhole's `region_controller` chains a `FailoverExplain` (`explain.v1`
# 0xC1) on its `ledger_out` when an operation blocks and when it ends, with
# `region_ctl.v1` DrStatus beside it. This module takes that stream on
# `ledger_in`, checks each record with Wormhole's own decoder (the envelope's
# digest, its kind and length) and writes every FailoverExplain verbatim at
#   /wh-ledger/<service hex>/<seq, 20 digits>
# (`_shared/whexplain.rs` `ledger_key`), the service the controller serves
# (`service`, 32 hex). A row is history: an entry already written with the
# same bytes (a controller's replay after a restart) is left as it is, and one
# whose row holds other bytes is never overwritten — refused and counted; the
# CLI's `LedgerCheck` names the fork. DrStatus and anything else on the stream
# is consumed, not written. One write at a time, the record held until the
# store decides it; a refused write is asked again after `retry_ms`.
#
# Params: `service` (32 hex, required), `retry_ms` (default 1000).
timer_class = "wall_clock"

[[ports]]
name = "ledger_in"
direction = "input"
content_type = "OctetStream"
required = true
buffer_size = 8192

[[resources]]
requires_contract = "storage.object"
access = "write"

[observability]
exempt = "control-plane projection — one store write per ledger entry, observed through `/wh-ledger/` and `nanocloud explain failovers`"
