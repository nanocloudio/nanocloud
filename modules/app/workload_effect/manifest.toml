name = "workload_effect"
version = "1.0.0"
description = "Chronicle connector for the workload contract — op records in, lifecycle / log / exec / pty events out"
type = "Transformer"
entry = "mod.rs"
edition = "2021"
hardware_targets = ["bcm2712", "linux"]

# The workload seam as a connector — what `store_effect` is to the store.
#
# WHEN to create, start, signal, pause, exec or tear a sandbox down is decided
# by params (`sandbox.uproc`), from the desired specs and the observed status.
# This module performs the op and reports what happened, and it owns only what
# cannot live in the store: the table of live workload HANDLES, and the
# continuous observation of them (WAIT for state changes, READ for output, the
# PTY pump). It is the only module holding `requires_contract = "workload"`
# plus `platform_raw`, so namespace surgery stays one auditable grant.
#
# In: six request inputs (so six chains feed it without a merge), each a
# Chronicle record (a byte stream, self-framed, or a mailbox):
#   1 correlation (i64)   2 op (i64)   3 id (the sandbox; the pty session's
#   tail for the pty ops)   30..39 carry, echoed on the op's event
#   op 1 CREATE   4 cmd (argv, whitespace-split)  5 rootfs  6 iso ("1")
#                 14 env (`NAME=VALUE`, `,`-separated, each escaped; a later
#                 entry overrides an earlier of its name)  15 host (HOSTNAME)
#                 16 wd (the cwd)  17 iwd (the cwd when 16 is empty)
#                 18 user (`uid[:gid]` | `name[:group]`) — the process gets
#                 exactly HOSTNAME, that env and a default PATH when it names
#                 none, never the runtime's environment; 14-18 escaped `%XX`
#                 19 cpu (millicores)  20 mem (bytes)  21 eph (bytes): the
#                 CREATE envelope (compute_milli, memory_bytes,
#                 storage_bytes — what the workload's own owner may hold in
#                 its storage root), every kind of workload; empty =
#                 unlimited
#                 12 graph: the workload is the FLXA subgraph of the Graph
#                 object /graphs.nanocloud.io/<graph> (spec.flxa, hex) — a
#                 module subgraph of the node's own image; cmd/rootfs/binds
#                 are then unused. A bare-metal node runs these and pulled
#                 workload images (13), never a host process
#                 13 pack: the workload is a PULLED WORKLOAD IMAGE, named
#                 as its /image-manifests/<pack> record (`kind=workload`;
#                 layers and sizes, the FLXA first, then one `.fmod` per
#                 module). Its layers are read from the `blobs` cache over
#                 the following steps (a provider may answer EAGAIN; no other
#                 op is taken meanwhile), each re-verified against its
#                 digest, laid out as an FXMT module table and created
#                 SOURCE_FMOD_PACK, every module pinned by its layer digest —
#                 the kernel stages it as the workload's own code. failed
#                 -2 a layer or the manifest the node does not hold, -7 past
#                 the kernel's 16 MiB pack pool (-12 when the elastic region
#                 cannot grant the buffer it is assembled in), -74 a cached layer that is not its
#                 digest, -22 a manifest that is not a workload image
#                 7 tasks (decimal, the pids envelope)  8 addr (IPv4, own
#                 netns when set)  9 prefix (decimal)  10 binds
#                 (`<src>:<dst>[:ro]`, `,`-separated — the workload `mount`/
#                 `bind` option)  → status created | failed(errno). An id
#                 already live is not created twice: its status is re-reported
#                 A CREATE the kernel stages over several calls
#                 (EINPROGRESS) is asked again each step with the same spec
#                 until it answers; no other op is taken meanwhile. One the
#                 kernel says is already live (EEXIST: it completed while
#                 this module faulted mid-call, or before a restart of this
#                 module) is adopted through LOOKUP by identity, never
#                 created twice
#   op 2 START    → running
#   op 3 DESTROY  → destroyed (an id this module holds no handle for is
#                 destroyed by identity: a workload it lost track of, or one
#                 still being staged, is torn down rather than leaked)
#   op 4 SIGNAL   4 `term` | `kill` — each level delivered once
#   op 5 PAUSE / op 6 RESUME — each intent issued once
#   op 7 EXEC     4 command, 11 the request's revision (i64) → exec event:
#                 code, output. A request named at 30 runs once per revision,
#                 however often it is re-offered before its result lands. A request carrying
#                 its name at 30 is run once, however often it is re-offered
#                 before its result lands
#   op 8 TTY_OPEN 4 the sandbox id, 5 rows, 6 cols, 7 cmd → pty status
#   op 9 TTY_CLOSE
#   op 10 TTY_IN  4 bytes, 5 the revision they were read at (i64; bytes at a
#                 revision already taken are not typed twice) → an `in`
#                 event once they are queued for the pty
# Out (`event_out`): 1 correlation (0 when spontaneous)  2 kind  3 id / tail
#   4 label  5 code (i64)  6 bytes  7 boot  8 code as decimal text
#   30..39 carry
#   kind 1 status (created running paused exited failed killed destroyed)
#   kind 2 log (bytes: the workload's merged stdout/stderr)
#   kind 3 exec (code, bytes: the output)
#   kind 4 pty output (bytes)   kind 5 pty status (open | failed |
#   exited, code)   kind 6 boot (emitted once at start)   kind 7 pty input
#   consumed
# `boot` is this process's identity, a random nonce drawn at start (never
# the wall clock, which a board reads as 0 until its time protocol answers):
# a status recorded under another boot
# describes a workload that no longer exists (the node restarted), which is
# how the chain knows to create it again.
# Param `blobs`: the node's blob cache (the directory a pulled image's layers
# land in, named by sha256). Without it a pack CREATE fails -22.
timer_class = "agnostic"
permissions = ["platform_raw"]

[[ports]]
name = "request_in"
direction = "input"
content_type = "OctetStream"
buffer_size = 16384
max_record = 8192

[[ports]]
name = "request_in_2"
direction = "input"
content_type = "OctetStream"
buffer_size = 16384
max_record = 8192

[[ports]]
name = "request_in_3"
direction = "input"
content_type = "OctetStream"
buffer_size = 16384
max_record = 8192

[[ports]]
name = "request_in_4"
direction = "input"
content_type = "OctetStream"
buffer_size = 16384
max_record = 8192

[[ports]]
name = "request_in_5"
direction = "input"
content_type = "OctetStream"
buffer_size = 16384
max_record = 8192

[[ports]]
name = "request_in_6"
direction = "input"
content_type = "OctetStream"
buffer_size = 16384
max_record = 8192

[[ports]]
name = "event_out"
direction = "output"
content_type = "OctetStream"
buffer_size = 65536
max_record = 8192

[[resources]]
requires_contract = "workload"
access = "write"

# The FLXA blob of a graph-backed workload, read from /graphs/<name>; a
# pulled workload image's manifest record.
[[resources]]
requires_contract = "storage.object"
access = "read"

# A pulled workload image's layers, in the blob cache (`blobs` param, the
# directory http_fetch lands them in).
[[resources]]
requires_contract = "fs"
access = "read"

[observability]
exempt = "control-plane connector — discrete op/event records, not a sustained byte data path"
