version = "1.0.0"
hardware_targets = ["bcm2712"]

# Service DNS zone projector — the cluster DNS zone as a
# PIC module. It SUBSCRIBEs /endpoints/ and projects, for each Service, an A-record
# set at /dns/<name>.<ns>.svc.cluster.local = "a=<ip>;a=<ip>" from the Service's
# ready backend IPs. Chains off endpoints_reconciler (services+pods -> endpoints
# -> dns zone); the cluster-dns bundle serves the zone from /dns/. A pure
# store transform — the zone is just endpoints projected onto DNS names.

# Cadence-independent: it does no tick-based timekeeping, just polls its watch.
timer_class = "agnostic"

# The store pushes namespace.change events onto this input port. A module cannot
# open a channel itself, so the graph allocates one by self-wiring `status` ->
# `changes` (a 1-node cycle); the module passes the resulting channel handle to
# SUBSCRIBE and drains pushed events from it.
[[ports]]
name = "changes"
direction = "input"
content_type = "OctetStream"
buffer_size = 4096

# The self-edge source. The module never writes it — its sole role is to make
# the graph allocate the `changes` channel above (see fluxor-dns.yaml).
[[ports]]
name = "status"
direction = "output"
content_type = "OctetStream"
buffer_size = 4096

[[resources]]
requires_contract = "storage.namespace"
access = "write"

[[resources]]
requires_contract = "storage.object"
access = "write"

# Module-scope observability — exempt: it emits no sustained byte stream; its
# observable is the DNS records it writes.
[observability]
exempt = "Control-plane DNS projector — provider-driven, emits no telemetry stream"
