# wormhole_fence alone: region 7's rows in the store, the confirmation on stdout.
target: linux
tick_us: 1000
params:
  mechanism:
    type: string
    default: upstream
    description: upstream | power.
modules:
  - name: fence
    type: wormhole_fence
    region: 7
    mechanism: ${param:mechanism}
    poll_ms: 100
  - name: cli_out
wiring:
  - from: fence.fence_out
    to: cli_out.bytes_in
