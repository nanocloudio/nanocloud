# rpki_fetch alone: an RRDP repository over the host's sockets.
target: linux
tick_us: 1000
platform:
  net: {}
modules:
  - name: rpki
    type: rpki_fetch
    # The repository the e2e serves (scripts/rpki-fetch-e2e.sh).
    notify: "http://127.0.0.1:8099/notification.xml"
    poll_ms: 500
wiring:
  - from: linux_net.net_out
    to: rpki.net_in
  - from: rpki.net_out
    to: linux_net.net_in
