# wormhole_dns alone: [len u16][KSDN] frames on stdin, the key as params.
target: linux
tick_us: 1000
params:
  issuer:
    type: string
    default: ""
    description: The SERVICE_DNS key's issuer.
  kid:
    type: string
    default: ""
    description: The SERVICE_DNS key's kid.
  public:
    type: string
    default: ""
    description: The SERVICE_DNS public key (64 hex).
modules:
  - name: dns
    type: wormhole_dns
    dns_issuer: ${param:issuer}
    dns_kid: ${param:kid}
    dns_public: ${param:public}
    retry_ms: 100
  - name: cli_in
wiring:
  - from: cli_in.stdin_out
    to: dns.ksdn_in
