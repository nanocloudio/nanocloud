# wormhole_fd alone: the controller's status stream on stdin, its answers on stdout.
target: linux
tick_us: 1000
modules:
  - name: fd
    type: wormhole_fd
    zone: zone-a
    arms: "zone-a,zone-b"
  - name: cli_in
  - name: cli_out
wiring:
  - from: cli_in.stdin_out
    to: fd.status_in
  - from: fd.ctl_out
    to: cli_out.bytes_in
