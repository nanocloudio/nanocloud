# A6b on the board: grow the root directory past fat32's per-step scan
# budget (32 sectors, ~512 short names) with 1500 files, then boot the
# control plane over that root with no wipe (pi5-controlplane + the
# driver). The store, its log and a tenant's log all walk the grown root
# at once — the shape that answered E_AGAIN forever before fat32 parked
# yielded walks (fluxor ae8c0f7e).
#
#   fluxor rig test --rig pi5-a --scenario packaging/rig/pi5-grow.scenario.toml
target: pi5
tick_us: 1000
platform:
  net: {}
  debug:
    to: net
    monitor: true
modules:
  - name: nvme
    bind: m2_primary
    namespace: 1
    queue_depth: 32
  - name: fat32
    step_deadline_us: 12000
    step_deadline_burst_us: 16000
    fault_policy: tolerate
    path: /
    init_free_hint: 20000
    clear_free_region: 4096
  - name: fs_async_seed
    step_deadline_us: 12000
    step_deadline_burst_us: 16000
    fault_policy: tolerate
    params:
      prefix: "/G"
      count: 1500
      size: 512
      rounds: 1
wiring:
  - from: nvme.blocks
    to: fat32.blocks
