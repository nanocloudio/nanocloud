name = "pi5_grow"
target = "pi5"
config = "pi5-grow.yaml"
requires = ["deploy.netboot_tftp", "power.cycle", "telemetry.monitor_udp"]
timeout_s = 1200
[[pass]]
source = "telemetry.monitor_udp"
regex = "\\[fs_async_seed\\] DONE n=1500 rounds=1"
[[fail]]
source = "telemetry.monitor_udp"
regex = "PANIC|EXCEPTION|halted|\\[fs_async_seed\\] FAIL"
