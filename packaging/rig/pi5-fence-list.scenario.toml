name = "pi5_fence_list"
target = "pi5"
config = "pi5-fence-list.yaml"
requires = ["deploy.netboot_tftp", "power.cycle", "telemetry.monitor_udp"]
timeout_s = 240
[[pass]]
source = "telemetry.monitor_udp"
regex = "\\[fs_clean\\] removed=[0-9]+ failed=0"
[[fail]]
source = "telemetry.monitor_udp"
regex = "PANIC|EXCEPTION|halted"
