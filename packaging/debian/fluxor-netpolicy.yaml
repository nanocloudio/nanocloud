# NetworkPolicy as Chronicle params (netpolicy.uproc) over the net.policy
# surface. The chains select pods per policy (/np-sel/), expand each selection
# into rule and isolation rows (/np-rows/netpolicy/), and prune what no longer
# holds; `net_apply` encodes the rows as the `netpolicy` table, and the
# platform realizes it — nftables on Linux, the packet filter on bare metal —
# with the outcome at /np-status/netpolicy. `enforced=0` there is a policy the
# node records and does not enforce, stated rather than assumed.
# Selection is upstream LabelSelector semantics on map stages (np_selmap);
# peers given by selector (pod and namespace) are materialised level by level
# (netpolicy_peers.uproc: /np-rule/ → /np-peer/ → /np-peerns/ → /np-peerip/)
# and joined to each selected pod as allow rows (netpolicy_allow.uproc).
target: linux
tick_us: 1000

scheduler:
  accept_cycles: true

modules:
  - name: np_selsrc
    type: store_scan
    prefix: "/networkpolicies/"
    paths: "spec.*"
    join: "/pods/"
    join_scoped: 2
    join_paths: "status.podIP"
    # The selector's terms as repeated fields the map stages in np_selmap
    # iterate, each PAIRED with the pod's value for its key (`@`): the pod's
    # labels never ride in the record, so no pod can overflow it. Past
    # `terms_max` a list is cut and field 67 says so, and np_sel then SELECTS
    # the pod (fails closed) — 8 keeps the record inside a 32-field table.
    join_terms: "90=spec.podSelector.matchExpressions[]:key,operator,values[]@metadata.labels;92=spec.podSelector.matchLabels{}@metadata.labels"
    terms_max: 8
    watch: "/pods/"
  - name: np_selmap
    type: pipeline
    params:
      # chronicle-source: modules/app/_chronicle/netpolicy.uproc np_selmap
      ir_stages: {hex: ""}
      stage_kinds: {hex: "0202"}
  - name: np_sel
    type: store_effect
    # chronicle-source: modules/app/_chronicle/netpolicy.uproc np_sel
    decision: {hex: ""}
    key_prefix: "/np-sel/"
  - name: np_insrc
    type: store_source
    prefix: "/np-sel/"
    expand: "spec.ingress[]+"
    paths: "podIP,spec.policyTypes,spec.ingress.#.from[].ipBlock.cidr,spec.ingress.#.ports[].port,spec.ingress.#.ports[].protocol,spec.ingress.#.from[].ipBlock.except"
    hash: "."
  - name: np_in
    type: store_effect
    # chronicle-source: modules/app/_chronicle/netpolicy.uproc np_in
    decision: {hex: ""}
    key_prefix: "/np-rows/netpolicy/"
  - name: np_outsrc
    type: store_source
    prefix: "/np-sel/"
    expand: "spec.egress[]+"
    paths: "podIP,spec.policyTypes,spec.egress.#.to[].ipBlock.cidr,spec.egress.#.ports[].port,spec.egress.#.ports[].protocol,spec.egress.#.to[].ipBlock.except"
    hash: "."
  - name: np_out
    type: store_effect
    # chronicle-source: modules/app/_chronicle/netpolicy.uproc np_out
    decision: {hex: ""}
    key_prefix: "/np-rows/netpolicy/"
  - name: np_pselsrc
    type: store_source
    rev: 1
    prefix: "/np-sel/"
    paths: "podIP"
    related: "/networkpolicies/^1:metadata.name"
    watch: "/networkpolicies/,/pods/"
  - name: np_psel
    type: store_stamped
    # chronicle-source: modules/app/_chronicle/netpolicy.uproc np_psel
    decision: {hex: ""}
    key_prefix: "/pods/"
    paths: "status.podIP"
  - name: np_psel_drop
    type: store_effect
    # chronicle-source: modules/app/_chronicle/netpolicy.uproc np_psel_drop
    decision: {hex: ""}
    key_prefix: "/np-sel/"
  - name: np_prowsrc
    type: store_source
    rev: 1
    prefix: "/np-rows/netpolicy/"
    flat: 1
    paths: "g"
    related: "/np-sel/^1:.!hash"
    watch: "/np-sel/"
  - name: np_prow
    type: store_effect
    # chronicle-source: modules/app/_chronicle/netpolicy.uproc np_prow
    decision: {hex: "01060000001000010002040000000100024600000021000c0000003300010002010000004001000000100400000000000000400200000001000203000000400300000001000202000000401c000000410a000000310001000201000000400100000010000000000000000040020000001200004003000000100000000000000000401c00000041"}
    key_prefix: "/np-rows/netpolicy/"
  # ── selector peers (netpolicy_peers.uproc, netpolicy_allow.uproc) ──
  - name: np_rinsrc
    type: store_source
    prefix: "/networkpolicies/"
    expand: "spec.ingress[]"
    paths: "spec.ingress.#.from,spec.ingress.#.ports"
    hash: "."
  - name: np_rin
    type: store_effect
    # chronicle-source: modules/app/_chronicle/netpolicy_peers.uproc np_rule_in
    decision: {hex: ""}
    key_prefix: "/np-rule/"
  - name: np_routsrc
    type: store_source
    prefix: "/networkpolicies/"
    expand: "spec.egress[]"
    paths: "spec.egress.#.to,spec.egress.#.ports"
    hash: "."
  - name: np_rout
    type: store_effect
    # chronicle-source: modules/app/_chronicle/netpolicy_peers.uproc np_rule_out
    decision: {hex: ""}
    key_prefix: "/np-rule/"
  - name: np_rulefsrc
    type: store_source
    rev: 1
    prefix: "/np-rule/"
    paths: "g"
    related: "/networkpolicies/^1:.!hash"
    watch: "/networkpolicies/"
  - name: np_rulef
    type: store_effect
    # chronicle-source: modules/app/_chronicle/netpolicy_allow.uproc np_fence
    decision: {hex: "01060000001000010002040000000100024600000021000c0000003300010002010000004001000000100400000000000000400200000001000203000000400300000001000202000000401c000000410a000000310001000201000000400100000010000000000000000040020000001200004003000000100000000000000000401c00000041"}
    key_prefix: "/np-rule/"
  - name: np_peersrc
    type: store_source
    prefix: "/np-rule/"
    expand: "peers[]"
    paths: "dir,peers.#.podSelector,peers.#.namespaceSelector,ports[].port,ports[].protocol"
    hash: "."
  - name: np_peer
    type: store_effect
    # chronicle-source: modules/app/_chronicle/netpolicy_peers.uproc np_peer
    decision: {hex: ""}
    key_prefix: "/np-peer/"
  - name: np_peerfsrc
    type: store_source
    rev: 1
    prefix: "/np-peer/"
    paths: "g"
    related: "/np-rule/^1:.!hash"
    watch: "/np-rule/"
  - name: np_peerf
    type: store_effect
    # chronicle-source: modules/app/_chronicle/netpolicy_allow.uproc np_fence
    decision: {hex: "01060000001000010002040000000100024600000021000c0000003300010002010000004001000000100400000000000000400200000001000203000000400300000001000202000000401c000000410a000000310001000201000000400100000010000000000000000040020000001200004003000000100000000000000000401c00000041"}
    key_prefix: "/np-peer/"
  - name: np_nssrc
    type: store_source
    prefix: "/np-peer/"
    join: "/namespaces/"
    paths: "dir,pod,ns,ports,protos"
    hash: "."
    join_terms: "90=ns.matchExpressions[]:key,operator,values[]@metadata.labels;92=ns.matchLabels{}@metadata.labels"
    watch: "/namespaces/"
  - name: np_nsmap
    type: pipeline
    params:
      # chronicle-source: modules/app/_chronicle/netpolicy_peers.uproc np_nsmap
      ir_stages: {hex: ""}
      stage_kinds: {hex: "0202"}
  - name: np_peerns
    type: store_effect
    # chronicle-source: modules/app/_chronicle/netpolicy_peers.uproc np_peerns
    decision: {hex: ""}
    key_prefix: "/np-peerns/"
  - name: np_nsfsrc
    type: store_source
    rev: 1
    prefix: "/np-peerns/"
    paths: "g"
    related: "/np-peer/^1:.!hash"
    watch: "/np-peer/"
  - name: np_nsf
    type: store_effect
    # chronicle-source: modules/app/_chronicle/netpolicy_allow.uproc np_fence
    decision: {hex: "01060000001000010002040000000100024600000021000c0000003300010002010000004001000000100400000000000000400200000001000203000000400300000001000202000000401c000000410a000000310001000201000000400100000010000000000000000040020000001200004003000000100000000000000000401c00000041"}
    key_prefix: "/np-peerns/"
  - name: np_podsrc
    type: store_scan
    prefix: "/np-peerns/"
    join: "/pods/"
    join_scoped: 10
    paths: "dir,pod,ports,protos"
    hash: "."
    join_terms: "90=pod.matchExpressions[]:key,operator,values[]@metadata.labels;92=pod.matchLabels{}@metadata.labels"
    join_paths: "status.podIP"
    watch: "/pods/"
  - name: np_podmap
    type: pipeline
    params:
      # chronicle-source: modules/app/_chronicle/netpolicy_peers.uproc np_podmap
      ir_stages: {hex: ""}
      stage_kinds: {hex: "0202"}
  - name: np_peerip
    type: store_effect
    # chronicle-source: modules/app/_chronicle/netpolicy_peers.uproc np_peerip
    decision: {hex: ""}
    key_prefix: "/np-peerip/"
  - name: np_ipfsrc
    type: store_source
    rev: 1
    prefix: "/np-peerip/"
    paths: "g"
    related: "/np-peerns/^1:.!hash"
    watch: "/np-peerns/"
  - name: np_ipf
    type: store_effect
    # chronicle-source: modules/app/_chronicle/netpolicy_allow.uproc np_fence
    decision: {hex: "01060000001000010002040000000100024600000021000c0000003300010002010000004001000000100400000000000000400200000001000203000000400300000001000202000000401c000000410a000000310001000201000000400100000010000000000000000040020000001200004003000000100000000000000000401c00000041"}
    key_prefix: "/np-peerip/"
  - name: np_ipsrc
    type: store_source
    rev: 1
    prefix: "/np-peerip/"
    paths: "ip,pk"
    watch: "/pods/"
  - name: np_ipget
    type: store_stamped
    # chronicle-source: modules/app/_chronicle/netpolicy_allow.uproc np_ipget
    decision: {hex: "00140000004600010002010000004001000000100100000000000000400200000001000205000000400300000001000203000000010002040000000100020200000042031e1f2040fe00000041"}
    key_prefix: "/pods/"
    paths: "status.podIP"
  - name: np_ipdrop
    type: store_effect
    # chronicle-source: modules/app/_chronicle/netpolicy_allow.uproc np_ipdrop
    decision: {hex: ""}
    key_prefix: "/np-peerip/"
  - name: np_allowsrc
    type: store_source
    prefix: "/np-sel/"
    join: "/np-peerip/"
    join_scoped: 3
    paths: "podIP"
    hash: "."
    join_paths: "ip,dir,ports,protos,sl"
    watch: "/np-peerip/"
  - name: np_allow
    type: store_effect
    # chronicle-source: modules/app/_chronicle/netpolicy_allow.uproc np_allow
    decision: {hex: ""}
    key_prefix: "/np-rows/netpolicy/"
  - name: np_arowsrc
    type: store_source
    rev: 1
    prefix: "/np-rows/netpolicy/"
    flat: 1
    paths: "peers,pk"
    watch: "/np-peerip/"
  - name: np_aget
    type: store_effect
    # chronicle-source: modules/app/_chronicle/netpolicy_allow.uproc np_aget
    decision: {hex: ""}
    paths: "ip"
  - name: np_adrop
    type: store_effect
    # chronicle-source: modules/app/_chronicle/netpolicy_allow.uproc np_adrop
    decision: {hex: ""}
    key_prefix: "/np-rows/netpolicy/"
  - name: np_apply
    type: net_apply
    prefix: "/np-rows/netpolicy/"
    table: "netpolicy"
    status_key: "/np-status/netpolicy"

wiring:
  - from: np_selsrc.status
    to: np_selsrc.changes
  - from: np_selsrc.record_out
    to: np_selmap.record_in
  - from: np_selmap.result_out
    to: np_sel.request_in
  - from: np_insrc.status
    to: np_insrc.changes
  - from: np_insrc.record_out
    to: np_in.request_in
  - from: np_outsrc.status
    to: np_outsrc.changes
  - from: np_outsrc.record_out
    to: np_out.request_in
  - from: np_pselsrc.status
    to: np_pselsrc.changes
  - from: np_pselsrc.record_out
    to: np_psel.request_in
  - from: np_psel.response_out
    to: np_psel_drop.request_in
  - from: np_prowsrc.status
    to: np_prowsrc.changes
  - from: np_prowsrc.record_out
    to: np_prow.request_in
  - from: np_rinsrc.status
    to: np_rinsrc.changes
  - from: np_rinsrc.record_out
    to: np_rin.request_in
  - from: np_routsrc.status
    to: np_routsrc.changes
  - from: np_routsrc.record_out
    to: np_rout.request_in
  - from: np_rulefsrc.status
    to: np_rulefsrc.changes
  - from: np_rulefsrc.record_out
    to: np_rulef.request_in
  - from: np_peersrc.status
    to: np_peersrc.changes
  - from: np_peersrc.record_out
    to: np_peer.request_in
  - from: np_peerfsrc.status
    to: np_peerfsrc.changes
  - from: np_peerfsrc.record_out
    to: np_peerf.request_in
  - from: np_nsfsrc.status
    to: np_nsfsrc.changes
  - from: np_nsfsrc.record_out
    to: np_nsf.request_in
  - from: np_ipfsrc.status
    to: np_ipfsrc.changes
  - from: np_ipfsrc.record_out
    to: np_ipf.request_in
  - from: np_allowsrc.status
    to: np_allowsrc.changes
  - from: np_allowsrc.record_out
    to: np_allow.request_in
  - from: np_nssrc.status
    to: np_nssrc.changes
  - from: np_nssrc.record_out
    to: np_nsmap.record_in
  - from: np_nsmap.result_out
    to: np_peerns.request_in
  - from: np_podsrc.status
    to: np_podsrc.changes
  - from: np_podsrc.record_out
    to: np_podmap.record_in
  - from: np_podmap.result_out
    to: np_peerip.request_in
  - from: np_ipsrc.status
    to: np_ipsrc.changes
  - from: np_ipsrc.record_out
    to: np_ipget.request_in
  - from: np_ipget.response_out
    to: np_ipdrop.request_in
  - from: np_arowsrc.status
    to: np_arowsrc.changes
  - from: np_arowsrc.record_out
    to: np_aget.request_in
  - from: np_aget.response_out
    to: np_adrop.request_in
  - from: np_apply.status
    to: np_apply.changes
