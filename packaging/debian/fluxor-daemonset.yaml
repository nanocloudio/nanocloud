# daemonset-reconciler workload graph: the
# daemonset_reconciler fmod, which watches /daemonsets.apps/, /nodes/ and /pods/
# and ensures one Pod per ready Node (/pods/<ns>/<ds>-<node>, pre-bound),
# pruning Pods whose Node is gone. Per-node coverage as a store transform.
target: linux
tick_us: 1000

# The self-edge below (change-sink allocator) is a deliberate 1-node cycle.
scheduler:
  accept_cycles: true

modules:
  - name: daemonset_reconciler

# Self-edge: the reconciler's own output feeds its `changes` input, allocating a
# module-owned channel the store's namespace.change SUBSCRIBE pushes onto. The
# module never writes this output; it drains pushed events from the input.
wiring:
  - from: daemonset_reconciler.status
    to: daemonset_reconciler.changes
