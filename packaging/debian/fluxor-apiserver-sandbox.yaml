# Persistent combined runtime: the apiserver pipeline (serves k8s REST over HTTP
# from the store) + sandbox_runner (runs containers) in ONE long-lived runtime,
# one store. Proves the production shape: CLI/clients reach a live container's
# control-plane objects over HTTP while the same runtime runs the container.
target: linux
tick_us: 1000
platform:
  net: {}
scheduler:
  accept_cycles: true
modules:
  - name: api_ingress
  - name: authn
  - name: rbac_gate
  - name: api_admission
  - name: core_api
  - name: watch_streamer
  - name: api_responder
  - name: sandbox_runner
wiring:
  - from: linux_net.net_out
    to: api_ingress.net_in
  - from: api_ingress.net_out
    to: linux_net.net_in
  - from: authn.status
    to: authn.changes
  - from: rbac_gate.status
    to: rbac_gate.changes
  - from: api_admission.status
    to: api_admission.changes
  - from: core_api.status
    to: core_api.changes
  - from: watch_streamer.status
    to: watch_streamer.changes
  - from: api_responder.status
    to: api_responder.changes
  - from: sandbox_runner.status
    to: sandbox_runner.changes
