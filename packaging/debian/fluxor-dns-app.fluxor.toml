# Workload source manifest for the cluster-dns bundle. postinst emits it and
# publishes it into the node's OCI store, so `dns:1.0.0` resolves offline.
# The graph it references (linux.yaml, staged beside this file) mirrors the
# packaged node graph's dns subgraph.
[workload]
name = "dns"
version = "1.0.0"
role = "service"

[[implementation]]
target = "linux"
graph = "linux.yaml"

[[export]]
name = "dns"
protocol = "udp"
port = 53
binding = "dns.net_out"

[resources]
state_bytes = 131072
buffer_bytes = 32768
