# Encrypted volumes (docs/design/encrypted-volumes.md), as params, with the
# effectors that answer them — the control plane and the node it runs on in
# one graph (a co-resident node; conffile: operator edits survive upgrades).
#
# Chains (store_source -> step decision -> store_effect, write-ahead), and the
# seam each issues its effects through:
#   provision   PVC + StorageClass -> /volume-provisions/        vx
#   attach      /volume-attachments/ (va_attach, va_epoch,        vx, vk
#               va_detach; this node's only)
#   retain      unattached volumes past `retain` -> deletions
#   grant       /volume-grants/                                   vk
#   rotate      /volume-rotations/ (vt_prepare, vt_migrate)       vk
#   snapshot    /volume-snapshots/                                vl
#   recover     /volume-recoveries/ (vr_recover, vr_unwind)       vl
#   delete      /volume-deletions/                                vl
#   claim       /volumes/ -> mount_effect (vc_claim, vc_act, vc_done)
# A chain's store_effect reply goes to its seam's `act`; every effect goes to
# every effector, each taking its own ops; every outcome comes back through
# every chain's route (volume_route.uproc), and only the asking chain's
# passes, into its seam's `record` and its store_effect.
#
# Effectors:
#   loam_effect         Loam leases (this node's identity), creates,
#                       snapshots, restores, deletes — admin wire over
#                       mutual TLS to Loam's admin gate, under this node's
#                       capability
#   kagi_storage_effect Kagi policy verbs; the volume key generated and split
#                       in this node's vault
#   volume_host         the volume's subgraph, unlocked through Kagi's
#                       endpoint, published over NBD
#   vw_s1..vw_answer    the pipelines' store writes: the records chain
#                       (volume_records.uproc), three store_effect stages
#   mount_effect        the claim chain's mount actuator
# Kagi's storage-key service with its ledger (security_state) and three
# custodians runs here; its control verbs reach it on an in-graph edge, a
# node's attach on `POST /storage-key` behind mutual TLS (port 7446).
#
# This node's identity: /etc/nanocloud/volumes/node.der (+ node.key.der),
# issued under /etc/nanocloud/volumes/ca.der, which both Loam and the Kagi
# endpoint trust; the endpoint serves kagi.der (+ kagi.key.der). The node's
# Kagi device is `node-a`, its device key a vault key (the public half is
# logged at start, for enrolment).
#
# This node's Loam capability: /etc/nanocloud/volumes/node.cap, one
# `fxcap1.` chain per line, which loam_effect and every volume's subgraph
# present to Loam's admin gate. The operator mints it from the mesh root
# whose key the gate's `mesh_roots` names (the node never holds the root):
#   fluxor modules cap mint --key root.seed --scope nanocloud/ \
#     --perms read_state,send_command --not-before <t0> --not-after <t1>
#   fluxor modules cap mint --key root.seed --object <body plane> \
#     --perms read_state,send_command --not-before <t0> --not-after <t1>
# (the body plane's object is the first 32 hex digits of
# sha256("loam.body-plane\0")), the two chains on two lines.
# Loam refuses a lease that would outlive the grant, so mint a new file
# before it expires; it is read again whenever a session opens.
target: linux
tick_us: 1000

scheduler:
  accept_cycles: true

platform:
  net: {}

# The volume subgraph's types (`_shared/volume_graph.rs`), packed so
# `volume_host` can stage it at run time; tls also runs here. `loam_volume`
# is built for the profile Loam's node runs.
workload_modules:
  - type: loam_volume
    variant: node
  - crypt_block
  - nbd_serve

modules:
  # ── provision ──
  - name: vp_pvc
    type: store_source
    prefix: "/persistentvolumeclaims/"
    due: "at+30000"
    paths: "spec.storageClassName,spec.resources.requests.storage,spec.accessModes.0,spec.volumeName"
    related: "/volume-provisions/!flat:phase"
    watch: "/volume-provisions/"
  - name: vp_ask
    type: decision
    params:
      # chronicle-source: modules/app/_chronicle/volume_provision.uproc vp_ask
      decision: ""
  - name: vp_class
    type: store_effect
    key_prefix: "/storageclasses/"
    paths: "provisioner,parameters.custody,parameters.fsType"
    ints: "parameters.minTier,parameters.lifetimeSeconds"
  - name: vp_open
    type: decision
    params:
      # chronicle-source: modules/app/_chronicle/volume_provision.uproc vp_open
      decision: ""
  - name: vp_create
    type: store_effect
    key_prefix: "/volume-provisions/"
  - name: vp_src
    type: store_source
    prefix: "/volume-provisions/"
    flat: 1
    paths: "phase,out,custody,fs,device,vol,set,grant,reason,size,access"
    ints: "tier,lifetime,at,tries,vek,wake"
    now: 1
    due: "wake,at+30000"
  - name: vp_step
    type: decision
    params:
      # chronicle-source: modules/app/_chronicle/volume_provision.uproc vp_step
      decision: ""
  - name: vp_store
    type: store_effect
    key_prefix: "/volume-provisions/"
  - name: vp_act
    type: decision
    params:
      # chronicle-source: modules/app/_chronicle/volume_effect.uproc vx_act
      decision: ""
  - name: vp_route
    type: decision
    params:
      # chronicle-source: modules/app/_chronicle/volume_route.uproc vx_route_provision
      decision: ""
  - name: vp_record
    type: decision
    params:
      # chronicle-source: modules/app/_chronicle/volume_effect.uproc vx_record
      decision: ""
  - name: vp_out
    type: store_effect
    key_prefix: "/volume-provisions/"
  # ── attach, its second epoch, detach: this node's attachments ──
  - name: va_src
    type: store_source
    prefix: "/volume-attachments/"
    flat: 1
    paths: "desired,phase,out,fresh,device,grant,access,vol,fs,inst,dev,reason,note,erase"
    ints: "fence,lease_exp,exp,at,tries,ready,wake"
    now: 1
    due: "wake,at+5000,at+30000,at+900000"
    related: "/volumes/:mount,device;/volume-keys/:kvol,epoch,next"
    watch: "/volumes/,/volume-keys/"
    where: "device=node-a"
  - name: va_attach
    type: decision
    params:
      # chronicle-source: modules/app/_chronicle/volume_attach.uproc va_attach
      decision: ""
  - name: va_epoch
    type: decision
    params:
      # chronicle-source: modules/app/_chronicle/volume_attach_epoch.uproc va_epoch
      decision: ""
  - name: va_detach
    type: decision
    params:
      # chronicle-source: modules/app/_chronicle/volume_detach.uproc va_detach
      decision: ""
  - name: va_store
    type: store_effect
    key_prefix: "/volume-attachments/"
  - name: va_vx_act
    type: decision
    params:
      # chronicle-source: modules/app/_chronicle/volume_effect.uproc vx_act
      decision: ""
  - name: va_vk_act
    type: decision
    params:
      # chronicle-source: modules/app/_chronicle/volume_key_effect.uproc vk_act
      decision: ""
  - name: va_vx_route
    type: decision
    params:
      # chronicle-source: modules/app/_chronicle/volume_route.uproc vx_route_attach
      decision: ""
  - name: va_vk_route
    type: decision
    params:
      # chronicle-source: modules/app/_chronicle/volume_route.uproc vk_route_attach
      decision: ""
  - name: va_vx_record
    type: decision
    params:
      # chronicle-source: modules/app/_chronicle/volume_effect.uproc vx_record
      decision: ""
  - name: va_vk_record
    type: decision
    params:
      # chronicle-source: modules/app/_chronicle/volume_key_effect.uproc vk_record
      decision: ""
  - name: va_out
    type: store_effect
    key_prefix: "/volume-attachments/"
  # ── retention: an unattached volume past `retain` is deleted ──
  - name: ve_kept
    type: store_source
    prefix: "/volume-attachments/"
    due: "at+5000,at+30000"
    flat: 1
    paths: "desired,vol"
    ints: "retain"
    now: 1
  - name: ve_retain
    type: decision
    params:
      # chronicle-source: modules/app/_chronicle/volume_delete.uproc ve_retain
      decision: ""
  - name: ve_ask
    type: store_effect
    key_prefix: "/volume-deletions/"
  # ── /volume-grants/ ──
  - name: vg_src
    type: store_source
    prefix: "/volume-grants/"
    flat: 1
    paths: "op,new,custody,evict,actor,phase,out,reason,note"
    ints: "tier,lifetime,at,tries,wake"
    now: 1
    due: "wake,at+30000"
    related: "/volume-attachments/:vol,grant,phase,desired,device;/volume-keys/:kvol"
    watch: "/volume-attachments/,/volume-keys/"
  - name: vg_step
    type: decision
    params:
      # chronicle-source: modules/app/_chronicle/volume_grant.uproc vg_step
      decision: ""
  - name: vg_store
    type: store_effect
    key_prefix: "/volume-grants/"
  - name: vg_act
    type: decision
    params:
      # chronicle-source: modules/app/_chronicle/volume_key_effect.uproc vk_act
      decision: ""
  - name: vg_route
    type: decision
    params:
      # chronicle-source: modules/app/_chronicle/volume_route.uproc vk_route_grant
      decision: ""
  - name: vg_record
    type: decision
    params:
      # chronicle-source: modules/app/_chronicle/volume_key_effect.uproc vk_record
      decision: ""
  - name: vg_out
    type: store_effect
    key_prefix: "/volume-grants/"
  # ── /volume-rotations/ ──
  - name: vt_src
    type: store_source
    prefix: "/volume-rotations/"
    flat: 1
    paths: "why,actor,phase,out,reason,note,from,to,set,cstate"
    ints: "vek,cursor,pins,at,tries,wake"
    now: 1
    due: "wake,at+5000,at+30000"
    related: "/volume-attachments/:vol,phase,inst,device,fence#;/volume-keys/:kvol,epoch,next"
    watch: "/volume-attachments/,/volume-keys/"
  - name: vt_prepare
    type: decision
    params:
      # chronicle-source: modules/app/_chronicle/volume_rotate.uproc vt_prepare
      decision: ""
  - name: vt_migrate
    type: decision
    params:
      # chronicle-source: modules/app/_chronicle/volume_rotate.uproc vt_migrate
      decision: ""
  - name: vt_store
    type: store_effect
    key_prefix: "/volume-rotations/"
  - name: vt_act
    type: decision
    params:
      # chronicle-source: modules/app/_chronicle/volume_key_effect.uproc vk_act
      decision: ""
  - name: vt_route
    type: decision
    params:
      # chronicle-source: modules/app/_chronicle/volume_route.uproc vk_route_rotate
      decision: ""
  - name: vt_record
    type: decision
    params:
      # chronicle-source: modules/app/_chronicle/volume_key_effect.uproc vk_record
      decision: ""
  - name: vt_out
    type: store_effect
    key_prefix: "/volume-rotations/"
  # ── /volume-snapshots/ ──
  - name: vs_src
    type: store_source
    prefix: "/volume-snapshots/"
    flat: 1
    paths: "desired,restore,restored,phase,out,reason,note,root,elo,ehi,kvol,clone"
    ints: "retain,at,tries,wake"
    now: 1
    due: "wake,at+5000,at+30000"
    related: "/volume-attachments/^1:vol,phase,inst,fs,access,grant,set,device;/volume-keys/^1:kvol,epoch,next;/volume-deletions/^1:phase"
    watch: "/volume-attachments/,/volume-keys/,/volume-deletions/"
  - name: vs_step
    type: decision
    params:
      # chronicle-source: modules/app/_chronicle/volume_snapshot.uproc vs_step
      decision: ""
  - name: vs_store
    type: store_effect
    key_prefix: "/volume-snapshots/"
  - name: vs_act
    type: decision
    params:
      # chronicle-source: modules/app/_chronicle/volume_data_effect.uproc vl_act
      decision: ""
  - name: vs_route
    type: decision
    params:
      # chronicle-source: modules/app/_chronicle/volume_route.uproc vl_route_snapshot
      decision: ""
  - name: vs_record
    type: decision
    params:
      # chronicle-source: modules/app/_chronicle/volume_data_effect.uproc vl_record
      decision: ""
  - name: vs_out
    type: store_effect
    key_prefix: "/volume-snapshots/"
  # ── /volume-recoveries/ ──
  - name: vr_src
    type: store_source
    prefix: "/volume-recoveries/"
    flat: 1
    paths: "actor,approver,device,phase,out,reason,ticket,inst,note"
    ints: "ttl,fence,ready,custodians,at,tries,wake"
    now: 1
    due: "wake,at+5000,at+30000"
    related: "/volume-attachments/:vol,phase,grant;/volume-keys/:kvol,epoch,next"
    watch: "/volume-attachments/,/volume-keys/"
  - name: vr_recover
    type: decision
    params:
      # chronicle-source: modules/app/_chronicle/volume_recovery.uproc vr_recover
      decision: ""
  - name: vr_unwind
    type: decision
    params:
      # chronicle-source: modules/app/_chronicle/volume_recovery.uproc vr_unwind
      decision: ""
  - name: vr_store
    type: store_effect
    key_prefix: "/volume-recoveries/"
  - name: vr_act
    type: decision
    params:
      # chronicle-source: modules/app/_chronicle/volume_data_effect.uproc vl_act
      decision: ""
  - name: vr_route
    type: decision
    params:
      # chronicle-source: modules/app/_chronicle/volume_route.uproc vl_route_recovery
      decision: ""
  - name: vr_record
    type: decision
    params:
      # chronicle-source: modules/app/_chronicle/volume_data_effect.uproc vl_record
      decision: ""
  - name: vr_out
    type: store_effect
    key_prefix: "/volume-recoveries/"
  # ── /volume-deletions/ ──
  - name: vd_src
    type: store_source
    prefix: "/volume-deletions/"
    flat: 1
    paths: "why,actor,phase,out,reason,note,erased"
    ints: "pins,at,tries,wake"
    now: 1
    due: "wake,at+5000,at+30000"
    related: "/volume-attachments/:vol,phase,reason,inst,dev,fence;/volume-keys/:kvol,epoch"
    watch: "/volume-attachments/,/volume-keys/"
  - name: ve_step
    type: decision
    params:
      # chronicle-source: modules/app/_chronicle/volume_delete.uproc ve_step
      decision: ""
  - name: vd_store
    type: store_effect
    key_prefix: "/volume-deletions/"
  - name: vd_act
    type: decision
    params:
      # chronicle-source: modules/app/_chronicle/volume_data_effect.uproc vl_act
      decision: ""
  - name: vd_route
    type: decision
    params:
      # chronicle-source: modules/app/_chronicle/volume_route.uproc vl_route_delete
      decision: ""
  - name: vd_record
    type: decision
    params:
      # chronicle-source: modules/app/_chronicle/volume_data_effect.uproc vl_record
      decision: ""
  - name: vd_out
    type: store_effect
    key_prefix: "/volume-deletions/"
  # ── claim: the mount actuator ──
  - name: vc_src
    type: store_source
    prefix: "/volumes/"
    due: "at+900000"
    flat: 1
    paths: "path,device,fs,mount,dir,mkfs"
    ints: "at"
    now: 1
    related: "/volume-attachments/:dev"
    watch: "/volume-attachments/"
  - name: vc_claim
    type: decision
    params:
      # chronicle-source: modules/app/_chronicle/volume_claim.uproc vc_claim
      decision: ""
  - name: vc_store
    type: store_effect
    key_prefix: "/volumes/"
  - name: vc_act
    type: decision
    params:
      # chronicle-source: modules/app/_chronicle/volume_claim.uproc vc_act
      decision: ""
  - name: mount_effect
  - name: vc_done
    type: decision
    params:
      # chronicle-source: modules/app/_chronicle/volume_claim.uproc vc_done
      decision: ""
  - name: vc_out
    type: store_effect
    key_prefix: "/volumes/"
  # ── effectors ──
  # The records chain (volume_records.uproc): an effect that names a store
  # write in, the write made, the outcome back — three store calls, each
  # stage deciding its request from the record before, then the answer.
  - name: vw_s1
    type: store_effect
    # chronicle-source: modules/app/_chronicle/volume_records.uproc vw_s1
    decision: ""
    key_prefix: ""
    flat: 1
    paths: "reason,phase,kvol"
    ints: "elo,ehi"
    revision: 1
    # chronicle-source: modules/app/_chronicle/volume_records.uproc vw_pin_snap
    count_where: ""
  - name: vw_s2
    type: store_effect
    # chronicle-source: modules/app/_chronicle/volume_records.uproc vw_s2
    decision: ""
    key_prefix: ""
    flat: 1
    paths: "kvol"
    ints: "epoch,next"
    wall: 1
    # chronicle-source: modules/app/_chronicle/volume_records.uproc vw_pin_key
    count_where: "0128000000670001000203000000010002220000002101000228000000010002200000002030010002210000001200002001000221000000532000100000000000000000203101000232000000010002210000005320002031010002330000000100022100000053200020313000030000000f0010010000000000000040010000004101000000010041"
  - name: vw_s3
    type: store_effect
    # chronicle-source: modules/app/_chronicle/volume_records.uproc vw_s3
    decision: ""
    key_prefix: ""
  - name: vw_answer
    type: decision
    params:
      # chronicle-source: modules/app/_chronicle/volume_records.uproc vw_answer
      decision: ""
  - name: loam_effect
    admin: "127.0.0.1:7443"
    capability: /etc/nanocloud/volumes/node.cap
    root: nanocloud
  - name: loam_tls
    type: tls
    mode: 0
    peer_auth: ca_dns
    trust: "${file:/etc/nanocloud/volumes/ca.der}"
    cert_file: /etc/nanocloud/volumes/node.der
    key_file: /etc/nanocloud/volumes/node.key.der
  - name: kagi_storage_effect
    params:
      aead: 1
  - name: volume_host
    loam_authority: "127.0.0.1:7443"
    loam_capability: /etc/nanocloud/volumes/node.cap
    trust: "${file:/etc/nanocloud/volumes/ca.der}"
    cert_file: /etc/nanocloud/volumes/node.der
    key_file: /etc/nanocloud/volumes/node.key.der
    issuer: "https://kagi.nanocloud"
    device: "node-a"
    device_key_label: "nanocloud/device"
  - name: kagi_client
    type: http
    variant: exchange
    mode: 1
    authority: "127.0.0.1:7446"
  - name: kagi_client_tls
    type: tls
    mode: 0
    peer_auth: ca_dns
    trust: "${file:/etc/nanocloud/volumes/ca.der}"
    cert_file: /etc/nanocloud/volumes/node.der
    key_file: /etc/nanocloud/volumes/node.key.der
  # ── Kagi: the storage-key service, its ledger, custodians and endpoint ──
  - name: storage_key
    iss: "https://kagi.nanocloud"
  - name: security_state
    authority: "single-node"
  - name: custodian_0
    type: storage_custodian
    index: 0
    label: "custodian-0"
  - name: custodian_1
    type: storage_custodian
    index: 1
    label: "custodian-1"
  - name: custodian_2
    type: storage_custodian
    index: 2
    label: "custodian-2"
  - name: storage_key_endpoint
  - name: kagi_http
    type: http
    variant: exchange
    port: 7446
    host_tcp: 1
    routes:
      - path: "/storage-key"
        app: true
  - name: kagi_tls
    type: tls
    mode: 1
    verify_peer: 1
    peer_auth: ca_dns
    trust: "${file:/etc/nanocloud/volumes/ca.der}"
    cert_file: /etc/nanocloud/volumes/kagi.der
    key_file: /etc/nanocloud/volumes/kagi.key.der

wiring:
  - from: vp_pvc.status
    to: vp_pvc.changes
  - from: vp_pvc.record_out
    to: vp_ask.record_in
  - from: vp_ask.result_out
    to: vp_class.request_in
  - from: vp_class.response_out
    to: vp_open.record_in
  - from: vp_open.result_out
    to: vp_create.request_in
  - from: vp_src.status
    to: vp_src.changes
  - from: vp_src.record_out
    to: vp_step.record_in
  - from: vp_step.result_out
    to: vp_store.request_in
  - from: vp_store.response_out
    to: vp_act.record_in
  - from: vp_route.result_out
    to: vp_record.record_in
  - from: vp_record.result_out
    to: vp_out.request_in
  - from: va_src.status
    to: va_src.changes
  - from: va_src.record_out
    to: va_attach.record_in
  - from: va_attach.result_out
    to: va_store.request_in
  - from: va_src.record_out
    to: va_epoch.record_in
  - from: va_epoch.result_out
    to: va_store.request_in
  - from: va_src.record_out
    to: va_detach.record_in
  - from: va_detach.result_out
    to: va_store.request_in
  - from: va_store.response_out
    to: va_vx_act.record_in
  - from: va_store.response_out
    to: va_vk_act.record_in
  - from: va_vx_route.result_out
    to: va_vx_record.record_in
  - from: va_vk_route.result_out
    to: va_vk_record.record_in
  - from: va_vx_record.result_out
    to: va_out.request_in
  - from: va_vk_record.result_out
    to: va_out.request_in
  - from: ve_kept.status
    to: ve_kept.changes
  - from: ve_kept.record_out
    to: ve_retain.record_in
  - from: ve_retain.result_out
    to: ve_ask.request_in
  - from: vg_src.status
    to: vg_src.changes
  - from: vg_src.record_out
    to: vg_step.record_in
  - from: vg_step.result_out
    to: vg_store.request_in
  - from: vg_store.response_out
    to: vg_act.record_in
  - from: vg_route.result_out
    to: vg_record.record_in
  - from: vg_record.result_out
    to: vg_out.request_in
  - from: vt_src.status
    to: vt_src.changes
  - from: vt_src.record_out
    to: vt_prepare.record_in
  - from: vt_prepare.result_out
    to: vt_store.request_in
  - from: vt_src.record_out
    to: vt_migrate.record_in
  - from: vt_migrate.result_out
    to: vt_store.request_in
  - from: vt_store.response_out
    to: vt_act.record_in
  - from: vt_route.result_out
    to: vt_record.record_in
  - from: vt_record.result_out
    to: vt_out.request_in
  - from: vs_src.status
    to: vs_src.changes
  - from: vs_src.record_out
    to: vs_step.record_in
  - from: vs_step.result_out
    to: vs_store.request_in
  - from: vs_store.response_out
    to: vs_act.record_in
  - from: vs_route.result_out
    to: vs_record.record_in
  - from: vs_record.result_out
    to: vs_out.request_in
  - from: vr_src.status
