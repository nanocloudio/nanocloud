# Service ClusterIP allocation as Chronicle params (ipam_svc.uproc): each
# address is claimed create-only at /ipam/svc/<u32>, then PATCHed into
# spec.clusterIP.
# EXTRACTED from packaging/debian/fluxor-controlplane.yaml by
# scripts/extract-fixture.py (is_) — do not edit; re-extract.
target: linux
tick_us: 1000

scheduler:
  accept_cycles: true

modules:
  - name: is_wait
    type: store_source
    prefix: "/services/"
    where: "spec.clusterIP="
    count: 1
    watch: "/ipam-retry/"
  - name: is_cur
    type: store_effect
    # chronicle-source: modules/app/_chronicle/ipam_svc.uproc sa_cur
    decision: {hex: "010500000012000100021400000010000000000000000020000d0000003500010002010000004001000000100100000000000000400200000012030073766340030000000100020300000042011e40fe000000410d0000003200010002010000004001000000100000000000000000400200000012000040030000000100020300000042011e40fe00000041"}
    key_prefix: "/ipam-cursor/"
    flat: 1
    ints: "n"
  - name: is_claim
    type: store_effect
    # chronicle-source: modules/app/_chronicle/ipam_svc.uproc sa_claim
    decision: {hex: ""}
    key_prefix: "/ipam/svc/"
  - name: is_bump
    type: store_effect
    # chronicle-source: modules/app/_chronicle/ipam_svc.uproc sa_bump
    decision: {hex: ""}
    key_prefix: "/ipam-cursor/"
  - name: is_bind
    type: store_effect
    # chronicle-source: modules/app/_chronicle/ipam_svc.uproc sa_bind
    decision: {hex: ""}
  - name: is_used
    type: store_source
    prefix: "/services/"
    count: 1
    empty: 1
    ints: "spec.clusterIP!ip4"
  - name: is_used_c
    type: store_effect
    # chronicle-source: modules/app/_chronicle/ipam_svc.uproc sb_claim
    decision: {hex: ""}
    key_prefix: "/ipam/svc/"
  - name: is_ready
    type: store_effect
    # chronicle-source: modules/app/_chronicle/ipam_svc.uproc sb_ready
    decision: {hex: ""}
    key_prefix: "/ipam-cursor/"
  - name: is_wake
    type: store_effect
    # chronicle-source: modules/app/_chronicle/ipam_pod_release.uproc wake
    decision: {hex: ""}
  - name: is_claims
    type: store_source
    prefix: "/ipam/svc/"
    flat: 1
    paths: "owner"
    ints: "ip"
    watch: "/services/"
  - name: is_owner
    type: store_effect
    # chronicle-source: modules/app/_chronicle/ipam_svc.uproc sr_owner
    decision: {hex: "00140000004600010002010000004001000000100100000000000000400200000001000204000000400300000001000203000000010002320000000100020400000042031e1f2040fe00000041"}
    key_prefix: "/services/"
    ints: "spec.clusterIP!ip4"
  - name: is_free
    type: store_effect
    # chronicle-source: modules/app/_chronicle/ipam_svc.uproc sr_free
    decision: {hex: ""}
    key_prefix: "/ipam/svc/"

wiring:
  - from: is_wait.record_out
    to: is_cur.request_in
  - from: is_cur.response_out
    to: is_claim.request_in
  - from: is_claim.response_out
    to: is_bump.request_in
  - from: is_bump.response_out
    to: is_bind.request_in
  - from: is_used.record_out
    to: is_used_c.request_in
  - from: is_used_c.response_out
    to: is_ready.request_in
  - from: is_ready.response_out
    to: is_wake.request_in
  - from: is_claims.record_out
    to: is_owner.request_in
  - from: is_owner.response_out
    to: is_free.request_in
