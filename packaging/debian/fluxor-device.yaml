# Device identities as Chronicle params (device.uproc), issued by kagi's
# certificate_endpoint. A Device names the public key it holds
# (spec.publicKey); one with no /deviceidentities.nanocloud.io/ entry yet is
# certified once — POST /pki/certificate through http_effect — and its identity
# (SPIFFE id, leaf, CA) is written back, and the CA to /ca-cert. The authority
# signs under the vault key `nanocloud.ca`, the node's one signing root
# (generated in the vault, sealed under FLUXOR_SEAL_KEY, never exported); no
# private key is ever issued or stored.
target: linux
tick_us: 1000

scheduler:
  accept_cycles: true

modules:
  - name: dv_source
    type: store_source
    prefix: "/devices.nanocloud.io/"
    paths: "spec.publicKey"
    # Certified once per key: a holder that re-keys is certified again.
    differs: "spec.publicKey,status.publicKey"
  - name: dv_dec
    type: decision
    params:
      # chronicle-source: modules/app/_chronicle/device.uproc rq
      decision: {hex: ""}
  - name: dv_http
    type: http_effect
    paths: "certificate,ca,spiffe_id"
  - name: certificate_endpoint
    issuer_cn: "nanocloud-ca"
    trust_domain: "nanocloud.local"
    dns_suffix: ".svc.cluster.local"
    key_label: "nanocloud.ca"
  - name: dv_ids
    type: store_effect
    # chronicle-source: modules/app/_chronicle/device.uproc idn
    decision: {hex: ""}
    key_prefix: "/deviceidentities.nanocloud.io/"
  - name: dv_ca
    type: store_effect
    # chronicle-source: modules/app/_chronicle/device.uproc cap
    decision: {hex: ""}
  # The Device's own status: what a client reading its Device through the
  # API is answered with (a joining node, its peer keys certified).
  - name: dv_status
    type: store_big
    # chronicle-source: modules/app/_chronicle/device.uproc sts
    decision: {hex: ""}
    key_prefix: "/devices.nanocloud.io/"

wiring:
  - from: dv_source.status
    to: dv_source.changes
  - from: dv_source.record_out
    to: dv_dec.record_in
  - from: dv_dec.result_out
    to: dv_http.request_in
  # The certificate call: one exchange per record, http_effect the requester.
  - from: dv_http.request_out
    to: certificate_endpoint.request_in
  - from: certificate_endpoint.response_out
    to: dv_http.response_in
  - from: dv_http.response_out
    to: dv_ids.request_in
  - from: dv_ids.response_out
    to: dv_ca.request_in
  - from: dv_http.response_out
    to: dv_status.request_in
