# cluster-edge workload graph: tls-fronted 443 ingress
# anchor. External HTTPS terminates at `tls` (transport.anchor.stream.secure)
# and reaches the `http` proxy anchor (transport.anchor.stream) in cleartext.
#
# The proxy RELAY is now live: the http module dials
# the matched backend and streams the request/response through — not just a
# route table. Routes are programmed dynamically:
# `routes_prefix` points the http table_consumer at /dataplane/edge/, which
# route_compiler (fluxor-route-compiler.yaml) populates from validated Routes.
# Backend hops are cleartext within the host/cluster segment in v1;
# TLS is terminated at the anchor.
#
# The fixed surface (/healthz, /readyz, landing, 404) is the empty-table
# fallback: when no dynamic route matches, the anchor serves it, so ingress
# degrades to a fixed answer rather than hanging.
target: linux
tick_us: 100

scheduler:
  accept_cycles: true      # linux_net ⇄ tls ⇄ http feedback pairs + routes self-edge

# Injects the `linux_net` built-in (host TCP via libc sockets) — the transport
# tls terminates. External clients reach 443; tls forwards http's CMD_BIND(443)
# down to linux_net so the anchor owns the listener.
platform:
  net: {}

modules:
  # TLS 1.3 termination (transport.anchor.stream.secure). Server TLS
  # (verify_peer=0) so ordinary HTTPS clients reach the edge; certs are
  # provisioned by the package (postinst generates a self-signed node cert
  # if absent), matching the control-plane graph's convention.
  - name: tls
    mode: 1
    verify_peer: 0
    # The proxy relay behind this anchor is HTTP/1.1-only (it forwards raw
    # HTTP/1.x bytes). Restrict the ALPN advertisement
    # to http/1.1 so dual-offering clients (curl offers h2,http/1.1) negotiate
    # h1 and reach the dynamic-route relay instead of the h2 (static-only) path.
    alpn_h1_only: 1
    cert_file: "/etc/nanocloud.io/certs/server.der"
    key_file: "/etc/nanocloud.io/certs/server.key.der"

  # The proxy anchor (transport.anchor.stream). Binds 443 (through tls),
  # relays matched requests to workload backends, serves the fixed surface
  # for everything else.
  - name: http_edge
    port: 443
    host_tcp: 1
    # Consume the compiled edge routes. Empty = feature off (default); set
    # here, the module SUBSCRIBEs the prefix and maintains its DynRoute arena,
    # which the relay dials on a match.
    routes_prefix: "/dataplane/edge/"
    # Dynamic listeners are DEFERRED on this tls-fronted graph: http binds
    # through `tls`, so any mid-life-bound port is TLS-terminated regardless —
    # a `tls=1` listener, and only the cleartext (`tls=0`) mid-life bind is
    # built, where http drives linux_net directly. The self-edge below is pre-wired but
    # `listeners_prefix` stays unset here, leaving the subsystem inert. A
    # CLEARTEXT edge sets `listeners_prefix: "/dataplane/edge-listeners/"`
    # and mid-life-binds pooled ports directly (see the dynamic-listener e2e).
    # listeners_prefix: "/dataplane/edge-listeners/"
    routes:
      - path: "/healthz"
        body: "ok"
        content_type: "text/plain"
      - path: "/readyz"
        body: "ok"
        content_type: "text/plain"
      - path: "/"
        body: "<html><body><h1>nanocloud edge</h1><p>graph-hosted edge serving</p></body></html>"

wiring:
  # linux_net <-> tls (ciphertext) <-> http (cleartext); tls forwards the bind.
  - from: linux_net.net_out
    to: tls.cipher_in
  - from: tls.cipher_out
    to: linux_net.net_in
    buffer_bytes: 32768
  - from: tls.clear_out
    to: http_edge.net_in
  - from: http_edge.net_out
    to: tls.clear_in
    buffer_bytes: 32768
  # Dynamic-route change-sink self-edge: the http
  # module's own output feeds its `routes_changes` input, allocating a
  # module-owned channel the store's namespace.change SUBSCRIBE pushes onto.
  # The module never writes this output; it drains pushed events from the
  # input. Inert unless `routes_prefix` is configured.
  - from: http_edge.routes_sink
    to: http_edge.routes_changes
  # Dynamic-listener change-sink self-edge: a
  # SECOND 1-node cycle allocating the module-owned channel the store's
  # namespace.change SUBSCRIBE for /dataplane/edge-listeners/ pushes onto.
  # Inert unless `listeners_prefix` is configured.
  - from: http_edge.listeners_sink
    to: http_edge.listeners_changes
