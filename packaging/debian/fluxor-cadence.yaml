# Adaptive-tick cadence graph — the scheduler fmod on a single
# relaxable domain, proving fluxor's upward-only variable cadence for an idle
# nanocloud control plane.
#
# Same module + self-edge as fluxor-scheduler.yaml, but domain `main` enables
# adaptive tick:
#
#   adaptive_flags = 3 = ADAPTIVE_FLAG_IDLE (bit 0, demand-driven idle relax)
#                      | ADAPTIVE_FLAG_CADENCE (bit 1, AIMD variable cadence)
#   tick_min_us = 1000   the HARD floor — the responsive base tick. The pacer
#                        never goes below it (no sub-floor busy-spin); a burst is
#                        absorbed intra-tick by the existing burst/multi-pass
#                        machinery, not by shrinking the period.
#   tick_max_us = 50000  the idle backstop. When the domain has no pending wake
#                        and no burst, the pacer walks the next deadline UP toward
#                        this ceiling. Any store change (a SUBSCRIBE push) latches
#                        an event wake that snaps the loop straight back to the
#                        floor, so relaxation costs no latency on real work.
#
# Net: an idle control plane parks ~20x/s (50ms) instead of ~1000x/s (1ms), with
# unchanged responsiveness. Only the power/thermal idle cost changes.
#
# Admissibility (I1): the scheduler declares timer_class = "agnostic"
# (cadence-independent — it reads no tick-as-time), so it clears the mechanism-(b)
# attestation gate in `validate_adaptive_tick`. A tick-counting module here would
# make `fluxor build` reject this graph outright.
#
# Single-domain by design on the linux host: the linux runner is single-threaded
# and paces the base graph off domain 0, so the relaxable domain IS domain 0
# here. The two-domain split (a fixed-cadence tenant co-resident beside this
# relaxable one) becomes operative on the multicore bcm2712 target and once a
# native/RT workload that must not relax shares the node.
target: linux
tick_us: 1000

# The self-edge below (change-sink allocator) is a deliberate 1-node cycle.
scheduler:
  accept_cycles: true

execution:
  domains:
    - name: main
      cores: [0]
      adaptive_flags: 3
      tick_min_us: 1000
      tick_max_us: 50000

modules:
  # The scheduler is PARAMS: the FIRST unbound Pod (where spec.nodeName=,
  # count index 0) JOIN /ready-nodes/ picked by the fewest Pods bound to it —
  # measured from the Pods themselves at pick time — PATCHes spec.nodeName;
  # one bind per pass, the spread emergent. Then the Scheduled event. Reads
  # /ready-nodes/ from the DaemonSet chain's projection. Params from
  # modules/app/_chronicle/scheduler.uproc.
  - name: sc_unbound
    type: store_source
    prefix: "/pods/"
    where: "spec.nodeName="
    count: 1
    join: "/ready-nodes/"
    join_pick: "mincount:/pods/:spec.nodeName"
    watch: "/ready-nodes/"
  - name: sc_bind
    type: decision
    params:
      # chronicle-source: modules/app/_chronicle/scheduler.uproc bd
      decision: ""
  - name: sc_patch
    type: store_effect
    key_prefix: "/pods/"
  - name: sc_record
    type: decision
    params:
      # chronicle-source: modules/app/_chronicle/scheduler.uproc rc
      decision: ""
  - name: sc_events
    type: store_effect
    key_prefix: "/events/"
  # the ready-nodes projection (the DaemonSet chain's rdy decision)
  - name: ds_nodes
    type: store_source
    prefix: "/nodes/"
    paths: "status.ready"
  - name: ds_ready
    type: decision
    params:
      # chronicle-source: modules/app/_chronicle/daemonset.uproc rdy
      decision: "01050000001000010002040000001204007472756520000b00000030000100020100000040010000001003000000000000004002000000010002030000004003000000120100314004000000410b0000002f000100020100000040010000001004000000000000004002000000010002030000004003000000120000400400000041"
  - name: ds_mark
    type: store_effect
    key_prefix: "/ready-nodes/"
    domain: main

# Self-edge: the scheduler's own output feeds its `changes` input, allocating a
# module-owned channel the store's namespace.change SUBSCRIBE pushes onto. The
# module never writes this output; it drains pushed events from the input.
wiring:
  - from: sc_unbound.status
    to: sc_unbound.changes
  - from: sc_unbound.record_out
    to: sc_bind.record_in
  - from: sc_bind.result_out
    to: sc_patch.request_in
    buffer_group: 111
  - from: sc_patch.response_out
    to: sc_record.record_in
  - from: sc_record.result_out
    to: sc_events.request_in
    buffer_group: 112
  - from: ds_nodes.status
    to: ds_nodes.changes
  - from: ds_nodes.record_out
    to: ds_ready.record_in
  - from: ds_ready.result_out
    to: ds_mark.request_in
    buffer_group: 41
