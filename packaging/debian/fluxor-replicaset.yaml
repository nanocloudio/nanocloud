# replicaset-reconciler workload graph: the
# replicaset_reconciler fmod, which watches /replicasets.apps/ and /pods/ and
# ensures each ReplicaSet has exactly `replicas` Pods under /pods/<ns>/<rs>-<i> —
# creating the missing, deleting the surplus. The second link of Deployment →
# ReplicaSet → Pods, all cooperating modules over the shared store.
target: linux
tick_us: 1000

# The self-edge below (change-sink allocator) is a deliberate 1-node cycle.
scheduler:
  accept_cycles: true

modules:
  - name: replicaset_reconciler

# Self-edge: the reconciler's own output feeds its `changes` input, allocating a
# module-owned channel the store's namespace.change SUBSCRIBE pushes onto. The
# module never writes this output; it drains pushed events from the input.
wiring:
  - from: replicaset_reconciler.status
    to: replicaset_reconciler.changes
