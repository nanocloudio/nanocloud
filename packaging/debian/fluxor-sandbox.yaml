# The container runtime as Chronicle params (sandbox.uproc, volume.uproc) over
# the `workload_effect` connector, which performs the workload ops (0x1A/0x1B),
# holds the live handles and reports what it observes. Desired sandboxes are
# /sandboxes/<id> (projected by the pod chain); what happened lands in
# /sandbox-status/, /sandbox-logs/, /sandbox-exec-result/ and /tty/. A pod's
# volumes (/pod-specs/<uid> volumes=) become workload binds.
#
# Other graphs embed this block between the `# ── sandbox` markers (scripts/
# support/sandbox-block.py), so the runtime is stated once.
target: linux
tick_us: 1000

scheduler:
  accept_cycles: true

modules:
  # ── sandbox ────────────────────────────────────────────────────────────
  - name: wl
    type: workload_effect
    # A pulled workload image's layers (http_fetch's `dir`).
    blobs: "/var/lib/nanocloud.io/image/blobs"
  - name: sb_spec
    type: store_source
    prefix: "/sandboxes/"
    flat: 1
    paths: "phase,cmd,rootfs,iso,net,tasks,env,host,wd,iwd,user,cpu,mem,eph,dns"
    count_children: "/volume-binds/"
    list_children: "/volume-binds/"
    list_values: 1
    child_sep: "/"
    # The node's segment (/sandbox-net, node_net's): what an own-network
    # sandbox's identity joins, stated before any is created.
    related: "/sandbox-status/:state;/ipam-lease/:.;/ipam-pool^9:.!prefix;/sandbox-boot^9:id;/pod-specs/:volumes!count#,desired;/sandbox-boot-of/:.;/sandbox-net^9:seg"
    watch: "/sandbox-status/,/ipam-lease/,/sandbox-boot,/volume-binds/,/sandbox-boot-of/,/sandbox-net"
  - name: sb_specd
    type: decision
    params:
      # chronicle-source: modules/app/_chronicle/sandbox.uproc sb_spec
      decision: {hex: ""}
  # A graph-backed sandbox: the same decision over /metal-sandboxes/, where a
  # Pod with runtimeClassName fluxor lands (pod_project). The kernel realises
  # its FLXA (/graphs/<graph>) as modules of the node's image — no rootfs,
  # binds or lease to wait for.
  - name: sb_mspec
    type: store_source
    prefix: "/metal-sandboxes/"
    flat: 1
    paths: "phase,graph,pack,cpu,mem,eph"
    # Its own address where the node's module workloads join its segment
    # (/sandbox-net graph=1, bare metal): its lease, once node_net asked for
    # it. Its resolver context: the cluster's name service (/cluster-dns)
    # and its namespace's search path.
    related: "/sandbox-status/:state;/sandbox-boot^9:id;/sandbox-boot-of/:.;/pod-specs/:desired,pod,hostnet;/ipam-lease/:.;/sandbox-net^9:seg,graph;/cluster-dns^9:."
    watch: "/sandbox-status/,/sandbox-boot,/sandbox-boot-of/,/ipam-lease/,/sandbox-net"
  - name: sb_mspecd
    type: decision
    params:
      # chronicle-source: modules/app/_chronicle/sandbox.uproc sb_mspec
      decision: {hex: ""}
  - name: sb_exec
    type: store_source
    prefix: "/sandbox-exec/"
    rev: 1
    paths: "."
    unless: "/sandbox-exec-result/"
    related: "/sandbox-status/^1!flat:state;/sandboxes/^1!flat:phase"
    watch: "/sandbox-status/"
  - name: sb_execd
    type: decision
    params:
      # chronicle-source: modules/app/_chronicle/sandbox.uproc sb_exec
      decision: {hex: ""}
  - name: sb_sig
    type: store_source
    prefix: "/sandbox-kill/"
    paths: "."
    # A signal for a sandbox not live yet is re-offered once it is.
    watch: "/sandbox-status/"
  - name: sb_pause
    type: store_source
    prefix: "/sandbox-pause/"
    paths: "."
    watch: "/sandbox-status/"
  - name: sb_sigd
    type: decision
    params:
      # chronicle-source: modules/app/_chronicle/sandbox.uproc sb_sig
      decision: {hex: ""}
  - name: sb_paused
    type: decision
    params:
      # chronicle-source: modules/app/_chronicle/sandbox.uproc sb_sig
      decision: {hex: ""}
  - name: sb_tty
    type: store_source
    prefix: "/tty/"
    flat: 1
    rev: 1
    paths: ".,rows,cols,cmd"
    related: "/tty/^1+status:."
    # An open waits for its sandbox to run: re-offered when that changes.
    watch: "/sandbox-status/"
  - name: sb_ttyd
    type: decision
    params:
      # chronicle-source: modules/app/_chronicle/sandbox.uproc sb_tty
      decision: {hex: ""}
  - name: sb_ev
    type: store_effect
    # chronicle-source: modules/app/_chronicle/sandbox.uproc sb_ev
    decision: {hex: ""}
    append_cap: 1024
    # Every byte a sandbox ever wrote, beside its log's bounded tail: what a
    # follower (`logs -f`) reads the tail's place in the whole stream by.
    append_tally: "/sandbox-logs/:/sandbox-log-n/"
  - name: sb_evout
    type: store_effect
    # chronicle-source: modules/app/_chronicle/sandbox.uproc sb_evout
    decision: {hex: ""}
  # volumes
  - name: vb_src
    type: store_source
    prefix: "/pod-specs/"
    flat: 1
    expand: "volumes[]"
    paths: "volumes.#"
    # A claim bound, or a ConfigMap or Secret changed: its volumes are
    # prepared again (volume_files projects only what changed), as
    # upstream's kubelet updates a mounted ConfigMap or Secret.
    watch: "/volumes/,/configmaps/,/secrets/"
  - name: vb_getd
    type: decision
    params:
      # chronicle-source: modules/app/_chronicle/volume.uproc vb_get
      decision: {hex: ""}
  # A Pod's own volumes — emptyDir, ConfigMap, Secret — as its directories on
  # this node (volume_files: made, projected, removed once the Pod is gone);
  # every other request passes through to the claim read.
  - name: vb_files
    type: volume_files
  - name: vb_get
    type: store_effect
    key_prefix: "/volumes/"
    flat: 1
    paths: "path"
  - name: vb_put
    type: store_effect
    # chronicle-source: modules/app/_chronicle/volume.uproc vb_put
    decision: {hex: ""}
    key_prefix: "/volume-binds/"
  - name: vb_rows
    type: store_source
    prefix: "/volume-binds/"
    rev: 1
    related: "/pod-specs/^1:."
    watch: "/pod-specs/"
  - name: vb_prune
    type: store_effect
    # chronicle-source: modules/app/_chronicle/volume.uproc vb_prune
    decision: {hex: "01050000000c000100024600000012000020000c0000003300010002010000004001000000100400000000000000400200000001000203000000400300000001000202000000401c000000410a000000310001000201000000400100000010000000000000000040020000001200004003000000100000000000000000401c00000041"}
    key_prefix: "/volume-binds/"
  # ── sandbox end ────────────────────────────────────────────────────────

wiring:
  # ── sandbox ────────────────────────────────────────────────────────────
  - from: sb_spec.record_out
    to: sb_specd.record_in
  - from: sb_specd.result_out
    to: wl.request_in
  - from: sb_mspec.record_out
    to: sb_mspecd.record_in
  - from: sb_mspecd.result_out
    to: wl.request_in_6
  - from: sb_exec.record_out
    to: sb_execd.record_in
  - from: sb_execd.result_out
    to: wl.request_in_2
  - from: sb_sig.record_out
    to: sb_sigd.record_in
  - from: sb_sigd.result_out
    to: wl.request_in_3
  - from: sb_pause.record_out
    to: sb_paused.record_in
  - from: sb_paused.result_out
    to: wl.request_in_5
  - from: sb_tty.record_out
    to: sb_ttyd.record_in
  - from: sb_ttyd.result_out
    to: wl.request_in_4
  - from: wl.event_out
    to: sb_ev.request_in
  - from: sb_ev.response_out
    to: sb_evout.request_in
  - from: vb_src.record_out
    to: vb_getd.record_in
  - from: vb_getd.result_out
    to: vb_files.request_in
  - from: vb_files.request_out
    to: vb_get.request_in
  - from: vb_get.response_out
    to: vb_put.request_in
  - from: vb_rows.record_out
    to: vb_prune.request_in
  # ── sandbox end ────────────────────────────────────────────────────────
