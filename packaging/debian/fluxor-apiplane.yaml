  - from: tomb_src.record_out
    to: tomb_gc.request_in
  - from: ws_emit.response_out
    to: reply.record_in
  - from: reply.result_out
    to: enc_http.record_in
  - from: enc_http.result_out
    to: http_chain.reply_in
    buffer_group: 7
  - from: rb_roles.status
    to: rb_roles.changes
  - from: rb_roles.record_out
