# The Kubernetes API request path, as a Chronicle graph.
#
# Decode, authenticate, authorize, read, write and answer — every one of them
# data. What a method MEANS as a verb, what a refused credential answers, when a
# create is a conflict, when a miss is a 404: all of it is params compiled from
# modules/app/_chronicle/apiplane.uproc. The only nanocloud modules present move
# bytes or walk a set, which are the two things Chronicle's VM cannot do by
# construction.
#
#   linux_net -> http (wave)      terminates HTTP, HANDLER_APP fan-out
#   -> kube_decode                envelope -> Request record + key + credential
#   -> admit    (decision)        credential out, request as carry
#   -> kagi_verify <-> token_verify   KAGI's verifier, over KAGI's auth_wire
#   -> authz    (decision)        verify_err -> verdict; method -> VERB
#   -> rbac_gate                  binding -> role -> rule, a SET walk
#   -> gate     (decision)        which requests admission should look at
#   -> api_admission              required fields, defaults, quota
#   -> probe    (decision)        -> GET the object / LIST the collection
#   -> se_probe (store_effect)
#   -> act      (decision)        what was found + the verb -> the write
#   -> se_act   (store_effect)
#   -> reply    (decision)        -> (cid, status, body)
#   -> enc_http (pipeline)        `ser` bytecode -> wave HttpResponse
#   -> http -> client
#
# WATCH, and its one honest limit. `?watch=true` is served by the second chain
# below: the request registers the watcher and answers the current listing with
# MORE_BODY set, and every later store change becomes an event on that
# connection. `watch` is checked as its OWN RBAC verb, which is what Kubernetes
# does — a role granting `list` does not grant it.
#
# The limit is wave's, not the chain's: `APP_TIMEOUT_MS = 30_000`, measured from
# the last progress, so a watch with nothing to say is cut off after 30 s. The
# answer is a heartbeat under that deadline — which is exactly what Kubernetes
# BOOKMARK events are — driven by a `due`-armed timer. Until that lands, a quiet
# watch drops and the client reconnects, which is behaviour every Kubernetes
# client already implements.
#
# The chain is also LEVEL-TRIGGERED, like every reconciler here: a change under
# the prefix re-emits the set rather than a delta, so a client can see an object
# it already has. Clients dedupe on resourceVersion; a delta would mean keeping
# per-watcher cursors, which is state a connector does not have.
#
# WHAT THIS GRAPH DOES NOT DO, and why `fluxor-apiserver.yaml` still exists:
# Swapping this in for the full apiserver before those land would trade a
# working surface for a cleaner one, which is not a trade worth making.
#
# Proven end to end by scripts/apiplane-e2e.sh — 21 cases: discovery, authn,
# authz, admission, CRUD, and the Kubernetes List/Status envelopes.
#
# mTLS: put fluxor's `tls` in front and wire `tls.peer_identity` to
# `http.peer_identity`. wave then carries the verified peer to the application
# as an envelope TRAILER, `kube_decode` projects it at field 12, and `admit`
# takes it as the caller — no bearer token, no kagi round trip, because the TLS
# layer already validated the chain and proved key possession.
#
# The identity is `peer:<fingerprint-hex>`, distinct by construction from a
# ServiceAccount's `system:serviceaccount:…`: two authentication methods that
# could produce the same subject string would let a binding written for one
# silently grant the other. See scripts/apiplane-mtls-e2e.sh.
#
# Probe:
#   curl -H "Authorization: Bearer <sa-token>" \
#        http://127.0.0.1:7444/api/v1/namespaces/default/pods/web-0

target: linux
tick_us: 1000

platform:
  net: {}

# rbac_gate self-wires status -> changes (a 1-node cycle) to allocate its
# store-change sink, and the request chain returns to `http`, so the graph is
# cyclic by construction.
scheduler:
  accept_cycles: true

modules:
  - name: http
    port: 7444
    host_tcp: 1
    max_body_kib: 64
    routes:
      # `/api/` is a PREFIX; `/api` without the slash does not match it, so the
      # discovery documents that sit exactly on those paths need routes of
      # their own. Cheap, and it keeps the prefix rules unsurprising.
      - path: "/api/"
        app: true
      - path: "/apis/"
        app: true
      - path: "/api"
        app: true
      - path: "/apis"
        app: true
      - path: "/version"
        app: true
      - path: "/openapi/"
        app: true
      - path: "/metrics"
        app: true
      - path: "/healthz"
        app: true

  - name: kube_decode
    # Discovery documents are not resource paths, so they only reach the graph
    # at all with passthrough on. `admit` answers them by TARGET and 404s every
    # other unknown path, which is what makes the empty-field frame safe.
    passthrough: 1

  - name: admit
    type: decision
    params:
      # chronicle-source: modules/app/_chronicle/apiplane.uproc admit
      decision: ""

  - name: kagi_verify
    audience: "nanocloud"
    issuer: "https://kubernetes.default.svc"
    key_path: "/authn-keys/sa"

  - name: token_verify

  # Which of the two authentication methods produced the caller — a kagi-verified
  # bearer token, or an mTLS peer the TLS layer authenticated. Selecting it here
  # keeps ONE verb ladder in `authz` instead of one per identity source.
  - name: ident
    type: decision
    params:
      # chronicle-source: modules/app/_chronicle/apiplane.uproc ident
      decision: ""

  - name: authz
    type: decision
    params:
      # chronicle-source: modules/app/_chronicle/apiplane.uproc authz
      decision: ""

  - name: rbac_gate

  - name: gate
    type: decision
    params:
      # chronicle-source: modules/app/_chronicle/apiplane.uproc gate
      decision: ""

  - name: api_admission

  - name: probe
    type: decision
    params:
      # chronicle-source: modules/app/_chronicle/apiplane.uproc probe
      decision: ""

  - name: se_probe
    type: store_effect
    # A collection GET answers the Kubernetes `List` envelope. The items are the
    # objects themselves, read during the same prefix walk; the envelope is
    # these two literals, which is why they live in the graph and not in the
    # module.
    list_values: 1
    list_sep: ","
    list_open: "{\"kind\":\"List\",\"apiVersion\":\"v1\",\"items\":["
    list_close: "]}"

  - name: act
    type: decision
    params:
      # chronicle-source: modules/app/_chronicle/apiplane.uproc act
      decision: ""

  - name: se_act
    type: store_effect

  - name: reply
    type: decision
    params:
      # chronicle-source: modules/app/_chronicle/apiplane.uproc reply
      decision: "010500000012000100021f0000001000000000000000002000090000003300100000000000000000400100000010cc00000000000000400200000012000040030000001000000000000000004004000000410d00000031000100021e00000040010000000100021f000000400200000001000220000000400300000001000221000000400400000041"

  # ---- the WATCH chain: store changes -> events on a registered connection ----
  # Configured PER WATCHED PREFIX. One source per resource is the honest shape:
  # the prefix is a node parameter, and a graph that watches pods and configmaps
  # runs two of these.
  - name: ws_src
    type: store_source
    prefix: "/pods/"
    watch: "/pods/"
  - name: ws_event
    type: decision
    params:
      # chronicle-source: modules/app/_chronicle/apiplane_watch.uproc event
      decision: "000f0000003f00010002010000004001000000100700000000000000400200000001000203000000400300000001000201000000401e0000000100021c000000401f00000041"
  - name: ws_obj
    type: store_effect
    key_prefix: "/pods/"
    list_values: 1
    list_sep: ","
    list_open: "{\"type\":\"MODIFIED\",\"object\":"
    list_close: "}\n"
  - name: ws_reg
    type: decision
    params:
      # chronicle-source: modules/app/_chronicle/apiplane_watch.uproc reg
      decision: "001100000048000100021e000000400100000010010000000000000040020000000100021f00000040030000001201002f40110000000100021e000000401e00000001000203000000401f00000041"
  - name: ws_who
    type: store_effect
    key_prefix: "/watch-reg/pods/"
    flat: 1
    ints: "cid"
  - name: ws_emit
    type: decision
    params:
      # chronicle-source: modules/app/_chronicle/apiplane_watch.uproc emit
      decision: ""

  - name: enc_http
    type: pipeline
    params:
      # The read path's encoder, with ONE change: the envelope's flags byte is
      # no longer the literal 0 but field 4 of the record (`01 00 02 04…` push,
      # `62 01 01` INT width 1 LE). That is what lets one encoder serve both a
      # complete response and the first slice of a stream — a watch — without
      # a second node the graph would have to choose between, which a graph
      # edge cannot do.
      # chronicle-source: modules/app/_chronicle/apiplane.uproc encode
      ir_stages: "01ff310005000101000000120100000005000102000000120200000005000103000000120300000005000104000000120400000013"
      encode: "01000201000000620401010002020000006202010100020400000062010160010010600200000001000203000000646202016010006170706c69636174696f6e2f6a736f6e01000203000000616a"

wiring:
  - from: linux_net.net_out
    to: http.net_in
  - from: http.net_out
    to: linux_net.net_in
  - from: http.req_out
    to: kube_decode.req_in
    buffer_group: 1

  # Mailbox an edge if and ONLY if the READER declares framed. A Chronicle
  # engine self-frames over a byte stream (io_core::admit_frame), and kagi's
  # token_verify does the same with its own 3-byte envelope — a mailbox on an
  # edge into either silently yields no output at all: no error, no metric,
  # just a request that never comes back.
  - from: kube_decode.record_out
    to: admit.record_in
  - from: admit.result_out
    to: kagi_verify.request_in
    buffer_group: 2
  - from: kagi_verify.key_out
    to: token_verify.verify_key
  - from: kagi_verify.verify_out
    to: token_verify.verify_requests
  - from: token_verify.results
    to: kagi_verify.verify_in
    buffer_group: 3
  - from: kagi_verify.response_out
    to: ident.record_in
  - from: ident.result_out
    to: authz.record_in
  - from: authz.result_out
    to: rbac_gate.request_in
    buffer_group: 4
  # rbac_gate's store-change sink (self-edge allocation).
  - from: rbac_gate.status
    to: rbac_gate.changes
  - from: rbac_gate.response_out
    to: gate.record_in
  - from: gate.result_out
    to: api_admission.request_in
    buffer_group: 8
  # api_admission's store-change sink (self-edge allocation).
  - from: api_admission.status
    to: api_admission.changes
  - from: api_admission.response_out
    to: probe.record_in
  - from: probe.result_out
    to: se_probe.request_in
    buffer_group: 5
  - from: se_probe.response_out
    to: act.record_in
  - from: act.result_out
    to: se_act.request_in
    buffer_group: 6
  - from: se_act.response_out
    to: reply.record_in

  # The watch chain, merging into the SAME reply stage. Fan-in is a kernel
  # MergeModule inserted automatically for two edges into one input; it clears
  # `buffer_group`, which is why the merge lands on a Chronicle engine input
  # (they self-frame) rather than on `http.resp_in`.
  - from: ws_src.status
    to: ws_src.changes
  - from: ws_src.record_out
    to: ws_event.record_in
  - from: ws_event.result_out
    to: ws_obj.request_in
    buffer_group: 8
  - from: ws_obj.response_out
    to: ws_reg.record_in
  - from: ws_reg.result_out
    to: ws_who.request_in
    buffer_group: 9
  - from: ws_who.response_out
    to: ws_emit.record_in
  - from: ws_emit.result_out
    to: reply.record_in
  - from: reply.result_out
    to: enc_http.record_in
  - from: enc_http.result_out
    to: http.resp_in
    buffer_group: 7
