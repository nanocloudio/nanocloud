# The Kubernetes API request path, as a Chronicle graph.
#
# Decode, authenticate, authorize, read, write and answer — every one of them
# data. What a method MEANS as a verb, what a refused credential answers, when a
# create is a conflict, when a miss is a 404: all of it is params compiled from
# modules/app/_chronicle/apiplane.uproc. The only nanocloud modules present move
# bytes or walk a set, which are the two things Chronicle's VM cannot do by
# construction.
#
#   linux_net -> http (wave)      terminates HTTP, HANDLER_APP fan-out
#   -> http_chain                 the exchange -> one request envelope
#   -> kube_decode                envelope -> Request record + key + credential
#   -> kube_sel / kube_facts      label selector; a GET's watch or List facts
#   -> admit    (decision)        credential out, request as carry
#   -> kagi_verify <-> token_verify   KAGI's verifier, over KAGI's auth_wire
#   -> authz    (decision)        verify_err -> verdict; method -> VERB
#   -> rbac     (store_effect)    ONE probe of the RBAC grant index (rb_*)
#   -> gate     (decision)        which requests admission should look at
#   -> ad_pol/ad_cnt/ad_dec       admission: required fields, defaults, quota
#   -> probe    (decision)        -> GET the object / LIST the collection
#   -> se_probe (store_doc)       -> lattice doc_json_dialect -> document_executor
#   -> act      (decision)        what was found + the verb -> the write
#   -> se_act   (decision: the answer)
#   -> reply    (decision)        -> (cid, status, body)
#   -> enc_http (pipeline)        `ser` bytecode -> a reply envelope
#   -> http_chain                 the reply envelopes -> the exchange's response
#   -> http -> client
#
# WATCH. `?watch=true` registers the connection at /watch-reg/<cid> with its
# facts (resume revision, timeoutSeconds, bookmarks, selectors) and holds the
# response open (the exchange's HOLD: idle between events, not cut at 30 s). The watch
# chain reads the store's CHANGE FEED per registration, strictly after its
# cursor: ADDED/MODIFIED/DELETED (with the object's last state), BOOKMARK on
# request, 410 Expired past the store's history, the end at timeoutSeconds.
# `watch` is checked as its OWN RBAC verb, which is what Kubernetes does — a
# role granting `list` does not grant it.
#
# WHAT THIS GRAPH DOES NOT DO, and why `fluxor-apiserver.yaml` still exists:
# Swapping this in for the full apiserver before those land would trade a
# working surface for a cleaner one, which is not a trade worth making.
#
# Proven end to end by scripts/apiplane-e2e.sh — 21 cases: discovery, authn,
# authz, admission, CRUD, and the Kubernetes List/Status envelopes.
#
# mTLS: put fluxor's `tls` in front and wire `tls.peer_identity` to
# `http.peer_identity`. wave then carries the verified peer on the exchange,
# `http_chain` hands it on as the request envelope's TRAILER, `kube_decode`
# projects it at field 12, and `admit` takes it as the caller — no bearer
# token, no kagi round trip, because the TLS layer already validated the chain
# and proved key possession.
#
# The identity is `peer:<fingerprint-hex>`, distinct by construction from a
# ServiceAccount's `system:serviceaccount:…`: two authentication methods that
# could produce the same subject string would let a binding written for one
# silently grant the other. See scripts/apiplane-mtls-e2e.sh.
#
# Probe:
#   curl -H "Authorization: Bearer <sa-token>" \
#        http://127.0.0.1:7444/api/v1/namespaces/default/pods/web-0

target: linux
tick_us: 1000

platform:
  # A watch client slow to read is buffered (up to this, per connection)
  # rather than holding up every other client: room for a few 1 MiB events.
  net:
    write_buf_kib: 8192

# Every store_source self-wires status -> changes (a 1-node cycle) to allocate
# its store-change sink, and the request chain returns to `http`, so the graph
# is cyclic by construction.
scheduler:
  accept_cycles: true

modules:
  - name: http
    port: 7444
    host_tcp: 1
    # Upstream's request ceiling on the two routes that take a body: 3 MiB
    # (413 past it), streamed to `http_chain` on its credit.
    route_0_max_body_kib: 3072
    route_1_max_body_kib: 3072
    routes:
      # `/api/` is a PREFIX; `/api` without the slash does not match it, so the
      # discovery documents that sit exactly on those paths need routes of
      # their own. Cheap, and it keeps the prefix rules unsurprising.
      - path: "/api/"
        app: true
      - path: "/apis/"
        app: true
      - path: "/api"
        app: true
      - path: "/apis"
        app: true
      - path: "/version"
        app: true
      - path: "/openapi/"
        app: true
      - path: "/metrics"
        app: true
      - path: "/healthz"
        app: true

  # The provider behind `http`'s application routes: each exchange becomes
  # one request envelope for `kube_decode`, and `enc_http`'s reply envelopes
  # become its response — a watch's held open, a large object's past the
  # server's credit. A body past a record is STAGED in the store and handed
  # on by reference (sha256:<hex>), collected by `gc_blob` once expired.
  - name: http_chain
    max_body_kib: 3072
    body_ref_prefix: "/blobs/"
    body_inline_max: 2048

  - name: kube_decode
    type: pipeline
    params:
      # The request, decoded (kube.rd): target, query, bearer credential, body,
      # peer identity, the path's segments and the store-key candidates.
      # rd-source: modules/app/_chronicle/kube.rd
      decode: ""
      # chronicle-source: modules/app/_chronicle/kube.uproc kd_pass
      ir_stages: ""
  - name: kube_sel
    type: pipeline
    params:
      # The label selector as requirements (kube_sel.rd).
      # rd-source: modules/app/_chronicle/kube_sel.rd
      decode: ""
      # chronicle-source: modules/app/_chronicle/kube.uproc ks_pass
      ir_stages: ""
  - name: kube_facts
    type: pipeline
    params:
      # A GET's facts in its body slot: a watch's registration, a list's typed
      # envelope head (kube_facts.rd).
      # rd-source: modules/app/_chronicle/kube_facts.rd
      decode: ""
      # chronicle-source: modules/app/_chronicle/kube.uproc kd_facts
      ir_stages: ""
  - name: kube_route
    type: decision
    params:
      # The path's shape → resource, namespace, name, key; any other target
      # (a discovery document) passes with those EMPTY and is answered by
      # target downstream.
      # chronicle-source: modules/app/_chronicle/kube.uproc kd_route
      decision: ""
  - name: admit
    type: decision
    params:
      # chronicle-source: modules/app/_chronicle/apiplane.uproc admit
      decision: ""

  - name: kagi_verify
    audience: "nanocloud"
    issuer: "https://kubernetes.default.svc"
    key_path: "/authn-keys/sa"

  - name: token_verify

  # Which of the two authentication methods produced the caller — a kagi-verified
  # bearer token, or an mTLS peer the TLS layer authenticated. Selecting it here
  # keeps ONE verb ladder in `authz` instead of one per identity source.
  - name: ident
    type: decision
    params:
      # chronicle-source: modules/app/_chronicle/apiplane.uproc ident
      decision: ""

  - name: rbac
    type: store_effect
    # chronicle-source: modules/app/_chronicle/apiplane.uproc authz
    decision: ""
    key_prefix: "/rbac-g/"
    wild: "18,26,20,22,24"
  # Kubernetes RBAC is PARAMS (rbac_rules.uproc, rbac_grants.uproc,
  # rbac_prune.uproc): Roles/ClusterRoles/RoleBindings/ClusterRoleBindings
  # are expanded into a grant index /rbac-g/<id>/<scope>|<verb>|<res> that
  # the authorization stage probes once; every derived row is pruned when
  # the object it came from no longer produces it.
  - name: rb_roles
    type: store_source
    prefix: "/roles/"
    expand: "rules[]"
    hash: "."
    paths: "rules.#.verbs,rules.#.resources,rules.#.resourceNames,rules.#.apiGroups,rules.#.nonResourceURLs"
  - name: rb_roles_e
    type: store_effect
    # chronicle-source: modules/app/_chronicle/rbac_rules.uproc ro_rule
    decision: ""
    key_prefix: "/rbac-rule/"
  - name: rb_croles
    type: store_source
    prefix: "/clusterroles/"
    expand: "rules[]"
    hash: "."
    paths: "rules.#.verbs,rules.#.resources,rules.#.resourceNames,rules.#.apiGroups,rules.#.nonResourceURLs"
  - name: rb_croles_e
    type: store_effect
    # chronicle-source: modules/app/_chronicle/rbac_rules.uproc cr_rule
    decision: ""
    key_prefix: "/rbac-rule/"
  - name: rb_rules
    type: store_source
    prefix: "/rbac-rule/"
    expand: "v[]*a[]*r[]*n[]"
    paths: "v.#0,a.#1,r.#2,n.#3"
  - name: rb_rules_e
    type: store_effect
    # chronicle-source: modules/app/_chronicle/rbac_rules.uproc ru_perm
    decision: ""
    key_prefix: "/rbac-perm/"
  - name: rb_rbs
    type: store_source
    prefix: "/rolebindings/"
    expand: "subjects[]"
    hash: "."
    paths: "subjects.#.kind,subjects.#.name,subjects.#.namespace,roleRef.kind,roleRef.name"
  - name: rb_rbs_e
    type: store_effect
    # chronicle-source: modules/app/_chronicle/rbac_grants.uproc rb_row
    decision: ""
    key_prefix: "/rbac-bind/"
  - name: rb_crbs
    type: store_source
    prefix: "/clusterrolebindings/"
    expand: "subjects[]"
    hash: "."
    paths: "subjects.#.kind,subjects.#.name,subjects.#.namespace,roleRef.kind,roleRef.name"
  - name: rb_crbs_e
    type: store_effect
    # chronicle-source: modules/app/_chronicle/rbac_grants.uproc crb_row
    decision: ""
    key_prefix: "/rbac-bind/"
  - name: rb_perms
    type: store_source
    prefix: "/rbac-perm/"
    paths: "v,a,r,n"
    join: "/rbac-bind/"
    join_scoped: 2
    join_paths: "id,scope"
    watch: "/rbac-bind/"
  - name: rb_src_e
    type: store_effect
    # chronicle-source: modules/app/_chronicle/rbac_grants.uproc gr_src
    decision: ""
    key_prefix: "/rbac-src/"
  - name: rb_g_e
    type: store_effect
    # chronicle-source: modules/app/_chronicle/rbac_grants.uproc gr_g
    decision: ""
    key_prefix: "/rbac-g/"
  - name: rb_prule
    type: store_source
    prefix: "/rbac-rule/"
    paths: "src,g"
    watch: "/roles/,/clusterroles/"
  - name: rb_prule_get
    type: store_effect
    # chronicle-source: modules/app/_chronicle/rbac_prune.uproc dv_get
    decision: ""
    hash: "."
  - name: rb_prule_del
    type: store_effect
    # chronicle-source: modules/app/_chronicle/rbac_prune.uproc dv_drop
    decision: ""
    key_prefix: "/rbac-rule/"
  - name: rb_pbind
    type: store_source
    prefix: "/rbac-bind/"
    paths: "src,g"
    watch: "/rolebindings/,/clusterrolebindings/"
  - name: rb_pbind_get
    type: store_effect
    # chronicle-source: modules/app/_chronicle/rbac_prune.uproc dv_get
    decision: ""
    hash: "."
  - name: rb_pbind_del
    type: store_effect
    # chronicle-source: modules/app/_chronicle/rbac_prune.uproc dv_drop
    decision: ""
    key_prefix: "/rbac-bind/"
  - name: rb_pperm
    type: store_source
    prefix: "/rbac-perm/"
    paths: "rule"
    watch: "/rbac-rule/"
  - name: rb_pperm_chk
    type: store_effect
    # chronicle-source: modules/app/_chronicle/rbac_prune.uproc pm_chk
    decision: "01050000000c000100020400000012000020000d0000003200010002010000004001000000100000000000000000400200000012000040030000000100020300000042011e40fe000000410e000000360001000201000000400100000010020000000000000040020000000100020400000040030000000100020300000042011e40fe00000041"
  - name: rb_pperm_del
    type: store_effect
    # chronicle-source: modules/app/_chronicle/rbac_prune.uproc pm_drop
    decision: "010500000012000100020200000010940100000000000020000a0000002c000100020100000040010000001004000000000000004002000000010002fe000000021e0000004003000000410800000023000100020100000040010000001000000000000000004002000000120000400300000041"
    key_prefix: "/rbac-perm/"
  # aggregationRule as params (rbac_agg.uproc): each binding of an aggregating
  # ClusterRole mirrored as a binding of every role its selectors match.
  - name: rb_aggselsrc
    type: store_source
    prefix: "/clusterroles/"
    expand: "aggregationRule.clusterRoleSelectors[]"
    paths: "aggregationRule.clusterRoleSelectors.#"
    hash: "."
  - name: rb_aggsel
    type: store_effect
    # chronicle-source: modules/app/_chronicle/rbac_agg.uproc ag_sel
    decision: ""
    key_prefix: "/rbac-aggsel/"
  - name: rb_aggsrc
    type: store_source
    prefix: "/rbac-aggsel/"
    join: "/clusterroles/"
    hash: "."
    join_terms: "90=sel.matchExpressions[]:key,operator,values[]@metadata.labels;92=sel.matchLabels{}@metadata.labels"
    watch: "/clusterroles/"
  - name: rb_aggmap
    type: pipeline
    params:
      # chronicle-source: modules/app/_chronicle/rbac_agg.uproc ag_map
      ir_stages: ""
      stage_kinds: "0202"
  - name: rb_agg
    type: store_effect
    # chronicle-source: modules/app/_chronicle/rbac_agg.uproc ag_agg
    decision: ""
    key_prefix: "/rbac-agg/"
  - name: rb_mirrorsrc
    type: store_source
    prefix: "/rbac-bind/"
    join: "/rbac-agg/"
    join_scoped: 2
    paths: "id,scope,src,g"
    ints: "d"
    watch: "/rbac-agg/"
  - name: rb_mirror
    type: store_effect
    # chronicle-source: modules/app/_chronicle/rbac_agg.uproc ag_mirror
    decision: ""
    key_prefix: "/rbac-bind/"
  - name: rb_paggsel
    type: store_source
    prefix: "/rbac-aggsel/"
    paths: "src,g"
    watch: "/clusterroles/"
  - name: rb_paggsel_get
    type: store_effect
    # chronicle-source: modules/app/_chronicle/rbac_prune.uproc dv_get
    decision: ""
    hash: "."
  - name: rb_paggsel_del
    type: store_effect
    # chronicle-source: modules/app/_chronicle/rbac_prune.uproc dv_drop
    decision: ""
    key_prefix: "/rbac-aggsel/"
  - name: rb_pagg
    type: store_source
    prefix: "/rbac-agg/"
    paths: "src,g"
    watch: "/rbac-aggsel/"
  - name: rb_pagg_get
    type: store_effect
    # chronicle-source: modules/app/_chronicle/rbac_prune.uproc dv_get
    decision: ""
    hash: "."
  - name: rb_pagg_del
    type: store_effect
    # chronicle-source: modules/app/_chronicle/rbac_prune.uproc dv_drop
    decision: ""
    key_prefix: "/rbac-agg/"
  - name: rb_paggrole
    type: store_source
    prefix: "/rbac-agg/"
    paths: "rule"
    watch: "/clusterroles/"
  - name: rb_paggrole_chk
    type: store_effect
    # chronicle-source: modules/app/_chronicle/rbac_prune.uproc pm_chk
    decision: "01050000000c000100020400000012000020000d0000003200010002010000004001000000100000000000000000400200000012000040030000000100020300000042011e40fe000000410e000000360001000201000000400100000010020000000000000040020000000100020400000040030000000100020300000042011e40fe00000041"
  - name: rb_paggrole_del
    type: store_effect
    # chronicle-source: modules/app/_chronicle/rbac_prune.uproc pm_drop
    decision: "010500000012000100020200000010940100000000000020000a0000002c000100020100000040010000001004000000000000004002000000010002fe000000021e0000004003000000410800000023000100020100000040010000001000000000000000004002000000120000400300000041"
    key_prefix: "/rbac-agg/"
  - name: rb_pmirror
    type: store_source
    prefix: "/rbac-bind/"
    paths: "agg"
    watch: "/rbac-agg/"
  - name: rb_pmirror_chk
    type: store_effect
    # chronicle-source: modules/app/_chronicle/rbac_prune.uproc pm_chk
    decision: "01050000000c000100020400000012000020000d0000003200010002010000004001000000100000000000000000400200000012000040030000000100020300000042011e40fe000000410e000000360001000201000000400100000010020000000000000040020000000100020400000040030000000100020300000042011e40fe00000041"
  - name: rb_pmirror_del
    type: store_effect
    # chronicle-source: modules/app/_chronicle/rbac_prune.uproc pm_drop
    decision: "010500000012000100020200000010940100000000000020000a0000002c000100020100000040010000001004000000000000004002000000010002fe000000021e0000004003000000410800000023000100020100000040010000001000000000000000004002000000120000400300000041"
    key_prefix: "/rbac-bind/"
  - name: rb_psrc
    type: store_source
    prefix: "/rbac-src/"
    flat: 1
    paths: "perm,bind"
    watch: "/rbac-perm/,/rbac-bind/"
  - name: rb_psrc_p
    type: store_effect
    # chronicle-source: modules/app/_chronicle/rbac_prune.uproc sr_perm
    decision: "00110000003e000100020100000040010000001002000000000000004002000000010002040000004003000000010002030000000100020500000042021e1f40fe00000041"
  - name: rb_psrc_bp
    type: store_effect
    # chronicle-source: modules/app/_chronicle/rbac_prune.uproc sr_bind
    decision: "001300000048000100020100000040010000001002000000000000004002000000010002fe000000021f0000004003000000010002fe000000021e0000000100020200000042021e2040fe00000041"
  - name: rb_psrc_del
    type: store_effect
    # chronicle-source: modules/app/_chronicle/rbac_prune.uproc sr_drop
    decision: "010b0000002900010002fe000000022000000010940100000000000020010002020000001094010000000000002031000a0000002c000100020100000040010000001004000000000000004002000000010002fe000000021e0000004003000000410800000023000100020100000040010000001000000000000000004002000000120000400300000041"
    key_prefix: "/rbac-src/"
  - name: rb_pg
    type: store_source
    prefix: "/rbac-g/"
    count_children: "/rbac-src/"
    child_sep: "/"
    watch: "/rbac-src/"
  - name: rb_pg_del
    type: store_effect
    # chronicle-source: modules/app/_chronicle/rbac_prune.uproc gr_drop
    decision: "010500000012000100021600000010000000000000000020000900000027000100020100000040010000001004000000000000004002000000010002030000004003000000410800000023000100020100000040010000001000000000000000004002000000120000400300000041"
    key_prefix: "/rbac-g/"

  - name: gate
    type: decision
    params:
      # chronicle-source: modules/app/_chronicle/apiplane.uproc gate
      decision: ""

  # Admission as params (admission.uproc): the policy, a quota count, the
  # verdict — the object as admitted (defaults applied) or the refusal.
  - name: ad_pol
    type: store_effect
    # chronicle-source: modules/app/_chronicle/admission.uproc ad_pol
    decision: ""
    key_prefix: "/admission-policy/"
    flat: 1
    paths: "required,defaults,quota"
    ints: "quota"
    echo: "60,61,62,63"
  - name: ad_cnt
    type: store_effect
    # chronicle-source: modules/app/_chronicle/admission.uproc ad_cnt
    decision: ""
    key_prefix: "/"
    echo: "40,41,42,50,60,63,64"
  - name: ad_dec
    type: pipeline
    params:
      # The policy applied (admission.rd): defaults into the object, then each
      # required path looked up in it; ad_ver gives the verdict (`ad`).
      # rd-source: modules/app/_chronicle/admission.rd
      decode: ""
      # chronicle-source: modules/app/_chronicle/admission.uproc ad_dec
      ir_stages: ""
  - name: ad_ver
    type: decision
    params:
      # chronicle-source: modules/app/_chronicle/admission.uproc ad_dec
      decision: ""

  - name: se_body
    # A STAGED body's name, read from its blob (a create names its object in
    # the body), and its data's size; nothing for an inline one.
    type: store_big
    # chronicle-source: modules/app/_chronicle/apiplane_watch.uproc w_body
    decision: ""
    key_prefix: "/blobs/sha256/"
    paths: "metadata.name"
    # 50, 51: what upstream bounds a ConfigMap's or Secret's data by.
    ints: "data!size,binaryData!size"
    echo: "60,61"
  - name: se_probe
    # The API's WRITER. The store decides what upstream decides from state
    # (409 for a create that exists, 404 for a write of nothing, 409 for a
    # stale resourceVersion), so nothing is probed first and the request body
    # never rides the carry. store_doc is the record edge only: each write
    # leaves as ONE JSON document request to lattice's dialect below, whose
    # schema is the Kubernetes object lifecycle, and whose executor writes
    # the object as JSON at its own key — the key every connector reads.
    type: store_doc
    # chronicle-source: modules/app/_chronicle/apiplane.uproc probe
    decision: ""
    # A delete leaves the object's last state for a watch's DELETED event.
    tomb: "/~tomb"
    # A staged body is read from its blob and sent as the document.
    blob: "/blobs/sha256/"
  # Kubernetes object lifecycle as lattice's JSON document dialect: the
  # identity a patch may not change, what a create stamps (uid,
  # creationTimestamp, the name — generateName's prefix plus five characters
  # when the key names none), what a replace keeps, the namespace name label,
  # the finalizer guard with what a held delete stamps, views, field
  # ownership (managedFields) and its conflict Status, and the
  # strategic-merge keys; `rv.if`: an update, a merge or strategic patch
  # and an apply are conditional on the resourceVersion their body states
  # (a stale one is 409, as upstream's). `codec=path`: every collection is
  # stored as the object's JSON at `/<collection>/<namespace>/<name>`
  # (`/<collection>/<name>` for the cluster-scoped kinds `id_paths` names),
  # managedFields inside it.
  - name: doc_json_dialect
    type: doc_json_dialect_big
    params:
      schema: "codec=path;rv.if=replace,merge,keyed,apply;identity=metadata.name,metadata.namespace,kind;create=metadata.name:name,metadata.uid:uuid,metadata.creationTimestamp:now;generate=metadata.generateName;keep=metadata.uid,metadata.creationTimestamp;named=namespaces|metadata.labels[kubernetes.io/metadata.name]:name;guard=metadata.finalizers;deleting=metadata.deletionTimestamp:now,metadata.deletionGracePeriodSeconds:#0;view.scale=tpl:{\"kind\":\"Scale\",\"apiVersion\":\"autoscaling/v1\",\"metadata\":{\"name\":{{metadata.name}},\"namespace\":{{metadata.namespace}},\"uid\":{{metadata.uid}},\"creationTimestamp\":{{metadata.creationTimestamp}}},\"spec\":{\"replicas\":{{spec.replicas|1}}},\"status\":{\"replicas\":{{status.replicas|0}},\"selector\":\"{{pairs:spec.selector.matchLabels}}\"}};write.scale=spec.replicas;write.status=status;owners=metadata.managedFields;owners.keys=manager,operation,apiVersion,time,subresource,fieldsV1;owners.ops=Apply,Update;owners.api=apiVersion;owners.entry={\"manager\":\"{{manager}}\",\"operation\":\"{{op}}\"{{?api:,\"apiVersion\":\"$\"}},\"time\":\"{{time}}\",\"fieldsType\":\"FieldsV1\",\"fieldsV1\":{{fields}}{{?sub:,\"subresource\":\"$\"}}};owners.marks=f:,k:,v:,.;unowned=apiVersion,kind,status,metadata.name,metadata.namespace,metadata.uid,metadata.resourceVersion,metadata.generation,metadata.creationTimestamp,metadata.managedFields,metadata.selfLink,metadata.deletionTimestamp,metadata.deletionGracePeriodSeconds;conflict={\"kind\":\"Status\",\"apiVersion\":\"v1\",\"metadata\":{},\"status\":\"Failure\",\"message\":\"Apply failed with {{count}} conflict{{?many:s}}: {{list}}\",\"reason\":\"Conflict\",\"details\":{\"causes\":[{{causes}}]},\"code\":409};conflict.item=conflict with \\\"{{manager}}\\\"{{?api: using $}}: {{field}};conflict.cause={\"type\":\"FieldManagerConflict\",\"message\":\"conflict with \\\"{{manager}}\\\"{{?api: using $}}\",\"field\":\"{{field}}\"};smp.patch=$patch;smp.retain=$retainKeys;smp.delete=$deleteFromPrimitiveList/;smp.prefix=$;rv=metadata.resourceVersion;missing={\"kind\":\"Status\",\"apiVersion\":\"v1\",\"metadata\":{},\"status\":\"Failure\",\"reason\":\"NotFound\",\"code\":404};view.log=text:/sandbox-logs/|metadata.uid;event={\"type\":\"{{type}}\",\"object\":{{object}}};expired={\"kind\":\"Status\",\"apiVersion\":\"v1\",\"metadata\":{},\"status\":\"Failure\",\"message\":\"too old resource version\",\"reason\":\"Expired\",\"code\":410};bookmark={\"kind\":\"{{kind}}\",\"apiVersion\":\"{{av}}\",\"metadata\":{\"resourceVersion\":\"{{rv}}\"}};list.tail=],\"metadata\":{\"resourceVersion\":\"{{rv}}\"{{?continue:,\"continue\":\"$\"}}}};table.head={\"kind\":\"Table\",\"apiVersion\":\"meta.k8s.io/v1\",\"columnDefinitions\":[{{cols}}],\"rows\":[;table.col={\"name\":\"{{name}}\",\"type\":\"string\",\"format\":\"{{format}}\",\"description\":\"\",\"priority\":0};table.row={\"cells\":[{{cells}}],\"object\":{\"kind\":\"PartialObjectMetadata\",\"apiVersion\":\"meta.k8s.io/v1\",\"metadata\":{{metadata}}}};table.end=]};event.types=ADDED,MODIFIED,DELETED,BOOKMARK"
      patch_keys: "containers=name,initContainers=name,ephemeralContainers=name,ports@containers=containerPort,ports@initContainers=containerPort,ports@ephemeralContainers=containerPort,ports=port,env=name,volumeMounts=mountPath,volumeDevices=devicePath,volumes=name,imagePullSecrets=name,hostAliases=ip,conditions=type,ownerReferences=uid,topologySpreadConstraints=topologyKey,resourceClaims=name,+finalizers"
      id_paths: "metadata.namespace,metadata.name;namespaces,nodes,persistentvolumes,clusterroles,clusterrolebindings,customresourcedefinitions,storageclasses,priorityclasses,ingressclasses,runtimeclasses,csidrivers,csinodes,volumeattachments,mutatingwebhookconfigurations,validatingwebhookconfigurations,apiservices,certificatesigningrequests=metadata.name"
      # Every object answered carries its store revision as
      # metadata.resourceVersion, and a REPLACE reads the expected revision
      # back out of the body the client sent.
      rv_path: "metadata.resourceVersion"
  - name: document_executor
    type: document_executor_big
  # The executor's command path to the store worker (lattice's composition).
  - name: kv_request_router

  - name: se_act
    # The answer, from what the write did (apiplane_reply.uproc `act`).
    type: decision
    params:
      # chronicle-source: modules/app/_chronicle/apiplane_reply.uproc act
      decision: ""

  - name: se_ans
    # A write of a staged body answers with the object it stored: a GET
    # registration the watch chain serves (apiplane_watch `ans`).
    type: store_effect
    # chronicle-source: modules/app/_chronicle/apiplane_watch.uproc w_ans
    decision: ""
    key_prefix: "/watch-reg/"
  # Staged request bodies, collected at their deadline (blob_gc.uproc).
  - name: gc_src
    type: store_source
    prefix: "/blobs/at/"
    ints: "deadline"
    due: "deadline"
  - name: gc_blob
    type: store_effect
    # chronicle-source: modules/app/_chronicle/blob_gc.uproc gc_blob
    decision: "010b000000220001000232000000100000000000000000240100023a000000010002320000002530000c0000003300010002010000004001000000100400000000000000400200000001000203000000400300000001000203000000401e000000410a0000002b0001000201000000400100000010000000000000000040020000001200004003000000120000401e00000041"
    key_prefix: "/blobs/sha256/"
  - name: gc_at
    type: store_effect
    # chronicle-source: modules/app/_chronicle/blob_gc.uproc gc_at
    decision: "01050000000c000100021e00000012000021000b0000002f0001000201000000400100000010040000000000000040020000000100021e0000004003000000120000401e000000410a0000002b0001000201000000400100000010000000000000000040020000001200004003000000120000401e00000041"
    key_prefix: "/blobs/at/"
  - name: reply
    type: decision
    params:
      # chronicle-source: modules/app/_chronicle/apiplane_reply.uproc reply
      decision: ""

  # ---- the WATCH chain: the store's change feed -> events on registered connections ----
  # apiplane_watch.uproc. ONE connector for every resource, serving LISTs and
  # WATCHes alike: each registration (/watch-reg/<cid>, written by the request
  # chain) names its prefix, resume revision, timeoutSeconds, bookmarks,
  # limit/continue and selectors. A LIST streams its items; a WATCH reads the
  # change feed from its own cursor. Each candidate passes the filter first;
  # every record carries the wire line already built.
  - name: ws_evt
    # store_source with a heap: objects past one record are read whole.
    type: store_watch
    # The document schema (_shared/docschema.rs): the revision every answer
    # carries, what a GET of nothing answers, how a view reads — a Scale
    # rendered from the object, a Pod's log as its sandbox's output tail —
    # and the watch wire: an event's framing, the 410 a watch past its
    # history ends with, a bookmark's object, and a List's tail.
    schema: "rv=metadata.resourceVersion;missing={\"kind\":\"Status\",\"apiVersion\":\"v1\",\"metadata\":{},\"status\":\"Failure\",\"reason\":\"NotFound\",\"code\":404};view.scale=tpl:{\"kind\":\"Scale\",\"apiVersion\":\"autoscaling/v1\",\"metadata\":{\"name\":{{metadata.name}},\"namespace\":{{metadata.namespace}},\"uid\":{{metadata.uid}},\"creationTimestamp\":{{metadata.creationTimestamp}}},\"spec\":{\"replicas\":{{spec.replicas|1}}},\"status\":{\"replicas\":{{status.replicas|0}},\"selector\":\"{{pairs:spec.selector.matchLabels}}\"}};view.log=text:/sandbox-logs/|metadata.uid;event={\"type\":\"{{type}}\",\"object\":{{object}}};expired={\"kind\":\"Status\",\"apiVersion\":\"v1\",\"metadata\":{},\"status\":\"Failure\",\"message\":\"too old resource version\",\"reason\":\"Expired\",\"code\":410};bookmark={\"kind\":\"{{kind}}\",\"apiVersion\":\"{{av}}\",\"metadata\":{\"resourceVersion\":\"{{rv}}\"}};list.tail=],\"metadata\":{\"resourceVersion\":\"{{rv}}\"{{?continue:,\"continue\":\"$\"}}}};table.head={\"kind\":\"Table\",\"apiVersion\":\"meta.k8s.io/v1\",\"columnDefinitions\":[{{cols}}],\"rows\":[;table.col={\"name\":\"{{name}}\",\"type\":\"string\",\"format\":\"{{format}}\",\"description\":\"\",\"priority\":0};table.row={\"cells\":[{{cells}}],\"object\":{\"kind\":\"PartialObjectMetadata\",\"apiVersion\":\"meta.k8s.io/v1\",\"metadata\":{{metadata}}}};table.end=]}"
    prefix: "/watch-reg/"
    watch: "/"
    events: 1
    # Registrations a previous runtime left (it stopped with watches open)
    # are deleted at the first step, unserved: no connection outlives its
    # runtime, and a new one reusing a stale one's id must not get its watch.
    stale_at_open: 1
    tomb: "/~tomb"
    paths: "metadata.name,metadata.namespace"
    join_paths: "fsn,fsns"
    # A server-side Table (kubectl get asks with Accept: as=Table): per kind,
    # the columns upstream prints (`*`: any other kind), each a path or an
    # expression (table.rs); the envelope is the schema's `table.*`.
    table: "*=Name/name:metadata.name,Age:@age(metadata.creationTimestamp);Pod=Name/name:metadata.name,Ready:@n(status.containerStatuses?ready=true)/@n(spec.containers),Status:status.phase,Restarts:@sum(status.containerStatuses:restartCount),Age:@age(metadata.creationTimestamp);Deployment=Name/name:metadata.name,Ready:@v(status.readyReplicas|0)/@v(spec.replicas|1),Up-to-date:status.updatedReplicas|0,Available:status.availableReplicas|0,Age:@age(metadata.creationTimestamp);ReplicaSet=Name/name:metadata.name,Desired:spec.replicas|1,Current:status.replicas|0,Ready:status.readyReplicas|0,Age:@age(metadata.creationTimestamp);StatefulSet=Name/name:metadata.name,Ready:@v(status.readyReplicas|0)/@v(spec.replicas|1),Age:@age(metadata.creationTimestamp);DaemonSet=Name/name:metadata.name,Desired:status.desiredNumberScheduled|0,Current:status.currentNumberScheduled|0,Ready:status.numberReady|0,Age:@age(metadata.creationTimestamp);Service=Name/name:metadata.name,Type:spec.type|ClusterIP,Cluster-IP:spec.clusterIP,Age:@age(metadata.creationTimestamp);Namespace=Name/name:metadata.name,Status:status.phase|Active,Age:@age(metadata.creationTimestamp);Node=Name/name:metadata.name,Status:status.phase|Unknown,Age:@age(metadata.creationTimestamp)"
    # The registration's selector terms, each PAIRED with the object's value
    # for its key (`@`, looked up in the object): the object's labels never
    # ride in the record.
    join_each: "90=sel[]:key,operator,values@metadata.labels"
    # The filter each candidate passes (labelSelector, fieldSelector).
    # chronicle-source: modules/app/_chronicle/apiplane_watch.uproc w_filter
    ir_stages: ""
    stage_kinds: "0200"
  - name: ws_emit
    type: store_effect
    # chronicle-source: modules/app/_chronicle/apiplane_watch.uproc w_emit
    decision: ""
    key_prefix: "/watch-reg/"
  # A deleted object's last state (se_act `tomb`), kept for a watch's DELETED
  # event and expired by its deadline (ttl.uproc).
  - name: tomb_src
    type: store_source
    prefix: "/~tomb/"
    ints: "deadline"
    due: "deadline"
  - name: tomb_gc
    type: store_effect
    # chronicle-source: modules/app/_chronicle/ttl.uproc ex
    decision: "010b000000220001000232000000100000000000000000240100023a000000010002320000002530000900000027000100020100000040010000001004000000000000004002000000010002030000004003000000410800000023000100020100000040010000001000000000000000004002000000120000400300000041"
    key_prefix: "/~tomb/"
  - name: enc_http
    type: pipeline
    params:
      # `http_chain`'s reply envelope. Its flags byte is field 4 of the record
      # (`01 00 02 04…` push, `62 01 01` INT width 1 LE), which is what lets
      # one encoder serve both a complete response and the first slice of a
      # stream — a watch — without a second node the graph would have to
      # choose between, which a graph edge cannot do.
      # chronicle-source: modules/app/_chronicle/apiplane_reply.uproc encode
      ir_stages: "01ff310005000101000000120100000005000102000000120200000005000103000000120300000005000104000000120400000013"
      encode: "01000201000000620401010002020000006202010100020400000062010160010010600200000001000203000000646202016010006170706c69636174696f6e2f6a736f6e01000203000000616a"
  # ── The store: lattice's storage engine, serving fluxor's storage.object /
  # storage.namespace contracts every connector in this graph reads and writes
  # through. It is ready at construction — recovered, its command log
  # replayed, the host store.log imported — and every module is constructed
  # before any takes a step, so nothing finds it unready.
  # Paths are the working directory's (the service runs in its state
  # directory): `lattice/` holds the store; `store.log` is the host store's
  # log, imported once and then resumed (a seed seam).
  - name: kv_state_worker_store
    params:
      state_store: 1
      store_dir: lattice
      import_log: store.log
      # The history a watch or a change read can resume from: the host
      # store's window (older answers 410, and the store stays bounded).
      history_revisions: 65536
  # The store's clock (a TTL tick through its own command stream) and its
  # chunk sweeps (large values' chunks reclaimed), as lattice composes one.
  - name: ttl_scheduler
    params:
      propose_wrap: 0

wiring:
  - from: linux_net.net_out
    to: http.net_in
  - from: http.net_out
    to: linux_net.net_in
  - from: http.request_out
    to: http_chain.request_in
  - from: http_chain.response_out
    to: http.response_in
  # A decode-mode pipeline reads one envelope per read: mailbox.
  - from: http_chain.record_out
    to: kube_decode.record_in
    buffer_group: 1

  # Mailbox a record edge if and ONLY if the READER declares framed (or is a
  # decode-mode pipeline). A Chronicle engine self-frames over a byte stream
  # (io_core::admit_frame) — a mailbox on an edge into one silently yields no
  # output at all: no error, no metric, just a request that never comes back.
  # Exchange edges (kagi_verify <-> token_verify, http <-> http_chain) are
  # framed by their content type and take the mailbox the build gives them.
  - from: kube_decode.result_out
    to: kube_sel.record_in
    # A decode-mode pipeline reads one protocol unit per read: a byte
    # stream would hand it two requests' frames at once and lose the second.
    buffer_group: 13
  - from: kube_sel.result_out
    to: kube_facts.record_in
    # A decode-mode pipeline reads one protocol unit per read: a byte
    # stream would hand it two requests' frames at once and lose the second.
    buffer_group: 14
  - from: kube_facts.result_out
    to: kube_route.record_in
  - from: kube_route.result_out
    to: admit.record_in
  - from: admit.result_out
    to: kagi_verify.request_in
    buffer_group: 2
  - from: kagi_verify.key_out
    to: token_verify.verify_key
  - from: kagi_verify.request_out
    to: token_verify.request_in
  - from: token_verify.response_out
    to: kagi_verify.response_in
  - from: kagi_verify.response_out
