  - from: se_probe.doc_out
    to: doc_json_dialect.req_in
  - from: doc_json_dialect.resp_out
    to: se_probe.doc_in
  - from: doc_json_dialect.exec_out
    to: document_executor.dialect_in
  - from: document_executor.dialect_out
