    to: reply.record_in
  - from: gc_src.record_out
    to: gc_blob.request_in
  - from: gc_blob.response_out
    to: gc_at.request_in

  # The watch chain, merging into the SAME reply stage. Fan-in is a kernel
  # MergeModule inserted automatically for two edges into one input; it clears
  # `buffer_group`, which is why the merge lands on a Chronicle engine input
  # (they self-frame) rather than on `http_chain.reply_in`.
  - from: ws_evt.record_out
    to: ws_emit.request_in
  - from: tomb_src.record_out
    to: tomb_gc.request_in
  - from: ws_emit.response_out
    to: reply.record_in
  - from: reply.result_out
    to: enc_http.record_in
  - from: enc_http.result_out
    to: http_chain.reply_in
    buffer_group: 7
