  - from: gate.result_out
    to: ad_pol.request_in
  - from: ad_pol.response_out
    to: ad_cnt.request_in
  - from: ad_cnt.response_out
    to: ad_dec.record_in
    # A decode-mode pipeline reads one protocol unit per read: a byte
    # stream would hand it two requests' frames at once and lose the second.
    buffer_group: 15
  - from: ad_dec.result_out
    to: ad_ver.record_in
  - from: ad_ver.result_out
    to: se_body.request_in
  - from: se_body.response_out
    to: se_probe.request_in
  # ── The writer's document engine: store_doc -> dialect -> executor -> store
  - from: se_probe.doc_out
    to: doc_json_dialect.req_in
  - from: doc_json_dialect.resp_out
    to: se_probe.doc_in
  - from: doc_json_dialect.exec_out
    to: document_executor.dialect_in
  - from: document_executor.dialect_out
    to: doc_json_dialect.exec_in
  - from: document_executor.kv_out
    to: kv_request_router.internal_sql_in
  - from: kv_request_router.compute_out
    to: document_executor.kv_in
  - from: kv_request_router.kv_out
    to: kv_state_worker_store.commands
  - from: kv_state_worker_store.responses
    to: kv_request_router.kv_in
  - from: kv_state_worker_store.mutations
    to: document_executor.changes_in
  - from: se_probe.response_out
    to: se_act.record_in
  - from: se_act.result_out
    to: se_ans.request_in
  - from: se_ans.response_out
    to: reply.record_in
  - from: gc_src.status
    to: gc_src.changes
  - from: gc_src.record_out
    to: gc_blob.request_in
  - from: gc_blob.response_out
    to: gc_at.request_in

  # The watch chain, merging into the SAME reply stage. Fan-in is a kernel
  # MergeModule inserted automatically for two edges into one input; it clears
  # `buffer_group`, which is why the merge lands on a Chronicle engine input
  # (they self-frame) rather than on `http_chain.reply_in`.
  - from: ws_evt.status
