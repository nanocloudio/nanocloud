# The Kubernetes API request path, as a Chronicle graph.
#
# Decode, authenticate, authorize, read, write and answer — every one of them
# data. What a method MEANS as a verb, what a refused credential answers, when a
# create is a conflict, when a miss is a 404: all of it is params compiled from
# modules/app/_chronicle/apiplane.plan. The only nanocloud modules present move
# bytes or walk a set, which are the two things Chronicle's VM cannot do by
# construction.
#
#   linux_net -> http (wave)      terminates HTTP, HANDLER_APP fan-out
#   -> http_chain                 the exchange -> one request envelope
#   -> kube_decode                envelope -> Request record + key + credential
#   -> kube_sel / kube_facts      label selector; a GET's watch or List facts
#   -> admit    (decision)        credential out, request as carry
#   -> oapi     (decision)        an OpenAPI v3 document, for a request admit tagged
#   -> kagi_verify <-> token_verify   KAGI's verifier, over KAGI's auth_wire
#   -> authz    (decision)        verify_err -> verdict; method -> VERB
#   -> rbac     (store_effect)    ONE probe of the RBAC grant index (rb_*)
#   -> esc/escd                   an RBAC object written grants only what its
#                                 writer holds, or escalate/bind (apiplane_esc.plan)
#   -> scope/disc/scoped          the kind's scope (404 at the other one; a custom
#                                 kind's from its CRD, crd.plan) and the discovery
#                                 documents the store holds (/apis, a CRD's group)
#   -> gate     (decision)        which requests admission should look at
#   -> ad_pol/ad_cnt/ad_dec       admission: required fields, defaults, quota
#   -> probe    (decision)        -> GET the object / LIST the collection
#   -> se_probe (store_doc)       -> lattice doc_json_dialect -> document_executor
#   -> act      (decision)        what was found + the verb -> the write
#   -> se_act   (decision: the answer)
#   -> reply    (decision)        -> (cid, status, body)
#   -> enc_http (pipeline)        `ser` bytecode -> a reply envelope
#   -> http_chain                 the reply envelopes -> the exchange's response
#   -> http -> client
#
# WATCH. `?watch=true` registers the connection at /watch-reg/<cid> with its
# facts (resume revision, timeoutSeconds, bookmarks, selectors) and holds the
# response open (the exchange's HOLD: idle between events, not cut at 30 s). The watch
# chain reads the store's CHANGE FEED per registration, strictly after its
# cursor: ADDED/MODIFIED/DELETED (with the object's last state), BOOKMARK on
# request, 410 Expired past the store's history, the end at timeoutSeconds.
# `watch` is checked as its OWN RBAC verb, which is what Kubernetes does — a
# role granting `list` does not grant it.
#
# WHAT THIS GRAPH DOES NOT DO, and why `fluxor-apiserver.yaml` still exists:
# Swapping this in for the full apiserver before those land would trade a
# working surface for a cleaner one, which is not a trade worth making.
#
# Proven end to end by scripts/apiplane-e2e.sh — 21 cases: discovery, authn,
# authz, admission, CRUD, and the Kubernetes List/Status envelopes.
#
# mTLS: put fluxor's `tls` in front and wire `tls.peer_identity` to
# `http.peer_identity`. wave then carries the verified peer on the exchange,
# `http_chain` hands it on as the request envelope's TRAILER, `kube_decode`
# projects it at field 12, and `admit` takes it as the caller — no bearer
# token, no kagi round trip, because the TLS layer already validated the chain
# and proved key possession.
#
# The identity is `peer:<fingerprint-hex>`, distinct by construction from a
# ServiceAccount's `system:serviceaccount:…`: two authentication methods that
# could produce the same subject string would let a binding written for one
# silently grant the other. See scripts/apiplane-mtls-e2e.sh.
#
# Probe:
#   curl -H "Authorization: Bearer <sa-token>" \
#        http://127.0.0.1:7444/api/v1/namespaces/default/pods/web-0

target: linux
tick_us: 1000

platform:
  # A watch client slow to read is buffered (up to this, per connection)
  # rather than holding up every other client: room for a few 1 MiB events.
  net:
    write_buf_kib: 8192

# The request chain returns to `http`, so the graph is cyclic by construction.
scheduler:
  accept_cycles: true

modules:
  - name: http
    port: 7444
    host_tcp: 1
    # Upstream's request ceiling on the two routes that take a body: 3 MiB
    # (413 past it), streamed to `http_chain` on its credit.
    route_0_max_body_kib: 3072
    route_1_max_body_kib: 3072
    routes:
      # `/api/` is a PREFIX; `/api` without the slash does not match it, so the
      # discovery documents that sit exactly on those paths need routes of
      # their own. Cheap, and it keeps the prefix rules unsurprising.
      - path: "/api/"
        app: true
      - path: "/apis/"
        app: true
      - path: "/api"
        app: true
      - path: "/apis"
        app: true
      - path: "/version"
        app: true
      - path: "/openapi/"
        app: true
      - path: "/metrics"
        app: true
      - path: "/healthz"
        app: true

  # The provider behind `http`'s application routes: each exchange becomes
  # one request envelope for `kube_decode`, and `enc_http`'s reply envelopes
  # become its response — a watch's held open, a large object's past the
  # server's credit. A body past a record is STAGED in the store and handed
  # on by reference (sha256:<hex>), collected by `gc_blob` once expired.
  - name: http_chain
    max_body_kib: 3072
    body_ref_prefix: "/blobs/"
    # Past this a body is staged and the chain carries `sha256:<hex>`
    # (apiplane_watch's body/ans arms). An inline body rides the chain's
    # records several times over — the request, the stored object, the
    # answer — inside Chronicle's 4 KiB record, and a record that
    # outgrows it is DROPPED, unanswered: at 2048 every POST past ~790
    # bytes of body hung (a ConfigMap, a Graph; 2026-10-10).
    body_inline_max: 512

  - name: kube_decode
    type: pipeline
    params:
      # The request, decoded (kube.rd): target, query, bearer credential, body,
      # peer identity, the path's segments and the store-key candidates.
      # rd-source: modules/app/_chronicle/kube.rd
      decode: {hex: ""}
      # chronicle-source: modules/app/_chronicle/kube.plan kd_pass
      ir_stages: {hex: ""}
  - name: kube_sel
    type: pipeline
    params:
      # The label selector as requirements (kube_sel.rd).
      # rd-source: modules/app/_chronicle/kube_sel.rd
      decode: {hex: ""}
      # chronicle-source: modules/app/_chronicle/kube.plan ks_pass
      ir_stages: {hex: ""}
  - name: kube_facts
    type: pipeline
    params:
      # A GET's facts in its body slot: a watch's registration, a list's typed
      # envelope head (kube_facts.rd).
      # rd-source: modules/app/_chronicle/kube_facts.rd
      decode: {hex: ""}
      # chronicle-source: modules/app/_chronicle/kube.plan kd_facts
      ir_stages: {hex: ""}
  - name: kube_route
    type: decision
    params:
      # The path's shape → resource, namespace, name, key; any other target
      # (a discovery document) passes with those EMPTY and is answered by
      # target downstream.
      # chronicle-source: modules/app/_chronicle/kube.plan kd_route
      decision: {hex: ""}
  - name: admit
    type: decision
    params:
      # chronicle-source: modules/app/_chronicle/apiplane_admit.plan admit
      decision: {hex: ""}
  # OpenAPI v3 documents, for the requests `admit` tagged — a second node
  # because discovery and OpenAPI together pass one container's 16 KiB.
  - name: oapi
    type: decision
    params:
      # chronicle-source: modules/app/_chronicle/apiplane_admit.plan oapi
      decision: {hex: ""}

  - name: kagi_verify
    audience: "nanocloud"
    issuer: "https://kubernetes.default.svc"
    # The key sets a token may be signed under (up to four): the
    # ServiceAccount issuer's, which this cell's mint announces at
    # /authn-keys/sa, and /authn-keys/node — where the mint announces when a
    # provisioned issuer holds /authn-keys/sa (the rigs' seeded key), so the
    # tokens the cell mints itself (TokenRequest, `kubectl create token`)
    # verify beside the provisioned issuer's.
    key_paths: "/authn-keys/sa,/authn-keys/node"

  - name: token_verify

  # Which of the two authentication methods produced the caller — a kagi-verified
  # bearer token, or an mTLS peer the TLS layer authenticated. Selecting it here
  # keeps ONE verb ladder in `authz` instead of one per identity source.
  - name: ident
    type: decision
    params:
      # chronicle-source: modules/app/_chronicle/apiplane.plan ident
      decision: {hex: ""}
  # The authority-epoch FENCE (apiplane_fence.plan), between `ident` and
  # `rbac`: a managed credential's (a ManagementBinding's, management.plan)
  # write must name its authority epoch (header Nanocloud-Authority-Epoch),
  # and one behind an epoch the cell has committed is refused 409 — a stale
  # management writer is stopped by the cell, not only by its own CAS.
  # `fence` COUNTs the caller's committed epochs newer than the header's
  # (/authority-epochs/<subject>/<epoch>, `count_where`); `fenced` decides
  # and hands `rbac` the record `ident` made.
  - name: fence
    type: store_effect
    # chronicle-source: modules/app/_chronicle/apiplane_fence.plan fence
    decision: {hex: ""}
    # chronicle-source: modules/app/_chronicle/apiplane_fence.plan fence_newer
    count_where: {hex: "02060000001700010002fe00000002060000001000000000000000002200030000000f0010010000000000000040010000004109000000180001000203000000532000010002fe00000002060000002400030000000f0010010000000000000040010000004101000000010041"}
    key_prefix: "/authority-epochs/"
  - name: fenced
    type: decision
    params:
      # chronicle-source: modules/app/_chronicle/apiplane_fence.plan fenced
      decision: {hex: ""}

  - name: rbac
    type: store_effect
    # chronicle-source: modules/app/_chronicle/apiplane.plan authz
    decision: {hex: ""}
    key_prefix: "/rbac-g/"
    wild: "18,26,20,22,24"
  # RBAC ESCALATION (apiplane_esc.plan, _shared/rbac_cover.rs): a write of
  # a Role, ClusterRole, (Cluster)RoleBinding or ManagementBinding grants
  # only what its writer holds in the grant index — or the writer may
  # `escalate` / `bind` it — upstream's rule. `esc` checks (a patch on its
  # result), `escd` turns a refusal into the verdict.
  - name: esc
    type: store_big
    # chronicle-source: modules/app/_chronicle/apiplane_esc.plan esc
    decision: {hex: ""}
    blob: "/blobs/sha256/"
    cover: "/rbac-g/|/roles/|/clusterroles/|/rbac-agg/"
  - name: escd
    type: decision
    params:
      # chronicle-source: modules/app/_chronicle/apiplane_esc.plan escd
      decision: {hex: ""}
  # The kind's SCOPE (apiplane_scope.plan): a cluster-scoped kind on a
  # namespaced path, or a namespaced one on the cluster path with a name or
  # a write, is 404 — a custom kind's scope read from its CRD's row
  # (crd.plan), no row no kind; and the discovery documents the store holds
  # (`/apis`' custom groups, a custom group-version's kinds), LISTed here.
  - name: scope
    type: store_effect
    # chronicle-source: modules/app/_chronicle/apiplane_scope.plan scope
    decision: {hex: ""}
    # `/apis`: the /discovery-groups/ rows' values in an APIGroupList.
    list_values: 1
    list_open: "{\"kind\":\"APIGroupList\",\"apiVersion\":\"v1\",\"groups\":["
    list_close: "]}"
  - name: disc
    type: store_effect
    # chronicle-source: modules/app/_chronicle/apiplane_scope.plan disc
    decision: {hex: ""}
    # A custom group-version: its /discovery-res/ rows in an APIResourceList.
    list_values: 1
    list_open: "{\"kind\":\"APIResourceList\",\"apiVersion\":\"v1\",\"groupVersion\":\"{{tail}}\",\"resources\":["
    list_close: "]}"
  - name: scoped
    type: decision
    params:
      # chronicle-source: modules/app/_chronicle/apiplane_scope.plan scoped
      decision: {hex: ""}
  # Kubernetes RBAC is PARAMS (rbac_rules.plan, rbac_grants.plan,
  # rbac_prune.plan): Roles/ClusterRoles/RoleBindings/ClusterRoleBindings
  # are expanded into a grant index /rbac-g/<id>/<scope>|<verb>|<res> that
  # the authorization stage probes once; every derived row is pruned when
  # the object it came from no longer produces it.
  - name: rb_roles
    type: store_source
    prefix: "/roles/"
    expand: "rules[]"
    hash: "."
    paths: "rules.#.verbs,rules.#.resources,rules.#.resourceNames,rules.#.apiGroups,rules.#.nonResourceURLs"
  - name: rb_roles_e
    type: store_effect
    # chronicle-source: modules/app/_chronicle/rbac_rules.plan ro_rule
    decision: {hex: ""}
    key_prefix: "/rbac-rule/"
  - name: rb_croles
    type: store_source
    prefix: "/clusterroles/"
    expand: "rules[]"
    hash: "."
    paths: "rules.#.verbs,rules.#.resources,rules.#.resourceNames,rules.#.apiGroups,rules.#.nonResourceURLs"
  - name: rb_croles_e
    type: store_effect
    # chronicle-source: modules/app/_chronicle/rbac_rules.plan cr_rule
    decision: {hex: ""}
    key_prefix: "/rbac-rule/"
  - name: rb_rules
    type: store_source
    prefix: "/rbac-rule/"
    expand: "v[]*a[]*r[]*n[]"
    paths: "v.#0,a.#1,r.#2,n.#3"
  - name: rb_rules_e
    type: store_effect
    # chronicle-source: modules/app/_chronicle/rbac_rules.plan ru_perm
    decision: {hex: ""}
    key_prefix: "/rbac-perm/"
  - name: rb_rbs
    type: store_source
    prefix: "/rolebindings/"
    expand: "subjects[]"
    hash: "."
    paths: "subjects.#.kind,subjects.#.name,subjects.#.namespace,roleRef.kind,roleRef.name"
  - name: rb_rbs_e
    type: store_effect
    # chronicle-source: modules/app/_chronicle/rbac_grants.plan rb_row
    decision: {hex: ""}
    key_prefix: "/rbac-bind/"
  - name: rb_crbs
    type: store_source
    prefix: "/clusterrolebindings/"
    expand: "subjects[]"
    hash: "."
    paths: "subjects.#.kind,subjects.#.name,subjects.#.namespace,roleRef.kind,roleRef.name"
  - name: rb_crbs_e
    type: store_effect
    # chronicle-source: modules/app/_chronicle/rbac_grants.plan crb_row
    decision: {hex: ""}
    key_prefix: "/rbac-bind/"
  - name: rb_perms
    type: store_source
    prefix: "/rbac-perm/"
    paths: "v,a,r,n"
    join: "/rbac-bind/"
    join_scoped: 2
    join_paths: "id,scope"
    watch: "/rbac-"
  - name: rb_src_e
    type: store_effect
    # chronicle-source: modules/app/_chronicle/rbac_grants.plan gr_src
    decision: {hex: ""}
    key_prefix: "/rbac-src/"
  - name: rb_g_e
    type: store_effect
    # chronicle-source: modules/app/_chronicle/rbac_grants.plan gr_g
    decision: {hex: ""}
    key_prefix: "/rbac-g/"
  - name: rb_prule
    type: store_source
    prefix: "/rbac-rule/"
    paths: "src,g"
    watch: "/roles/,/clusterroles/"
  - name: rb_prule_get
    type: store_effect
    # chronicle-source: modules/app/_chronicle/rbac_prune.plan dv_get
    decision: {hex: ""}
    hash: "."
  - name: rb_prule_del
    type: store_effect
    # chronicle-source: modules/app/_chronicle/rbac_prune.plan dv_drop
    decision: {hex: ""}
    key_prefix: "/rbac-rule/"
  - name: rb_pbind
    type: store_source
    prefix: "/rbac-bind/"
    paths: "src,g"
    watch: "/rolebindings/,/clusterrolebindings/"
  - name: rb_pbind_get
    type: store_effect
    # chronicle-source: modules/app/_chronicle/rbac_prune.plan dv_get
    decision: {hex: ""}
    hash: "."
  - name: rb_pbind_del
    type: store_effect
    # chronicle-source: modules/app/_chronicle/rbac_prune.plan dv_drop
    decision: {hex: ""}
    key_prefix: "/rbac-bind/"
  - name: rb_pperm
    type: store_source
    prefix: "/rbac-perm/"
    paths: "rule"
    watch: "/rbac-"
  - name: rb_pperm_chk
    type: store_effect
    # chronicle-source: modules/app/_chronicle/rbac_prune.plan pm_chk
    decision: {hex: "01050000000c000100020400000012000020000d0000003200010002010000004001000000100000000000000000400200000012000040030000000100020300000042011e40fe000000410e000000360001000201000000400100000010020000000000000040020000000100020400000040030000000100020300000042011e40fe00000041"}
  - name: rb_pperm_del
    type: store_effect
    # chronicle-source: modules/app/_chronicle/rbac_prune.plan pm_drop
    decision: {hex: "010500000012000100020200000010940100000000000020000a0000002c000100020100000040010000001004000000000000004002000000010002fe000000021e0000004003000000410800000023000100020100000040010000001000000000000000004002000000120000400300000041"}
    key_prefix: "/rbac-perm/"
  # aggregationRule as params (rbac_agg.plan): each binding of an aggregating
  # ClusterRole mirrored as a binding of every role its selectors match.
  - name: rb_aggselsrc
    type: store_source
    prefix: "/clusterroles/"
    expand: "aggregationRule.clusterRoleSelectors[]"
    paths: "aggregationRule.clusterRoleSelectors.#"
    hash: "."
  - name: rb_aggsel
    type: store_effect
    # chronicle-source: modules/app/_chronicle/rbac_agg.plan ag_sel
    decision: {hex: ""}
    key_prefix: "/rbac-aggsel/"
  - name: rb_aggsrc
    type: store_source
    prefix: "/rbac-aggsel/"
    join: "/clusterroles/"
    hash: "."
    join_terms: "90=sel.matchExpressions[]:key,operator,values[]@metadata.labels;92=sel.matchLabels{}@metadata.labels"
    watch: "/clusterroles/"
  - name: rb_aggmap
    type: pipeline
    params:
      # chronicle-source: modules/app/_chronicle/rbac_agg.plan ag_map
      ir_stages: {hex: ""}
      stage_kinds: {hex: "0202"}
  - name: rb_agg
    type: store_effect
    # chronicle-source: modules/app/_chronicle/rbac_agg.plan ag_agg
    decision: {hex: ""}
    key_prefix: "/rbac-agg/"
  - name: rb_mirrorsrc
    type: store_source
    prefix: "/rbac-bind/"
    join: "/rbac-agg/"
    join_scoped: 2
    paths: "id,scope,src,g"
    ints: "d"
    watch: "/rbac-"
  - name: rb_mirror
    type: store_effect
    # chronicle-source: modules/app/_chronicle/rbac_agg.plan ag_mirror
    decision: {hex: ""}
    key_prefix: "/rbac-bind/"
  - name: rb_paggsel
    type: store_source
    prefix: "/rbac-aggsel/"
    paths: "src,g"
    watch: "/clusterroles/"
  - name: rb_paggsel_get
    type: store_effect
    # chronicle-source: modules/app/_chronicle/rbac_prune.plan dv_get
    decision: {hex: ""}
    hash: "."
  - name: rb_paggsel_del
    type: store_effect
    # chronicle-source: modules/app/_chronicle/rbac_prune.plan dv_drop
    decision: {hex: ""}
    key_prefix: "/rbac-aggsel/"
  - name: rb_pagg
    type: store_source
    prefix: "/rbac-agg/"
    paths: "src,g"
    watch: "/rbac-"
  - name: rb_pagg_get
    type: store_effect
    # chronicle-source: modules/app/_chronicle/rbac_prune.plan dv_get
    decision: {hex: ""}
    hash: "."
  - name: rb_pagg_del
    type: store_effect
    # chronicle-source: modules/app/_chronicle/rbac_prune.plan dv_drop
    decision: {hex: ""}
    key_prefix: "/rbac-agg/"
  - name: rb_paggrole
    type: store_source
    prefix: "/rbac-agg/"
    paths: "rule"
    watch: "/clusterroles/"
  - name: rb_paggrole_chk
    type: store_effect
    # chronicle-source: modules/app/_chronicle/rbac_prune.plan pm_chk
    decision: {hex: "01050000000c000100020400000012000020000d0000003200010002010000004001000000100000000000000000400200000012000040030000000100020300000042011e40fe000000410e000000360001000201000000400100000010020000000000000040020000000100020400000040030000000100020300000042011e40fe00000041"}
  - name: rb_paggrole_del
    type: store_effect
    # chronicle-source: modules/app/_chronicle/rbac_prune.plan pm_drop
    decision: {hex: "010500000012000100020200000010940100000000000020000a0000002c000100020100000040010000001004000000000000004002000000010002fe000000021e0000004003000000410800000023000100020100000040010000001000000000000000004002000000120000400300000041"}
    key_prefix: "/rbac-agg/"
  - name: rb_pmirror
    type: store_source
    prefix: "/rbac-bind/"
    paths: "agg"
    watch: "/rbac-"
  - name: rb_pmirror_chk
    type: store_effect
    # chronicle-source: modules/app/_chronicle/rbac_prune.plan pm_chk
    decision: {hex: "01050000000c000100020400000012000020000d0000003200010002010000004001000000100000000000000000400200000012000040030000000100020300000042011e40fe000000410e000000360001000201000000400100000010020000000000000040020000000100020400000040030000000100020300000042011e40fe00000041"}
  - name: rb_pmirror_del
    type: store_effect
    # chronicle-source: modules/app/_chronicle/rbac_prune.plan pm_drop
    decision: {hex: "010500000012000100020200000010940100000000000020000a0000002c000100020100000040010000001004000000000000004002000000010002fe000000021e0000004003000000410800000023000100020100000040010000001000000000000000004002000000120000400300000041"}
    key_prefix: "/rbac-bind/"
  - name: rb_psrc
    type: store_source
    prefix: "/rbac-src/"
    flat: 1
    paths: "perm,bind"
    watch: "/rbac-"
  - name: rb_psrc_p
    type: store_effect
    # chronicle-source: modules/app/_chronicle/rbac_prune.plan sr_perm
    decision: {hex: "00110000003e000100020100000040010000001002000000000000004002000000010002040000004003000000010002030000000100020500000042021e1f40fe00000041"}
  - name: rb_psrc_bp
    type: store_effect
    # chronicle-source: modules/app/_chronicle/rbac_prune.plan sr_bind
    decision: {hex: "001300000048000100020100000040010000001002000000000000004002000000010002fe000000021f0000004003000000010002fe000000021e0000000100020200000042021e2040fe00000041"}
  - name: rb_psrc_del
    type: store_effect
    # chronicle-source: modules/app/_chronicle/rbac_prune.plan sr_drop
    decision: {hex: "010b0000002900010002fe000000022000000010940100000000000020010002020000001094010000000000002031000a0000002c000100020100000040010000001004000000000000004002000000010002fe000000021e0000004003000000410800000023000100020100000040010000001000000000000000004002000000120000400300000041"}
    key_prefix: "/rbac-src/"
  - name: rb_pg
    type: store_source
    prefix: "/rbac-g/"
    count_children: "/rbac-src/"
    child_sep: "/"
    watch: "/rbac-"
  - name: rb_pg_del
    type: store_effect
    # chronicle-source: modules/app/_chronicle/rbac_prune.plan gr_drop
    decision: {hex: "010500000012000100021600000010000000000000000020000900000027000100020100000040010000001004000000000000004002000000010002030000004003000000410800000023000100020100000040010000001000000000000000004002000000120000400300000041"}
    key_prefix: "/rbac-g/"
  # CustomResourceDefinitions as params (crd.plan): each CRD upstream would
  # admit becomes its scope row (/crd-scope/<plural>.<group>, what `scope`
  # reads) and its discovery rows (/discovery-res/<group>/<version>/…, the
  # kinds of a group-version; /discovery-groups/<group>/<version>, what
  # `/apis` lists); each row goes when its CRD no longer produces it.
  # store_scan (store_source with a heap): a CRD with a real openAPI schema is
  # routinely several KiB, past one record; it is read whole, never refused.
  - name: crd_src
    type: store_scan
    prefix: "/customresourcedefinitions/"
    paths: "metadata.name,spec.group,spec.scope,spec.names.plural"
  - name: crd_scope
    type: store_effect
    # chronicle-source: modules/app/_chronicle/crd.plan cr_scope
    decision: {hex: ""}
    key_prefix: "/crd-scope/"
  - name: crd_vers
    type: store_scan
    prefix: "/customresourcedefinitions/"
    expand: "spec.versions[]"
    hash: "."
    paths: "metadata.name,spec.group,spec.scope,spec.names.plural,spec.names.singular,spec.names.kind,spec.versions.#.name,spec.versions.#.served,spec.names.shortNames,spec.versions.#.subresources.status,spec.versions.#.subresources.scale"
  - name: crd_res
    type: store_effect
    # chronicle-source: modules/app/_chronicle/crd.plan cr_res
    decision: {hex: ""}
    key_prefix: "/discovery-res/"
  # A served version's status and scale subresources, rows beside its kind's.
  - name: crd_res_st
    type: store_effect
    # chronicle-source: modules/app/_chronicle/crd_groups.plan cr_rstat
    decision: {hex: ""}
    key_prefix: "/discovery-res/"
  - name: crd_res_sc
    type: store_effect
    # chronicle-source: modules/app/_chronicle/crd_groups.plan cr_rscale
    decision: {hex: ""}
    key_prefix: "/discovery-res/"
  # A served group-version, ranked (crd_groups.plan), and the group's row
  # made by its first CRD; the group's row composed from every gv row under
  # it — one APIGroup per group, every version — and gv rows pruned when no
  # kind is left under them.
  - name: crd_grp
    type: store_effect
    # chronicle-source: modules/app/_chronicle/crd_groups.plan cr_gv
    decision: {hex: ""}
    key_prefix: "/discovery-gv/"
  - name: crd_gn
    type: store_effect
    # chronicle-source: modules/app/_chronicle/crd_groups.plan cr_gname
    decision: {hex: ""}
    key_prefix: "/discovery-groups/"
  - name: crd_gc
    type: store_source
    prefix: "/discovery-groups/"
    list_children: "/discovery-gv/"
    child_sep: "/"
    list_values: 1
    watch: "/discovery-gv/"
  - name: crd_gc_put
    type: store_effect
    # chronicle-source: modules/app/_chronicle/crd_groups.plan cr_gcomp
    decision: {hex: ""}
    key_prefix: "/discovery-groups/"
  - name: crd_gvp
    type: store_source
    prefix: "/discovery-gv/"
    watch: "/discovery-res/"
  - name: crd_gvp_cnt
    type: store_effect
    # chronicle-source: modules/app/_chronicle/crd_groups.plan cgv_count
    decision: {hex: ""}
  - name: crd_gvp_del
    type: store_effect
    # chronicle-source: modules/app/_chronicle/crd_groups.plan cgv_drop
    decision: {hex: ""}
    key_prefix: "/discovery-gv/"
  # The groups this server serves itself, one /discovery-groups/ row.
  - name: crd_bi
    type: store_source
    prefix: "/discovery-groups/"
    count: 1
    empty: 1
  - name: crd_bi_put
    type: store_effect
    # chronicle-source: modules/app/_chronicle/crd.plan cr_builtin
    decision: {hex: ""}
    key_prefix: "/discovery-groups/"
  - name: crd_ps
    type: store_source
    prefix: "/crd-scope/"
    unless: "/customresourcedefinitions/"
    watch: "/customresourcedefinitions/"
  - name: crd_ps_del
    type: store_effect
    # chronicle-source: modules/app/_chronicle/crd.plan cs_drop
    decision: {hex: "01050000000c000100020300000012000020000a000000310001000201000000400100000010000000000000000040020000001200004003000000100000000000000000401c000000410b00000035000100020100000040010000001004000000000000004002000000010002030000004003000000100000000000000000401c00000041"}
    key_prefix: "/crd-scope/"
  - name: crd_pr
    type: store_source
    prefix: "/discovery-res/"
    watch: "/customresourcedefinitions/"
  # store_big: the CRD's digest is of the WHOLE document (a plain store_effect
  # answers one past a record as present with empty projections, and the
  # digest of nothing would prune its rows every pass).
  - name: crd_pr_get
    type: store_big
    # chronicle-source: modules/app/_chronicle/crd.plan crs_get
    decision: {hex: ""}
    hash: "."
  - name: crd_pr_del
    type: store_effect
    # chronicle-source: modules/app/_chronicle/crd.plan crs_drop
    decision: {hex: ""}
    key_prefix: "/discovery-res/"
  - name: crd_pg
    type: store_source
    prefix: "/discovery-groups/"
    count_children: "/discovery-res/"
    child_sep: "/"
    watch: "/discovery-res/"
  - name: crd_pg_del
    type: store_effect
    # chronicle-source: modules/app/_chronicle/crd.plan cg_drop
    decision: {hex: ""}
    key_prefix: "/discovery-groups/"

  - name: gate
    type: decision
    params:
      # chronicle-source: modules/app/_chronicle/apiplane.plan gate
      decision: {hex: ""}

  # Admission as params (admission.plan): the policy, a quota count, the
  # verdict — the object as admitted (defaults applied) or the refusal.
  - name: ad_pol
    type: store_effect
    # chronicle-source: modules/app/_chronicle/admission.plan ad_pol
    decision: {hex: ""}
    key_prefix: "/admission-policy/"
    flat: 1
    paths: "required,defaults,quota"
    ints: "quota"
    echo: "60,61,62,63"
  - name: ad_cnt
    type: store_effect
    # chronicle-source: modules/app/_chronicle/admission.plan ad_cnt
    decision: {hex: ""}
    key_prefix: "/"
    echo: "40,41,42,50,60,63,64"
  - name: ad_dec
    type: pipeline
    params:
      # The policy applied (admission.rd): defaults into the object, then each
      # required path looked up in it; ad_ver gives the verdict (`ad`).
      # rd-source: modules/app/_chronicle/admission.rd
      decode: {hex: ""}
      # chronicle-source: modules/app/_chronicle/admission.plan ad_dec
      ir_stages: {hex: ""}
  - name: ad_ver
    type: decision
    params:
      # chronicle-source: modules/app/_chronicle/admission.plan ad_dec
      decision: {hex: ""}

  - name: se_body
    # A STAGED body's name, read from its blob (a create names its object in
    # the body), and its data's size; nothing for an inline one.
    type: store_big
    # chronicle-source: modules/app/_chronicle/apiplane_watch.plan w_body
    decision: {hex: ""}
    key_prefix: "/blobs/sha256/"
    paths: "metadata.name"
    # 50, 51: what upstream bounds a ConfigMap's or Secret's data by.
    ints: "data!size,binaryData!size"
    echo: "60,61"
  - name: se_probe
    # The API's WRITER. The store decides what upstream decides from state
    # (409 for a create that exists, 404 for a write of nothing, 409 for a
    # stale resourceVersion), so nothing is probed first and the request body
    # never rides the carry. store_doc is the record edge only: each write
    # leaves as ONE JSON document request to lattice's dialect below, whose
    # schema is the Kubernetes object lifecycle, and whose executor writes
    # the object as JSON at its own key — the key every connector reads.
    type: store_doc
    # chronicle-source: modules/app/_chronicle/apiplane.plan probe
    decision: {hex: ""}
    # A delete leaves the object's last state for a watch's DELETED event.
    tomb: "/~tomb"
    # A staged body is read from its blob and sent as the document.
    blob: "/blobs/sha256/"
    # A Secret's write-only stringData folded into data (base64) on create,
    # replace, apply and patch, as upstream's Secret strategy does.
    fold: "/secrets/|stringData>data"
  # Kubernetes object lifecycle as lattice's JSON document dialect: the
  # identity a patch may not change, what a create stamps (uid,
  # creationTimestamp, the name — generateName's prefix plus five characters
  # when the key names none), what a replace keeps, the namespace name label,
  # the finalizer guard with what a held delete stamps, views, field
  # ownership (managedFields) and its conflict Status, and the
  # strategic-merge keys; `rv.if`: an update, a merge or strategic patch
  # and an apply are conditional on the resourceVersion their body states
  # (a stale one is 409, as upstream's). `codec=path`: every collection is
  # stored as the object's JSON at `/<collection>/<namespace>/<name>`
  # (`/<collection>/<name>` for the cluster-scoped kinds `id_paths` names),
  # managedFields inside it.
  - name: doc_json_dialect
    type: doc_json_dialect_big
    params:
      schema: "codec=path;rv.if=replace,merge,keyed,apply;identity=metadata.name,metadata.namespace,kind;create=metadata.name:name,metadata.uid:uuid,metadata.creationTimestamp:now;generate=metadata.generateName;keep=metadata.uid,metadata.creationTimestamp;named=namespaces|metadata.labels[kubernetes.io/metadata.name]:name;guard=metadata.finalizers;deleting=metadata.deletionTimestamp:now,metadata.deletionGracePeriodSeconds:#0;view.scale=tpl:{\"kind\":\"Scale\",\"apiVersion\":\"autoscaling/v1\",\"metadata\":{\"name\":{{metadata.name}},\"namespace\":{{metadata.namespace}},\"uid\":{{metadata.uid}},\"creationTimestamp\":{{metadata.creationTimestamp}}},\"spec\":{\"replicas\":{{spec.replicas|1}}},\"status\":{\"replicas\":{{status.replicas|0}},\"selector\":\"{{pairs:spec.selector.matchLabels}}\"}};write.scale=spec.replicas;write.status=status;owners=metadata.managedFields;owners.keys=manager,operation,apiVersion,time,subresource,fieldsV1;owners.ops=Apply,Update;owners.api=apiVersion;owners.entry={\"manager\":\"{{manager}}\",\"operation\":\"{{op}}\"{{?api:,\"apiVersion\":\"$\"}},\"time\":\"{{time}}\",\"fieldsType\":\"FieldsV1\",\"fieldsV1\":{{fields}}{{?sub:,\"subresource\":\"$\"}}};owners.marks=f:,k:,v:,.;unowned=apiVersion,kind,status,metadata.name,metadata.namespace,metadata.uid,metadata.resourceVersion,metadata.generation,metadata.creationTimestamp,metadata.managedFields,metadata.selfLink,metadata.deletionTimestamp,metadata.deletionGracePeriodSeconds;conflict={\"kind\":\"Status\",\"apiVersion\":\"v1\",\"metadata\":{},\"status\":\"Failure\",\"message\":\"Apply failed with {{count}} conflict{{?many:s}}: {{list}}\",\"reason\":\"Conflict\",\"details\":{\"causes\":[{{causes}}]},\"code\":409};conflict.item=conflict with \\\"{{manager}}\\\"{{?api: using $}}: {{field}};conflict.cause={\"type\":\"FieldManagerConflict\",\"message\":\"conflict with \\\"{{manager}}\\\"{{?api: using $}}\",\"field\":\"{{field}}\"};smp.patch=$patch;smp.retain=$retainKeys;smp.delete=$deleteFromPrimitiveList/;smp.prefix=$;rv=metadata.resourceVersion;missing={\"kind\":\"Status\",\"apiVersion\":\"v1\",\"metadata\":{},\"status\":\"Failure\",\"reason\":\"NotFound\",\"code\":404};view.log=text:/~node/|spec.nodeName|/sandbox-logs/|metadata.uid;event={\"type\":\"{{type}}\",\"object\":{{object}}};expired={\"kind\":\"Status\",\"apiVersion\":\"v1\",\"metadata\":{},\"status\":\"Failure\",\"message\":\"too old resource version\",\"reason\":\"Expired\",\"code\":410};bookmark={\"kind\":\"{{kind}}\",\"apiVersion\":\"{{av}}\",\"metadata\":{\"resourceVersion\":\"{{rv}}\"}};list.tail=],\"metadata\":{\"resourceVersion\":\"{{rv}}\"{{?continue:,\"continue\":\"$\"}}}};table.head={\"kind\":\"Table\",\"apiVersion\":\"meta.k8s.io/v1\",\"columnDefinitions\":[{{cols}}],\"rows\":[;table.col={\"name\":\"{{name}}\",\"type\":\"string\",\"format\":\"{{format}}\",\"description\":\"\",\"priority\":0};table.row={\"cells\":[{{cells}}],\"object\":{\"kind\":\"PartialObjectMetadata\",\"apiVersion\":\"meta.k8s.io/v1\",\"metadata\":{{metadata}}}};table.end=]};event.types=ADDED,MODIFIED,DELETED,BOOKMARK"
      patch_keys: "containers=name,initContainers=name,ephemeralContainers=name,ports@containers=containerPort,ports@initContainers=containerPort,ports@ephemeralContainers=containerPort,ports=port,env=name,volumeMounts=mountPath,volumeDevices=devicePath,volumes=name,imagePullSecrets=name,hostAliases=ip,conditions=type,ownerReferences=uid,topologySpreadConstraints=topologyKey,resourceClaims=name,+finalizers"
      id_paths: "metadata.namespace,metadata.name;namespaces,nodes,persistentvolumes,clusterroles,clusterrolebindings,customresourcedefinitions,storageclasses,priorityclasses,ingressclasses,runtimeclasses,csidrivers,csinodes,volumeattachments,mutatingwebhookconfigurations,validatingwebhookconfigurations,apiservices,certificatesigningrequests,graphs.nanocloud.io,zonesummaries.nanocloud.io,managementbindings.nanocloud.io=metadata.name;?=metadata.namespace,metadata.name"
      # Every object answered carries its store revision as
      # metadata.resourceVersion, and a REPLACE reads the expected revision
      # back out of the body the client sent.
      rv_path: "metadata.resourceVersion"
  - name: document_executor
    type: document_executor_big
  # The executor's command path to the store worker (lattice's composition).
  - name: kv_request_router

  - name: se_act
    # The answer, from what the write did (apiplane_reply.plan `act`).
    type: decision
    params:
      # chronicle-source: modules/app/_chronicle/apiplane_reply.plan act
      decision: {hex: ""}

  - name: se_ans
    # A write of a staged body answers with the object it stored: a GET
    # registration the watch chain serves (apiplane_watch `ans`).
    type: store_effect
    # chronicle-source: modules/app/_chronicle/apiplane_watch.plan w_ans
    decision: {hex: ""}
    key_prefix: "/watch-reg/"
  # Staged request bodies, collected at their deadline (blob_gc.plan).
  - name: gc_src
    type: store_source
    prefix: "/blobs/at/"
    ints: "deadline"
    due: "deadline"
  - name: gc_blob
    type: store_effect
    # chronicle-source: modules/app/_chronicle/blob_gc.plan gc_blob
    decision: {hex: "010b000000220001000232000000100000000000000000240100023a000000010002320000002530000c0000003300010002010000004001000000100400000000000000400200000001000203000000400300000001000203000000401e000000410a0000002b0001000201000000400100000010000000000000000040020000001200004003000000120000401e00000041"}
    key_prefix: "/blobs/sha256/"
  - name: gc_at
    type: store_effect
    # chronicle-source: modules/app/_chronicle/blob_gc.plan gc_at
    decision: {hex: "01050000000c000100021e00000012000021000b0000002f0001000201000000400100000010040000000000000040020000000100021e0000004003000000120000401e000000410a0000002b0001000201000000400100000010000000000000000040020000001200004003000000120000401e00000041"}
    key_prefix: "/blobs/at/"
  - name: reply
    type: decision
    params:
      # chronicle-source: modules/app/_chronicle/apiplane_reply.plan reply
      decision: {hex: ""}

  # ---- the WATCH chain: the store's change feed -> events on registered connections ----
  # apiplane_watch.plan. ONE connector for every resource, serving LISTs and
  # WATCHes alike: each registration (/watch-reg/<cid>, written by the request
  # chain) names its prefix, resume revision, timeoutSeconds, bookmarks,
  # limit/continue and selectors. A LIST streams its items; a WATCH reads the
  # change feed from its own cursor. Each candidate passes the filter first;
  # every record carries the wire line already built.
  - name: ws_evt
    # store_source with a heap: objects past one record are read whole.
    type: store_watch
    # The document schema (_shared/docschema.rs): the revision every answer
    # carries, what a GET of nothing answers, how a view reads — a Scale
    # rendered from the object, a Pod's log as its sandbox's output tail —
    # and the watch wire: an event's framing, the 410 a watch past its
    # history ends with, the 500 a watch, list or get the store refused ends
    # with, a bookmark's object, and a List's tail.
    schema: "rv=metadata.resourceVersion;missing={\"kind\":\"Status\",\"apiVersion\":\"v1\",\"metadata\":{},\"status\":\"Failure\",\"reason\":\"NotFound\",\"code\":404};view.scale=tpl:{\"kind\":\"Scale\",\"apiVersion\":\"autoscaling/v1\",\"metadata\":{\"name\":{{metadata.name}},\"namespace\":{{metadata.namespace}},\"uid\":{{metadata.uid}},\"creationTimestamp\":{{metadata.creationTimestamp}}},\"spec\":{\"replicas\":{{spec.replicas|1}}},\"status\":{\"replicas\":{{status.replicas|0}},\"selector\":\"{{pairs:spec.selector.matchLabels}}\"}};view.log=text:/~node/|spec.nodeName|/sandbox-logs/|metadata.uid;event={\"type\":\"{{type}}\",\"object\":{{object}}};expired={\"kind\":\"Status\",\"apiVersion\":\"v1\",\"metadata\":{},\"status\":\"Failure\",\"message\":\"too old resource version\",\"reason\":\"Expired\",\"code\":410};failed={\"kind\":\"Status\",\"apiVersion\":\"v1\",\"metadata\":{},\"status\":\"Failure\",\"message\":\"the store refused a read\",\"reason\":\"InternalError\",\"code\":500};bookmark={\"kind\":\"{{kind}}\",\"apiVersion\":\"{{av}}\",\"metadata\":{\"resourceVersion\":\"{{rv}}\"}};list.tail=],\"metadata\":{\"resourceVersion\":\"{{rv}}\"{{?continue:,\"continue\":\"$\"}}}};table.head={\"kind\":\"Table\",\"apiVersion\":\"meta.k8s.io/v1\",\"columnDefinitions\":[{{cols}}],\"rows\":[;table.col={\"name\":\"{{name}}\",\"type\":\"string\",\"format\":\"{{format}}\",\"description\":\"\",\"priority\":0};table.row={\"cells\":[{{cells}}],\"object\":{\"kind\":\"PartialObjectMetadata\",\"apiVersion\":\"meta.k8s.io/v1\",\"metadata\":{{metadata}}}};table.end=]}"
    prefix: "/watch-reg/"
    watch: "/"
    events: 1
    # Registrations a previous runtime left (it stopped with watches open)
    # are deleted at the first step, unserved: no connection outlives its
    # runtime, and a new one reusing a stale one's id must not get its watch.
    stale_at_open: 1
    tomb: "/~tomb"
    paths: "metadata.name,metadata.namespace"
    join_paths: "fsn,fsns"
    # A server-side Table (kubectl get asks with Accept: as=Table): per kind,
    # the columns upstream prints (`*`: any other kind), each a path or an
    # expression (table.rs); the envelope is the schema's `table.*`.
    table: "*=Name/name:metadata.name,Age:@age(metadata.creationTimestamp);Pod=Name/name:metadata.name,Ready:@n(status.containerStatuses?ready=true)/@n(spec.containers),Status:@podstatus(),Restarts:@sum(status.containerStatuses:restartCount),Age:@age(metadata.creationTimestamp);Deployment=Name/name:metadata.name,Ready:@v(status.readyReplicas|0)/@v(spec.replicas|1),Up-to-date:status.updatedReplicas|0,Available:status.availableReplicas|0,Age:@age(metadata.creationTimestamp);ReplicaSet=Name/name:metadata.name,Desired:spec.replicas|1,Current:status.replicas|0,Ready:status.readyReplicas|0,Age:@age(metadata.creationTimestamp);StatefulSet=Name/name:metadata.name,Ready:@v(status.readyReplicas|0)/@v(spec.replicas|1),Age:@age(metadata.creationTimestamp);DaemonSet=Name/name:metadata.name,Desired:status.desiredNumberScheduled|0,Current:status.currentNumberScheduled|0,Ready:status.numberReady|0,Age:@age(metadata.creationTimestamp);Service=Name/name:metadata.name,Type:spec.type|ClusterIP,Cluster-IP:spec.clusterIP,Age:@age(metadata.creationTimestamp);Namespace=Name/name:metadata.name,Status:status.phase|Active,Age:@age(metadata.creationTimestamp);Node=Name/name:metadata.name,Status:@ready(status.conditions),Age:@age(metadata.creationTimestamp);ZoneSummary=Name/name:metadata.name,Ready:@v(status.nodes.ready|0)/@v(status.nodes.total|0);EndpointSlice=Name/name:metadata.name,AddressType:addressType,Ports:@more(ports:port),Endpoints:@more(endpoints:addresses),Age:@age(metadata.creationTimestamp)"
    # The registration's selector terms, each PAIRED with the object's value
    # for its key (`@`, looked up in the object): the object's labels never
    # ride in the record.
    join_each: "90=sel[]:key,operator,values@metadata.labels"
    # The filter each candidate passes (labelSelector, fieldSelector).
    # chronicle-source: modules/app/_chronicle/apiplane_watch.plan w_filter
    ir_stages: {hex: ""}
    stage_kinds: {hex: "0200"}
  - name: ws_emit
    type: store_effect
    # chronicle-source: modules/app/_chronicle/apiplane_watch.plan w_emit
    decision: {hex: ""}
    key_prefix: "/watch-reg/"
  # A deleted object's last state (store_doc `tomb`), kept for a watch's
  # DELETED event and expired by its deadline (tomb.plan `ex_any`).
  - name: tomb_src
    # The tombs' END, indexed apart (tomb.plan): a small entry per tomb,
    # read whatever the object's size — a 1 MiB tomb ends at its deadline.
    type: store_source
    prefix: "/~tomb-at/"
    # The deadline is a moment (wall time when the clock is trusted): read
    # as this boot's monotonic ms; another boot's re-based to its ttl.
    ints: "deadline!due:ttl"
    due: "deadline!due:ttl"
  - name: tomb_gc
    # At the deadline: the tomb and its index entry, dropped together.
    type: store_effect
    # chronicle-source: modules/app/_chronicle/tomb.plan ex_any
    decision: {hex: ""}
    key_prefix: "/~"
  - name: enc_http
    type: pipeline
    params:
      # `http_chain`'s reply envelope. Its flags byte is field 4 of the record
      # (`01 00 02 04…` push, `62 01 01` INT width 1 LE), which is what lets
      # one encoder serve both a complete response and the first slice of a
      # stream — a watch — without a second node the graph would have to
      # choose between, which a graph edge cannot do.
      # The body is `value` then the parts 5..10 (apiplane_reply Reply), in a
      # region whose length, less the content type's 16 bytes, is body_len.
      # chronicle-source: modules/app/_chronicle/apiplane_reply.plan encode
      ir_stages: {hex: "01ff79000500010100000012010000000500010200000012020000000500010300000012030000000500010400000012040000000500010500000012050000000500010600000012060000000500010700000012070000000500010800000012080000000500010900000012090000000500010a000000120a00000013"}
      encode: {hex: "010002010000006204010100020200000062020101000204000000620101600100106002000000656010006170706c69636174696f6e2f6a736f6e0100020300000061010002050000006101000206000000610100020700000061010002080000006101000209000000610100020a00000061670201f06a"}
  # ── The store: lattice's storage engine, serving fluxor's storage.object /
  # storage.namespace contracts every connector in this graph reads and writes
  # through. It is ready at construction — recovered, its command log
  # replayed, the host store.log imported — and every module is constructed
  # before any takes a step, so nothing finds it unready.
  # Paths are the working directory's (the service runs in its state
  # directory): `lattice/` holds the store; `store.log` is the host store's
  # log, imported once and then resumed (a seed seam).
  - name: kv_state_worker_store
    params:
      state_store: 1
      store_dir: lattice
      import_log: store.log
      # The history a watch or a change read can resume from: the host
      # store's window (older answers 410, and the store stays bounded).
      history_revisions: 65536
  # The store's clock (a TTL tick through its own command stream) and its
  # chunk sweeps (large values' chunks reclaimed), as lattice composes one.
  - name: ttl_scheduler
    params:
      propose_wrap: 0

wiring:
  - from: linux_net.net_out
    to: http.net_in
  - from: http.net_out
    to: linux_net.net_in
  - from: http.request_out
    to: http_chain.request_in
  - from: http_chain.response_out
    to: http.response_in
  # A decode-mode pipeline reads one envelope per read: mailbox.
  - from: http_chain.record_out
    to: kube_decode.record_in
    buffer_group: 1

  # Mailbox a record edge if and ONLY if the READER declares framed (or is a
  # decode-mode pipeline). A Chronicle engine self-frames over a byte stream
  # (io_core::admit_frame) — a mailbox on an edge into one silently yields no
  # output at all: no error, no metric, just a request that never comes back.
  # Exchange edges (kagi_verify <-> token_verify, http <-> http_chain) are
  # framed by their content type and take the mailbox the build gives them.
  - from: kube_decode.result_out
    to: kube_sel.record_in
    # A decode-mode pipeline reads one protocol unit per read: a byte
    # stream would hand it two requests' frames at once and lose the second.
    buffer_group: 13
  - from: kube_sel.result_out
    to: kube_facts.record_in
    # A decode-mode pipeline reads one protocol unit per read: a byte
    # stream would hand it two requests' frames at once and lose the second.
    buffer_group: 14
  - from: kube_facts.result_out
    to: kube_route.record_in
  - from: kube_route.result_out
    to: admit.record_in
  - from: admit.result_out
    to: oapi.record_in
  - from: oapi.result_out
    to: kagi_verify.request_in
    buffer_group: 2
  - from: kagi_verify.key_out
    to: token_verify.verify_key
  - from: kagi_verify.request_out
    to: token_verify.request_in
  - from: token_verify.response_out
    to: kagi_verify.response_in
  - from: kagi_verify.response_out
    to: ident.record_in
  - from: ident.result_out
    to: fence.request_in
  - from: fence.response_out
    to: fenced.record_in
  - from: fenced.result_out
    to: rbac.request_in
  - from: rbac.response_out
    to: esc.request_in
  - from: esc.response_out
    to: escd.record_in
  - from: escd.result_out
    to: scope.request_in
  - from: scope.response_out
    to: disc.request_in
  - from: disc.response_out
    to: scoped.record_in
  - from: scoped.result_out
    to: gate.record_in
  - from: gate.result_out
    to: ad_pol.request_in
  - from: ad_pol.response_out
    to: ad_cnt.request_in
  - from: ad_cnt.response_out
    to: ad_dec.record_in
    # A decode-mode pipeline reads one protocol unit per read: a byte
    # stream would hand it two requests' frames at once and lose the second.
    buffer_group: 15
  - from: ad_dec.result_out
    to: ad_ver.record_in
  - from: ad_ver.result_out
    to: se_body.request_in
  - from: se_body.response_out
    to: se_probe.request_in
