# Combined node-runtime + CLI graph: the sandbox runtime (owns containers, services
# exec/logs) and nanocloud_cli (arms requests, reads objects) in ONE runtime.
#
# Why one runtime, not two: fluxor's store is single-writer (no flock, no
# multi-process WAL) AND the workload backend's container slots live in the
# spawning process's memory. So the CLI can only reach a runtime-owned
# container — for exec/logs — from the SAME runtime that spawned it. A separate
# `fluxor exec nanocloud` process can neither share the store nor see the slots.
#
# Proven: `-- get pods` lists workloads; `-- exec <id> -- <cmd>` runs a command
# inside the live container and returns its output; `-- logs <id>` streams it.
#
# Caveat (run-to-completion vs persistent): nanocloud_cli is run-to-completion
# while the sandbox runtime is long-lived, so with a running container the runtime
# does not self-exit (the CLI's output still prints). The clean persistent model
# -- one long-lived control-plane runtime + CLI-over-apiserver-HTTP -- is the
# production target; this graph proves the in-runtime CLI<->sandbox seam.
target: linux
tick_us: 1000
scheduler:
  accept_cycles: true
platform:
  cli: {}
modules:
  # (the runtime block of packaging/debian/fluxor-sandbox.yaml — kept identical; scripts/support/sandbox-block.py)
  # ── sandbox ────────────────────────────────────────────────────────────
  - name: wl
    type: workload_effect
    # A pulled workload image's layers (http_fetch's `dir`).
    blobs: "/var/lib/nanocloud.io/image/blobs"
  - name: sb_spec
    type: store_source
    prefix: "/sandboxes/"
    flat: 1
    paths: "phase,cmd,rootfs,iso,net,tasks,env,host,wd,iwd,user,cpu,mem,eph"
    count_children: "/volume-binds/"
    list_children: "/volume-binds/"
    list_values: 1
    child_sep: "/"
    related: "/sandbox-status/:state;/ipam-lease/:.;/ipam-pool^9:.!prefix;/sandbox-boot^9:id;/pod-specs/:volumes!count#,desired;/sandbox-boot-of/:."
    watch: "/sandbox-status/,/ipam-lease/,/sandbox-boot,/volume-binds/,/sandbox-boot-of/"
  - name: sb_specd
    type: decision
    params:
      # chronicle-source: modules/app/_chronicle/sandbox.uproc sb_spec
      decision: {hex: ""}
  # A graph-backed sandbox: the same decision over /metal-sandboxes/, where a
  # Pod with runtimeClassName fluxor lands (pod_project). The kernel realises
  # its FLXA (/graphs/<graph>) as modules of the node's image — no rootfs,
  # binds or lease to wait for.
  - name: sb_mspec
    type: store_source
    prefix: "/metal-sandboxes/"
    flat: 1
    paths: "phase,graph,pack,cpu,mem,eph"
    related: "/sandbox-status/:state;/sandbox-boot^9:id;/sandbox-boot-of/:.;/pod-specs/:desired"
    watch: "/sandbox-status/,/sandbox-boot,/sandbox-boot-of/"
  - name: sb_mspecd
    type: decision
    params:
      # chronicle-source: modules/app/_chronicle/sandbox.uproc sb_mspec
      decision: {hex: ""}
  - name: sb_exec
    type: store_source
    prefix: "/sandbox-exec/"
    rev: 1
    paths: "."
    unless: "/sandbox-exec-result/"
    related: "/sandbox-status/^1!flat:state;/sandboxes/^1!flat:phase"
    watch: "/sandbox-status/"
  - name: sb_execd
    type: decision
    params:
      # chronicle-source: modules/app/_chronicle/sandbox.uproc sb_exec
      decision: {hex: ""}
  - name: sb_sig
    type: store_source
    prefix: "/sandbox-kill/"
    paths: "."
    # A signal for a sandbox not live yet is re-offered once it is.
    watch: "/sandbox-status/"
  - name: sb_pause
    type: store_source
    prefix: "/sandbox-pause/"
    paths: "."
    watch: "/sandbox-status/"
  - name: sb_sigd
    type: decision
    params:
      # chronicle-source: modules/app/_chronicle/sandbox.uproc sb_sig
      decision: {hex: ""}
  - name: sb_paused
    type: decision
    params:
      # chronicle-source: modules/app/_chronicle/sandbox.uproc sb_sig
      decision: {hex: ""}
  - name: sb_tty
    type: store_source
    prefix: "/tty/"
    flat: 1
    rev: 1
    paths: ".,rows,cols,cmd"
    related: "/tty/^1+status:."
    # An open waits for its sandbox to run: re-offered when that changes.
    watch: "/sandbox-status/"
  - name: sb_ttyd
    type: decision
    params:
      # chronicle-source: modules/app/_chronicle/sandbox.uproc sb_tty
      decision: {hex: ""}
  - name: sb_ev
    type: store_effect
    # chronicle-source: modules/app/_chronicle/sandbox.uproc sb_ev
    decision: {hex: ""}
    append_cap: 1024
  - name: sb_evout
    type: store_effect
    # chronicle-source: modules/app/_chronicle/sandbox.uproc sb_evout
    decision: {hex: ""}
  # volumes
  - name: vb_src
    type: store_source
    prefix: "/pod-specs/"
    flat: 1
    expand: "volumes[]"
    paths: "volumes.#"
    watch: "/volumes/"
  - name: vb_get
    type: store_effect
    # chronicle-source: modules/app/_chronicle/volume.uproc vb_get
    decision: {hex: ""}
    key_prefix: "/volumes/"
    flat: 1
    paths: "path"
  - name: vb_put
    type: store_effect
    # chronicle-source: modules/app/_chronicle/volume.uproc vb_put
    decision: {hex: ""}
    key_prefix: "/volume-binds/"
  - name: vb_rows
    type: store_source
    prefix: "/volume-binds/"
    rev: 1
    related: "/pod-specs/^1:."
    watch: "/pod-specs/"
  - name: vb_prune
    type: store_effect
    # chronicle-source: modules/app/_chronicle/volume.uproc vb_prune
    decision: {hex: "01050000000c000100024600000012000020000c0000003300010002010000004001000000100400000000000000400200000001000203000000400300000001000202000000401c000000410a000000310001000201000000400100000010000000000000000040020000001200004003000000100000000000000000401c00000041"}
    key_prefix: "/volume-binds/"
  # ── sandbox end ────────────────────────────────────────────────────────
  - name: nanocloud_cli
wiring:
  # ── sandbox ────────────────────────────────────────────────────────────
  - from: sb_spec.status
    to: sb_spec.changes
  - from: sb_spec.record_out
    to: sb_specd.record_in
  - from: sb_specd.result_out
    to: wl.request_in
  - from: sb_mspec.status
    to: sb_mspec.changes
  - from: sb_mspec.record_out
    to: sb_mspecd.record_in
  - from: sb_mspecd.result_out
    to: wl.request_in_6
  - from: sb_exec.status
    to: sb_exec.changes
  - from: sb_exec.record_out
    to: sb_execd.record_in
  - from: sb_execd.result_out
    to: wl.request_in_2
  - from: sb_sig.status
    to: sb_sig.changes
  - from: sb_sig.record_out
    to: sb_sigd.record_in
  - from: sb_sigd.result_out
    to: wl.request_in_3
  - from: sb_pause.status
    to: sb_pause.changes
  - from: sb_pause.record_out
    to: sb_paused.record_in
  - from: sb_paused.result_out
    to: wl.request_in_5
  - from: sb_tty.status
    to: sb_tty.changes
  - from: sb_tty.record_out
    to: sb_ttyd.record_in
  - from: sb_ttyd.result_out
    to: wl.request_in_4
  - from: wl.event_out
    to: sb_ev.request_in
  - from: sb_ev.response_out
    to: sb_evout.request_in
  - from: vb_src.status
    to: vb_src.changes
  - from: vb_src.record_out
    to: vb_get.request_in
  - from: vb_get.response_out
    to: vb_put.request_in
  - from: vb_rows.status
    to: vb_rows.changes
  - from: vb_rows.record_out
    to: vb_prune.request_in
  # ── sandbox end ────────────────────────────────────────────────────────
  - from: cli_in.args_out
    to: nanocloud_cli.args
  - from: cli_in.stdin_out
    to: nanocloud_cli.stdin
  - from: nanocloud_cli.stdout
    to: cli_out.bytes_in
  - from: nanocloud_cli.exit
    to: cli_out.exit_in
