# job-reconciler workload graph: the job_reconciler
# fmod, which watches /jobs.batch/ and /pods/, launches `completions` Pods per
# Job, tracks how many Succeeded, and writes /job-status/<ns>/<name>. Run-to-
# completion as a store transform.
target: linux
tick_us: 1000

# The self-edge below (change-sink allocator) is a deliberate 1-node cycle.
scheduler:
  accept_cycles: true

modules:
  - name: job_reconciler

# Self-edge: the reconciler's own output feeds its `changes` input, allocating a
# module-owned channel the store's namespace.change SUBSCRIBE pushes onto. The
# module never writes this output; it drains pushed events from the input.
wiring:
  - from: job_reconciler.status
    to: job_reconciler.changes
