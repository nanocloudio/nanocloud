# watch-streamer workload graph: the watch_streamer
# fmod, which watches /watch-req/ in the store and serves ?watch=true as
# long-poll — given a prefix + `since` revision it LISTs the prefix and writes
# /watch-resp/ with the entries newer than `since` (as PUT events) plus the new
# fence. The essence: a k8s watch is a pure projection of the store's revisions.
target: linux
tick_us: 1000

# The self-edge below (change-sink allocator) is a deliberate 1-node cycle.
scheduler:
  accept_cycles: true

modules:
  - name: watch_streamer

# Self-edge: watch_streamer's own output feeds its `changes` input, allocating a
# module-owned channel the store's namespace.change SUBSCRIBE pushes onto. The
# module never writes this output; it drains pushed events from the input.
wiring:
  - from: watch_streamer.status
    to: watch_streamer.changes
