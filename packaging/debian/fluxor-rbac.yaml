# rbac-gate workload graph: the rbac_gate fmod, which
# watches /authz-req/ in the store and decides allow/deny for each
# (identity, verb, resource) by resolving /rolebindings/ → /roles/, writing
# /authz-resp/. Pure authorization decision over the store.
target: linux
tick_us: 1000

# The self-edge below (change-sink allocator) is a deliberate 1-node cycle.
scheduler:
  accept_cycles: true

modules:
  - name: rbac_gate

# Self-edge: the gate's own output feeds its `changes` input, allocating a
# module-owned channel the store's namespace.change SUBSCRIBE pushes onto. The
# module never writes this output; it drains pushed events from the input.
wiring:
  - from: rbac_gate.status
    to: rbac_gate.changes
