# Kubernetes RBAC as Chronicle params (rbac_rules/rbac_grants/rbac_prune.uproc):
# the grant index /rbac-g/<id>/<scope>|<verb>|<res> the API plane probes.
# EXTRACTED from packaging/debian/fluxor-controlplane.yaml by
# scripts/extract-fixture.py (rb_) — do not edit; re-extract.
target: linux
tick_us: 1000

scheduler:
  accept_cycles: true

modules:
  - name: rb_roles
    type: store_source
    prefix: "/roles/"
    expand: "rules[]"
    hash: "."
    paths: "rules.#.verbs,rules.#.resources,rules.#.resourceNames,rules.#.apiGroups,rules.#.nonResourceURLs"
  - name: rb_roles_e
    type: store_effect
    # chronicle-source: modules/app/_chronicle/rbac_rules.uproc ro_rule
    decision: ""
    key_prefix: "/rbac-rule/"
  - name: rb_croles
    type: store_source
    prefix: "/clusterroles/"
    expand: "rules[]"
    hash: "."
    paths: "rules.#.verbs,rules.#.resources,rules.#.resourceNames,rules.#.apiGroups,rules.#.nonResourceURLs"
  - name: rb_croles_e
    type: store_effect
    # chronicle-source: modules/app/_chronicle/rbac_rules.uproc cr_rule
    decision: ""
    key_prefix: "/rbac-rule/"
  - name: rb_rules
    type: store_source
    prefix: "/rbac-rule/"
    expand: "v[]*a[]*r[]*n[]"
    paths: "v.#0,a.#1,r.#2,n.#3"
  - name: rb_rules_e
    type: store_effect
    # chronicle-source: modules/app/_chronicle/rbac_rules.uproc ru_perm
    decision: ""
    key_prefix: "/rbac-perm/"
  - name: rb_rbs
    type: store_source
    prefix: "/rolebindings/"
    expand: "subjects[]"
    hash: "."
    paths: "subjects.#.kind,subjects.#.name,subjects.#.namespace,roleRef.kind,roleRef.name"
  - name: rb_rbs_e
    type: store_effect
    # chronicle-source: modules/app/_chronicle/rbac_grants.uproc rb_row
    decision: ""
    key_prefix: "/rbac-bind/"
  - name: rb_crbs
    type: store_source
    prefix: "/clusterrolebindings/"
    expand: "subjects[]"
    hash: "."
    paths: "subjects.#.kind,subjects.#.name,subjects.#.namespace,roleRef.kind,roleRef.name"
  - name: rb_crbs_e
    type: store_effect
    # chronicle-source: modules/app/_chronicle/rbac_grants.uproc crb_row
    decision: ""
    key_prefix: "/rbac-bind/"
  - name: rb_perms
    type: store_source
    prefix: "/rbac-perm/"
    paths: "v,a,r,n"
    join: "/rbac-bind/"
    join_scoped: 2
    join_paths: "id,scope"
    watch: "/rbac-bind/"
  - name: rb_src_e
    type: store_effect
    # chronicle-source: modules/app/_chronicle/rbac_grants.uproc gr_src
    decision: ""
    key_prefix: "/rbac-src/"
  - name: rb_g_e
    type: store_effect
    # chronicle-source: modules/app/_chronicle/rbac_grants.uproc gr_g
    decision: ""
    key_prefix: "/rbac-g/"
  - name: rb_prule
    type: store_source
    prefix: "/rbac-rule/"
    paths: "src,g"
    watch: "/roles/,/clusterroles/"
  - name: rb_prule_get
    type: store_effect
    # chronicle-source: modules/app/_chronicle/rbac_prune.uproc dv_get
    decision: ""
    hash: "."
  - name: rb_prule_del
    type: store_effect
    # chronicle-source: modules/app/_chronicle/rbac_prune.uproc dv_drop
    decision: ""
    key_prefix: "/rbac-rule/"
  - name: rb_pbind
    type: store_source
    prefix: "/rbac-bind/"
    paths: "src,g"
    watch: "/rolebindings/,/clusterrolebindings/"
  - name: rb_pbind_get
    type: store_effect
    # chronicle-source: modules/app/_chronicle/rbac_prune.uproc dv_get
    decision: ""
    hash: "."
  - name: rb_pbind_del
    type: store_effect
    # chronicle-source: modules/app/_chronicle/rbac_prune.uproc dv_drop
    decision: ""
    key_prefix: "/rbac-bind/"
  - name: rb_pperm
    type: store_source
    prefix: "/rbac-perm/"
    paths: "rule"
    watch: "/rbac-rule/"
  - name: rb_pperm_chk
    type: store_effect
    # chronicle-source: modules/app/_chronicle/rbac_prune.uproc pm_chk
    decision: "01050000000c000100020400000012000020000d0000003200010002010000004001000000100000000000000000400200000012000040030000000100020300000042011e40fe000000410e000000360001000201000000400100000010020000000000000040020000000100020400000040030000000100020300000042011e40fe00000041"
  - name: rb_pperm_del
    type: store_effect
    # chronicle-source: modules/app/_chronicle/rbac_prune.uproc pm_drop
    decision: "010500000012000100020200000010940100000000000020000a0000002c000100020100000040010000001004000000000000004002000000010002fe000000021e0000004003000000410800000023000100020100000040010000001000000000000000004002000000120000400300000041"
    key_prefix: "/rbac-perm/"
  # aggregationRule as params (rbac_agg.uproc): each binding of an aggregating
  # ClusterRole mirrored as a binding of every role its selectors match.
  - name: rb_aggselsrc
    type: store_source
    prefix: "/clusterroles/"
    expand: "aggregationRule.clusterRoleSelectors[]"
    paths: "aggregationRule.clusterRoleSelectors.#"
    hash: "."
  - name: rb_aggsel
    type: store_effect
    # chronicle-source: modules/app/_chronicle/rbac_agg.uproc ag_sel
    decision: ""
    key_prefix: "/rbac-aggsel/"
  - name: rb_aggsrc
    type: store_source
    prefix: "/rbac-aggsel/"
    join: "/clusterroles/"
    hash: "."
    join_terms: "90=sel.matchExpressions[]:key,operator,values[]@metadata.labels;92=sel.matchLabels{}@metadata.labels"
    watch: "/clusterroles/"
  - name: rb_aggmap
    type: pipeline
    params:
      # chronicle-source: modules/app/_chronicle/rbac_agg.uproc ag_map
      ir_stages: ""
      stage_kinds: "0202"
  - name: rb_agg
    type: store_effect
    # chronicle-source: modules/app/_chronicle/rbac_agg.uproc ag_agg
    decision: ""
    key_prefix: "/rbac-agg/"
  - name: rb_mirrorsrc
    type: store_source
    prefix: "/rbac-bind/"
    join: "/rbac-agg/"
    join_scoped: 2
    paths: "id,scope,src,g"
    ints: "d"
    watch: "/rbac-agg/"
  - name: rb_mirror
    type: store_effect
    # chronicle-source: modules/app/_chronicle/rbac_agg.uproc ag_mirror
    decision: ""
    key_prefix: "/rbac-bind/"
  - name: rb_paggsel
    type: store_source
    prefix: "/rbac-aggsel/"
    paths: "src,g"
    watch: "/clusterroles/"
  - name: rb_paggsel_get
    type: store_effect
    # chronicle-source: modules/app/_chronicle/rbac_prune.uproc dv_get
    decision: ""
    hash: "."
  - name: rb_paggsel_del
    type: store_effect
    # chronicle-source: modules/app/_chronicle/rbac_prune.uproc dv_drop
    decision: ""
    key_prefix: "/rbac-aggsel/"
  - name: rb_pagg
    type: store_source
    prefix: "/rbac-agg/"
    paths: "src,g"
    watch: "/rbac-aggsel/"
  - name: rb_pagg_get
    type: store_effect
    # chronicle-source: modules/app/_chronicle/rbac_prune.uproc dv_get
    decision: ""
    hash: "."
  - name: rb_pagg_del
