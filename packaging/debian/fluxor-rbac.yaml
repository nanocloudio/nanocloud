    # chronicle-source: modules/app/_chronicle/rbac_prune.uproc dv_drop
    decision: ""
    key_prefix: "/rbac-agg/"
  - name: rb_paggrole
    type: store_source
    prefix: "/rbac-agg/"
    paths: "rule"
    watch: "/clusterroles/"
  - name: rb_paggrole_chk
    type: store_effect
    # chronicle-source: modules/app/_chronicle/rbac_prune.uproc pm_chk
    decision: "01050000000c000100020400000012000020000d0000003200010002010000004001000000100000000000000000400200000012000040030000000100020300000042011e40fe000000410e000000360001000201000000400100000010020000000000000040020000000100020400000040030000000100020300000042011e40fe00000041"
  - name: rb_paggrole_del
    type: store_effect
    # chronicle-source: modules/app/_chronicle/rbac_prune.uproc pm_drop
    decision: "010500000012000100020200000010940100000000000020000a0000002c000100020100000040010000001004000000000000004002000000010002fe000000021e0000004003000000410800000023000100020100000040010000001000000000000000004002000000120000400300000041"
    key_prefix: "/rbac-agg/"
  - name: rb_pmirror
    type: store_source
    prefix: "/rbac-bind/"
    paths: "agg"
    watch: "/rbac-agg/"
  - name: rb_pmirror_chk
    type: store_effect
    # chronicle-source: modules/app/_chronicle/rbac_prune.uproc pm_chk
    decision: "01050000000c000100020400000012000020000d0000003200010002010000004001000000100000000000000000400200000012000040030000000100020300000042011e40fe000000410e000000360001000201000000400100000010020000000000000040020000000100020400000040030000000100020300000042011e40fe00000041"
  - name: rb_pmirror_del
