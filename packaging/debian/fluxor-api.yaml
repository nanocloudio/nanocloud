# api-responder workload graph: the api_responder fmod,
# which serves API requests over the store request/response seam — api_ingress
# writes /api-req/<id>, this module handles the
# op and writes /api-resp/<id>. The minimal proof that an API endpoint is a pure
# store transform served by a fluxor module.
target: linux
tick_us: 1000

# The self-edge below (change-sink allocator) is a deliberate 1-node cycle.
scheduler:
  accept_cycles: true

modules:
  - name: api_responder

# Self-edge: the module's own output feeds its `changes` input, allocating a
# module-owned channel the store's namespace.change SUBSCRIBE pushes onto. The
# module never writes this output; it drains pushed events from the input.
wiring:
  - from: api_responder.status
    to: api_responder.changes
