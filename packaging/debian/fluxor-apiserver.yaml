# The apiserver graph — api_ingress terminates HTTP/1.1
# directly off the net stream and serves the k8s API as PIC, driving the full
# request pipeline (authn → rbac → admission → core) over the control-plane
# store. This is the cleartext form; the production graph adds `tls` between
# linux_net and api_ingress.
#
# Probe:
#   curl -s http://127.0.0.1:7443/healthz
#   curl -s -XPOST http://127.0.0.1:7443/api/v1/namespaces/default/configmaps \
#        -d '{"metadata":{"name":"cm1"},"key":"v1"}'

target: linux
tick_us: 1000

platform:
  net: {}

# Each responder fmod self-wires status -> changes (a 1-node cycle) to allocate
# its store-change sink channel.
scheduler:
  accept_cycles: true

modules:
  - name: api_ingress
  - name: authn
  - name: rbac_gate
  - name: api_admission
  - name: core_api
  - name: watch_streamer
  - name: api_responder

wiring:
  # The socket seam: linux_net <-> api_ingress (net_proto both ways).
  - from: linux_net.net_out
    to: api_ingress.net_in
  - from: api_ingress.net_out
    to: linux_net.net_in

  # Each responder's store-change sink (self-edge allocation).
  - from: authn.status
    to: authn.changes
  - from: rbac_gate.status
    to: rbac_gate.changes
  - from: api_admission.status
    to: api_admission.changes
  - from: core_api.status
    to: core_api.changes
  - from: watch_streamer.status
    to: watch_streamer.changes
  - from: api_responder.status
    to: api_responder.changes
