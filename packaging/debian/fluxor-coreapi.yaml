# core-api workload graph: the core_api fmod, which
# watches /core-req/ in the store and serves get/list/create/update/delete on
# objects keyed at /<resource>/<ns>/<name>, writing /core-resp/. The essence: a
# k8s API handler is a pure transform — request in, store read/CAS-write, out.
target: linux
tick_us: 1000

# The self-edge below (change-sink allocator) is a deliberate 1-node cycle.
scheduler:
  accept_cycles: true

modules:
  - name: core_api

# Self-edge: the module's own output feeds its `changes` input, allocating a
# module-owned channel the store's namespace.change SUBSCRIBE pushes onto. The
# module never writes this output; it drains pushed events from the input.
wiring:
  - from: core_api.status
    to: core_api.changes
