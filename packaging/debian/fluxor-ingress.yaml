# API ingress over a socket — the graph that makes the control-plane store
# single-writer.
#
# The API fmods are reached over a request/response seam in the store
# (`/<lane>-req/<id>` → `/<lane>-resp/<id>`). The caller lives inside the
# graph, because the fluxor store is single-writer by design (no flock, no
# multi-process WAL): `linux_net` terminates a TCP socket,
# `api_ingress` translates each line into the store seam, and `api_responder`
# answers it. Every store write now happens in one process, under the runtime's
# single writer. The front becomes a socket client that writes nothing.
#
# This is the minimal proving graph (one responder lane). The full control plane
# is `fluxor-controlplane.yaml`, which composes the same ingress in front of all
# six lanes.
#
# Probe:
#   printf 'api\thealthz\n' | nc 127.0.0.1 7443

target: linux
tick_us: 1000

# Injects the `linux_net` built-in (host TCP via libc sockets).
platform:
  net: {}

# api_responder self-wires status -> changes (a 1-node cycle) to allocate its
# store-change sink channel.
scheduler:
  accept_cycles: true

modules:
  - name: api_ingress
  - name: api_responder

wiring:
  # The socket seam: linux_net <-> api_ingress (net_proto both ways).
  - from: linux_net.net_out
    to: api_ingress.net_in
  - from: api_ingress.net_out
    to: linux_net.net_in

  # The responder's store-change sink (self-edge allocation).
  - from: api_responder.status
    to: api_responder.changes
