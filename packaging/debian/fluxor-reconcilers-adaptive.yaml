# Adaptive-tick reconciler plane — the controller-manager
# equivalent: the store-driven workload reconcilers as Chronicle chains on
# ONE relaxable domain. This is the realistic unit that benefits from adaptive
# cadence, as opposed to the apiserver front door (linux_net/tls/http),
# which is socket-driven and stays hot — see fluxor-controlplane.yaml.
#
# Every engine and connector here declares timer_class = "agnostic" (a pure
# store transform,
# cadence-independent), so the whole group clears the mechanism-(b) attestation
# gate in `validate_adaptive_tick`. The node/kubelet liveness modules
# (pod_lifecycle and the probe chain, once modules) were timer_class = "tick_counted" — they count
# ticks as time for probe periods, so they are DELIBERATELY excluded: fluxor's
# build gate would reject this graph outright if one were added here (proven by
# the negative control fluxor-reconcilers-adaptive-bad.yaml).
#
# Domain `main` enables adaptive tick:
#   adaptive_flags = 3 = IDLE (bit 0) | CADENCE (bit 1)
#   tick_min_us = 1000    hard floor — the responsive base tick, never crossed
#   tick_max_us = 50000   idle backstop — the pacer walks up to here when the
#                         plane has no pending store change; any SUBSCRIBE push
#                         latches an event wake that snaps back to the floor.
# Net: an idle controller-manager parks ~20x/s instead of ~1000x/s, with no
# added latency on real reconcile work.
target: linux
tick_us: 1000

# Every reconciler self-wires status -> changes (a 1-node cycle) to allocate its
# store-change sink channel.
scheduler:
  accept_cycles: true

execution:
  domains:
    - name: main
      cores: [0]
      adaptive_flags: 3
      tick_min_us: 1000
      tick_max_us: 50000

modules:
  # The scheduler is PARAMS (scheduler.uproc) over the source's pick
  # (store_source `sched`, _shared/sched.rs): each pending Pod judged against
  # the ready nodes as upstream's default profile judges it — cordon,
  # nodeSelector and node affinity, taints and tolerations, requests within
  # allocatable, pod (anti-)affinity, topology spread — and scored; position
  # 0 (bound this pass) to the first placeable Pod of the highest priority;
  # a Pod nothing fits gets PodScheduled=False/Unschedulable and a
  # FailedScheduling event; the first unplaceable Pod of the highest
  # priority may preempt lower-priority Pods (PodDisruptionBudgets honoured
  # as far as they can be). One bind per pass, the load measured from the
  # Pods themselves at pick time. Reads /ready-nodes/ from the DaemonSet
  # chain's projection.
  - name: sc_unbound
    type: store_scan
    prefix: "/pods/"
    where: "spec.nodeName="
    count: 1
    join: "/ready-nodes/"
    paths: "metadata.uid"
    sched: "/nodes/:/pods/:/poddisruptionbudgets/"
    sched_preempt: 1
    watch: "/ready-nodes/,/nodes/,/poddisruptionbudgets/"
  - name: sc_victim
    type: store_stamped
    # chronicle-source: modules/app/_chronicle/scheduler.uproc vict_p
    decision: {hex: ""}
    key_prefix: "/"
    # A preempted Pod leaves its tomb: its node learns of the delete.
    tomb: "/~tomb"
  - name: sc_patch
    type: store_big
    # chronicle-source: modules/app/_chronicle/scheduler.uproc bind_p
    decision: {hex: ""}
    key_prefix: "/pods/"
  - name: sc_events
    type: store_effect
    # chronicle-source: modules/app/_chronicle/scheduler.uproc record_p
    decision: {hex: ""}
    key_prefix: "/events/"
  # the ready-nodes projection (the DaemonSet chain's rdy decision)
  - name: ds_nodes
    type: store_source
    prefix: "/nodes/"
    paths: "status.ready"
  - name: ds_mark
    type: store_effect
    # chronicle-source: modules/app/_chronicle/daemonset.uproc rdy
    decision: {hex: "01050000001000010002040000001204007472756520000b00000030000100020100000040010000001003000000000000004002000000010002030000004003000000120100314004000000410b0000002f000100020100000040010000001004000000000000004002000000010002030000004003000000120000400400000041"}
    key_prefix: "/ready-nodes/"
    domain: main

  - name: dp_source
    type: store_scan
    prefix: "/deployments.apps/"
    paths: "spec!hash,spec.replicas,metadata.uid"
    hash: "spec.template"
  - name: dp_current
    type: store_stamped
    # chronicle-source: modules/app/_chronicle/deployment.uproc rd
    decision: {hex: ""}
    key_prefix: "/replicasets.apps/"
    paths: "metadata.labels.pod-template-hash,spec!hash"
  - name: dp_history
    type: store_big
    # chronicle-source: modules/app/_chronicle/deployment.uproc arch
    decision: {hex: ""}
    key_prefix: "/controllerrevisions.apps/"
  - name: dp_apply
    type: store_big
    # Objects this controller creates get their identity as the API's do:
    # a uid and creationTimestamp stamped when created, kept when rewritten.
    stamp: 1
    schema: "create=metadata.uid:uuid,metadata.creationTimestamp:now;keep=metadata.uid,metadata.creationTimestamp"
    # chronicle-source: modules/app/_chronicle/deployment.uproc wr
    decision: {hex: ""}
    key_prefix: "/replicasets.apps/"
  - name: dp_events
    type: store_effect
    # chronicle-source: modules/app/_chronicle/deployment.uproc rec
    decision: {hex: ""}
    key_prefix: "/events/"
  # ReplicaSet convergence is PARAMS, not a module: the nine nodes below are
  # Chronicle's generic engines carrying params compiled from
  # `modules/app/_chronicle/replicaset.uproc`. Names are `rs_`-prefixed because
  # this graph holds twenty-five modules and `act`/`record` are not distinctive.
  #
  # The params are BAKED because a deb ships no compiler; each carries a
  # provenance marker that `scripts/chronicle-param-drift-e2e.sh` recompiles and
  # compares. A stale decision does not error — it decides something else.
  - name: rs_source
    type: store_scan
    prefix: "/replicasets.apps/"
    paths: "metadata.labels.pod-template-hash,metadata.uid"
    expand: "spec.replicas"
    # One past the desired count, so the first surplus ordinal is probed and
    # collected on the same pass that scales down.
    expand_tail: 4
    # ...and past the highest EXISTING child, whatever the count: a surplus far
    # above the count (scale 10 -> 1) is otherwise never probed, and orphaned.
    expand_over: "/pods/"
    # Watch the children too: a rolled Pod is DELETED and recreated on a later
    # pass, and without this nothing would wake the ReplicaSet to do it.
    watch: "/pods/"
  # Stage 1 — the PREDECESSOR, so a rollout proceeds strictly in ordinal order.
  # Roll ordinal i only when i is stale and i-1 is already fresh: that is what
  # maxUnavailable = 1 means, with no budget to spend.
  - name: rs_prevget
    type: store_stamped
    # chronicle-source: modules/app/_chronicle/replicaset.uproc prev
    decision: {hex: ""}
    key_prefix: "/pods/"
    paths: "metadata.labels.pod-template-hash"
  # Stage 2 — THIS ordinal, carrying the predecessor verdict.
  - name: rs_selfget
    type: store_stamped
    # chronicle-source: modules/app/_chronicle/replicaset.uproc ask
    decision: {hex: ""}
    key_prefix: "/pods/"
    paths: "metadata.labels.pod-template-hash"
  # Stage 3 — create, delete, roll, or nothing.
  - name: rs_apply
    type: store_big
    # Objects this controller creates get their identity as the API's do:
    # a uid and creationTimestamp stamped when created, kept when rewritten.
    stamp: 1
    schema: "create=metadata.uid:uuid,metadata.creationTimestamp:now;keep=metadata.uid,metadata.creationTimestamp"
    # chronicle-source: modules/app/_chronicle/replicaset.uproc act
    decision: {hex: ""}
    key_prefix: "/pods/"
  # Stage 4 — record what stage 3 did. The write's own reply carries the tag
  # saying which branch fired, so the event is decided from the effect that
  # produced it rather than guessed from a second read of the store.
  - name: rs_events
    type: store_effect
    # chronicle-source: modules/app/_chronicle/replicaset.uproc rec
    decision: {hex: ""}
    key_prefix: "/events/"
  # DaemonSet is PARAMS, not a module. Thirteen ds_* nodes carry the readiness
  # projection (/nodes/ -> /ready-nodes/),
  # the placement (DaemonSets JOIN ready Nodes -> create-if-absent, node-pinned),
  # and the prune (a DaemonSet Pod whose Node is no longer ready). The cross
  # product is the source's — `join` — as the count was for ReplicaSet.
  # Params compiled from modules/app/_chronicle/daemonset.uproc.
  - name: ds_source
    type: store_scan
    # A DaemonSet carries its users' template: read whole (store_scan). Its
    # digest is the Pods' controller-revision-hash; the template itself is
    # SPLICED by ds_apply from the stored DaemonSet, never carried.
    hash: "spec.template"
    prefix: "/daemonsets.apps/"
    paths: "metadata.uid"
    join: "/ready-nodes/"
    watch: "/ready-nodes/,/pods/"
  - name: ds_exists
    type: store_effect
    # chronicle-source: modules/app/_chronicle/daemonset.uproc prb
    decision: {hex: "00230000006e0001000201000000400100000010020000000000000040020000000100021800000040030000000100021800000001000203000000010002150000000100021c0000000100021d000000010002040000000100021b0000000100021a00000042081e1f20222324252740fe00000041"}
    key_prefix: "/pods/"
  - name: ds_apply
    type: store_big
    # Objects this controller creates get their identity as the API's do:
    # a uid and creationTimestamp stamped when created, kept when rewritten.
    stamp: 1
    schema: "create=metadata.uid:uuid,metadata.creationTimestamp:now;keep=metadata.uid,metadata.creationTimestamp"
    # chronicle-source: modules/app/_chronicle/daemonset.uproc mk
    decision: {hex: ""}
    key_prefix: "/pods/"
  - name: ds_pods
    type: store_scan
    prefix: "/pods/"
    paths: "metadata.ownerReferences.0.kind,spec.nodeName"
    watch: "/ready-nodes/"
  - name: ds_known
    type: store_effect
    # chronicle-source: modules/app/_chronicle/daemonset.uproc ask_p
    decision: {hex: ""}
    key_prefix: "/ready-nodes/"
  - name: ds_collect
    type: store_effect
    # chronicle-source: modules/app/_chronicle/daemonset.uproc prn
    decision: {hex: "010500000012000100020200000010940100000000000020000a0000002c000100020100000040010000001004000000000000004002000000010002fe000000021e0000004003000000410800000023000100020100000040010000001000000000000000004002000000120000400300000041"}
    key_prefix: "/pods/"
  # StatefulSet is PARAMS: the ReplicaSet chain with the gate asked of the
  # NEIGHBOUR that matters — the predecessor's readiness in range, the
  # successor's absence for a surplus — so bring-up is ordered and teardown is
  # highest-first without a budget. Params from modules/app/_chronicle/statefulset.uproc.
  - name: st_source
    type: store_scan
    prefix: "/statefulsets.apps/"
    paths: "spec.replicas,metadata.uid"
    expand: "spec.replicas"
    expand_tail: 2
    expand_over: "/pods/"
    watch: "/pods/"
  - name: st_nbget
    type: store_stamped
    # chronicle-source: modules/app/_chronicle/statefulset.uproc nb
    decision: {hex: ""}
    key_prefix: "/pods/"
    # the neighbour's readiness: its Ready condition
    paths: "status.conditions[type=Ready].status"
  - name: st_selfget
    type: store_stamped
    # chronicle-source: modules/app/_chronicle/statefulset.uproc ask
    decision: {hex: ""}
    key_prefix: "/pods/"
  - name: st_apply
    type: store_big
    # Objects this controller creates get their identity as the API's do:
    # a uid and creationTimestamp stamped when created, kept when rewritten.
    stamp: 1
    schema: "create=metadata.uid:uuid,metadata.creationTimestamp:now;keep=metadata.uid,metadata.creationTimestamp"
    # chronicle-source: modules/app/_chronicle/statefulset.uproc act
    decision: {hex: ""}
    key_prefix: "/pods/"
  # Job is PARAMS (job.uproc, job_launch.uproc, job_status.uproc), to
  # Kubernetes' semantics: parallelism, completions (NonIndexed and
  # Indexed), backoffLimit with a backoff of 10 s doubling to 6 min,
  # activeDeadlineSeconds, ttlSecondsAfterFinished, suspend — and the
  # status `kubectl get jobs` and `kubectl wait --for=condition=complete`
  # read. A Job's state lives beside it, flat, at /job-ctl/<ns>/<job>: its
  # Pods counted (active, succeeded, failed, ready), how many to start,
  # the terminal state, and the MOMENTS it started, finished, last failed
  # and was suspended — read back as deadlines on the kernel timer.
  #   seed    a Job with no state -> its /job-ctl/ record
  #   ctl     /job-ctl/ + its Job (related) -> ONE weighted COUNT of its
  #           Pods -> W1 (the four counts unpacked, how many to start,
  #           terminal state, backoff, the TTL's delete) -> W2 (startTime,
  #           suspend/resume)
  #   status  /job-ctl/ -> the Job's .status
  #   launch  NonIndexed <job>-<i>; Indexed via /job-idx/<ns>/<job>/<i> ->
  #           <job>-<i>-<attempt>. Names and the uid only: the writers
  #           SPLICE the template from the stored Job, whatever its size
  # The readers of Jobs and of Pods are heap builds (store_scan,
  # store_stamped): a Job carries its users' template, and its Pods do.
  #   kill    a suspended or finished Job's active Pods
  - name: jb_jobs
    type: store_scan
    prefix: "/jobs.batch/"
    paths: "metadata.uid"
    unless: "/job-ctl/"
    watch: "/job-ctl/"
  - name: jb_seed
    type: store_effect
    # chronicle-source: modules/app/_chronicle/job.uproc seed_p
    decision: {hex: "01050000000c000100020400000012000021001000000049000100020100000040010000001008000000000000004002000000010002030000004003000000120200753d40040000000100020400000040050000001204003b6e3d304006000000410800000023000100020100000040010000001000000000000000004002000000120000400300000041"}
    key_prefix: "/job-ctl/"
  - name: jb_ctl
    type: store_scan
    prefix: "/job-ctl/"
    flat: 1
    paths: "u,fin,sp,fc,t0,fat,tf"
    # The deadlines: started + activeDeadline, failed + backoff, finished +
    # ttl — moments read as this boot's monotonic ms, and armed.
    ints: "t0!due+dms,fat!due+bms,tf!due+xms"
    due: "t0!due+dms,fat!due+bms,tf!due+xms"
    now: 1
    related: "/jobs.batch/!json:metadata.uid,spec.parallelism,spec.parallelism#,spec.completions,spec.completions#,spec.completionMode,spec.backoffLimit,spec.backoffLimit#,spec.activeDeadlineSeconds,spec.activeDeadlineSeconds#;/jobs.batch/!json:spec.ttlSecondsAfterFinished,spec.ttlSecondsAfterFinished#,spec.suspend"
    watch: "/jobs.batch/,/pods/"
  - name: jb_count
    type: store_stamped
    # ONE walk of the namespace's Pods counts all four (active,
    # succeeded, failed, ready): each Pod weighs the sum of what it is
    # (job.uproc `tally`), and jb_w1 unpacks the sum. Heap (store_stamped):
    # a Pod past a record is read whole, never skipped.
    # chronicle-source: modules/app/_chronicle/job.uproc c0_p
    decision: {hex: ""}
    # chronicle-source: modules/app/_chronicle/job.uproc tally_p
    count_where: {hex: ""}
    key_prefix: "/"
    paths: "metadata.ownerReferences.0.uid,metadata.deletionTimestamp,status.phase,status.conditions[type=Ready].status"
  - name: jb_w1
    type: store_effect
    # chronicle-source: modules/app/_chronicle/job.uproc w1_p
    decision: {hex: ""}
    key_prefix: "/"
    wall: 2
    # The TTL's delete leaves the Job's tomb (a watch's DELETED).
    tomb: "/~tomb"
  - name: jb_w2
    type: store_effect
    # chronicle-source: modules/app/_chronicle/job.uproc w2_p
    decision: {hex: ""}
    key_prefix: "/"
    wall: 2
  - name: jb_status
    type: store_source
    prefix: "/job-ctl/"
    flat: 1
    paths: "a,s,f,r,fin,sp,t0!wjts,tf!wjts,ts!wjts,md,c,u"
    # A moment not yet sayable (the clock untrusted) is null; scan again.
    recheck: 5000
  - name: jb_stpatch
    type: store_stamped
    # chronicle-source: modules/app/_chronicle/job_status.uproc st_p
    decision: {hex: ""}
    key_prefix: "/jobs.batch/"
  - name: jb_launch
    type: store_source
    # Names and the uid only (its /job-ctl/ record's): jb_create SPLICES the
    # template from the stored Job, whatever its size.
    prefix: "/job-ctl/"
    flat: 1
    where: "md="
    paths: "fin,sp,u"
    expand: "n"
    expand_tail: 0
    expand_over: "/pods/"
  - name: jb_create
    type: store_big
    # Objects this controller creates get their identity as the API's do:
    # a uid and creationTimestamp stamped when created, kept when rewritten.
    stamp: 1
    schema: "create=metadata.uid:uuid,metadata.creationTimestamp:now;keep=metadata.uid,metadata.creationTimestamp"
    # chronicle-source: modules/app/_chronicle/job_launch.uproc launch_p
    decision: {hex: ""}
    key_prefix: "/pods/"
  - name: jb_idx
    type: store_source
    prefix: "/job-ctl/"
    flat: 1
    where: "md=Indexed"
    paths: "fin,sp,u"
    ints: "w,p"
    expand: "c"
    expand_tail: 0
    watch: "/pods/"
  - name: jb_icount
    type: store_stamped
    # ONE walk counts index i covered, its failures, the indexes below
    # it covered and the Job's active Pods (job_launch.uproc `itally`,
    # unpacked by jb_iput).
    # chronicle-source: modules/app/_chronicle/job_launch.uproc i0_p
    decision: {hex: ""}
    # chronicle-source: modules/app/_chronicle/job_launch.uproc itally_p
    count_where: {hex: ""}
    key_prefix: "/"
    paths: "metadata.ownerReferences.0.uid,metadata.deletionTimestamp,status.phase"
    ints: 'metadata.annotations."batch.kubernetes.io/job-completion-index"'
  - name: jb_iput
    type: store_effect
    # chronicle-source: modules/app/_chronicle/job_launch.uproc i3_p
    decision: {hex: ""}
    key_prefix: "/job-idx/"
  - name: jb_irec
    type: store_source
    prefix: "/job-idx/"
    flat: 1
    paths: "go,u,i,fi,j"
    ints: "cov,bi,w,i,a,p"
    related: "/job-ctl/^1!flat:u"
    watch: "/job-ctl/"
  - name: jb_icreate
    type: store_big
    stamp: 1
    schema: "create=metadata.uid:uuid,metadata.creationTimestamp:now;keep=metadata.uid,metadata.creationTimestamp"
    # chronicle-source: modules/app/_chronicle/job_launch.uproc ilaunch_p
    decision: {hex: ""}
    key_prefix: "/"
  - name: jb_kpods
    type: store_scan
    prefix: "/pods/"
    where: "metadata.ownerReferences.0.kind=Job"
    paths: "metadata.ownerReferences.0.name,status.phase,metadata.deletionTimestamp"
    watch: "/job-ctl/"
  - name: jb_kget
    type: store_effect
    # chronicle-source: modules/app/_chronicle/job_status.uproc kq_p
    decision: {hex: ""}
    key_prefix: "/"
    flat: 1
    paths: "fin,sp"
  - name: jb_kill
    type: store_stamped
    # Heap (store_stamped): a Pod past a record is read whole for its tomb,
    # whose index tells its node it is gone.
    # chronicle-source: modules/app/_chronicle/job_status.uproc kd_p
    decision: {hex: ""}
    key_prefix: "/"
    tomb: "/~tomb"
  # HPA is PARAMS: three reads and one arithmetic decision — desired =
  # ceil(current * cpu / target), clamped to [min, max] — ending in a PATCH of
  # spec.replicas on the target Deployment. Woken by the metric, never by its
  # own write. Params from modules/app/_chronicle/hpa.uproc.
  - name: hp_source
    type: store_source
    prefix: "/hpa/"
    paths: "spec.scaleTargetRef.name"
    ints: "spec.minReplicas,spec.maxReplicas,spec.targetCPUUtilizationPercentage"
    watch: "/hpa-metrics/"
    now: 1
  - name: hp_depget
    type: store_effect
    # chronicle-source: modules/app/_chronicle/hpa.uproc rd
    decision: {hex: ""}
    key_prefix: "/deployments.apps/"
    ints: "spec.replicas"
  - name: hp_metget
    type: store_effect
    # chronicle-source: modules/app/_chronicle/hpa.uproc mt
    decision: {hex: ""}
    key_prefix: "/hpa-metrics/"
    flat: 1
    ints: "cpu"
  - name: hp_rec
    type: decision
    params:
      # chronicle-source: modules/app/_chronicle/hpa.uproc rc
      decision: {hex: ""}
  - name: hp_stab
    type: aggregation
    params:
      # agg-source: scripts/hpa-agg.sh 300000 60000
      ir_def: {hex: "e09304000000000000000000000000004000000060ea000000000000000000000000000008000500010100000014080005000102000000143d0005000101000000120100000005000202000000010000001202000000050002020000000200000012030000000500020300000002000000120400000013020308000500010300000014030800050001020000001401"}
  - name: hp_patch
    type: store_effect
    # chronicle-source: modules/app/_chronicle/hpa.uproc ap
    decision: {hex: ""}
    key_prefix: "/deployments.apps/"
  # The ownerRef cascade is PARAMS, not a module. These thirteen nodes are two
  # sweeps — the SAME two decisions over different
  # prefixes, nothing recompiled — and the Events count-cap, a fold over a set
  # expressed as a per-record decision because store_source's `count` mode
  # stamps every record with its position and the total.
  #
  #   pods        <- replicasets   gc_pod_*
  #   replicasets <- deployments   gc_rs_*
  #   /events/ capped at 200       gc_ev_*
  #
  # Params are BAKED (a deb ships no compiler) and carry provenance markers
  # that `scripts/chronicle-param-drift-e2e.sh` recompiles and compares.
  - name: gc_pod_source
    type: store_source
    prefix: "/pods/"
    paths: "metadata.ownerReferences.0.name,metadata.ownerReferences.0.kind"
    # Only what a ReplicaSet owns is this sweep's to judge (gc.uproc `probe`).
    label: "ReplicaSet"
    # The cascade: when an owner is collected its children are orphans NOW,
    # and nothing under the children's prefix changed to say so.
    watch: "/replicasets.apps/"
  - name: gc_pod_owner
    type: store_effect
    # chronicle-source: modules/app/_chronicle/gc.uproc ask
    decision: {hex: ""}
    key_prefix: "/replicasets.apps/"
  - name: gc_pod_collect
    type: store_effect
    # chronicle-source: modules/app/_chronicle/gc.uproc act
    decision: {hex: ""}
    key_prefix: "/pods/"
  - name: gc_rs_source
    type: store_source
    prefix: "/replicasets.apps/"
    paths: "metadata.ownerReferences.0.name,metadata.ownerReferences.0.kind"
    # Only what a Deployment owns is this sweep's to judge (gc.uproc `probe`).
    label: "Deployment"
    # The cascade: when an owner is collected its children are orphans NOW,
    # and nothing under the children's prefix changed to say so.
    watch: "/deployments.apps/"
  - name: gc_rs_owner
    type: store_effect
    # chronicle-source: modules/app/_chronicle/gc.uproc ask
    decision: {hex: ""}
    key_prefix: "/deployments.apps/"
  - name: gc_rs_collect
    type: store_effect
    # chronicle-source: modules/app/_chronicle/gc.uproc act
    decision: {hex: ""}
    key_prefix: "/replicasets.apps/"
  - name: gc_ev_source
    type: store_source
    prefix: "/events/"
    count: 1
  - name: gc_ev_collect
    type: store_effect
    # chronicle-source: modules/app/_chronicle/gc.uproc evcap
    decision: {hex: "01080000001a000100021400000010c800000000000000500100021600000022000900000027000100020100000040010000001004000000000000004002000000010002030000004003000000410800000023000100020100000040010000001000000000000000004002000000120000400300000041"}
    key_prefix: "/events/"
  # Namespace teardown is PARAMS: a JOIN scoped to the namespace across every
  # namespaced tree — one record per object it contains — DELETEd while it is
  # Terminating; then count_children over the same trees, and at zero the
  # namespace record goes. Params from modules/app/_chronicle/namespace.uproc.
  - name: ns_objects
    type: store_source
    prefix: "/namespaces/"
    paths: "status.phase"
    join: "/pods/,/services/,/endpoints/,/configmaps/,/secrets/,/serviceaccounts/,/pvcs/,/deployments.apps/,/replicasets.apps/,/daemonsets.apps/,/statefulsets.apps/,/jobs.batch/,/hpa/,/networkpolicies/"
    join_scoped: 1
  - name: ns_collect
    type: store_effect
    # chronicle-source: modules/app/_chronicle/namespace.uproc sw
    decision: {hex: "0105000000170001000204000000120b005465726d696e6174696e6720000900000027000100020100000040010000001004000000000000004002000000010002180000004003000000410800000023000100020100000040010000001000000000000000004002000000120000400300000041"}
