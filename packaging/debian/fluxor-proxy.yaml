# Service proxying as Chronicle params (proxy.uproc) over the net.policy
# surface. The chains keep one row per (Service, ready backend) under
# /np-rows/proxy/, a named targetPort resolved against that backend's Pod; `net_apply` encodes them as the `proxy` table and the
# platform realizes it — nftables DNAT on Linux, the packet filter on bare
# metal — with the outcome at /np-status/proxy (`enforced=1|0;rules=…`).
target: linux
tick_us: 1000

scheduler:
  accept_cycles: true

modules:
  - name: px_src
    type: store_source
    prefix: "/services/"
    paths: "spec.clusterIP,spec.ports[].port,spec.ports[].targetPort,spec.ports[].protocol,spec.ports[].nodePort,status.loadBalancer.ingress.0.ip"
    join: "/endpointslices/"
    join_scoped: 1
    join_paths: "."
    watch: "/endpointslices/"
  # Each backend's Pod, for its named ports (a targetPort may name one).
  - name: px_pod
    type: store_stamped
    # chronicle-source: modules/app/_chronicle/proxy.uproc px_ask
    decision: {hex: ""}
    key_prefix: "/pods/"
    paths: "spec.containers.0.ports[].name,spec.containers.0.ports[].containerPort"
  - name: px_rows
    type: store_effect
    # chronicle-source: modules/app/_chronicle/proxy.uproc px_row
    decision: {hex: ""}
    key_prefix: "/np-rows/proxy/"
  - name: px_rowsrc
    type: store_source
    rev: 1
    prefix: "/np-rows/proxy/"
    flat: 1
    paths: "vip,backend"
    related: "/services/^1!json:spec.clusterIP;/endpointslices/:."
    watch: "/services/,/endpointslices/"
  - name: px_prune
    type: store_effect
    # chronicle-source: modules/app/_chronicle/proxy.uproc px_prune
    decision: {hex: ""}
    key_prefix: "/np-rows/proxy/"
  # NodePort and LoadBalancer: each Service's node ports and its
  # load-balancer address, claimed in the store (the control plane's; a
  # render adds `lb_pool` from NANOCLOUD_LB_POOL).
  - name: px_alloc
    type: svc_alloc
    node_ports: "30000-32767"
  # The node's enforcement (a render adds `node_address`: what its node
  # ports are DNATed at).
  - name: px_apply
    type: net_apply
    prefix: "/np-rows/proxy/"
    table: "proxy"
    status_key: "/np-status/proxy"

wiring:
  - from: px_src.status
    to: px_src.changes
  - from: px_src.record_out
    to: px_pod.request_in
  - from: px_pod.response_out
    to: px_rows.request_in
  - from: px_rowsrc.status
    to: px_rowsrc.changes
  - from: px_rowsrc.record_out
    to: px_prune.request_in
  - from: px_apply.status
    to: px_apply.changes
  - from: px_alloc.status
    to: px_alloc.changes
