# Service proxying as Chronicle params (proxy.uproc) over the net.policy
# surface. The chains keep one row per (Service, ready backend) under
# /np-rows/proxy/, a named targetPort resolved against that backend's Pod,
# and one per container with host ports under /np-rows/hostport/;
# `net_apply` encodes both as the `proxy` table and the
# platform realizes it — nftables DNAT on Linux, the packet filter on bare
# metal — with the outcome at /np-status/proxy (`enforced=1|0;rules=…`).
target: linux
tick_us: 1000

scheduler:
  accept_cycles: true

modules:
  - name: px_src
    type: store_source
    prefix: "/services/"
    paths: "spec.clusterIP,spec.ports[].port,spec.ports[].targetPort,spec.ports[].protocol,spec.ports[].nodePort,status.loadBalancer.ingress.0.ip,spec.externalTrafficPolicy,spec.internalTrafficPolicy"
    join: "/endpointslices/"
    join_scoped: 1
    join_paths: "."
    watch: "/endpointslices/"
  # Each backend's Pod, for its named ports (a targetPort may name one) and
  # its node (a `Local` traffic policy keeps to the backends on a node).
  - name: px_pod
    type: store_stamped
    # chronicle-source: modules/app/_chronicle/proxy.uproc px_ask
    decision: {hex: ""}
    key_prefix: "/pods/"
    paths: "spec.containers.0.ports[].name,spec.containers.0.ports[].containerPort,spec.nodeName"
  - name: px_rows
    type: store_effect
    # chronicle-source: modules/app/_chronicle/proxy.uproc px_row
    decision: {hex: ""}
    key_prefix: "/np-rows/proxy/"
  - name: px_rowsrc
    type: store_source
    rev: 1
    prefix: "/np-rows/proxy/"
    flat: 1
    paths: "vip,backend"
    related: "/services/^1!json:spec.clusterIP;/endpointslices/:."
    watch: "/services/,/endpointslices/"
  - name: px_prune
    type: store_effect
    # chronicle-source: modules/app/_chronicle/proxy.uproc px_prune
    decision: {hex: ""}
    key_prefix: "/np-rows/proxy/"
  # hostPort: each container's ports that name one, as a row for the node
  # its Pod runs on (pruned with the Pod).
  - name: hp_src
    type: store_source
    prefix: "/pods/"
    expand: "spec.containers[]"
    paths: "status.podIP,spec.nodeName,spec.containers.#.ports[].hostPort,spec.containers.#.ports[].containerPort,spec.containers.#.ports[].protocol,spec.containers.#.ports[].hostIP"
  - name: hp_rows
    type: store_effect
    # chronicle-source: modules/app/_chronicle/proxy.uproc px_hostport
    decision: {hex: ""}
    key_prefix: "/np-rows/hostport/"
  - name: hp_rowsrc
    type: store_source
    rev: 1
    prefix: "/np-rows/hostport/"
    flat: 1
    paths: "backend"
    related: "/pods/^1!json:status.podIP"
    watch: "/pods/"
  - name: hp_prune
    type: store_effect
    # chronicle-source: modules/app/_chronicle/proxy.uproc px_hp_prune
    decision: {hex: "01060000001000010002460000000100020400000021000c0000003300010002010000004001000000100400000000000000400200000001000203000000400300000001000202000000401c000000410a000000310001000201000000400100000010000000000000000040020000001200004003000000100000000000000000401c00000041"}
    key_prefix: "/np-rows/hostport/"
  # NodePort and LoadBalancer: each Service's node ports and its
  # load-balancer address, claimed in the store (the control plane's; a
  # render adds `lb_pool` from NANOCLOUD_LB_POOL).
  - name: px_alloc
    type: svc_alloc
    node_ports: "30000-32767"
  # The node's enforcement (a render adds `node_address`: what its node
  # and host ports are DNATed at, and `node_name`: whose backends are its
  # own), over the Services' rows and the host ports'.
  - name: px_apply
    type: net_apply
    prefix: "/np-rows/proxy/,/np-rows/hostport/"
    table: "proxy"
    status_key: "/np-status/proxy"

wiring:
  - from: px_src.record_out
    to: px_pod.request_in
  - from: px_pod.response_out
    to: px_rows.request_in
  - from: px_rowsrc.record_out
    to: px_prune.request_in
  - from: hp_src.record_out
    to: hp_rows.request_in
  - from: hp_rowsrc.record_out
    to: hp_prune.request_in
