# namespace-gc graph: the namespace teardown chain as Chronicle params — a
# terminating Namespace's objects are collected, then its finalizer removed.
#
# The nodes and params are the SAME ones fluxor-controlplane.yaml ships; this
# graph is that chain on its own so an E2E can drive it directly.
target: linux
tick_us: 1000

scheduler:
  accept_cycles: true

modules:
  - name: ns_objects
    type: store_source
    prefix: "/namespaces/"
    paths: "status.phase"
    join: "/pods/,/services/,/endpoints/,/configmaps/,/secrets/,/serviceaccounts/,/pvcs/,/deployments.apps/,/replicasets.apps/,/daemonsets.apps/,/statefulsets.apps/,/jobs.batch/,/hpa/,/networkpolicies/"
    join_scoped: 1
  - name: ns_collect
    type: store_effect
    # chronicle-source: modules/app/_chronicle/namespace.uproc sw
    decision: {hex: "0105000000170001000204000000120b005465726d696e6174696e6720000900000027000100020100000040010000001004000000000000004002000000010002180000004003000000410800000023000100020100000040010000001000000000000000004002000000120000400300000041"}
  - name: ns_source
    type: store_source
    prefix: "/namespaces/"
    paths: "status.phase"
    count_children: "/pods/,/services/,/endpoints/,/configmaps/,/secrets/,/serviceaccounts/,/pvcs/,/deployments.apps/,/replicasets.apps/,/daemonsets.apps/,/statefulsets.apps/,/jobs.batch/,/hpa/,/networkpolicies/"
    child_sep: "/"
    watch: "/pods/,/services/,/endpoints/,/configmaps/,/secrets/,/serviceaccounts/,/pvcs/,/deployments.apps/,/replicasets.apps/,/daemonsets.apps/,/statefulsets.apps/,/jobs.batch/,/hpa/,/networkpolicies/"
  - name: ns_remove
    type: store_effect
    # chronicle-source: modules/app/_chronicle/namespace.uproc fin
    decision: {hex: "010a000000290001000204000000120b005465726d696e6174696e6720010002160000001000000000000000002030000900000027000100020100000040010000001004000000000000004002000000010002030000004003000000410800000023000100020100000040010000001000000000000000004002000000120000400300000041"}
    key_prefix: "/namespaces/"
  # The node plane is NOT here: it is a node's (the kubelet's chains and
  # its image pull, which nanocloud-graph.sh splices into a worker's graph,
  # and into the control plane's when it runs Pods too).
  # The scheduler is PARAMS: the FIRST unbound Pod (where spec.nodeName=,
  # count index 0) JOIN /ready-nodes/ picked by the fewest Pods bound to it —
  # measured from the Pods themselves at pick time — PATCHes spec.nodeName;
  # one bind per pass, the spread emergent. Then the Scheduled event. Reads
  # /ready-nodes/ from the DaemonSet chain's projection. Params from
  # modules/app/_chronicle/scheduler.uproc.

wiring:
  - from: ns_objects.record_out
    to: ns_collect.request_in
  - from: ns_source.record_out
    to: ns_remove.request_in