# statefulset-reconciler workload graph: the
# statefulset_reconciler fmod, which watches /statefulsets.apps/ and /pods/ and
# brings Pods /pods/<ns>/<sts>-<i> up one at a time in ordinal order (each gated
# on its predecessor being ready), scaling down highest-first. Ordered,
# stable-identity Pods as a store transform.
target: linux
tick_us: 1000

# The self-edge below (change-sink allocator) is a deliberate 1-node cycle.
scheduler:
  accept_cycles: true

modules:
  - name: statefulset_reconciler

# Self-edge: the reconciler's own output feeds its `changes` input, allocating a
# module-owned channel the store's namespace.change SUBSCRIBE pushes onto. The
# module never writes this output; it drains pushed events from the input.
wiring:
  - from: statefulset_reconciler.status
    to: statefulset_reconciler.changes
