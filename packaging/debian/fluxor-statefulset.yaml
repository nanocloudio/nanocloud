# statefulset graph: the StatefulSet chain as Chronicle params — ordinals
# created strictly in order, each waiting on its predecessor.
#
# The nodes and params are the SAME ones fluxor-controlplane.yaml ships; this
# graph is that chain on its own so an E2E can drive it directly.
target: linux
tick_us: 1000

# Every self-edge below is a source's change sink — a deliberate 1-node cycle.
scheduler:
  accept_cycles: true

modules:
  - name: st_source
    type: store_scan
    prefix: "/statefulsets.apps/"
    paths: "spec.replicas,metadata.uid"
    expand: "spec.replicas"
    expand_tail: 2
    expand_over: "/pods/"
    watch: "/pods/"
  - name: st_nbget
    type: store_stamped
    # chronicle-source: modules/app/_chronicle/statefulset.uproc nb
    decision: {hex: ""}
    key_prefix: "/pods/"
    # the neighbour's readiness: its Ready condition
    paths: "status.conditions[type=Ready].status"
  - name: st_selfget
    type: store_stamped
    # chronicle-source: modules/app/_chronicle/statefulset.uproc ask
    decision: {hex: ""}
    key_prefix: "/pods/"
  - name: st_apply
    type: store_big
    # Objects this controller creates get their identity as the API's do:
    # a uid and creationTimestamp stamped when created, kept when rewritten.
    stamp: 1
    schema: "create=metadata.uid:uuid,metadata.creationTimestamp:now;keep=metadata.uid,metadata.creationTimestamp"
    # chronicle-source: modules/app/_chronicle/statefulset.uproc act
    decision: {hex: ""}
    key_prefix: "/pods/"
  # Job is PARAMS: launch once (expanded by spec.completions, create-if-absent,
  # never recreated), the per-pod done fact (/job-done/), and the status —
  # "how many of mine succeeded" is a per-object fold the source performs
  # (count_children) and a decision states. Params from modules/app/_chronicle/job.uproc.

wiring:
  - from: st_source.status
    to: st_source.changes
  - from: st_source.record_out
    to: st_nbget.request_in
  - from: st_nbget.response_out
    to: st_selfget.request_in
  - from: st_selfget.response_out
    to: st_apply.request_in