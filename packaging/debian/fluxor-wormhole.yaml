# The Wormhole projection (rfc_lb_vip §6.1): Services and their endpoint
# slices declared to Wormhole as its own v1 records. Spliced into the control
# plane's Service plane beside the endpoints chain (nanocloud-graph.sh).
#
#   wh_ chains (wormhole.plan)   /services/ -> /wh-intent/<ns>/<svc>
#                                /endpointslices/ (+ the Pod's named ports)
#                                  -> /wh-intent-ep/<ns>/<svc>/<pod>
#                                both pruned with their source
#   wormhole_emit                the intent rows -> /wh/<tenant>/<service>/
#                                gen/<g>/… (endpoints, manifests, policy,
#                                admission, routes, seal) and the active
#                                pointer by compare-and-swap; /wh-status/
#   wormhole_status              Wormhole's VIP bindings (/wh/<t>/<s>/vip/…)
#                                -> /wh-vip/<ns>/<svc>
#   wh_ status chain             status.loadBalancer only while that VIP is
#                                ACTIVE or DRAINING
#   wc_ chains (wh_cell.plan)    Wormhole's ingress-cell demand -> a
#                                Deployment of that many hosts
#
# docs/architecture/wormhole-projection.md has the key layout, the identities
# and what Wormhole writes back.
target: linux
tick_us: 1000

scheduler:
  accept_cycles: true

modules:
  # A Service, as Wormhole is told it: only one whose loadBalancerClass is
  # unset or wormhole.nanocloud.io/lb.
  - name: wh_svc_src
    type: store_source
    prefix: "/services/"
    paths: "spec.type,spec.clusterIP,spec.clusterIPs,spec.ipFamilies,spec.ports[].port,spec.ports[].protocol,spec.ports[].targetPort,spec.loadBalancerClass,spec.externalTrafficPolicy,spec.internalTrafficPolicy,spec.sessionAffinity,spec.sessionAffinityConfig.clientIP.timeoutSeconds,spec.loadBalancerSourceRanges"
    related: "/lb-addr/!flat:ip"
    watch: "/lb-addr/"
  - name: wh_svc
    type: store_effect
    # chronicle-source: modules/app/_chronicle/wormhole.plan wh_svc
    decision: {hex: ""}
    key_prefix: "/wh-intent/"
  # Each slice of a Wormhole Service, its Pod read for its named ports.
  - name: wh_ep_src
    type: store_source
    prefix: "/endpointslices/"
    flat: 1
    paths: "."
    related: "/services/^1!json:metadata.name,spec.loadBalancerClass,spec.clusterIP,spec.type"
    watch: "/services/"
  - name: wh_ep_pod
    # store_stamped: a Pod past a record (a real template) read whole.
    type: store_stamped
    # chronicle-source: modules/app/_chronicle/wormhole.plan wh_ep_ask
    decision: {hex: ""}
    key_prefix: "/pods/"
    paths: "spec.containers.0.ports[].name,spec.containers.0.ports[].containerPort"
  - name: wh_ep
    type: store_effect
    # chronicle-source: modules/app/_chronicle/wormhole.plan wh_ep
    decision: {hex: ""}
    key_prefix: "/wh-intent-ep/"
  # Rows whose source is gone.
  - name: wh_ep_rows
    type: store_source
    rev: 1
    prefix: "/wh-intent-ep/"
    related: "/endpointslices/:."
    watch: "/endpointslices/"
  - name: wh_ep_prune
    type: store_effect
    # chronicle-source: modules/app/_chronicle/wormhole.plan wh_prune
    decision: {hex: "01050000000c000100024600000012000020000c0000003300010002010000004001000000100400000000000000400200000001000203000000400300000001000202000000401c000000410a000000310001000201000000400100000010000000000000000040020000001200004003000000100000000000000000401c00000041"}
    key_prefix: "/wh-intent-ep/"
  - name: wh_svc_rows
    type: store_source
    rev: 1
    prefix: "/wh-intent/"
    related: "/services/!json:metadata.name"
    watch: "/services/"
  - name: wh_svc_prune
    type: store_effect
    # chronicle-source: modules/app/_chronicle/wormhole.plan wh_prune
    decision: {hex: "01050000000c000100024600000012000020000c0000003300010002010000004001000000100400000000000000400200000001000203000000400300000001000202000000401c000000410a000000310001000201000000400100000010000000000000000040020000001200004003000000100000000000000000401c00000041"}
    key_prefix: "/wh-intent/"
  # The records: the one writer of /wh/<t>/<s>/{gen/,active} and /wh-status/.
  - name: wh_emit
    type: wormhole_emit
  # Wormhole's VIP bindings (/wh/<t>/<s>/vip/<4|6>, Wormhole's to write),
  # decoded to /wh-vip/<ns>/<svc>: phase and address per family.
  - name: wh_vip
    type: wormhole_status
  # A LoadBalancer Service's status names its address only while its VIP is
  # ACTIVE or DRAINING (§6.1). store_stamped: a Service past a record is
  # patched whole on its heap.
  - name: wh_lb_src
    type: store_source
    prefix: "/services/"
    paths: "spec.type,spec.loadBalancerClass"
    related: "/wh-vip/!flat:p4#,a4,p6#,a6"
    watch: "/wh-vip/"
  - name: wh_lb_status
    type: store_stamped
    # chronicle-source: modules/app/_chronicle/wormhole.plan wh_status
    decision: {hex: ""}
    key_prefix: "/services/"
  # Ingress-cell capacity (wh_cell.plan): Wormhole's demand
  # /wh-demand/<cell> = hosts=<n>;profile=<pi5|server>;image=<ref> -> a
  # Deployment wormhole-system/<cell> of that many hosts, one per node,
  # through the workload path (its ReplicaSet, its Pods, the scheduler).
  - name: wc_src
    type: store_source
    prefix: "/wh-demand/"
    flat: 1
    paths: "profile,image"
    ints: "hosts"
  - name: wc_ns
    type: store_stamped
    # chronicle-source: modules/app/_chronicle/wh_cell.plan wc_ns
    decision: {hex: ""}
    key_prefix: "/namespaces/"
    schema: "create=metadata.uid:uuid,metadata.creationTimestamp:now;keep=metadata.uid,metadata.creationTimestamp"
    stamp: 1
  - name: wc_create
    type: store_stamped
    # chronicle-source: modules/app/_chronicle/wh_cell.plan wc_create
    decision: {hex: ""}
    key_prefix: "/deployments.apps/"
    schema: "create=metadata.uid:uuid,metadata.creationTimestamp:now;keep=metadata.uid,metadata.creationTimestamp"
    stamp: 1
  - name: wc_size
    type: store_stamped
    # chronicle-source: modules/app/_chronicle/wh_cell.plan wc_size
    decision: {hex: ""}
    key_prefix: "/deployments.apps/"
  - name: wc_template
    type: store_stamped
    # chronicle-source: modules/app/_chronicle/wh_cell.plan wc_template
    decision: {hex: ""}
    key_prefix: "/deployments.apps/"
  # A Deployment of the chain's whose demand is gone (or 0 hosts) goes, its
  # tomb left for a watch's DELETED.
  - name: wc_deps
    type: store_source
    rev: 1
    prefix: "/deployments.apps/wormhole-system/"
    paths: "metadata.labels.\"app.kubernetes.io/managed-by\""
    related: "/wh-demand/!flat:hosts#"
    watch: "/wh-demand/"
  - name: wc_prune
    type: store_stamped
    # chronicle-source: modules/app/_chronicle/wh_cell.plan wc_prune
    decision: {hex: ""}
    key_prefix: "/deployments.apps/wormhole-system/"
    tomb: "/~tomb"

wiring:
  - from: wh_svc_src.record_out
    to: wh_svc.request_in
  - from: wh_ep_src.record_out
    to: wh_ep_pod.request_in
  - from: wh_ep_pod.response_out
    to: wh_ep.request_in
  - from: wh_ep_rows.record_out
    to: wh_ep_prune.request_in
  - from: wh_svc_rows.record_out
    to: wh_svc_prune.request_in
  - from: wh_lb_src.record_out
    to: wh_lb_status.request_in
  - from: wc_src.record_out
    to: wc_ns.request_in
  - from: wc_ns.response_out
    to: wc_create.request_in
  - from: wc_create.response_out
    to: wc_size.request_in
  - from: wc_size.response_out
    to: wc_template.request_in
  - from: wc_deps.record_out
    to: wc_prune.request_in
