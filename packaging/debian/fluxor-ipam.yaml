# cni-ipam workload graph the cni_ipam fmod, which watches
# /ipam-request/ in the control-plane store and allocates pod IPs from the
# pool CIDR, writing /ipam-lease/. Pure allocation decision over the store; the
# CNI plugin's effect is the node network backend's, driven from the lease.
target: linux
tick_us: 1000

# The self-edge below (change-sink allocator) is a deliberate 1-node cycle.
scheduler:
  accept_cycles: true

modules:
  - name: cni_ipam

# Self-edge: the module's own output feeds its `changes` input, allocating a
# module-owned channel the store's namespace.change SUBSCRIBE pushes onto. The
# module never writes this output; it drains pushed events from the input.
wiring:
  - from: cni_ipam.status
    to: cni_ipam.changes
