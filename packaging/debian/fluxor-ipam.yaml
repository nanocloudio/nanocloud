# Pod IP allocation as Chronicle params (ipam_pod.uproc, ipam_pod_release.uproc).
# Requests at /ipam-request/<id> get a create-only lease at /ipam-lease/<id>;
# each address is claimed create-only at /ipam/pod/<u32>.
# EXTRACTED from packaging/debian/fluxor-controlplane.yaml by
# scripts/extract-fixture.py (ip_) — do not edit; re-extract.
target: linux
tick_us: 1000

scheduler:
  accept_cycles: true

modules:
  - name: ip_wait
    type: store_source
    prefix: "/ipam-request/"
    unless: "/ipam-lease/"
    count: 1
    watch: "/ipam-lease/,/ipam-retry/"
  - name: ip_cur
    type: store_effect
    # chronicle-source: modules/app/_chronicle/ipam_pod.uproc pa_cur
    decision: "010500000012000100021400000010000000000000000020000d00000035000100020100000040010000001001000000000000004002000000120300706f6440030000000100020300000042011e40fe000000410d0000003200010002010000004001000000100000000000000000400200000012000040030000000100020300000042011e40fe00000041"
    key_prefix: "/ipam-cursor/"
    flat: 1
    ints: "n,net,span"
  - name: ip_claim
    type: store_effect
    # chronicle-source: modules/app/_chronicle/ipam_pod.uproc pa_claim
    decision: ""
    key_prefix: "/ipam/pod/"
  - name: ip_bump
    type: store_effect
    # chronicle-source: modules/app/_chronicle/ipam_pod.uproc pa_bump
    decision: ""
    key_prefix: "/ipam-cursor/"
  - name: ip_lease
    type: store_effect
    # chronicle-source: modules/app/_chronicle/ipam_pod.uproc pa_lease
    decision: ""
  - name: ip_used
    type: store_source
    prefix: "/ipam-lease/"
    count: 1
    empty: 1
    ints: ".!ip4"
  - name: ip_used_c
    type: store_effect
    # chronicle-source: modules/app/_chronicle/ipam_pod.uproc pb_claim
    decision: ""
    key_prefix: "/ipam/pod/"
  - name: ip_pool
    type: store_effect
    # chronicle-source: modules/app/_chronicle/ipam_pod.uproc pb_pool
    decision: ""
    flat: 1
    ints: "cidr!ip4,cidr!prefix"
  - name: ip_ready
    type: store_effect
    # chronicle-source: modules/app/_chronicle/ipam_pod.uproc pb_ready
    decision: ""
    key_prefix: "/ipam-cursor/"
  - name: ip_wake
    type: store_effect
    # chronicle-source: modules/app/_chronicle/ipam_pod_release.uproc wake
    decision: ""
  - name: ip_claims
    type: store_source
    prefix: "/ipam/pod/"
    flat: 1
    paths: "owner"
    ints: "ip"
    watch: "/ipam-lease/,/ipam-request/"
  - name: ip_owner
    type: store_effect
    # chronicle-source: modules/app/_chronicle/ipam_pod_release.uproc pr_owner
    decision: "00140000004600010002010000004001000000100100000000000000400200000001000204000000400300000001000203000000010002320000000100020400000042031e1f2040fe00000041"
    key_prefix: "/ipam-lease/"
    ints: ".!ip4"
  - name: ip_req
    type: store_effect
    # chronicle-source: modules/app/_chronicle/ipam_pod_release.uproc pr_req
    decision: "001a0000005d000100020100000040010000001002000000000000004002000000010002fe00000002200000004003000000010002fe000000021e000000010002fe000000021f000000010002020000000100023200000042041e1f222340fe00000041"
    key_prefix: "/ipam-request/"
  - name: ip_free
    type: store_effect
    # chronicle-source: modules/app/_chronicle/ipam_pod_release.uproc pr_free
    decision: ""
    key_prefix: "/ipam/pod/"
  - name: ip_orphan
    type: store_source
    prefix: "/ipam-request/"
    unless: "/sandboxes/"
    watch: "/sandboxes/"
  - name: ip_orphan_l
    type: store_effect
    # chronicle-source: modules/app/_chronicle/ipam_pod_release.uproc po_lease
    decision: "000e000000360001000201000000400100000010040000000000000040020000000100020300000040030000000100020300000042011e40fe00000041"
    key_prefix: "/ipam-lease/"
  - name: ip_orphan_r
    type: store_effect
    # chronicle-source: modules/app/_chronicle/ipam_pod_release.uproc po_req
    decision: "001000000040000100020100000040010000001004000000000000004002000000010002fe000000021e0000004003000000010002fe000000021e00000042011e40fe00000041"
    key_prefix: "/ipam-request/"

wiring:
  - from: ip_wait.status
    to: ip_wait.changes
  - from: ip_wait.record_out
    to: ip_cur.request_in
  - from: ip_cur.response_out
    to: ip_claim.request_in
  - from: ip_claim.response_out
    to: ip_bump.request_in
  - from: ip_bump.response_out
    to: ip_lease.request_in
  - from: ip_used.status
    to: ip_used.changes
  - from: ip_used.record_out
    to: ip_used_c.request_in
  - from: ip_used_c.response_out
    to: ip_pool.request_in
  - from: ip_pool.response_out
    to: ip_ready.request_in
  - from: ip_ready.response_out
    to: ip_wake.request_in
  - from: ip_claims.status
    to: ip_claims.changes
  - from: ip_claims.record_out
    to: ip_owner.request_in
  - from: ip_owner.response_out
    to: ip_req.request_in
  - from: ip_req.response_out
    to: ip_free.request_in
  - from: ip_orphan.status
    to: ip_orphan.changes
  - from: ip_orphan.record_out
    to: ip_orphan_l.request_in
  - from: ip_orphan_l.response_out
    to: ip_orphan_r.request_in
