# Workload source manifest for the sandbox-runner bundle. postinst emits it and
# publishes it into the node's OCI store, so `sandbox-runner:1.0.0` resolves offline.
# Portless — the runner drives the store and workload capability surfaces via
# provider_call, not a socket. The graph (linux.yaml, staged beside this file)
# runs the sandbox_runner module.
[workload]
name = "sandbox-runner"
version = "1.0.0"
role = "service"

[[implementation]]
target = "linux"
graph = "linux.yaml"

[resources]
state_bytes = 65536
buffer_bytes = 16384
