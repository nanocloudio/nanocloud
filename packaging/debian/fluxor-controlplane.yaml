    type: store_effect
    # chronicle-source: modules/app/_chronicle/ipam_svc.uproc sb_ready
    decision: {hex: ""}
    key_prefix: "/ipam-cursor/"
  - name: is_wake
    type: store_effect
    # chronicle-source: modules/app/_chronicle/ipam_pod_release.uproc wake
    decision: {hex: ""}
  - name: is_claims
    type: store_source
    prefix: "/ipam/svc/"
    flat: 1
    paths: "owner"
    ints: "ip"
    watch: "/services/"
  - name: is_owner
    type: store_effect
    # chronicle-source: modules/app/_chronicle/ipam_svc.uproc sr_owner
    decision: {hex: "00140000004600010002010000004001000000100100000000000000400200000001000204000000400300000001000203000000010002320000000100020400000042031e1f2040fe00000041"}
    key_prefix: "/services/"
    ints: "spec.clusterIP!ip4"
  - name: is_free
    type: store_effect
    # chronicle-source: modules/app/_chronicle/ipam_svc.uproc sr_free
    decision: {hex: ""}
    key_prefix: "/ipam/svc/"
  # Pod IPs are PARAMS (ipam_pod.uproc, ipam_pod_release.uproc): a request
  # with no lease (`unless`) is waiting; its address is claimed create-only
  # at /ipam/pod/<u32> and committed as a create-only /ipam-lease/<id>. The
  # pool CIDR rides the cursor. A request whose sandbox is gone releases
  # its lease, and a claim whose owner is gone releases its address.
  - name: ip_wait
    type: store_source
    prefix: "/ipam-request/"
    unless: "/ipam-lease/"
    # The request's CIDR: its node's (pod_resolve's `cidr=`), which the
    # address is taken from; a request naming none takes /ipam-pool's.
    flat: 1
    ints: "cidr!ip4,cidr!prefix"
    count: 1
    watch: "/ipam-"
  - name: ip_cur
    type: store_effect
    # chronicle-source: modules/app/_chronicle/ipam_pod.uproc pa_cur
    decision: {hex: ""}
    key_prefix: "/ipam-cursor/"
    flat: 1
    ints: "n,net,span"
  - name: ip_claim
    type: store_effect
    # chronicle-source: modules/app/_chronicle/ipam_pod.uproc pa_claim
    decision: {hex: ""}
    key_prefix: "/ipam/pod/"
  - name: ip_bump
    type: store_effect
    # chronicle-source: modules/app/_chronicle/ipam_pod.uproc pa_bump
    decision: {hex: ""}
    key_prefix: "/ipam-cursor/"
  - name: ip_lease
    type: store_effect
    # chronicle-source: modules/app/_chronicle/ipam_pod.uproc pa_lease
    decision: {hex: ""}
  - name: ip_used
    type: store_source
    prefix: "/ipam-lease/"
    count: 1
    empty: 1
    ints: ".!ip4"
  - name: ip_used_c
    type: store_effect
    # chronicle-source: modules/app/_chronicle/ipam_pod.uproc pb_claim
    decision: {hex: ""}
    key_prefix: "/ipam/pod/"
  - name: ip_pool
    type: store_effect
    # chronicle-source: modules/app/_chronicle/ipam_pod.uproc pb_pool
    decision: {hex: ""}
    flat: 1
    ints: "cidr!ip4,cidr!prefix"
  - name: ip_ready
    type: store_effect
    # chronicle-source: modules/app/_chronicle/ipam_pod.uproc pb_ready
    decision: {hex: ""}
    key_prefix: "/ipam-cursor/"
  - name: ip_wake
    type: store_effect
    # chronicle-source: modules/app/_chronicle/ipam_pod_release.uproc wake
    decision: {hex: ""}
  - name: ip_claims
    type: store_source
    prefix: "/ipam/pod/"
    flat: 1
    paths: "owner"
    ints: "ip"
    watch: "/ipam"
  - name: ip_owner
    type: store_effect
    # chronicle-source: modules/app/_chronicle/ipam_pod_release.uproc pr_owner
    decision: {hex: "00140000004600010002010000004001000000100100000000000000400200000001000204000000400300000001000203000000010002320000000100020400000042031e1f2040fe00000041"}
    key_prefix: "/ipam-lease/"
    ints: ".!ip4"
  - name: ip_req
    type: store_effect
    # chronicle-source: modules/app/_chronicle/ipam_pod_release.uproc pr_req
    decision: {hex: "001a0000005d000100020100000040010000001002000000000000004002000000010002fe00000002200000004003000000010002fe000000021e000000010002fe000000021f000000010002020000000100023200000042041e1f222340fe00000041"}
    key_prefix: "/ipam-request/"
  - name: ip_free
    type: store_effect
    # chronicle-source: modules/app/_chronicle/ipam_pod_release.uproc pr_free
    decision: {hex: ""}
    key_prefix: "/ipam/pod/"
  # Only a request naming no node: a node's own (pod_resolve's, `node=`)
  # outlives this store's /sandboxes/ view and is released by that node
  # (node_net), once its Pod and its sandbox are gone.
  - name: ip_orphan
    type: store_source
    prefix: "/ipam-request/"
    flat: 1
    where: "node="
    unless: "/sandboxes/"
    watch: "/sandboxes/"
  - name: ip_orphan_l
    type: store_effect
    # chronicle-source: modules/app/_chronicle/ipam_pod_release.uproc po_lease
    decision: {hex: "000e000000360001000201000000400100000010040000000000000040020000000100020300000040030000000100020300000042011e40fe00000041"}
    key_prefix: "/ipam-lease/"
  - name: ip_orphan_r
    type: store_effect
    # chronicle-source: modules/app/_chronicle/ipam_pod_release.uproc po_req
    decision: {hex: "001000000040000100020100000040010000001004000000000000004002000000010002fe000000021e0000004003000000010002fe000000021e00000042011e40fe00000041"}
    key_prefix: "/ipam-request/"
  # VolumeSnapshot is PARAMS: create the bound VolumeSnapshotContent, then
  # PATCH the VolumeSnapshot's status to bind it and mark it ready; gated on
  # readyToUse. Params from modules/app/_chronicle/snapshot.uproc.
  - name: sn_source
    type: store_source
    prefix: "/volumesnapshots.snapshot.storage.k8s.io/"
    paths: "status.readyToUse,spec.source.persistentVolumeClaimName"
  - name: sn_contents
    type: store_effect
    # chronicle-source: modules/app/_chronicle/snapshot.uproc ct
    decision: {hex: ""}
    key_prefix: "/volumesnapshotcontents.snapshot.storage.k8s.io/"
  - name: sn_status
    type: store_effect
    # chronicle-source: modules/app/_chronicle/snapshot.uproc bd
    decision: {hex: ""}
    key_prefix: "/volumesnapshots.snapshot.storage.k8s.io/"
  # Device identities as params (device.uproc): a Device naming its public key
  # is certified (once per key) by kagi's certificate_endpoint, through http_effect, under
  # the vault key `nanocloud.ca` — the same root that signs ServiceAccount tokens.
  - name: dv_source
    type: store_source
    prefix: "/devices.nanocloud.io/"
    paths: "spec.publicKey"
    # Certified once per key: a holder that re-keys is certified again.
    differs: "spec.publicKey,status.publicKey"
  - name: dv_dec
    type: decision
    params:
      # chronicle-source: modules/app/_chronicle/device.uproc rq
      decision: {hex: ""}
  - name: dv_http
    type: http_effect
    paths: "certificate,ca,spiffe_id"
  - name: certificate_endpoint
    issuer_cn: "nanocloud-ca"
    trust_domain: "nanocloud.local"
    dns_suffix: ".svc.cluster.local"
    key_label: "nanocloud.ca"
  - name: dv_ids
    type: store_effect
    # chronicle-source: modules/app/_chronicle/device.uproc idn
    decision: {hex: ""}
    key_prefix: "/deviceidentities.nanocloud.io/"
  - name: dv_ca
    type: store_effect
    # chronicle-source: modules/app/_chronicle/device.uproc cap
    decision: {hex: ""}
  # The Device's own status: what a client reading its Device through the
  # API is answered with (a joining node, its peer keys certified).
  - name: dv_status
    type: store_big
    # chronicle-source: modules/app/_chronicle/device.uproc sts
    decision: {hex: ""}
    key_prefix: "/devices.nanocloud.io/"
  # ServiceAccount tokens as params (sa_token.uproc) over kagi's token_mint,
  # signed under the vault key `nanocloud.ca` — the node's one signing root —
  # whose public half the mint announces to /authn-keys/sa for kagi_verify.
  - name: tk_req
    type: store_source
    prefix: "/token-req/"
    flat: 1
    paths: "ns,sa,aud,ttl"
    unless: "/token-resp/"
  - name: tk_dec
    type: decision
    params:
      # chronicle-source: modules/app/_chronicle/sa_token.uproc tk_mint
      decision: {hex: ""}
  - name: tk_mint
    type: kagi_mint
    issuer: "https://kubernetes.default.svc"
    key_label: "nanocloud.ca"
    announce_path: "/authn-keys/sa"
  - name: token_mint
    posture: development
  - name: tk_resp
    type: store_effect
    # chronicle-source: modules/app/_chronicle/sa_token.uproc tk_store
    decision: {hex: ""}
    key_prefix: "/token-resp/"
