  - name: pst_csrc
    type: store_source
    prefix: "/podstatus/"
    flat: 1
    paths: "pod,rst,ready,started,st,why,msg,code,digest,tr!jts,tf!jts,lcode,lwhy,ltr!jts,ltf!jts"
    watch: "/pods/"
  - name: pst_cs
