    params:
      # agg-source: scripts/hpa-agg.sh 300000 60000
      ir_def: {hex: "e09304000000000000000000000000004000000060ea000000000000000000000000000008000500010100000014080005000102000000143d0005000101000000120100000005000202000000010000001202000000050002020000000200000012030000000500020300000002000000120400000013020308000500010300000014030800050001020000001401"}
  - name: hp_patch
    type: store_effect
    # chronicle-source: modules/app/_chronicle/hpa.uproc ap
    decision: {hex: ""}
    key_prefix: "/deployments.apps/"
  # The ownerRef cascade is PARAMS, not a module. These thirteen nodes are two
  # sweeps — the SAME two decisions over different
  # prefixes, nothing recompiled — and the Events count-cap, a fold over a set
  # expressed as a per-record decision because store_source's `count` mode
  # stamps every record with its position and the total.
  #
  #   pods        <- replicasets   gc_pod_*
  #   replicasets <- deployments   gc_rs_*
  #   pods        <- jobs          gc_job_*
  #   jobs        <- cronjobs      gc_cj_*
  #   /events/ capped at 200       gc_ev_*
  #
  # Params are BAKED (a deb ships no compiler) and carry provenance markers
  # that `scripts/chronicle-param-drift-e2e.sh` recompiles and compares.
  - name: gc_pod_source
    type: store_scan
    prefix: "/pods/"
    paths: "metadata.ownerReferences.0.name,metadata.ownerReferences.0.kind"
    # Only what a ReplicaSet owns is this sweep's to judge (gc.uproc `probe`).
    label: "ReplicaSet"
    # The cascade: when an owner is collected its children are orphans NOW,
    # and nothing under the children's prefix changed to say so.
    watch: "/replicasets.apps/"
  - name: gc_pod_owner
    type: store_effect
    # chronicle-source: modules/app/_chronicle/gc.uproc ask
    decision: {hex: ""}
    key_prefix: "/replicasets.apps/"
  - name: gc_pod_collect
    type: store_stamped
    # chronicle-source: modules/app/_chronicle/gc.uproc act
    decision: {hex: ""}
    key_prefix: "/pods/"
    # The node learns of the delete from the Pod's tomb, and a watch's
    # DELETED carries the whole Pod (heap: one past a record read whole).
    tomb: "/~tomb"
  - name: gc_rs_source
    type: store_scan
    prefix: "/replicasets.apps/"
    paths: "metadata.ownerReferences.0.name,metadata.ownerReferences.0.kind"
    # Only what a Deployment owns is this sweep's to judge (gc.uproc `probe`).
    label: "Deployment"
    # The cascade: when an owner is collected its children are orphans NOW,
    # and nothing under the children's prefix changed to say so.
    watch: "/deployments.apps/"
  - name: gc_rs_owner
    type: store_effect
    # chronicle-source: modules/app/_chronicle/gc.uproc ask
    decision: {hex: ""}
    key_prefix: "/deployments.apps/"
  - name: gc_rs_collect
    type: store_stamped
    # chronicle-source: modules/app/_chronicle/gc.uproc act
    decision: {hex: ""}
    key_prefix: "/replicasets.apps/"
    # An orphan ReplicaSet's tomb, for a watch's DELETED (heap: one with a
    # real template is past a record).
    tomb: "/~tomb"
  # A Job's Pods, collected with their Job (the same two decisions).
  - name: gc_job_source
    type: store_scan
    prefix: "/pods/"
    paths: "metadata.ownerReferences.0.name,metadata.ownerReferences.0.kind"
    label: "Job"
    watch: "/jobs.batch/"
  - name: gc_job_owner
