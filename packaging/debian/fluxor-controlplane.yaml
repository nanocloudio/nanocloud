    type: store_effect
    # chronicle-source: modules/app/_chronicle/volume_static.uproc vs_pv
    decision: {hex: ""}
    key_prefix: "/volumes/"
  - name: pvb_pvst
    type: store_effect
    # chronicle-source: modules/app/_chronicle/volume_static.uproc vs_bound
    decision: {hex: ""}
    key_prefix: "/persistentvolumeclaims/"
  - name: pvb_pvc
    type: store_source
    prefix: "/persistentvolumeclaims/"
    paths: "spec.volumeName"
  - name: pvb_pvget
    type: store_effect
    # chronicle-source: modules/app/_chronicle/volume_static.uproc vs_ask
    decision: {hex: "01050000000c00010002040000001200002100110000003e0001000201000000400100000010010000000000000040020000000100020400000040030000000100021c0000000100021d00000042021e1f40fe000000410e00000032000100020100000040010000001000000000000000004002000000120000400300000012000012000042021e1f40fe00000041"}
    key_prefix: "/persistentvolumes/"
    paths: "spec.hostPath.path,spec.local.path,spec.claimRef.namespace,spec.claimRef.name"
  - name: pvb_pvcput
    type: store_effect
    # chronicle-source: modules/app/_chronicle/volume_static.uproc vs_claim
    decision: {hex: ""}
    key_prefix: "/volumes/"
  - name: pvb_pvcst
    type: store_effect
    # chronicle-source: modules/app/_chronicle/volume_static.uproc vs_bound
    decision: {hex: ""}
    key_prefix: "/persistentvolumeclaims/"
