  # carries a NoExecute taint it does not tolerate is evicted at once; one it
  # tolerates for tolerationSeconds is evicted that long after the moment it
  # was first seen so (/taint-evict/<ns>/<pod>, on the kernel timer) — unless
  # the taint went first.
  - name: te_pods
    type: store_scan
    prefix: "/pods/"
    paths: "metadata.uid"
    sched: "/nodes/:/pods/"
    sched_noexec: 1
    related: "/taint-evict/!flat:t"
