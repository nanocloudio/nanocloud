  - name: sss_rdy
    type: store_stamped
    # chronicle-source: modules/app/_chronicle/set_status.uproc sts_rdy_p
    decision: {hex: ""}
    # chronicle-source: modules/app/_chronicle/replicaset_status.uproc rs_ready_p
    count_where: {hex: "0121000000690001000228000000010002fe000000022000000020010002fe000000022000000012000021300100022900000012000020300100022a00000012090053756363656564656421300100022a0000001206004661696c656421300100022b00000012040054727565203000030000000f0010010000000000000040010000004101000000010041"}
    key_prefix: "/pods/"
    paths: "metadata.ownerReferences.0.uid,metadata.deletionTimestamp,status.phase,status.conditions[type=Ready].status,metadata.labels.pod-template-hash"
  - name: sss_put
    type: store_stamped
    # chronicle-source: modules/app/_chronicle/set_status.uproc sts_st_p
    decision: {hex: ""}
    key_prefix: "/statefulsets.apps/"
  # DaemonSet is PARAMS, not a module. Thirteen ds_* nodes carry the readiness
  # projection (/nodes/ -> /ready-nodes/),
  # the placement (DaemonSets JOIN ready Nodes -> create-if-absent, node-pinned),
  # and the prune (a DaemonSet Pod whose Node is no longer ready). The cross
  # product is the source's — `join` — as the count was for ReplicaSet.
  # Params compiled from modules/app/_chronicle/daemonset.uproc.
  # Node leases (modules/app/_chronicle/node_lease.uproc): each node renews
  # its own /nodes/<name>; the plane notes when it last saw each change, by
  # its own clock, and a node silent past the lease is taken out of service
  # (status.ready false), which ds_mark below carries to /ready-nodes/.
  - name: nl_nodes
    type: store_source
    prefix: "/nodes/"
    rev: 1
    now: 1
    related: "/node-seen/!flat:rev#,at#"
  - name: nl_seen
    type: store_effect
    # chronicle-source: modules/app/_chronicle/node_lease.uproc seen_p
    decision: {hex: ""}
    key_prefix: "/node-seen/"
  - name: nl_leases
    type: store_source
    prefix: "/node-seen/"
    flat: 1
    ints: "at"
    now: 1
    due: "at+30000"
    related: "/nodes/!json:status.ready"
  - name: nl_stale
    type: store_effect
    # chronicle-source: modules/app/_chronicle/node_lease.uproc stale_p
    decision: {hex: ""}
    key_prefix: "/nodes/"
  - name: ds_nodes
    type: store_source
    prefix: "/nodes/"
    paths: "status.ready"
  - name: ds_mark
    type: store_effect
    # chronicle-source: modules/app/_chronicle/daemonset.uproc rdy
    decision: {hex: "01050000001000010002040000001204007472756520000b00000030000100020100000040010000001003000000000000004002000000010002030000004003000000120100314004000000410b0000002f000100020100000040010000001004000000000000004002000000010002030000004003000000120000400400000041"}
    key_prefix: "/ready-nodes/"
  # A Node deleted outright is no record under /nodes/: its tomb's index
  # ends its mark (daemonset.uproc gone), unless a Node of its name is back.
  - name: ds_ngone
    type: store_source
    prefix: "/~tomb-at/nodes/"
    related: "/nodes/:metadata.name"
    # The index is written BEFORE the Node is deleted: read then, the Node
    # is still there. The delete itself is what has to wake it.
    watch: "/nodes/"
  - name: ds_unmark
    type: store_effect
    # chronicle-source: modules/app/_chronicle/daemonset.uproc gone_p
    decision: {hex: "01050000000c000100024600000012000020000b0000002f0001000201000000400100000010040000000000000040020000000100020300000040030000001200004004000000410a0000002b0001000201000000400100000010000000000000000040020000001200004003000000120000400400000041"}
    key_prefix: "/ready-nodes/"
  - name: ds_source
    type: store_scan
    # A DaemonSet carries its users' template: read whole (store_scan). Its
    # digest is the Pods' controller-revision-hash; the template itself is
    # SPLICED by ds_apply from the stored DaemonSet, never carried.
    hash: "spec.template"
    prefix: "/daemonsets.apps/"
    paths: "metadata.uid"
    join: "/ready-nodes/"
    watch: "/ready-nodes/,/pods/"
  - name: ds_exists
    type: store_effect
    # chronicle-source: modules/app/_chronicle/daemonset.uproc prb
    decision: {hex: "00230000006e0001000201000000400100000010020000000000000040020000000100021800000040030000000100021800000001000203000000010002150000000100021c0000000100021d000000010002040000000100021b0000000100021a00000042081e1f20222324252740fe00000041"}
    key_prefix: "/pods/"
  - name: ds_apply
    type: store_big
    # Objects this controller creates get their identity as the API's do:
    # a uid and creationTimestamp stamped when created, kept when rewritten.
    stamp: 1
    schema: "create=metadata.uid:uuid,metadata.creationTimestamp:now;keep=metadata.uid,metadata.creationTimestamp"
    # chronicle-source: modules/app/_chronicle/daemonset.uproc mk
    decision: {hex: ""}
    key_prefix: "/pods/"
  - name: ds_pods
    type: store_scan
    prefix: "/pods/"
    paths: "metadata.ownerReferences.0.kind,spec.nodeName"
    watch: "/ready-nodes/"
  - name: ds_known
    type: store_effect
    # chronicle-source: modules/app/_chronicle/daemonset.uproc ask_p
    decision: {hex: ""}
    key_prefix: "/ready-nodes/"
  - name: ds_collect
    type: store_stamped
    # chronicle-source: modules/app/_chronicle/daemonset.uproc prn
    decision: {hex: "010500000012000100020200000010940100000000000020000a0000002c000100020100000040010000001004000000000000004002000000010002fe000000021e0000004003000000410800000023000100020100000040010000001000000000000000004002000000120000400300000041"}
    key_prefix: "/pods/"
    # The node learns of the delete from the Pod's tomb, and a watch's
    # DELETED carries the whole Pod (heap: one past a record read whole).
    tomb: "/~tomb"
  # StatefulSet is PARAMS: the ReplicaSet chain with the gate asked of the
  # NEIGHBOUR that matters — the predecessor's readiness in range, the
  # successor's absence for a surplus — so bring-up is ordered and teardown is
  # highest-first without a budget. Params from modules/app/_chronicle/statefulset.uproc.
  - name: st_source
    type: store_scan
    prefix: "/statefulsets.apps/"
    paths: "spec.replicas,metadata.uid"
    expand: "spec.replicas"
    expand_tail: 2
    expand_over: "/pods/"
    watch: "/pods/"
  - name: st_nbget
    type: store_stamped
    # chronicle-source: modules/app/_chronicle/statefulset.uproc nb
    decision: {hex: ""}
    key_prefix: "/pods/"
    # the neighbour's readiness: its Ready condition
    paths: "status.conditions[type=Ready].status"
  - name: st_selfget
    type: store_stamped
    # chronicle-source: modules/app/_chronicle/statefulset.uproc ask
    decision: {hex: ""}
    key_prefix: "/pods/"
  - name: st_apply
    type: store_big
    # Objects this controller creates get their identity as the API's do:
    # a uid and creationTimestamp stamped when created, kept when rewritten.
    stamp: 1
    schema: "create=metadata.uid:uuid,metadata.creationTimestamp:now;keep=metadata.uid,metadata.creationTimestamp"
    # chronicle-source: modules/app/_chronicle/statefulset.uproc act
    decision: {hex: ""}
    key_prefix: "/pods/"
    # A scale-down's or a roll's delete leaves the Pod's tomb (as rs_apply).
    tomb: "/~tomb"
  # Job is PARAMS (job.uproc, job_launch.uproc, job_status.uproc), to
  # Kubernetes' semantics: parallelism, completions (NonIndexed and
  # Indexed), backoffLimit with a backoff of 10 s doubling to 6 min,
  # activeDeadlineSeconds, ttlSecondsAfterFinished, suspend — and the
  # status `kubectl get jobs` and `kubectl wait --for=condition=complete`
  # read. A Job's state lives beside it, flat, at /job-ctl/<ns>/<job>: its
  # Pods counted (active, succeeded, failed, ready), how many to start,
  # the terminal state, and the MOMENTS it started, finished, last failed
  # and was suspended — read back as deadlines on the kernel timer.
  #   seed    a Job with no state -> its /job-ctl/ record
  #   ctl     /job-ctl/ + its Job (related) -> ONE weighted COUNT of its
  #           Pods -> W1 (the four counts unpacked, how many to start,
  #           terminal state, backoff, the TTL's delete) -> W2 (startTime,
  #           suspend/resume)
  #   status  /job-ctl/ -> the Job's .status
  #   launch  NonIndexed <job>-<i>; Indexed via /job-idx/<ns>/<job>/<i> ->
  #           <job>-<i>-<attempt>. Names and the uid only: the writers
  #           SPLICE the template from the stored Job, whatever its size
  # The readers of Jobs and of Pods are heap builds (store_scan,
  # store_stamped): a Job carries its users' template, and its Pods do.
  #   kill    a suspended or finished Job's active Pods
  - name: jb_jobs
    type: store_scan
    prefix: "/jobs.batch/"
    paths: "metadata.uid"
    unless: "/job-ctl/"
    watch: "/job-ctl/"
  - name: jb_seed
    type: store_effect
    # chronicle-source: modules/app/_chronicle/job.uproc seed_p
    decision: {hex: "01050000000c000100020400000012000021001000000049000100020100000040010000001008000000000000004002000000010002030000004003000000120200753d40040000000100020400000040050000001204003b6e3d304006000000410800000023000100020100000040010000001000000000000000004002000000120000400300000041"}
    key_prefix: "/job-ctl/"
  - name: jb_ctl
    type: store_scan
    prefix: "/job-ctl/"
    flat: 1
    paths: "u,fin,sp,fc,t0,fat,tf"
    # The deadlines: started + activeDeadline, failed + backoff, finished +
    # ttl — moments read as this boot's monotonic ms, and armed.
    ints: "t0!due+dms,fat!due+bms,tf!due+xms"
    due: "t0!due+dms,fat!due+bms,tf!due+xms"
    now: 1
    related: "/jobs.batch/!json:metadata.uid,spec.parallelism,spec.parallelism#,spec.completions,spec.completions#,spec.completionMode,spec.backoffLimit,spec.backoffLimit#,spec.activeDeadlineSeconds,spec.activeDeadlineSeconds#;/jobs.batch/!json:spec.ttlSecondsAfterFinished,spec.ttlSecondsAfterFinished#,spec.suspend"
    watch: "/jobs.batch/,/pods/"
  - name: jb_count
    type: store_stamped
    # ONE walk of the namespace's Pods counts all four (active,
    # succeeded, failed, ready): each Pod weighs the sum of what it is
    # (job.uproc `tally`), and jb_w1 unpacks the sum. Heap (store_stamped):
    # a Pod past a record is read whole, never skipped.
    # chronicle-source: modules/app/_chronicle/job.uproc c0_p
    decision: {hex: ""}
    # chronicle-source: modules/app/_chronicle/job.uproc tally_p
    count_where: {hex: ""}
    key_prefix: "/"
    paths: "metadata.ownerReferences.0.uid,metadata.deletionTimestamp,status.phase,status.conditions[type=Ready].status"
  - name: jb_w1
    type: store_stamped
    # chronicle-source: modules/app/_chronicle/job.uproc w1_p
    decision: {hex: ""}
    key_prefix: "/"
    wall: 2
    # The TTL's delete leaves the Job's tomb (a watch's DELETED).
    tomb: "/~tomb"
  - name: jb_w2
    type: store_effect
    # chronicle-source: modules/app/_chronicle/job.uproc w2_p
    decision: {hex: ""}
    key_prefix: "/"
    wall: 2
  - name: jb_status
    type: store_source
    prefix: "/job-ctl/"
    flat: 1
    paths: "a,s,f,r,fin,sp,t0!wjts,tf!wjts,ts!wjts,md,c,u"
    # A moment not yet sayable (the clock untrusted) is null; scan again.
    recheck: 5000
  - name: jb_stpatch
    type: store_stamped
    # chronicle-source: modules/app/_chronicle/job_status.uproc st_p
    decision: {hex: ""}
    key_prefix: "/jobs.batch/"
  - name: jb_launch
    type: store_source
    # Names and the uid only (its /job-ctl/ record's): jb_create SPLICES the
    # template from the stored Job, whatever its size.
    prefix: "/job-ctl/"
    flat: 1
    where: "md="
    paths: "fin,sp,u"
    expand: "n"
    expand_tail: 0
    expand_over: "/pods/"
  - name: jb_create
    type: store_big
    # Objects this controller creates get their identity as the API's do:
    # a uid and creationTimestamp stamped when created, kept when rewritten.
    stamp: 1
    schema: "create=metadata.uid:uuid,metadata.creationTimestamp:now;keep=metadata.uid,metadata.creationTimestamp"
    # chronicle-source: modules/app/_chronicle/job_launch.uproc launch_p
    decision: {hex: ""}
    key_prefix: "/pods/"
  - name: jb_idx
    type: store_source
    prefix: "/job-ctl/"
    flat: 1
    where: "md=Indexed"
    paths: "fin,sp,u"
    ints: "w,p"
    expand: "c"
    expand_tail: 0
    watch: "/pods/"
  - name: jb_icount
    type: store_stamped
    # ONE walk counts index i covered, its failures, the indexes below
    # it covered and the Job's active Pods (job_launch.uproc `itally`,
    # unpacked by jb_iput).
    # chronicle-source: modules/app/_chronicle/job_launch.uproc i0_p
    decision: {hex: ""}
    # chronicle-source: modules/app/_chronicle/job_launch.uproc itally_p
    count_where: {hex: ""}
    key_prefix: "/"
    paths: "metadata.ownerReferences.0.uid,metadata.deletionTimestamp,status.phase"
    ints: 'metadata.annotations."batch.kubernetes.io/job-completion-index"'
  - name: jb_iput
    type: store_effect
    # chronicle-source: modules/app/_chronicle/job_launch.uproc i3_p
    decision: {hex: ""}
    key_prefix: "/job-idx/"
  - name: jb_irec
    type: store_source
    prefix: "/job-idx/"
    flat: 1
    paths: "go,u,i,fi,j"
    ints: "cov,bi,w,i,a,p"
    related: "/job-ctl/^1!flat:u"
    watch: "/job-ctl/"
  - name: jb_icreate
    type: store_big
    stamp: 1
    schema: "create=metadata.uid:uuid,metadata.creationTimestamp:now;keep=metadata.uid,metadata.creationTimestamp"
    # chronicle-source: modules/app/_chronicle/job_launch.uproc ilaunch_p
    decision: {hex: ""}
    key_prefix: "/"
  - name: jb_kpods
    type: store_scan
    prefix: "/pods/"
    where: "metadata.ownerReferences.0.kind=Job"
    paths: "metadata.ownerReferences.0.name,status.phase,metadata.deletionTimestamp"
    watch: "/job-ctl/"
  - name: jb_kget
    type: store_effect
    # chronicle-source: modules/app/_chronicle/job_status.uproc kq_p
    decision: {hex: ""}
    key_prefix: "/"
    flat: 1
    paths: "fin,sp"
  - name: jb_kill
    type: store_stamped
    # Heap (store_stamped): a Pod past a record is read whole for its tomb,
    # whose index tells its node it is gone.
    # chronicle-source: modules/app/_chronicle/job_status.uproc kd_p
    decision: {hex: ""}
    key_prefix: "/"
    tomb: "/~tomb"
  # PodDisruptionBudget status (pdb.uproc): the Pods its selector selects
  # (count_sel), those healthy, desired from minAvailable or maxUnavailable,
  # disruptionsAllowed — what the Eviction check and the scheduler's
  # preemption read.
  - name: pdb_src
    type: store_source
    prefix: "/poddisruptionbudgets/"
    paths: "spec.minAvailable,spec.maxUnavailable,spec.selector"
    ints: "metadata.generation"
    watch: "/pods/"
  - name: pdb_exp
    type: store_stamped
    # chronicle-source: modules/app/_chronicle/pdb.uproc p0_p
    decision: {hex: ""}
    # chronicle-source: modules/app/_chronicle/pdb.uproc expected_p
    count_where: {hex: "010f0000003400010002300000001201003120010002290000001209005375636365656465642130010002290000001206004661696c6564213000030000000f0010010000000000000040010000004101000000010041"}
    key_prefix: "/"
    paths: "metadata.deletionTimestamp,status.phase,status.conditions[type=Ready].status"
    count_sel: "@36|metadata.labels"
  - name: pdb_hlt
    type: store_stamped
    # chronicle-source: modules/app/_chronicle/pdb.uproc p1_p
    decision: {hex: ""}
    # chronicle-source: modules/app/_chronicle/pdb.uproc healthy_p
    count_where: {hex: "01190000005000010002300000001201003120010002280000001200002030010002290000001209005375636365656465642130010002290000001206004661696c656421300100022a00000012040054727565203000030000000f0010010000000000000040010000004101000000010041"}
    key_prefix: "/"
    paths: "metadata.deletionTimestamp,status.phase,status.conditions[type=Ready].status"
    count_sel: "@36|metadata.labels"
  - name: pdb_put
    type: store_effect
    # chronicle-source: modules/app/_chronicle/pdb.uproc p2_p
    decision: {hex: ""}
    key_prefix: "/poddisruptionbudgets/"
  # ResourceQuota usage (quota.uproc): each resource a quota limits, counted
  # (or summed: a Pod's requests and limits) over its namespace ->
  # /quota-used/ (admission's figures) and /quota-json/ (the status) ->
  # status {hard, used}.
  - name: q_exp
    type: store_source
    prefix: "/resourcequotas/"
    expand: "spec.hard{}"
    expand_tail: 0
    ints: "spec.hard.#!milli,spec.hard.#!bytes"
    # What a quota most often counts (a count/<resource> of another kind
    # follows its next change here, or the quota's own).
    watch: "/pods/,/services/,/configmaps/,/secrets/,/persistentvolumeclaims/,/deployments.apps/,/jobs.batch/"
  - name: q_cnt
    type: store_stamped
    # chronicle-source: modules/app/_chronicle/quota.uproc q0_p
    decision: {hex: ""}
    # chronicle-source: modules/app/_chronicle/quota.uproc weigh_p
    count_where: {hex: ""}
    key_prefix: "/"
    paths: "status.phase"
    ints: ".!reqcpu,.!reqmem,.!limcpu,.!limmem"
  - name: q_put
    type: store_effect
    # chronicle-source: modules/app/_chronicle/quota.uproc q1_p
    decision: {hex: ""}
    key_prefix: "/quota-used/"
  - name: q_json
    type: store_effect
    # chronicle-source: modules/app/_chronicle/quota.uproc q2_p
    decision: {hex: ""}
    key_prefix: "/quota-json/"
  - name: q_st
    type: store_source
    prefix: "/resourcequotas/"
    paths: "spec.hard"
    list_children: "/quota-json/"
    child_sep: "/"
    list_values: 1
    watch: "/quota-json/"
  - name: q_stp
    type: store_effect
    # chronicle-source: modules/app/_chronicle/quota.uproc st_p
    decision: {hex: ""}
    key_prefix: "/resourcequotas/"
  - name: q_gcsrc
    type: store_source
    prefix: "/quota-used/"
    related: "/resourcequotas/^1!json:metadata.uid"
    watch: "/resourcequotas/"
  - name: q_gc
    type: store_effect
    # chronicle-source: modules/app/_chronicle/quota.uproc gc_p
    decision: {hex: "01050000000c000100024600000012000020000b0000004400010002010000004001000000101200000000000000400200000001000203000000400300000012150071756f74612d757365642c71756f74612d6a736f6e4004000000410800000023000100020100000040010000001000000000000000004002000000120000400300000041"}
    key_prefix: "/"
  # PriorityClass (priority.uproc): the system classes; the global default;
  # a Pod's priority resolved from its class (or the default) — what the
  # scheduler orders and preempts by.
  - name: pc_sys
    type: store_source
    prefix: "/priorityclasses/"
    where: "metadata.name=system-node-critical"
    count: 1
    empty: 1
  - name: pc_sys1
    type: store_stamped
    stamp: 1
    schema: "create=metadata.uid:uuid,metadata.creationTimestamp:now;keep=metadata.uid,metadata.creationTimestamp"
    # chronicle-source: modules/app/_chronicle/priority.uproc sys1_p
    decision: {hex: ""}
    key_prefix: "/priorityclasses/"
  - name: pc_sys2
    type: store_stamped
    stamp: 1
    schema: "create=metadata.uid:uuid,metadata.creationTimestamp:now;keep=metadata.uid,metadata.creationTimestamp"
    # chronicle-source: modules/app/_chronicle/priority.uproc sys2_p
    decision: {hex: ""}
    key_prefix: "/priorityclasses/"
  - name: pc_cls
    type: store_source
    prefix: "/priorityclasses/"
    paths: "globalDefault"
  - name: pc_def
    type: store_effect
    # chronicle-source: modules/app/_chronicle/priority.uproc def_p
    decision: {hex: "01050000001000010002040000001204007472756520000b00000030000100020100000040010000001003000000000000004002000000010002030000004003000000120100314004000000410b0000002f000100020100000040010000001004000000000000004002000000010002030000004003000000120000400400000041"}
    key_prefix: "/priority-default/"
  - name: pc_dsrc
    type: store_source
    prefix: "/priority-default/"
    related: "/priorityclasses/!json:metadata.name"
    watch: "/priorityclasses/"
  - name: pc_dgc
    type: store_effect
    # chronicle-source: modules/app/_chronicle/priority.uproc defgc_p
    decision: {hex: "01050000000c000100024600000012000020000b0000002f0001000201000000400100000010040000000000000040020000000100020300000040030000001200004004000000410a0000002b0001000201000000400100000010000000000000000040020000001200004003000000120000400400000041"}
    key_prefix: "/priority-default/"
  - name: pc_pods
    type: store_scan
    prefix: "/pods/"
    where: "spec.priority="
    paths: "spec.priorityClassName"
    watch: "/priority-default/,/priorityclasses/"
  - name: pc_list
    type: store_effect
    # chronicle-source: modules/app/_chronicle/priority.uproc r0_p
    decision: {hex: ""}
    key_prefix: "/"
  - name: pc_get
    type: store_effect
    # chronicle-source: modules/app/_chronicle/priority.uproc r1_p
    decision: {hex: ""}
    key_prefix: "/"
    paths: "preemptionPolicy"
    ints: "value"
  - name: pc_patch
    type: store_big
    # chronicle-source: modules/app/_chronicle/priority.uproc r2_p
    decision: {hex: ""}
    key_prefix: "/pods/"
  # CronJob is PARAMS (cronjob.uproc, cronjob_status.uproc), to Kubernetes'
  # semantics: the schedule (standard cron and descriptors; spec.timeZone
  # UTC or a fixed Etc/GMT±N offset) judged by the source (`cron`,
  # _shared/cron.rs) against the TRUSTED wall clock only — a board before
  # SNTP schedules nothing; concurrencyPolicy, startingDeadlineSeconds,
  # suspend, the history limits; status active / lastScheduleTime /
  # lastSuccessfulTime. Its state at /cron-last/<ns>/<cj>, its active Jobs
  # at /cron-active/<ns>/<cj>/<job>.
  - name: cj_src
    type: store_scan
    prefix: "/cronjobs.batch/"
    cron: "spec.schedule|spec.timeZone"
    paths: "spec.concurrencyPolicy,spec.suspend,spec.startingDeadlineSeconds,metadata.uid"
    ints: "metadata.creationTimestamp!unix,spec.startingDeadlineSeconds"
    related: "/cron-last/!flat:t#,t0#,rp#"
    count_children: "/cron-active/"
    child_sep: "/"
    watch: "/cron-active/,/cron-last/"
    # The clock not yet trusted: scan again (nothing changes in the store
    # when it becomes so).
    recheck: 10000
  - name: cj_run
    type: store_big
    stamp: 1
    schema: "create=metadata.uid:uuid,metadata.creationTimestamp:now;keep=metadata.uid,metadata.creationTimestamp"
    # chronicle-source: modules/app/_chronicle/cronjob.uproc run_p
    decision: {hex: ""}
    key_prefix: "/"
  - name: cj_rec
    type: store_effect
    # chronicle-source: modules/app/_chronicle/cronjob.uproc rec_p
    decision: {hex: ""}
    key_prefix: "/"
  - name: cj_jobs
    type: store_scan
    prefix: "/jobs.batch/"
    where: "metadata.ownerReferences.0.kind=CronJob"
    paths: "metadata.ownerReferences.0.name,metadata.uid,status.conditions[type=Complete].status,status.conditions[type=Failed].status,metadata.deletionTimestamp"
    ints: 'metadata.annotations."batch.kubernetes.io/cronjob-scheduled-timestamp"!unix,status.completionTime!unix'
    watch: "/cron-last/"
  - name: cj_aget
    type: store_effect
    # chronicle-source: modules/app/_chronicle/cronjob.uproc a0_p
