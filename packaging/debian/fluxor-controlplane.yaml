  # (/~node/<node>/pod-specs/<uid>: a worker's own). A graph-backed Pod's is
  # params (pod_specs.uproc: its graph, restartPolicy as the node spells it,
  # its limits); a Pod deleted outright, from its tomb, -> desired=deleted.
  - name: ps_pods
    type: store_scan
    prefix: "/pods/"
    paths: "metadata.uid,spec.nodeName,spec.containers.0.image,spec.restartPolicy!lower,metadata.deletionTimestamp,spec.runtimeClassName,spec.containers.0.resources.limits.cpu!milli,spec.containers.0.resources.limits.memory!bytes,spec.containers.0.resources.limits.ephemeral-storage!bytes,metadata.annotations!pick=nanocloud.io/paused,spec.hostNetwork"
  - name: ps_spec
    type: store_effect
    # chronicle-source: modules/app/_chronicle/pod_specs.uproc spec_p
    decision: {hex: ""}
    key_prefix: "/~node/"
  # A CONTAINER Pod's containers, each as its node's ask (pod_resolve,
  # _shared/podres.rs): <uid> for the first app container, <uid>~c<n> and
  # <uid>~i<n> for the others and the init containers — the environment
  # (Service links, envFrom, valueFrom, $(VAR)), command and args expanded,
  # the securityContext's user, the volumes, the init order. A Pod waiting
  # on a ConfigMap or Secret is resolved again every 3 s, so it starts once
  # that exists; a write that changes nothing spends no
  # revision. It shares ps_pods (one subscription), passing every record on
  # to ps_spec. A Pod being deleted gracefully (marked by the API's delete:
