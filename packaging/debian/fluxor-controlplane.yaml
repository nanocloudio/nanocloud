    # object, a Pod's or a ConfigMap's past a record, is read whole); a
    # Pod's node learns of the delete there.
    tomb: "/~tomb"
  - name: ns_source
    type: store_source
    prefix: "/namespaces/"
    paths: "status.phase"
    count_children: "/pods/,/services/,/endpoints/,/configmaps/,/secrets/,/serviceaccounts/,/pvcs/,/deployments.apps/,/replicasets.apps/,/daemonsets.apps/,/statefulsets.apps/,/jobs.batch/,/hpa/,/networkpolicies/"
    child_sep: "/"
    watch: "/pods/,/services/,/endpoints/,/configmaps/,/secrets/,/serviceaccounts/,/pvcs/,/deployments.apps/,/replicasets.apps/,/daemonsets.apps/,/statefulsets.apps/,/jobs.batch/,/hpa/,/networkpolicies/"
  - name: ns_remove
    type: store_effect
    # chronicle-source: modules/app/_chronicle/namespace.uproc fin
    decision: {hex: "010a000000290001000204000000120b005465726d696e6174696e6720010002160000001000000000000000002030000900000027000100020100000040010000001004000000000000004002000000010002030000004003000000410800000023000100020100000040010000001000000000000000004002000000120000400300000041"}
    key_prefix: "/namespaces/"
    # The namespace's own tomb, for a watch's DELETED.
    tomb: "/~tomb"
  # The node plane is not written here: it is spliced in (the KUBELET
  # placeholders below) by the render (nanocloud-graph.sh) when this node
  # also runs Pods (NANOCLOUD_PODS=1, a fresh install's cluster.env) — the
  # kubelet's chains (kubelet.yaml), the image pull (image.yaml) and this
  # node's lease — as a worker's graph carries them. What the control plane
  # writes for any node is that node's ask, /~node/<node>/pod-specs/<uid>
  # (ps_* below, from the scheduled Pods).
  # The scheduler is PARAMS (scheduler.uproc) over the source's pick
  # (store_source `sched`, _shared/sched.rs): each pending Pod judged against
  # the ready nodes as upstream's default profile judges it — cordon,
  # nodeSelector and node affinity, taints and tolerations, requests within
  # allocatable, pod (anti-)affinity, topology spread — and scored; position
  # 0 (bound this pass) to the first placeable Pod of the highest priority;
  # a Pod nothing fits gets PodScheduled=False/Unschedulable and a
  # FailedScheduling event; the first unplaceable Pod of the highest
  # priority may preempt lower-priority Pods (PodDisruptionBudgets honoured
  # as far as they can be). One bind per pass, the load measured from the
  # Pods themselves at pick time. Reads /ready-nodes/ from the DaemonSet
  # chain's projection.
  - name: sc_unbound
    type: store_scan
    prefix: "/pods/"
    where: "spec.nodeName="
    count: 1
    join: "/ready-nodes/"
    paths: "metadata.uid"
    sched: "/nodes/:/pods/:/poddisruptionbudgets/"
    sched_preempt: 1
    watch: "/ready-nodes/,/nodes/,/poddisruptionbudgets/"
  - name: sc_victim
    type: store_stamped
    # chronicle-source: modules/app/_chronicle/scheduler.uproc vict_p
    decision: {hex: ""}
    key_prefix: "/"
    # A preempted Pod leaves its tomb: its node learns of the delete.
    tomb: "/~tomb"
  - name: sc_patch
    type: store_big
    # chronicle-source: modules/app/_chronicle/scheduler.uproc bind_p
    decision: {hex: ""}
    key_prefix: "/pods/"
  - name: sc_events
    type: store_effect
    # chronicle-source: modules/app/_chronicle/scheduler.uproc record_p
    decision: {hex: ""}
    key_prefix: "/events/"
