  # last 300 s, one lane per target), and a PATCH of spec.replicas on the
  # target Deployment. Woken by the metric, never by its own write. A scale-up
  # applies at once; a scale-down after the window. Params from
  # modules/app/_chronicle/hpa.uproc and scripts/hpa-agg.sh.
  - name: hp_source
