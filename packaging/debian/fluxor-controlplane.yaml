    decision: {hex: "01080000001a000100021400000010c800000000000000500100021600000022000900000027000100020100000040010000001004000000000000004002000000010002030000004003000000410800000023000100020100000040010000001000000000000000004002000000120000400300000041"}
    key_prefix: "/events/"
    # An Event capped away leaves its tomb, for a watch's DELETED.
    tomb: "/~tomb"
  # Namespace teardown is PARAMS: a JOIN scoped to the namespace across every
  # namespaced tree — one record per object it contains — DELETEd while it is
  # Terminating; then count_children over the same trees, and at zero the
  # namespace record goes. Params from modules/app/_chronicle/namespace.uproc.
  - name: ns_objects
    type: store_source
    prefix: "/namespaces/"
    paths: "status.phase"
    join: "/pods/,/services/,/endpoints/,/configmaps/,/secrets/,/serviceaccounts/,/pvcs/,/deployments.apps/,/replicasets.apps/,/daemonsets.apps/,/statefulsets.apps/,/jobs.batch/,/hpa/,/networkpolicies/"
    join_scoped: 1
  - name: ns_collect
    type: store_stamped
    # chronicle-source: modules/app/_chronicle/namespace.uproc sw
    decision: {hex: "0105000000170001000204000000120b005465726d696e6174696e6720000900000027000100020100000040010000001004000000000000004002000000010002180000004003000000410800000023000100020100000040010000001000000000000000004002000000120000400300000041"}
