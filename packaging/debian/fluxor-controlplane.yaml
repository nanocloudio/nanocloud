# Complete fluxor-native control plane: every core control-plane fmod composed
# into ONE graph over the shared control-plane store. This is the graph the node
# boots — the API plane, every workload reconciler, the scheduler, and the
# supporting services, all as cooperating PIC modules. The leaf dataplane
# positions (dns, netpolicy, proxy, route, webhook, endpoints, sandbox, edge)
# deploy separately (node graph / scheduled StatefulSets); this graph is the
# control plane proper.
target: linux
tick_us: 1000

# Injects the `linux_net` built-in (host TCP via libc sockets) — the transport
# wave's `http` terminates. This is what lets the store stay single-writer: the
# HTTP front reaches the API lanes over a socket instead of writing the store
# file from a second process.
platform:
  net: {}

# Every reconciler self-wires status -> changes (a 1-node cycle) to allocate its
# store-change sink channel.
scheduler:
  accept_cycles: true

modules:
  - name: http
    port: 7443
    host_tcp: 1
    max_body_kib: 64
    routes:
      # `/api/` is a PREFIX; `/api` without the slash does not match it, so the
      # discovery documents that sit exactly on those paths need routes of
      # their own. Cheap, and it keeps the prefix rules unsurprising.
      - path: "/api/"
        app: true
      - path: "/apis/"
        app: true
      - path: "/api"
        app: true
      - path: "/apis"
        app: true
      - path: "/version"
        app: true
      - path: "/openapi/"
        app: true
      - path: "/metrics"
        app: true
      - path: "/healthz"
        app: true
  - name: kube_decode
    # Discovery documents are not resource paths, so they only reach the graph
    # at all with passthrough on. `admit` answers them by TARGET and 404s every
    # other unknown path, which is what makes the empty-field frame safe.
    passthrough: 1
  - name: admit
    type: decision
    params:
      # chronicle-source: modules/app/_chronicle/apiplane.uproc admit
      decision: ""
  - name: kagi_verify
    audience: "nanocloud"
    issuer: "https://kubernetes.default.svc"
    key_path: "/authn-keys/sa"
  - name: token_verify
  # Which of the two authentication methods produced the caller — a kagi-verified
  # bearer token, or an mTLS peer the TLS layer authenticated. Selecting it here
  # keeps ONE verb ladder in `authz` instead of one per identity source.
  - name: ident
    type: decision
    params:
      # chronicle-source: modules/app/_chronicle/apiplane.uproc ident
      decision: ""
  - name: authz
    type: decision
    params:
      # chronicle-source: modules/app/_chronicle/apiplane.uproc authz
      decision: ""
  - name: gate
    type: decision
    params:
      # chronicle-source: modules/app/_chronicle/apiplane.uproc gate
      decision: ""
  - name: probe
    type: decision
    params:
      # chronicle-source: modules/app/_chronicle/apiplane.uproc probe
      decision: ""
  - name: se_probe
    type: store_effect
    # A collection GET answers the Kubernetes `List` envelope. The items are the
    # objects themselves, read during the same prefix walk; the envelope is
    # these two literals, which is why they live in the graph and not in the
    # module.
    list_values: 1
    list_sep: ","
    list_open: "{\"kind\":\"List\",\"apiVersion\":\"v1\",\"items\":["
    list_close: "]}"
  - name: act
    type: decision
    params:
      # chronicle-source: modules/app/_chronicle/apiplane.uproc act
      decision: ""
  - name: se_act
    type: store_effect
  - name: reply
    type: decision
    params:
      # chronicle-source: modules/app/_chronicle/apiplane.uproc reply
      decision: "010500000012000100021f0000001000000000000000002000090000003300100000000000000000400100000010cc00000000000000400200000012000040030000001000000000000000004004000000410d00000031000100021e00000040010000000100021f000000400200000001000220000000400300000001000221000000400400000041"
  # ---- the WATCH chain: store changes -> events on a registered connection ----
  # Configured PER WATCHED PREFIX. One source per resource is the honest shape:
  # the prefix is a node parameter, and a graph that watches pods and configmaps
  # runs two of these.
  - name: ws_src
    type: store_source
    prefix: "/pods/"
    watch: "/pods/"
  - name: ws_event
    type: decision
    params:
      # chronicle-source: modules/app/_chronicle/apiplane_watch.uproc event
      decision: "000f0000003f00010002010000004001000000100700000000000000400200000001000203000000400300000001000201000000401e0000000100021c000000401f00000041"
  - name: ws_obj
    type: store_effect
    key_prefix: "/pods/"
    list_values: 1
    list_sep: ","
    list_open: "{\"type\":\"MODIFIED\",\"object\":"
    list_close: "}\n"
  - name: ws_reg
    type: decision
    params:
      # chronicle-source: modules/app/_chronicle/apiplane_watch.uproc reg
      decision: "001100000048000100021e000000400100000010010000000000000040020000000100021f00000040030000001201002f40110000000100021e000000401e00000001000203000000401f00000041"
  - name: ws_who
    type: store_effect
    key_prefix: "/watch-reg/pods/"
    flat: 1
    ints: "cid"
  - name: ws_emit
    type: decision
    params:
      # chronicle-source: modules/app/_chronicle/apiplane_watch.uproc emit
      decision: ""
  - name: enc_http
    type: pipeline
    params:
      # The read path's encoder, with ONE change: the envelope's flags byte is
      # no longer the literal 0 but field 4 of the record (`01 00 02 04…` push,
      # `62 01 01` INT width 1 LE). That is what lets one encoder serve both a
      # complete response and the first slice of a stream — a watch — without
      # a second node the graph would have to choose between, which a graph
      # edge cannot do.
      # chronicle-source: modules/app/_chronicle/apiplane.uproc encode
      ir_stages: "01ff310005000101000000120100000005000102000000120200000005000103000000120300000005000104000000120400000013"
      encode: "01000201000000620401010002020000006202010100020400000062010160010010600200000001000203000000646202016010006170706c69636174696f6e2f6a736f6e01000203000000616a"
  # TLS 1.3 termination. Server TLS (verify_peer=0) so bearer-token clients
  # (kubectl with a service-account token) work out of the box. For mandatory
  # mTLS set verify_peer=1 AND a peer-auth profile — `tls` refuses to construct
  # without one — which for a cluster is:
  #     verify_peer: 1
  #     peer_auth: 2                                   # chain to the CA below
  #     trust: "${file:/etc/nanocloud.io/certs/ca.der}"
  # Client certs must then be CA-issued with EKU clientAuth; the wired
  # peer_identity below carries the accepted leaf's SPIFFE SVID to `http`,
  # where rbac_gate binds it. See scripts/apiserver-mtls-e2e.sh for the whole
  # shape end to end. Certs are provisioned by the package (postinst generates
  # a self-signed node cert if absent).
  - name: tls
    mode: 1
    verify_peer: 0
    cert_file: "/etc/nanocloud.io/certs/server.der"
    key_file: "/etc/nanocloud.io/certs/server.key.der"
  # The two request-path nodes that are modules rather than params: a walk
  # over the binding set, and a count of live objects for a quota. Both answer
  # the chain over `request_in`/`response_out`; the meaning of their answers
  # stays in the decisions around them.
  - name: rbac_gate
  - name: api_admission
  - name: dp_source
    type: store_source
    prefix: "/deployments.apps/"
    paths: "spec,spec.replicas"
    hash: "spec.template"
  - name: dp_read
    type: decision
    params:
      # chronicle-source: modules/app/_chronicle/deployment.uproc rd
      decision: ""
  - name: dp_current
    type: store_effect
    key_prefix: "/replicasets.apps/"
    paths: "metadata.labels.pod-template-hash,spec"
  - name: dp_archive
    type: decision
    params:
      # chronicle-source: modules/app/_chronicle/deployment.uproc arch
      decision: ""
  - name: dp_history
    type: store_effect
    key_prefix: "/controllerrevisions.apps/"
  - name: dp_write
    type: decision
    params:
      # chronicle-source: modules/app/_chronicle/deployment.uproc wr
      decision: ""
  - name: dp_apply
    type: store_effect
    key_prefix: "/replicasets.apps/"
  - name: dp_record
    type: decision
    params:
      # chronicle-source: modules/app/_chronicle/deployment.uproc rec
      decision: ""
  - name: dp_events
    type: store_effect
    key_prefix: "/events/"
  # ReplicaSet convergence is PARAMS, not a module: the nine nodes below are
  # Chronicle's generic engines carrying params compiled from
  # `modules/app/_chronicle/replicaset.uproc`. Names are `rs_`-prefixed because
  # this graph holds twenty-five modules and `act`/`record` are not distinctive.
  #
  # The params are BAKED because a deb ships no compiler; each carries a
  # provenance marker that `scripts/chronicle-param-drift-e2e.sh` recompiles and
  # compares. A stale decision does not error — it decides something else.
  - name: rs_source
    type: store_source
    prefix: "/replicasets.apps/"
    paths: "spec.template.spec,metadata.labels.pod-template-hash"
    expand: "spec.replicas"
    # One past the desired count, so the first surplus ordinal is probed and
    # collected on the same pass that scales down.
    expand_tail: 4
    # ...and past the highest EXISTING child, whatever the count: a surplus far
    # above the count (scale 10 -> 1) is otherwise never probed, and orphaned.
    expand_over: "/pods/"
    # Watch the children too: a rolled Pod is DELETED and recreated on a later
    # pass, and without this nothing would wake the ReplicaSet to do it.
    watch: "/pods/"
  # Stage 1 — the PREDECESSOR, so a rollout proceeds strictly in ordinal order.
  # Roll ordinal i only when i is stale and i-1 is already fresh: that is what
  # maxUnavailable = 1 means, with no budget to spend.
  - name: rs_prev
    type: decision
    params:
      # chronicle-source: modules/app/_chronicle/replicaset.uproc prev
      decision: ""
  - name: rs_prevget
    type: store_effect
    key_prefix: "/pods/"
    paths: "metadata.labels.pod-template-hash"
  # Stage 2 — THIS ordinal, carrying the predecessor verdict.
  - name: rs_probe
    type: decision
    params:
      # chronicle-source: modules/app/_chronicle/replicaset.uproc ask
      decision: ""
  - name: rs_selfget
    type: store_effect
    key_prefix: "/pods/"
    paths: "metadata.labels.pod-template-hash"
  # Stage 3 — create, delete, roll, or nothing.
  - name: rs_act
    type: decision
    params:
      # chronicle-source: modules/app/_chronicle/replicaset.uproc act
      decision: ""
  - name: rs_apply
    type: store_effect
    key_prefix: "/pods/"
  # Stage 4 — record what stage 3 did. The write's own reply carries the tag
  # saying which branch fired, so the event is decided from the effect that
  # produced it rather than guessed from a second read of the store.
  - name: rs_record
    type: decision
    params:
      # chronicle-source: modules/app/_chronicle/replicaset.uproc rec
      decision: ""
  - name: rs_events
    type: store_effect
    key_prefix: "/events/"
  # DaemonSet is PARAMS, not a module. Thirteen ds_* nodes carry the readiness
  # projection (/nodes/ -> /ready-nodes/),
  # the placement (DaemonSets JOIN ready Nodes -> create-if-absent, node-pinned),
  # and the prune (a DaemonSet Pod whose Node is no longer ready). The cross
  # product is the source's — `join` — as the count was for ReplicaSet.
  # Params compiled from modules/app/_chronicle/daemonset.uproc.
  - name: ds_nodes
    type: store_source
    prefix: "/nodes/"
    paths: "status.ready"
  - name: ds_ready
    type: decision
    params:
      # chronicle-source: modules/app/_chronicle/daemonset.uproc rdy
      decision: "01050000001000010002040000001204007472756520000b00000030000100020100000040010000001003000000000000004002000000010002030000004003000000120100314004000000410b0000002f000100020100000040010000001004000000000000004002000000010002030000004003000000120000400400000041"
  - name: ds_mark
    type: store_effect
    key_prefix: "/ready-nodes/"
  - name: ds_source
    type: store_source
    prefix: "/daemonsets.apps/"
    paths: "spec.template.spec.*"
    join: "/ready-nodes/"
    watch: "/ready-nodes/,/pods/"
  - name: ds_probe
    type: decision
    params:
      # chronicle-source: modules/app/_chronicle/daemonset.uproc prb
      decision: "001b0000006f00010002010000004001000000100200000000000000400200000001000218000000400300000001000218000000401e00000001000204000000401f0000000100021500000040200000000100021c00000040220000000100021d00000040230000000100021a000000402700000041"
  - name: ds_exists
    type: store_effect
    key_prefix: "/pods/"
  - name: ds_create
    type: decision
    params:
      # chronicle-source: modules/app/_chronicle/daemonset.uproc mk
      decision: ""
  - name: ds_apply
    type: store_effect
    key_prefix: "/pods/"
  - name: ds_pods
    type: store_source
    prefix: "/pods/"
    paths: "metadata.ownerReferences.0.kind,spec.nodeName"
    watch: "/ready-nodes/"
  - name: ds_ask
    type: decision
    params:
      # chronicle-source: modules/app/_chronicle/daemonset.uproc ask
      decision: ""
  - name: ds_known
    type: store_effect
    key_prefix: "/ready-nodes/"
  - name: ds_prune
    type: decision
    params:
      # chronicle-source: modules/app/_chronicle/daemonset.uproc prn
      decision: "0105000000120001000202000000109401000000000000200009000000270001000201000000400100000010040000000000000040020000000100021e0000004003000000410800000023000100020100000040010000001000000000000000004002000000120000400300000041"
  - name: ds_collect
    type: store_effect
    key_prefix: "/pods/"
  # StatefulSet is PARAMS: the ReplicaSet chain with the gate asked of the
  # NEIGHBOUR that matters — the predecessor's readiness in range, the
  # successor's absence for a surplus — so bring-up is ordered and teardown is
  # highest-first without a budget. Params from modules/app/_chronicle/statefulset.uproc.
  - name: st_source
    type: store_source
    prefix: "/statefulsets.apps/"
    paths: "spec.template.spec,spec.replicas"
    expand: "spec.replicas"
    expand_tail: 2
    expand_over: "/pods/"
    watch: "/pods/"
  - name: st_nb
    type: decision
    params:
      # chronicle-source: modules/app/_chronicle/statefulset.uproc nb
      decision: ""
  - name: st_nbget
    type: store_effect
    key_prefix: "/pods/"
    paths: "status.ready"
  - name: st_probe
    type: decision
    params:
      # chronicle-source: modules/app/_chronicle/statefulset.uproc ask
      decision: ""
  - name: st_selfget
    type: store_effect
    key_prefix: "/pods/"
  - name: st_act
    type: decision
    params:
      # chronicle-source: modules/app/_chronicle/statefulset.uproc act
      decision: ""
  - name: st_apply
    type: store_effect
    key_prefix: "/pods/"
  # Job is PARAMS: launch once (expanded by spec.completions, create-if-absent,
  # never recreated), the per-pod done fact (/job-done/), and the status —
  # "how many of mine succeeded" is a per-object fold the source performs
  # (count_children) and a decision states. Params from modules/app/_chronicle/job.uproc.
  - name: jb_source
    type: store_source
    prefix: "/jobs.batch/"
    paths: "spec.template.spec,spec.completions"
    expand: "spec.completions"
    expand_tail: 0
    watch: "/pods/"
  - name: jb_probe
    type: decision
    params:
      # chronicle-source: modules/app/_chronicle/job.uproc prb
      decision: ""
  - name: jb_exists
    type: store_effect
    key_prefix: "/pods/"
  - name: jb_launch
    type: decision
    params:
      # chronicle-source: modules/app/_chronicle/job.uproc mk
      decision: ""
  - name: jb_apply
    type: store_effect
    key_prefix: "/pods/"
  - name: jb_pods
    type: store_source
    prefix: "/pods/"
    paths: "metadata.ownerReferences.0.kind,status.phase"
  - name: jb_done
    type: decision
    params:
      # chronicle-source: modules/app/_chronicle/job.uproc dn
      decision: ""
  - name: jb_mark
    type: store_effect
    key_prefix: "/job-done/"
  - name: jb_jobs
    type: store_source
    prefix: "/jobs.batch/"
    paths: "spec.completions"
    desired: "spec.completions"
    count_children: "/job-done/"
    watch: "/job-done/"
  - name: jb_status
    type: decision
    params:
      # chronicle-source: modules/app/_chronicle/job.uproc st
      decision: ""
  - name: jb_write
    type: store_effect
    key_prefix: "/job-status/"
  # HPA is PARAMS: three reads and one arithmetic decision — desired =
  # ceil(current * cpu / target), clamped to [min, max] — ending in a PATCH of
  # spec.replicas on the target Deployment. Woken by the metric, never by its
  # own write. Params from modules/app/_chronicle/hpa.uproc.
  - name: hp_source
    type: store_source
    prefix: "/hpa/"
    paths: "spec.scaleTargetRef.name"
    ints: "spec.minReplicas,spec.maxReplicas,spec.targetCPUUtilizationPercentage"
    watch: "/hpa-metrics/"
  - name: hp_dep
    type: decision
    params:
      # chronicle-source: modules/app/_chronicle/hpa.uproc rd
      decision: ""
  - name: hp_depget
    type: store_effect
    key_prefix: "/deployments.apps/"
    ints: "spec.replicas"
  - name: hp_met
    type: decision
    params:
      # chronicle-source: modules/app/_chronicle/hpa.uproc mt
      decision: ""
  - name: hp_metget
    type: store_effect
    key_prefix: "/hpa-metrics/"
    flat: 1
    ints: "cpu"
  - name: hp_scale
    type: decision
    params:
      # chronicle-source: modules/app/_chronicle/hpa.uproc sc
      decision: ""
  - name: hp_patch
    type: store_effect
    key_prefix: "/deployments.apps/"
  # The ownerRef cascade is PARAMS, not a module. These thirteen nodes are two
  # sweeps — the SAME two decisions over different
  # prefixes, nothing recompiled — and the Events count-cap, a fold over a set
  # expressed as a per-record decision because store_source's `count` mode
  # stamps every record with its position and the total.
  #
  #   pods        <- replicasets   gc_pod_*
  #   replicasets <- deployments   gc_rs_*
  #   /events/ capped at 200       gc_ev_*
  #
  # Params are BAKED (a deb ships no compiler) and carry provenance markers
  # that `scripts/chronicle-param-drift-e2e.sh` recompiles and compares.
  - name: gc_pod_source
    type: store_source
    prefix: "/pods/"
    paths: "metadata.ownerReferences.0.name"
    # The cascade: when an owner is collected its children are orphans NOW,
    # and nothing under the children's prefix changed to say so.
    watch: "/replicasets.apps/"
  - name: gc_pod_probe
    type: decision
    params:
      # chronicle-source: modules/app/_chronicle/gc.uproc ask
      decision: ""
  - name: gc_pod_owner
    type: store_effect
    key_prefix: "/replicasets.apps/"
  - name: gc_pod_sweep
    type: decision
    params:
      # chronicle-source: modules/app/_chronicle/gc.uproc act
      decision: ""
  - name: gc_pod_collect
    type: store_effect
    key_prefix: "/pods/"
  - name: gc_rs_source
    type: store_source
    prefix: "/replicasets.apps/"
    paths: "metadata.ownerReferences.0.name"
    # The cascade: when an owner is collected its children are orphans NOW,
    # and nothing under the children's prefix changed to say so.
    watch: "/deployments.apps/"
  - name: gc_rs_probe
    type: decision
    params:
      # chronicle-source: modules/app/_chronicle/gc.uproc ask
      decision: ""
  - name: gc_rs_owner
    type: store_effect
    key_prefix: "/deployments.apps/"
  - name: gc_rs_sweep
    type: decision
    params:
      # chronicle-source: modules/app/_chronicle/gc.uproc act
      decision: ""
  - name: gc_rs_collect
    type: store_effect
    key_prefix: "/replicasets.apps/"
  - name: gc_ev_source
    type: store_source
    prefix: "/events/"
    count: 1
  - name: gc_ev_cap
    type: decision
    params:
      # chronicle-source: modules/app/_chronicle/gc.uproc evcap
      decision: "01080000001a000100021400000010c800000000000000500100021600000022000900000027000100020100000040010000001004000000000000004002000000010002030000004003000000410800000023000100020100000040010000001000000000000000004002000000120000400300000041"
  - name: gc_ev_collect
    type: store_effect
    key_prefix: "/events/"
  # Namespace teardown is PARAMS: a JOIN scoped to the namespace across every
  # namespaced tree — one record per object it contains — DELETEd while it is
  # Terminating; then count_children over the same trees, and at zero the
  # namespace record goes. Params from modules/app/_chronicle/namespace.uproc.
  - name: ns_objects
    type: store_source
    prefix: "/namespaces/"
    paths: "status.phase"
    join: "/pods/,/services/,/endpoints/,/configmaps/,/secrets/,/serviceaccounts/,/pvcs/,/deployments.apps/,/replicasets.apps/,/daemonsets.apps/,/statefulsets.apps/,/jobs.batch/,/hpa/,/networkpolicies/"
    join_scoped: 1
  - name: ns_sweep
    type: decision
    params:
      # chronicle-source: modules/app/_chronicle/namespace.uproc sw
      decision: "0105000000170001000204000000120b005465726d696e6174696e6720000900000027000100020100000040010000001004000000000000004002000000010002180000004003000000410800000023000100020100000040010000001000000000000000004002000000120000400300000041"
  - name: ns_collect
    type: store_effect
  - name: ns_source
    type: store_source
    prefix: "/namespaces/"
    paths: "status.phase"
    count_children: "/pods/,/services/,/endpoints/,/configmaps/,/secrets/,/serviceaccounts/,/pvcs/,/deployments.apps/,/replicasets.apps/,/daemonsets.apps/,/statefulsets.apps/,/jobs.batch/,/hpa/,/networkpolicies/"
    child_sep: "/"
    watch: "/pods/,/services/,/endpoints/,/configmaps/,/secrets/,/serviceaccounts/,/pvcs/,/deployments.apps/,/replicasets.apps/,/daemonsets.apps/,/statefulsets.apps/,/jobs.batch/,/hpa/,/networkpolicies/"
  - name: ns_finalize
    type: decision
    params:
      # chronicle-source: modules/app/_chronicle/namespace.uproc fin
      decision: "010a000000290001000204000000120b005465726d696e6174696e6720010002160000001000000000000000002030000900000027000100020100000040010000001004000000000000004002000000010002030000004003000000410800000023000100020100000040010000001000000000000000004002000000120000400300000041"
  - name: ns_remove
    type: store_effect
    key_prefix: "/namespaces/"
  # The node plane is NOT here. Nothing in the control plane writes
  # /pod-specs/, so the pod-lifecycle chain belongs to the image plane
  # (`fluxor-image-fetch.yaml` -> /etc/nanocloud.io/fluxor/image-plane.yaml),
  # which the deb installs alongside this one and which carries the whole
  # chain: pull, resolve, project, lifecycle, prune. It also keeps this graph
  # inside MAX_MODULES — that chain is 35 nodes, and 101 + 35 is past 128.
  # The scheduler is PARAMS: the FIRST unbound Pod (where spec.nodeName=,
  # count index 0) JOIN /ready-nodes/ picked by the fewest Pods bound to it —
  # measured from the Pods themselves at pick time — PATCHes spec.nodeName;
  # one bind per pass, the spread emergent. Then the Scheduled event. Reads
  # /ready-nodes/ from the DaemonSet chain's projection. Params from
  # modules/app/_chronicle/scheduler.uproc.
  - name: sc_unbound
    type: store_source
    prefix: "/pods/"
    where: "spec.nodeName="
    count: 1
    join: "/ready-nodes/"
    join_pick: "mincount:/pods/:spec.nodeName"
    watch: "/ready-nodes/"
  - name: sc_bind
    type: decision
    params:
      # chronicle-source: modules/app/_chronicle/scheduler.uproc bd
      decision: ""
  - name: sc_patch
    type: store_effect
    key_prefix: "/pods/"
  - name: sc_record
    type: decision
    params:
      # chronicle-source: modules/app/_chronicle/scheduler.uproc rc
      decision: ""
  - name: sc_events
    type: store_effect
    key_prefix: "/events/"
  - name: service_ipam
  - name: cni_ipam
  - name: image_puller
  - name: volume_manager
  # VolumeSnapshot is PARAMS: create the bound VolumeSnapshotContent, then
  # PATCH the VolumeSnapshot's status to bind it and mark it ready; gated on
  # readyToUse. Params from modules/app/_chronicle/snapshot.uproc.
  - name: sn_source
    type: store_source
    prefix: "/volumesnapshots.snapshot.storage.k8s.io/"
    paths: "status.readyToUse,spec.source.persistentVolumeClaimName"
  - name: sn_content
    type: decision
    params:
      # chronicle-source: modules/app/_chronicle/snapshot.uproc ct
      decision: ""
  - name: sn_contents
    type: store_effect
    key_prefix: "/volumesnapshotcontents.snapshot.storage.k8s.io/"
  - name: sn_bind
    type: decision
    params:
      # chronicle-source: modules/app/_chronicle/snapshot.uproc bd
      decision: ""
  - name: sn_status
    type: store_effect
    key_prefix: "/volumesnapshots.snapshot.storage.k8s.io/"
  # DEVELOPMENT DECLARATION — see `crypto_signer`'s development gate. It is a
  # KEY_VAULT conformance fixture, and it signs ANY message written to
  # `/sign-req/<id>`. In a graph anything else can write to, that is a signing
  # oracle over a vault-held key.
  - name: crypto_signer
    params:
      development: 1
  # DEVELOPMENT DECLARATION, not a preference. `cert_manager` refuses to
  # construct without it — see the development gate in its `mod.rs`. It
  # regenerates its CA at every startup, returns leaf PRIVATE KEYS as
  # plaintext hex on the control-plane store, and lets the caller choose its own
  # CN/DNS/SPIFFE. A deployment issues from kagi's `certificate_endpoint`.
  #
  # It stands only because nothing else answers the `/cert-req/` seam
  # `device_reconciler` writes to, and removing an issuer before its
  # replacement exists is a regression rather than a fix. What the flag buys
  # is that any graph naming this module fails closed instead of quietly
  # inheriting an issuing authority.
  - name: cert_manager
    params:
      development: 1
  - name: sa_token

