# route-validator workload graph.
#
# A Route is validated by a Chronicle decision compiled from
# modules/app/_chronicle/route_validator.uproc; the three modules below only
# move bytes. The rules — first-error, in spec order — live in the `decision`
# param rather than in any .fmod, which is the point of the params form.
#
# The store contract: watch /routes/, write /route-status/<ns>/<name> =
# "ready=1;endpoint=<svc>:<port>" | "ready=0;msg=…", guarded, so
# route_compiler's ready=1 gate reads a settled verdict.
target: linux
tick_us: 1000

# Self-edges (change-sink allocators) are deliberate 1-node cycles.
scheduler:
  accept_cycles: true

modules:
  # Watch /routes/ and project the four fields the rules decide on. Depth 2 and
  # 3 JSON paths — Chronicle's record frame is flat and it has no path reader,
  # so the projection happens here.
  - name: store_source
    prefix: "/routes/"
    paths: "spec.host,spec.to.name,spec.port,spec.path"

  # The rules, as data.
  - name: validate
    type: decision
    params:
      # chronicle-source: modules/app/_chronicle/route_validator.uproc check
      #
      # A baked param has no link to the source it came from, and a stale one
      # does not error -- it decides something else. That marker is the link:
      # scripts/chronicle-param-drift-e2e.sh recompiles every graph carrying one
      # and fails if the bytes differ. The param stays baked because a deb has
      # no compiler; the marker is what keeps it honest.
      decision: ""

  # Guarded PUT to /route-status/. `response_out` is deliberately unwired: this
  # is the end of the chain and has nobody to answer.
  - name: store_effect
    key_prefix: "/route-status/"

wiring:
  - from: store_source.status
    to: store_source.changes

  # NO buffer_group: a Chronicle engine self-frames over a byte stream
  # (io_core::admit_frame peeks, reads the length, consumes exactly that), so a
  # mailbox channel breaks its partial read.
  - from: store_source.record_out
    to: validate.record_in

  # store_effect reads a whole record per step and declares its input framed, so
  # the build requires mailbox mode here.
  - from: validate.result_out
    to: store_effect.request_in
    buffer_group: 1
