# The kubelet's DECISION half as params.
# Three chains and no compiled controller:
#
#   project    /pod-specs/ -> the artifact fields of /sandboxes/<uid> (or
#              /metal-sandboxes/), and the /pod-runtime/ record the state
#              machine runs on. MERGE, so this chain owns the artifact and
#              the lifecycle chain owns `phase=` without either restating
#              the other's half.
#   lifecycle  /pod-runtime/ -> ONE decision of 29 arms (the two-phase kill,
#              the backoff ladder, terminated/destroyed/running/paused)
#              -> the runtime MERGE, the kill key, the sandbox phase, the pod
#              phase, the event. The source stamps the clock (58), arms a
#              kernel timer for whichever deadline is nearest (`due`), and
#              looks the same uid up under every other plane (`related`).
#   prune      a /pod-runtime/ whose /pod-specs/ is gone
target: linux
tick_us: 1000
scheduler:
  accept_cycles: true
modules:
  # (the runtime block of packaging/debian/fluxor-sandbox.yaml — kept identical; scripts/support/sandbox-block.py)
  # ── sandbox ────────────────────────────────────────────────────────────
  - name: wl
    type: workload_effect
    # A pulled workload image's layers (http_fetch's `dir`).
    blobs: "/var/lib/nanocloud.io/image/blobs"
  - name: sb_spec
    type: store_source
    prefix: "/sandboxes/"
    flat: 1
    paths: "phase,cmd,rootfs,iso,net,tasks"
    count_children: "/volume-binds/"
    list_children: "/volume-binds/"
    list_values: 1
    child_sep: "/"
    related: "/sandbox-status/:state;/ipam-lease/:.;/ipam-pool^9:.!prefix;/sandbox-boot^9:id;/pod-specs/:volumes!count#,desired;/sandbox-boot-of/:."
    watch: "/sandbox-status/,/ipam-lease/,/sandbox-boot,/volume-binds/,/sandbox-boot-of/"
  - name: sb_specd
    type: decision
    params:
      # chronicle-source: modules/app/_chronicle/sandbox.uproc sb_spec
      decision: {hex: ""}
  # A graph-backed sandbox: the same decision over /metal-sandboxes/, where a
  # Pod with runtimeClassName fluxor lands (pod_project). The kernel realises
  # its FLXA (/graphs/<graph>) as modules of the node's image — no rootfs,
  # binds or lease to wait for.
  - name: sb_mspec
    type: store_source
    prefix: "/metal-sandboxes/"
    flat: 1
    paths: "phase,graph,pack"
    related: "/sandbox-status/:state;/sandbox-boot^9:id;/sandbox-boot-of/:.;/pod-specs/:desired"
    watch: "/sandbox-status/,/sandbox-boot,/sandbox-boot-of/"
  - name: sb_mspecd
    type: decision
    params:
      # chronicle-source: modules/app/_chronicle/sandbox.uproc sb_mspec
      decision: {hex: ""}
  - name: sb_exec
    type: store_source
    prefix: "/sandbox-exec/"
    rev: 1
    paths: "."
    unless: "/sandbox-exec-result/"
    related: "/sandbox-status/^1!flat:state;/sandboxes/^1!flat:phase"
    watch: "/sandbox-status/"
  - name: sb_execd
    type: decision
    params:
      # chronicle-source: modules/app/_chronicle/sandbox.uproc sb_exec
      decision: {hex: ""}
  - name: sb_sig
    type: store_source
    prefix: "/sandbox-kill/"
    paths: "."
    # A signal for a sandbox not live yet is re-offered once it is.
    watch: "/sandbox-status/"
  - name: sb_pause
    type: store_source
    prefix: "/sandbox-pause/"
    paths: "."
    watch: "/sandbox-status/"
  - name: sb_sigd
    type: decision
    params:
      # chronicle-source: modules/app/_chronicle/sandbox.uproc sb_sig
      decision: {hex: ""}
  - name: sb_paused
    type: decision
    params:
      # chronicle-source: modules/app/_chronicle/sandbox.uproc sb_sig
      decision: {hex: ""}
  - name: sb_tty
    type: store_source
    prefix: "/tty/"
    flat: 1
    rev: 1
    paths: ".,rows,cols,cmd"
    related: "/tty/^1+status:."
    # An open waits for its sandbox to run: re-offered when that changes.
    watch: "/sandbox-status/"
  - name: sb_ttyd
    type: decision
    params:
      # chronicle-source: modules/app/_chronicle/sandbox.uproc sb_tty
      decision: {hex: ""}
  - name: sb_ev
    type: store_effect
    # chronicle-source: modules/app/_chronicle/sandbox.uproc sb_ev
    decision: {hex: ""}
    append_cap: 1024
  - name: sb_evout
    type: store_effect
    # chronicle-source: modules/app/_chronicle/sandbox.uproc sb_evout
    decision: {hex: ""}
  # volumes
  - name: vb_src
    type: store_source
    prefix: "/pod-specs/"
    flat: 1
    expand: "volumes[]"
    paths: "volumes.#"
    watch: "/volumes/"
  - name: vb_get
    type: store_effect
    # chronicle-source: modules/app/_chronicle/volume.uproc vb_get
    decision: {hex: ""}
    key_prefix: "/volumes/"
    flat: 1
    paths: "path"
  - name: vb_put
    type: store_effect
    # chronicle-source: modules/app/_chronicle/volume.uproc vb_put
    decision: {hex: ""}
    key_prefix: "/volume-binds/"
  - name: vb_rows
    type: store_source
    prefix: "/volume-binds/"
    rev: 1
    related: "/pod-specs/^1:."
    watch: "/pod-specs/"
  - name: vb_prune
    type: store_effect
    # chronicle-source: modules/app/_chronicle/volume.uproc vb_prune
    decision: {hex: "01050000000c000100024600000012000020000c0000003300010002010000004001000000100400000000000000400200000001000203000000400300000001000202000000401c000000410a000000310001000201000000400100000010000000000000000040020000001200004003000000100000000000000000401c00000041"}
    key_prefix: "/volume-binds/"
  # ── sandbox end ────────────────────────────────────────────────────────
  # Liveness/readiness probes are PARAMS (probe.uproc, probe_collect.uproc):
  # per-probe state at /probe-rt-<l|r>/<uid> (its due/deadline arm the timer),
  # exec attempts over the /sandbox-exec/ seam, verdicts at /probe-status/.
  - name: pb_spec
    type: store_source
    prefix: "/pod-specs/"
    flat: 1
    paths: "lp_cmd,rp_cmd"
  - name: pb_seed_l
    type: store_effect
    # chronicle-source: modules/app/_chronicle/probe.uproc sd_l
    decision: {hex: ""}
  - name: pb_seed_r
    type: store_effect
    # chronicle-source: modules/app/_chronicle/probe.uproc sd_r
    decision: {hex: ""}
  - name: pb_tl
    type: store_source
    prefix: "/probe-rt-l/"
    flat: 1
    ints: "inflight,due,deadline,seq,fails,oks,verdict"
    now: 1
    due: "due,deadline"
    related: "/pod-specs/!flat:lp_cmd,lp_period#,lp_timeout#,lp_fail#,lp_succ#;/sandbox-status/!flat:state"
    watch: "/pod-specs/,/sandbox-status/"
  - name: pb_tl_rt
    type: store_effect
    # chronicle-source: modules/app/_chronicle/probe.uproc tk_l
    decision: {hex: ""}
    key_prefix: "/probe-rt-l/"
  - name: pb_tl_res
    type: store_effect
    # chronicle-source: modules/app/_chronicle/probe.uproc sm_res
    decision: {hex: ""}
  - name: pb_tl_out
    type: store_effect
    # chronicle-source: modules/app/_chronicle/probe.uproc sm_out
    decision: {hex: ""}
  - name: pb_tl_req
    type: store_effect
    # chronicle-source: modules/app/_chronicle/probe.uproc sm_req
    decision: {hex: ""}
  - name: pb_tr
    type: store_source
    prefix: "/probe-rt-r/"
    flat: 1
    ints: "inflight,due,deadline,seq,fails,oks,verdict"
    now: 1
    due: "due,deadline"
    related: "/pod-specs/!flat:rp_cmd,rp_period#,rp_timeout#,rp_fail#,rp_succ#;/sandbox-status/!flat:state"
    watch: "/pod-specs/,/sandbox-status/"
  - name: pb_tr_rt
    type: store_effect
    # chronicle-source: modules/app/_chronicle/probe.uproc tk_r
    decision: {hex: ""}
    key_prefix: "/probe-rt-r/"
  - name: pb_tr_res
    type: store_effect
    # chronicle-source: modules/app/_chronicle/probe.uproc sm_res
    decision: {hex: ""}
  - name: pb_tr_out
    type: store_effect
    # chronicle-source: modules/app/_chronicle/probe.uproc sm_out
    decision: {hex: ""}
  - name: pb_tr_req
    type: store_effect
    # chronicle-source: modules/app/_chronicle/probe.uproc sm_req
    decision: {hex: ""}
  - name: pb_res
    type: store_source
    prefix: "/sandbox-exec-result/"
    paths: "."
  - name: pb_get
    type: store_effect
    # chronicle-source: modules/app/_chronicle/probe_collect.uproc cl_get
    decision: {hex: ""}
    flat: 1
    ints: "inflight,fails,oks,verdict,fail_n,succ_n"
  - name: pb_dreq
    type: store_effect
    # chronicle-source: modules/app/_chronicle/probe_collect.uproc cl_req
    decision: {hex: ""}
  - name: pb_dres
    type: store_effect
    # chronicle-source: modules/app/_chronicle/probe_collect.uproc cl_res
    decision: {hex: ""}
  - name: pb_dout
    type: store_effect
    # chronicle-source: modules/app/_chronicle/probe_collect.uproc cl_out
    decision: {hex: ""}
  - name: pb_fold
    type: store_effect
    # chronicle-source: modules/app/_chronicle/probe_collect.uproc cl_fold
    decision: {hex: ""}
  - name: pb_pods
    type: store_source
    prefix: "/pod-specs/"
    related: "/probe-rt-l/!flat:seq,verdict#;/probe-rt-r/!flat:seq,verdict#"
    watch: "/probe-rt-l/,/probe-rt-r/"
  - name: pb_pub
    type: store_effect
    # chronicle-source: modules/app/_chronicle/probe_collect.uproc pub
    decision: {hex: ""}
    key_prefix: "/probe-status/"
  - name: pb_gone
    type: store_source
    prefix: "/probe-status/"
    unless: "/pod-specs/"
  - name: pb_gone_e
    type: store_effect
    # chronicle-source: modules/app/_chronicle/probe_collect.uproc gone
    decision: {hex: "000b0000002f000100020100000040010000001004000000000000004002000000010002030000004003000000120000400400000041"}
    key_prefix: "/probe-status/"

  # ── project ──────────────────────────────────────────────────────────
  - name: pj_source
    type: store_source
    prefix: "/pod-specs/"
    flat: 1
    paths: "cmd,rootfs,iso,net,tasks,graph"
    related: "/pod-resolved/:rootfs,cmd"
    watch: "/pod-resolved/"
  - name: pj_sandbox
    type: store_effect
    # chronicle-source: modules/app/_chronicle/pod_project.uproc art
    decision: {hex: ""}
    key_prefix: "/sandboxes/"
  - name: pj_runtime
    type: store_effect
    # chronicle-source: modules/app/_chronicle/pod_project.uproc rt
    decision: {hex: "000c0000003a000100020100000040010000001006000000000000004002000000010002fe000000021e00000040030000001206007365656e3d31400400000041"}
    key_prefix: "/pod-runtime/"
  - name: pj_msource
    type: store_source
    prefix: "/pod-specs/"
    flat: 1
    paths: "cmd,rootfs,iso,net,tasks,graph,image"
    related: "/pod-resolved/:rootfs"
    watch: "/pod-resolved/"
  - name: pj_metal
    type: store_effect
    # chronicle-source: modules/app/_chronicle/pod_project.uproc mtl
    decision: {hex: ""}
    key_prefix: "/metal-sandboxes/"

  # ── image: a reference resolved to a rootfs and an argv ──────────────
  - name: pi_source
    type: store_source
    prefix: "/pod-specs/"
    flat: 1
    paths: "image,image!repo,image!tag,image!flat,rootfs,cmd"
    watch: "/image-rootfs/,/image-config/"
  - name: pi_requests
    type: store_effect
    # chronicle-source: modules/app/_chronicle/pod_image.uproc rq
    decision: {hex: ""}
    key_prefix: "/image-requests/"
  - name: pi_rootfs
    type: store_effect
    # chronicle-source: modules/app/_chronicle/pod_image.uproc ar
    decision: {hex: ""}
    key_prefix: "/image-rootfs/"
    flat: 1
    paths: "state,path"
  - name: pi_config
    type: store_effect
    # chronicle-source: modules/app/_chronicle/pod_image.uproc ac
    decision: {hex: ""}
    key_prefix: "/image-config/"
    flat: 1
    paths: "entrypoint!argv,cmd!argv"
  - name: pi_resolved
    type: store_effect
    # chronicle-source: modules/app/_chronicle/pod_image.uproc rs
    decision: {hex: ""}
    key_prefix: "/pod-resolved/"

  # ── lifecycle ────────────────────────────────────────────────────────
  - name: pl_source
    type: store_source
    prefix: "/pod-runtime/"
    flat: 1
    ints: "kill_phase,kill_deadline,backoff_until,run_started,paused_since,restarts,was_terminal"
    now: 1
    due: "kill_deadline,backoff_until"
    related: "/pod-specs/:cmd,desired,restart,rootfs,graph,grace#,pod;/sandbox-status/:state,code;/probe-status/:live;/sandboxes/:cmd;/sandbox-boot^9:id;/sandbox-boot-of/:."
    watch: "/pod-specs/,/sandbox-status/,/probe-status/,/sandboxes/,/sandbox-boot,/sandbox-boot-of/"
  - name: pl_runtime
    type: store_effect
    # chronicle-source: modules/app/_chronicle/pod_lifecycle.uproc st
    decision: {hex: ""}
    key_prefix: "/pod-runtime/"
  - name: pl_kill
    type: store_effect
    # chronicle-source: modules/app/_chronicle/pod_effect.uproc kl
    decision: {hex: ""}
    key_prefix: "/sandbox-kill/"
  - name: pl_sandbox
    type: store_effect
    # chronicle-source: modules/app/_chronicle/pod_effect.uproc sb
    decision: {hex: ""}
    key_prefix: "/sandboxes/"
  - name: pl_metal
    type: store_effect
    # chronicle-source: modules/app/_chronicle/pod_effect.uproc mt
    decision: {hex: ""}
    key_prefix: "/metal-sandboxes/"
  - name: pl_status
    type: store_effect
    # chronicle-source: modules/app/_chronicle/pod_effect.uproc st
    decision: {hex: ""}
    key_prefix: "/pod-lifecycle-status/"
  # The phase, reported to the plane under a prefix the node does not scope.
  - name: pl_report
    type: store_effect
    # chronicle-source: modules/app/_chronicle/pod_effect.uproc rp
    decision: {hex: ""}
    key_prefix: "/podstatus/"
  - name: pl_events
    type: store_effect
    # chronicle-source: modules/app/_chronicle/pod_effect.uproc ev
    decision: {hex: ""}
    key_prefix: "/events/"

  # ── prune ────────────────────────────────────────────────────────────
  - name: pr_source
    type: store_source
    prefix: "/pod-runtime/"
    related: "/sandbox-status/!flat:state;/metal-sandboxes/!flat:graph"
    watch: "/pod-specs/,/sandbox-status/"
  - name: pr_exists
    type: store_effect
    # chronicle-source: modules/app/_chronicle/pod_project.uproc ak
    decision: {hex: "00140000004600010002010000004001000000100200000000000000400200000001000203000000400300000001000203000000010002460000000100025000000042031e1f2040fe00000041"}
    key_prefix: "/pod-specs/"
  - name: pr_drop
    type: store_effect
    # chronicle-source: modules/app/_chronicle/pod_project.uproc pr
    decision: {hex: ""}
    # A Pod gone from its spec: its records under every collection
    # (pod_project.uproc `prune`, store_effect DROP_EACH).
    key_prefix: "/"

wiring:
  # ── sandbox ────────────────────────────────────────────────────────────
  - from: sb_spec.status
    to: sb_spec.changes
  - from: sb_spec.record_out
    to: sb_specd.record_in
  - from: sb_specd.result_out
    to: wl.request_in
  - from: sb_mspec.status
    to: sb_mspec.changes
  - from: sb_mspec.record_out
    to: sb_mspecd.record_in
  - from: sb_mspecd.result_out
    to: wl.request_in_6
  - from: sb_exec.status
    to: sb_exec.changes
  - from: sb_exec.record_out
    to: sb_execd.record_in
  - from: sb_execd.result_out
    to: wl.request_in_2
  - from: sb_sig.status
    to: sb_sig.changes
  - from: sb_sig.record_out
    to: sb_sigd.record_in
  - from: sb_sigd.result_out
    to: wl.request_in_3
  - from: sb_pause.status
    to: sb_pause.changes
  - from: sb_pause.record_out
    to: sb_paused.record_in
  - from: sb_paused.result_out
    to: wl.request_in_5
  - from: sb_tty.status
    to: sb_tty.changes
  - from: sb_tty.record_out
    to: sb_ttyd.record_in
  - from: sb_ttyd.result_out
    to: wl.request_in_4
  - from: wl.event_out
    to: sb_ev.request_in
  - from: sb_ev.response_out
    to: sb_evout.request_in
  - from: vb_src.status
    to: vb_src.changes
  - from: vb_src.record_out
    to: vb_get.request_in
  - from: vb_get.response_out
    to: vb_put.request_in
  - from: vb_rows.status
    to: vb_rows.changes
  - from: vb_rows.record_out
    to: vb_prune.request_in
  # ── sandbox end ────────────────────────────────────────────────────────
  - from: pb_spec.status
    to: pb_spec.changes
  - from: pb_spec.record_out
    to: pb_seed_l.request_in
  - from: pb_seed_l.response_out
    to: pb_seed_r.request_in
  - from: pb_tl.status
    to: pb_tl.changes
  - from: pb_tl.record_out
    to: pb_tl_rt.request_in
  - from: pb_tl_rt.response_out
    to: pb_tl_res.request_in
  - from: pb_tl_res.response_out
    to: pb_tl_out.request_in
  - from: pb_tl_out.response_out
    to: pb_tl_req.request_in
  - from: pb_tr.status
    to: pb_tr.changes
  - from: pb_tr.record_out
    to: pb_tr_rt.request_in
  - from: pb_tr_rt.response_out
    to: pb_tr_res.request_in
  - from: pb_tr_res.response_out
    to: pb_tr_out.request_in
  - from: pb_tr_out.response_out
    to: pb_tr_req.request_in
  - from: pb_res.status
    to: pb_res.changes
  - from: pb_res.record_out
    to: pb_get.request_in
  - from: pb_get.response_out
    to: pb_dreq.request_in
  - from: pb_dreq.response_out
    to: pb_dres.request_in
  - from: pb_dres.response_out
    to: pb_dout.request_in
  - from: pb_dout.response_out
    to: pb_fold.request_in
  - from: pb_pods.status
    to: pb_pods.changes
  - from: pb_pods.record_out
    to: pb_pub.request_in
  - from: pb_gone.status
    to: pb_gone.changes
  - from: pb_gone.record_out
    to: pb_gone_e.request_in
  - from: pj_source.status
    to: pj_source.changes
  - from: pj_source.record_out
    to: pj_sandbox.request_in
  - from: pj_sandbox.response_out
    to: pj_runtime.request_in
  - from: pj_msource.status
    to: pj_msource.changes
  - from: pj_msource.record_out
    to: pj_metal.request_in
  - from: pi_source.status
    to: pi_source.changes
  - from: pi_source.record_out
    to: pi_requests.request_in
  - from: pi_requests.response_out
    to: pi_rootfs.request_in
  - from: pi_rootfs.response_out
    to: pi_config.request_in
  - from: pi_config.response_out
    to: pi_resolved.request_in
  - from: pl_source.status
    to: pl_source.changes
  - from: pl_source.record_out
    to: pl_runtime.request_in
  - from: pl_runtime.response_out
    to: pl_kill.request_in
  - from: pl_kill.response_out
    to: pl_sandbox.request_in
  - from: pl_sandbox.response_out
    to: pl_metal.request_in
  - from: pl_metal.response_out
    to: pl_status.request_in
  - from: pl_status.response_out
    to: pl_report.request_in
  - from: pl_report.response_out
    to: pl_events.request_in
  - from: pr_source.status
    to: pr_source.changes
  - from: pr_source.record_out
    to: pr_exists.request_in
  - from: pr_exists.response_out
    to: pr_drop.request_in