# dns-chain graph: the endpoints chain + the DNS zone, both as Chronicle params
# on one shared store — services + ready pods become endpoints, and endpoints
# become the cluster DNS zone. /dns/<name>.<ns>.svc.cluster.local A-records fall
# straight out of the store. The cluster-dns bundle then serves the zone.
target: linux
tick_us: 1000

# The per-module self-edges below (change-sink allocators) are deliberate
# 1-node cycles.
scheduler:
  accept_cycles: true

modules:
  # Endpoints is PARAMS: Services JOIN the namespace's Pods with the label
  # selector as the join predicate and the probe runner's readiness overriding
  # the static field -> /endpointslices/<ns>/<svc>/<pod>; a slice whose Pod is
  # gone is pruned; and list_children over the slices materialises
  # /endpoints/<ns>/<svc> = "<pod>=<ip>,…" — the document the consumers parse,
  # unchanged. Params from modules/app/_chronicle/endpoints.uproc.
  - name: ep_pairs
    type: store_source
    prefix: "/services/"
    paths: "spec.selector"
    join: "/pods/"
    join_scoped: 2
    join_match: "metadata.labels:spec.selector"
    join_paths: "status.ready,status.podIP,metadata.uid"
    watch: "/pods/,/probe-status/"
  - name: ep_probe
    type: store_effect
    # chronicle-source: modules/app/_chronicle/endpoints.uproc ak
    decision: {hex: ""}
    key_prefix: "/probe-status/"
    flat: 1
    paths: "ready"
  - name: ep_slices
    type: store_effect
    # chronicle-source: modules/app/_chronicle/endpoints.uproc sl
    decision: {hex: ""}
    key_prefix: "/endpointslices/"
  - name: ep_sl_source
    type: store_source
    prefix: "/endpointslices/"
    watch: "/pods/"
  - name: ep_podexists
    type: store_effect
    # chronicle-source: modules/app/_chronicle/endpoints.uproc ex
    decision: {hex: "00130000004b0001000201000000400100000010020000000000000040020000000100021c00000040030000001201002f40110000000100021d00000040120000000100020300000042011e40fe00000041"}
    key_prefix: "/pods/"
  - name: ep_collect
    type: store_effect
    # chronicle-source: modules/app/_chronicle/endpoints.uproc pr
    decision: {hex: "010500000012000100020200000010940100000000000020000c00000034000100020100000040010000001004000000000000004002000000010002fe000000021e00000040030000001200004004000000410a0000002b0001000201000000400100000010000000000000000040020000001200004003000000120000400400000041"}
    key_prefix: "/endpointslices/"
  - name: ep_svcs
    type: store_source
    prefix: "/services/"
    paths: "spec.selector"
    list_children: "/endpointslices/"
    child_sep: "/"
    watch: "/endpointslices/"
  - name: ep_write
    type: store_effect
    # chronicle-source: modules/app/_chronicle/endpoints.uproc dc
    decision: {hex: ""}
    key_prefix: "/endpoints/"
  # The DNS zone is PARAMS: one record per Service, its key assembled from four
  # parts and its value the ready addresses decorated as `a=<ip>` while the
  # children are walked. Params from modules/app/_chronicle/service_dns.uproc.
  - name: dns_src
    type: store_source
    prefix: "/endpoints/"
    list_children: "/endpointslices/"
    child_sep: "/"
    list_values: 1
    list_item: "a="
    list_join: ";"
    watch: "/endpointslices/"
  - name: dns_write
    type: store_effect
    # chronicle-source: modules/app/_chronicle/service_dns.uproc project
    decision: {hex: "0013000000620001000201000000400100000010030000000000000040020000000100021d00000040030000001201002e40110000000100021c00000040120000001212002e7376632e636c75737465722e6c6f63616c401900000001000238000000400400000041"}
    key_prefix: "/dns/"

# Self-edges: each module's own output feeds its `changes` input, allocating a
# module-owned channel the store's namespace.change SUBSCRIBE pushes onto. The
# module never writes this output; it drains pushed events from the input.
wiring:
  - from: ep_pairs.status
    to: ep_pairs.changes
  - from: ep_pairs.record_out
    to: ep_probe.request_in
  - from: ep_probe.response_out
    to: ep_slices.request_in
  - from: ep_sl_source.status
    to: ep_sl_source.changes
  - from: ep_sl_source.record_out
    to: ep_podexists.request_in
  - from: ep_podexists.response_out
    to: ep_collect.request_in
  - from: ep_svcs.status
    to: ep_svcs.changes
  - from: ep_svcs.record_out
    to: ep_write.request_in
  - from: dns_src.status
    to: dns_src.changes
  - from: dns_src.record_out
    to: dns_write.request_in