# The cluster's DNS (modules/app/cluster_dns): `<svc>.<ns>.svc.cluster.local`
# answered from the store as the API keeps it — a Service's ClusterIP, or a
# headless Service's ready backends from its Endpoints document (the
# endpoints chain's, fluxor-endpoints.yaml) — and every other name forwarded
# to the node's resolver. Nothing is projected for it: an answer is read
# where the Service is, so it is never staler than the Service.
#
# The control plane splices it in (nanocloud-graph.sh, installed as dns.yaml),
# with the node's DNS port (NANOCLOUD_DNS_PORT, 53) and its upstream (the
# first nameserver of its resolv.conf; NANOCLOUD_DNS_UPSTREAM).
target: linux
tick_us: 1000

platform:
  net: {}

modules:
  - name: cluster_dns
    type: cluster_dns
    port: 53
    zone: "cluster.local"
    ttl: 5

wiring:
  - from: linux_net.net_out
    to: cluster_dns.net_in
  - from: cluster_dns.net_out
    to: linux_net.net_in
