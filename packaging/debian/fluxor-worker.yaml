# A worker node's graph: its replica of the control plane's store — a
# learner, outside the voter set, given the group's log once an operator
# adds it (`nanocloud-cluster add-node <id>` on a control-plane node) — its
# lease, and its pod plane (fluxor-podlifecycle.yaml: the kubelet's chains
# and the sandbox runtime, spliced in by the render) with its dataplane: the
# proxy's and NetworkPolicy's `net_apply`, which realize the cluster's rows
# as this node's packet policy — its own name and address rendered in, so a
# `Local` traffic policy keeps to the backends here and its Pods' host ports
# are DNATed at its address.
#
#   renew   /nodes/<this node>: absent, or due -> ready, its heartbeat this
#           node's clock (node_lease.uproc `renew`). Written here, decided
#           by the voters: the control plane projects the node ready, takes
#           it out of service when it stops renewing, and schedules onto it.
#
# Its replica is scoped to this node: the pod plane's records (/pod-specs/,
# /pod-runtime/, /sandboxes/, /sandbox-…, /probe-…, /image-…, …) are this
# node's own, kept in the store under /~node/<this node>. The control plane
# writes what it asks of the node there (/~node/<node>/pod-specs/<uid>), so
# the pod plane reads its own asks by their plain names and no other
# node's. A template: nanocloud-graph.sh renders it per node
# (NANOCLOUD_ROLE=node in /etc/nanocloud.io/cluster.env).
target: linux
tick_us: 1000

platform:
  net: {}

scheduler:
  accept_cycles: true

modules:
__REPLICA_MODULES__
__KUBELET_MODULES__
  - name: nl_self
    type: store_source
    prefix: "/nodes/"
    where: "metadata.name=__NODE_NAME__"
    # Its Pod CIDR (svc_alloc's), restated by every renewal.
    paths: "status.ready,metadata.labels,spec.podCIDR"
    ints: "status.heartbeat"
    count: 1
    empty: 1
    label: "__NODE_NAME__"
    # What the render knows of this node, its labels (arch, os, hostname,
    # the fluxor ABI): what a Pod's nodeSelector is matched against.
    facts: '__NODE_FACTS__'
    # Its own address (InternalIP): its Pods' hostIP. Empty, or a
    # placeholder a render left, advertises none.
    address: "__NODE_ADDRESS__"
    # Its capacity (cpu, memory, pods): its Node's status.capacity and
    # allocatable, what the scheduler fits requests within. A placeholder a
    # render left reports none.
    capacity: '__NODE_CAPACITY__'
    now: 1
    due: "status.heartbeat+10000"
  - name: nl_renew
    type: store_effect
    # chronicle-source: modules/app/_chronicle/node_lease.uproc renew_p
    decision: {hex: ""}
    key_prefix: "/nodes/"

wiring:
  - from: nl_self.record_out
    to: nl_renew.request_in
__REPLICA_WIRING__
__KUBELET_WIRING__
