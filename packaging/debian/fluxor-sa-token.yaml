# ServiceAccount tokens as Chronicle params (sa_token.uproc) over kagi's
# token_mint. A /token-req/<id> (`ns=…;sa=…[;aud=…]`) with no /token-resp/<id>
# is minted and answered `token=<JWT>` — ES256, signed in the fluxor key vault
# under `nanocloud.ca` — the node's one signing root, which also issues its
# certificates — generated there on first open, sealed under FLUXOR_SEAL_KEY, and
# never leaves it. The public half is announced by the mint and stored at
# /authn-keys/sa, where kagi_verify loads the key it verifies with.
target: linux
tick_us: 1000

scheduler:
  accept_cycles: true

modules:
  - name: tk_req
    type: store_source
    prefix: "/token-req/"
    flat: 1
    paths: "ns,sa,aud"
    unless: "/token-resp/"
  - name: tk_dec
    type: decision
    params:
      # chronicle-source: modules/app/_chronicle/sa_token.uproc tk_mint
      decision: ""
  - name: tk_mint
    type: kagi_mint
    issuer: "https://kubernetes.default.svc"
    key_label: "nanocloud.ca"
    announce_path: "/authn-keys/sa"
  - name: token_mint
    posture: development
  - name: tk_resp
    type: store_effect
    # chronicle-source: modules/app/_chronicle/sa_token.uproc tk_store
    decision: ""
    key_prefix: "/token-resp/"

wiring:
  - from: tk_req.status
    to: tk_req.changes
  - from: tk_req.record_out
    to: tk_dec.record_in
  - from: tk_dec.result_out
    to: tk_mint.request_in
  # The mint call: one exchange per record, kagi_mint the requester. The key
  # announcement comes back whole, and kagi_mint reads it whole (framed):
  # mailbox.
  - from: tk_mint.request_out
    to: token_mint.request_in
  - from: tk_mint.key_out
    to: token_mint.key_material
  - from: token_mint.response_out
    to: tk_mint.response_in
  - from: token_mint.key_announce
    to: tk_mint.announce_in
    buffer_group: 2
  - from: tk_mint.response_out
    to: tk_resp.request_in
