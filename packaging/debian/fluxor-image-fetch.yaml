# Image plane — the full pod-image path: a /pod-specs/ entry carrying `image=` drives pull → verify →
# assemble → run, entirely as fmods:
#
#   pod_lifecycle    image= → /image-requests/ (pull trigger) + Pending gate
#   image.uproc      manifest (through an index) + config + layers over
#                    http_fetch, behind TLS (deployment-CA pinned, h1-only)
#   image_asm.uproc  every layer cached → assembly job → /image-rootfs/ ready
#   sandbox chain    runs the assembly job, then the pod (pivot_root)
#
# The tls client posture mirrors ota_registry's (alpn_h1_only — registry:2 is
# a Go server that would select h2; trust = the nanocloud deployment
# CA in DER). The node blob cache is content-addressed — pulls skip blobs the
# cache already holds, layers dedup across images.
#
# Validated end-to-end on linux (host + Pi 5): pull of nanocloud/hello-e2e
# from registry.nanocloud.io:5000 over TLS 1.3 → digest-verified cache →
# whiteout-correct rootfs → pod Succeeded with its stdout in /sandbox-logs/.

target: linux
tick_us: 1000

platform:
  net: {}

# The self-edges below (change-sink allocators) are deliberate 1-node cycles.
scheduler:
  accept_cycles: true

modules:
  - name: tls
    mode: 0
    alpn_h1_only: 1
    # A TLS client always authenticates its peer, so the profile must be
    # declared: ca_dns = chain to the deployment CA AND match the name we
    # dialled. `verify_hostname` is required of a client under this profile
    # (an IP literal is rejected), and it is the name the fetcher dials.
    peer_auth: 2
    trust: "${file:/etc/nanocloud.io/certs/ca.der}"
    verify_hostname: "registry.nanocloud.io"
  # ── pull + assembly: image.uproc / image_asm.uproc over http_fetch ──
  - name: fetch
    type: http_fetch
    authority: "registry.nanocloud.io:5000"
    dir: "/var/lib/nanocloud.io/image/blobs"
    chunk_bytes: 0
    boot_delay_ms: 500
  # ── the queue writers ────────────────────────────────────────────────
  - name: im_req
    type: store_source
    prefix: "/image-requests/"
    flat: 1
    paths: "repo,tag"
    related: "/image-index/:digest"
    unless: "/image-manifests/"
    watch: "/image-index/,/image-manifests/"
  - name: im_qm
    type: store_effect
    # chronicle-source: modules/app/_chronicle/image.uproc im_qm
    decision: ""
  - name: im_cfg
    type: store_source
    prefix: "/image-manifests/"
    flat: 1
    paths: "repo,config,configsize"
    unless: "/image-config/"
    watch: "/image-config/"
  - name: im_qc
    type: store_effect
    # chronicle-source: modules/app/_chronicle/image.uproc im_qc
    decision: ""
  - name: im_lay
    type: store_source
    prefix: "/image-manifests/"
    flat: 1
    expand: "layers[]"
    paths: "repo,layers.#,sizes.#"
    watch: "/blobs/"
  - name: im_le
    type: store_effect
    # chronicle-source: modules/app/_chronicle/image.uproc im_le
    decision: ""
  - name: im_lr
    type: store_effect
    # chronicle-source: modules/app/_chronicle/image.uproc im_lr
    decision: ""
  # ── the fetch ────────────────────────────────────────────────────────
  - name: im_q
    type: store_source
    prefix: "/fetch-q/"
    flat: 1
    paths: "kind,name,path,digest,repo,size"
    ints: "size"
    watch: "/image-manifests/,/image-config/,/blobs/,/image-index/"
  - name: im_fq
    type: decision
    params:
      # chronicle-source: modules/app/_chronicle/image.uproc im_fq
      decision: ""
  - name: im_ans
    type: store_effect
    # chronicle-source: modules/app/_chronicle/image.uproc im_ans
    decision: ""
  # ── assembly ─────────────────────────────────────────────────────────
  - name: im_asm
    type: store_source
    prefix: "/image-manifests/"
    flat: 1
    paths: "layers!argv"
    ints: "n"
    count_children: "/image-layer-ok/"
    related: "/image-rootfs/:state;/sandbox-status/img-asm-:state,code;/config/image^9:script,rootfs,blobs"
    watch: "/image-layer-ok/,/image-rootfs/,/sandbox-status/,/config/"
  - name: im_as1
    type: store_effect
    # chronicle-source: modules/app/_chronicle/image_asm.uproc im_as1
    decision: ""
  - name: im_as2
    type: store_effect
    # chronicle-source: modules/app/_chronicle/image_asm.uproc im_as2
    decision: ""
  # ── project ──────────────────────────────────────────────────────────
  - name: pj_source
    type: store_source
    prefix: "/pod-specs/"
    flat: 1
    paths: "cmd,rootfs,iso,net,tasks,graph"
    related: "/pod-resolved/:rootfs,cmd"
    watch: "/pod-resolved/"
  - name: pj_sandbox
    type: store_effect
    # chronicle-source: modules/app/_chronicle/pod_project.uproc art
    decision: ""
    key_prefix: "/sandboxes/"
  - name: pj_runtime
    type: store_effect
    # chronicle-source: modules/app/_chronicle/pod_project.uproc rt
    decision: "000c0000003a000100020100000040010000001006000000000000004002000000010002fe000000021e00000040030000001206007365656e3d31400400000041"
    key_prefix: "/pod-runtime/"
  - name: pj_msource
    type: store_source
    prefix: "/pod-specs/"
    flat: 1
    paths: "cmd,rootfs,iso,net,tasks,graph"
  - name: pj_metal
    type: store_effect
    # chronicle-source: modules/app/_chronicle/pod_project.uproc mtl
    decision: ""
    key_prefix: "/metal-sandboxes/"

  # ── image: a reference resolved to a rootfs and an argv ──────────────
  - name: pi_source
    type: store_source
    prefix: "/pod-specs/"
    flat: 1
    paths: "image,image!repo,image!tag,image!flat,rootfs,cmd"
    watch: "/image-rootfs/,/image-config/"
  - name: pi_requests
    type: store_effect
    # chronicle-source: modules/app/_chronicle/pod_image.uproc rq
    decision: ""
    key_prefix: "/image-requests/"
  - name: pi_rootfs
    type: store_effect
    # chronicle-source: modules/app/_chronicle/pod_image.uproc ar
    decision: ""
    key_prefix: "/image-rootfs/"
    flat: 1
    paths: "state,path"
  - name: pi_config
    type: store_effect
    # chronicle-source: modules/app/_chronicle/pod_image.uproc ac
    decision: ""
    key_prefix: "/image-config/"
    flat: 1
    paths: "entrypoint!argv,cmd!argv"
  - name: pi_resolved
    type: store_effect
    # chronicle-source: modules/app/_chronicle/pod_image.uproc rs
    decision: ""
    key_prefix: "/pod-resolved/"

  # ── lifecycle ────────────────────────────────────────────────────────
  - name: pl_source
    type: store_source
    prefix: "/pod-runtime/"
    flat: 1
    ints: "kill_phase,kill_deadline,backoff_until,run_started,paused_since,restarts,was_terminal"
    now: 1
    due: "kill_deadline,backoff_until"
    related: "/pod-specs/:cmd,desired,restart,rootfs,graph,grace#;/sandbox-status/:state,code;/probe-status/:live;/sandboxes/:cmd"
    watch: "/pod-specs/,/sandbox-status/,/probe-status/,/sandboxes/"
  - name: pl_runtime
    type: store_effect
    # chronicle-source: modules/app/_chronicle/pod_lifecycle.uproc st
    decision: ""
    key_prefix: "/pod-runtime/"
  - name: pl_kill
    type: store_effect
    # chronicle-source: modules/app/_chronicle/pod_effect.uproc kl
    decision: ""
    key_prefix: "/sandbox-kill/"
  - name: pl_sandbox
    type: store_effect
    # chronicle-source: modules/app/_chronicle/pod_effect.uproc sb
    decision: ""
    key_prefix: "/sandboxes/"
  - name: pl_metal
    type: store_effect
    # chronicle-source: modules/app/_chronicle/pod_effect.uproc mt
    decision: ""
    key_prefix: "/metal-sandboxes/"
  - name: pl_status
    type: store_effect
    # chronicle-source: modules/app/_chronicle/pod_effect.uproc st
    decision: ""
    key_prefix: "/pod-lifecycle-status/"
  - name: pl_events
    type: store_effect
    # chronicle-source: modules/app/_chronicle/pod_effect.uproc ev
    decision: ""
    key_prefix: "/events/"

  # ── prune ────────────────────────────────────────────────────────────
  - name: pr_source
    type: store_source
    prefix: "/pod-runtime/"
    watch: "/pod-specs/"
  - name: pr_exists
    type: store_effect
    # chronicle-source: modules/app/_chronicle/pod_project.uproc ak
    decision: "000e000000360001000201000000400100000010020000000000000040020000000100020300000040030000000100020300000042011e40fe00000041"
    key_prefix: "/pod-specs/"
  - name: pr_drop
    type: store_effect
    # chronicle-source: modules/app/_chronicle/pod_project.uproc pr
    decision: "010500000012000100020200000010940100000000000020000c00000034000100020100000040010000001004000000000000004002000000010002fe000000021e00000040030000001200004004000000410a0000002b0001000201000000400100000010000000000000000040020000001200004003000000120000400400000041"
    key_prefix: "/pod-runtime/"
  # (the runtime block of packaging/debian/fluxor-sandbox.yaml — kept identical; scripts/support/sandbox-block.py)
  # ── sandbox ────────────────────────────────────────────────────────────
  - name: wl
    type: workload_effect
  - name: sb_spec
    type: store_source
    prefix: "/sandboxes/"
    flat: 1
    paths: "phase,cmd,rootfs,iso,net,tasks"
    count_children: "/volume-binds/"
    list_children: "/volume-binds/"
    list_values: 1
    child_sep: "/"
    related: "/sandbox-status/:state;/ipam-lease/:.;/ipam-pool^9:.!prefix;/sandbox-boot^9:id;/pod-specs/:volumes!count#;/sandbox-boot-of/:."
    watch: "/sandbox-status/,/ipam-lease/,/sandbox-boot,/volume-binds/,/sandbox-boot-of/"
  - name: sb_specd
    type: decision
    params:
      # chronicle-source: modules/app/_chronicle/sandbox.uproc sb_spec
      decision: ""
  - name: sb_exec
    type: store_source
    prefix: "/sandbox-exec/"
    rev: 1
    paths: "."
    unless: "/sandbox-exec-result/"
    related: "/sandbox-status/^1!flat:state;/sandboxes/^1!flat:phase"
    watch: "/sandbox-status/"
  - name: sb_execd
    type: decision
    params:
      # chronicle-source: modules/app/_chronicle/sandbox.uproc sb_exec
      decision: ""
  - name: sb_sig
    type: store_source
    prefix: "/sandbox-kill/"
    paths: "."
    # A signal for a sandbox not live yet is re-offered once it is.
    watch: "/sandbox-status/"
  - name: sb_pause
    type: store_source
    prefix: "/sandbox-pause/"
    paths: "."
    watch: "/sandbox-status/"
  - name: sb_sigd
    type: decision
    params:
      # chronicle-source: modules/app/_chronicle/sandbox.uproc sb_sig
      decision: ""
  - name: sb_paused
    type: decision
    params:
      # chronicle-source: modules/app/_chronicle/sandbox.uproc sb_sig
      decision: ""
  - name: sb_tty
    type: store_source
    prefix: "/tty/"
    flat: 1
    rev: 1
    paths: ".,rows,cols,cmd"
    related: "/tty/^1+status:."
    # An open waits for its sandbox to run: re-offered when that changes.
    watch: "/sandbox-status/"
  - name: sb_ttyd
    type: decision
    params:
      # chronicle-source: modules/app/_chronicle/sandbox.uproc sb_tty
      decision: ""
  - name: sb_ev
    type: store_effect
    # chronicle-source: modules/app/_chronicle/sandbox.uproc sb_ev
    decision: ""
    append_cap: 1024
  - name: sb_evout
    type: store_effect
    # chronicle-source: modules/app/_chronicle/sandbox.uproc sb_evout
    decision: ""
  # volumes
  - name: vb_src
    type: store_source
    prefix: "/pod-specs/"
    flat: 1
    expand: "volumes[]"
    paths: "volumes.#"
    watch: "/volumes/"
  - name: vb_get
    type: store_effect
    # chronicle-source: modules/app/_chronicle/volume.uproc vb_get
    decision: ""
    key_prefix: "/volumes/"
    flat: 1
    paths: "path"
  - name: vb_put
    type: store_effect
    # chronicle-source: modules/app/_chronicle/volume.uproc vb_put
    decision: ""
    key_prefix: "/volume-binds/"
  - name: vb_rows
    type: store_source
    prefix: "/volume-binds/"
    rev: 1
    related: "/pod-specs/^1:."
    watch: "/pod-specs/"
  - name: vb_prune
    type: store_effect
    # chronicle-source: modules/app/_chronicle/volume.uproc vb_prune
    decision: "01050000000c000100024600000012000020000c0000003300010002010000004001000000100400000000000000400200000001000203000000400300000001000202000000401c000000410a000000310001000201000000400100000010000000000000000040020000001200004003000000100000000000000000401c00000041"
    key_prefix: "/volume-binds/"
  # ── sandbox end ────────────────────────────────────────────────────────
  # Liveness/readiness probes are PARAMS (probe.uproc, probe_collect.uproc):
  # per-probe state at /probe-rt-<l|r>/<uid> (its due/deadline arm the timer),
  # exec attempts over the /sandbox-exec/ seam, verdicts at /probe-status/.
  - name: pb_spec
    type: store_source
    prefix: "/pod-specs/"
    flat: 1
    paths: "lp_cmd,rp_cmd"
  - name: pb_seed_l
    type: store_effect
    # chronicle-source: modules/app/_chronicle/probe.uproc sd_l
    decision: ""
  - name: pb_seed_r
    type: store_effect
    # chronicle-source: modules/app/_chronicle/probe.uproc sd_r
    decision: ""
  - name: pb_tl
    type: store_source
    prefix: "/probe-rt-l/"
    flat: 1
    ints: "inflight,due,deadline,seq,fails,oks,verdict"
    now: 1
    due: "due,deadline"
    related: "/pod-specs/!flat:lp_cmd,lp_period#,lp_timeout#,lp_fail#,lp_succ#;/sandbox-status/!flat:state"
    watch: "/pod-specs/,/sandbox-status/"
  - name: pb_tl_rt
    type: store_effect
    # chronicle-source: modules/app/_chronicle/probe.uproc tk_l
    decision: ""
    key_prefix: "/probe-rt-l/"
  - name: pb_tl_res
    type: store_effect
    # chronicle-source: modules/app/_chronicle/probe.uproc sm_res
    decision: ""
  - name: pb_tl_out
    type: store_effect
    # chronicle-source: modules/app/_chronicle/probe.uproc sm_out
    decision: ""
  - name: pb_tl_req
    type: store_effect
    # chronicle-source: modules/app/_chronicle/probe.uproc sm_req
    decision: ""
  - name: pb_tr
    type: store_source
    prefix: "/probe-rt-r/"
    flat: 1
    ints: "inflight,due,deadline,seq,fails,oks,verdict"
    now: 1
    due: "due,deadline"
    related: "/pod-specs/!flat:rp_cmd,rp_period#,rp_timeout#,rp_fail#,rp_succ#;/sandbox-status/!flat:state"
    watch: "/pod-specs/,/sandbox-status/"
  - name: pb_tr_rt
    type: store_effect
    # chronicle-source: modules/app/_chronicle/probe.uproc tk_r
    decision: ""
    key_prefix: "/probe-rt-r/"
  - name: pb_tr_res
    type: store_effect
    # chronicle-source: modules/app/_chronicle/probe.uproc sm_res
    decision: ""
  - name: pb_tr_out
    type: store_effect
    # chronicle-source: modules/app/_chronicle/probe.uproc sm_out
    decision: ""
  - name: pb_tr_req
    type: store_effect
    # chronicle-source: modules/app/_chronicle/probe.uproc sm_req
    decision: ""
  - name: pb_res
    type: store_source
    prefix: "/sandbox-exec-result/"
    paths: "."
  - name: pb_get
    type: store_effect
    # chronicle-source: modules/app/_chronicle/probe_collect.uproc cl_get
    decision: ""
    flat: 1
    ints: "inflight,fails,oks,verdict,fail_n,succ_n"
  - name: pb_dreq
    type: store_effect
    # chronicle-source: modules/app/_chronicle/probe_collect.uproc cl_req
    decision: ""
  - name: pb_dres
    type: store_effect
    # chronicle-source: modules/app/_chronicle/probe_collect.uproc cl_res
    decision: ""
  - name: pb_dout
    type: store_effect
    # chronicle-source: modules/app/_chronicle/probe_collect.uproc cl_out
    decision: ""
  - name: pb_fold
    type: store_effect
    # chronicle-source: modules/app/_chronicle/probe_collect.uproc cl_fold
    decision: ""
  - name: pb_pods
    type: store_source
    prefix: "/pod-specs/"
    related: "/probe-rt-l/!flat:seq,verdict#;/probe-rt-r/!flat:seq,verdict#"
    watch: "/probe-rt-l/,/probe-rt-r/"
  - name: pb_pub
    type: store_effect
    # chronicle-source: modules/app/_chronicle/probe_collect.uproc pub
    decision: ""
    key_prefix: "/probe-status/"
  - name: pb_gone
    type: store_source
    prefix: "/probe-status/"
    unless: "/pod-specs/"
  - name: pb_gone_e
    type: store_effect
    # chronicle-source: modules/app/_chronicle/probe_collect.uproc gone
    decision: "000b0000002f000100020100000040010000001004000000000000004002000000010002030000004003000000120000400400000041"
    key_prefix: "/probe-status/"

wiring:
  # The socket seam: linux_net <-> tls (cipher) <-> http_fetch (clear).
  - from: linux_net.net_out
    to: tls.cipher_in
  - from: tls.cipher_out
    to: linux_net.net_in
  - from: tls.clear_out
    to: fetch.net_in
  - from: fetch.net_out
    to: tls.clear_in

  # Store-change sinks (self-edge allocation).
  - from: im_req.status
    to: im_req.changes
  - from: im_req.record_out
    to: im_qm.request_in
  - from: im_cfg.status
    to: im_cfg.changes
  - from: im_cfg.record_out
    to: im_qc.request_in
  - from: im_lay.status
    to: im_lay.changes
  - from: im_lay.record_out
    to: im_le.request_in
  - from: im_le.response_out
    to: im_lr.request_in
  - from: im_q.status
    to: im_q.changes
  - from: im_q.record_out
    to: im_fq.record_in
  - from: im_fq.result_out
    to: fetch.request_in
  - from: fetch.response_out
    to: im_ans.request_in
  - from: im_asm.status
    to: im_asm.changes
  - from: im_asm.record_out
    to: im_as1.request_in
  - from: im_as1.response_out
    to: im_as2.request_in
  - from: pj_source.status
    to: pj_source.changes
  - from: pj_source.record_out
    to: pj_sandbox.request_in
  - from: pj_sandbox.response_out
    to: pj_runtime.request_in
  - from: pj_msource.status
    to: pj_msource.changes
  - from: pj_msource.record_out
    to: pj_metal.request_in
  - from: pi_source.status
    to: pi_source.changes
  - from: pi_source.record_out
    to: pi_requests.request_in
  - from: pi_requests.response_out
    to: pi_rootfs.request_in
  - from: pi_rootfs.response_out
    to: pi_config.request_in
  - from: pi_config.response_out
    to: pi_resolved.request_in
  - from: pl_source.status
    to: pl_source.changes
  - from: pl_source.record_out
    to: pl_runtime.request_in
  - from: pl_runtime.response_out
    to: pl_kill.request_in
  - from: pl_kill.response_out
    to: pl_sandbox.request_in
  - from: pl_sandbox.response_out
    to: pl_metal.request_in
  - from: pl_metal.response_out
    to: pl_status.request_in
  - from: pl_status.response_out
    to: pl_events.request_in
  - from: pr_source.status
    to: pr_source.changes
  - from: pr_source.record_out
    to: pr_exists.request_in
  - from: pr_exists.response_out
    to: pr_drop.request_in
  # ── sandbox ────────────────────────────────────────────────────────────
  - from: sb_spec.status
    to: sb_spec.changes
  - from: sb_spec.record_out
    to: sb_specd.record_in
  - from: sb_specd.result_out
    to: wl.request_in
  - from: sb_exec.status
    to: sb_exec.changes
  - from: sb_exec.record_out
    to: sb_execd.record_in
  - from: sb_execd.result_out
    to: wl.request_in_2
  - from: sb_sig.status
    to: sb_sig.changes
  - from: sb_sig.record_out
    to: sb_sigd.record_in
  - from: sb_sigd.result_out
    to: wl.request_in_3
  - from: sb_pause.status
    to: sb_pause.changes
  - from: sb_pause.record_out
    to: sb_paused.record_in
  - from: sb_paused.result_out
    to: wl.request_in_5
  - from: sb_tty.status
    to: sb_tty.changes
  - from: sb_tty.record_out
    to: sb_ttyd.record_in
  - from: sb_ttyd.result_out
    to: wl.request_in_4
  - from: wl.event_out
    to: sb_ev.request_in
  - from: sb_ev.response_out
    to: sb_evout.request_in
  - from: vb_src.status
    to: vb_src.changes
  - from: vb_src.record_out
    to: vb_get.request_in
  - from: vb_get.response_out
    to: vb_put.request_in
  - from: vb_rows.status
    to: vb_rows.changes
  - from: vb_rows.record_out
    to: vb_prune.request_in
  # ── sandbox end ────────────────────────────────────────────────────────
  - from: pb_spec.status
    to: pb_spec.changes
  - from: pb_spec.record_out
    to: pb_seed_l.request_in
  - from: pb_seed_l.response_out
    to: pb_seed_r.request_in
  - from: pb_tl.status
    to: pb_tl.changes
  - from: pb_tl.record_out
    to: pb_tl_rt.request_in
  - from: pb_tl_rt.response_out
    to: pb_tl_res.request_in
  - from: pb_tl_res.response_out
    to: pb_tl_out.request_in
  - from: pb_tl_out.response_out
    to: pb_tl_req.request_in
  - from: pb_tr.status
    to: pb_tr.changes
  - from: pb_tr.record_out
    to: pb_tr_rt.request_in
  - from: pb_tr_rt.response_out
    to: pb_tr_res.request_in
  - from: pb_tr_res.response_out
    to: pb_tr_out.request_in
  - from: pb_tr_out.response_out
    to: pb_tr_req.request_in
  - from: pb_res.status
    to: pb_res.changes
  - from: pb_res.record_out
    to: pb_get.request_in
  - from: pb_get.response_out
    to: pb_dreq.request_in
  - from: pb_dreq.response_out
    to: pb_dres.request_in
  - from: pb_dres.response_out
    to: pb_dout.request_in
  - from: pb_dout.response_out
    to: pb_fold.request_in
  - from: pb_pods.status
    to: pb_pods.changes
  - from: pb_pods.record_out
    to: pb_pub.request_in
  - from: pb_gone.status
    to: pb_gone.changes
  - from: pb_gone.record_out
    to: pb_gone_e.request_in