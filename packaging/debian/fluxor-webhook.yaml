# webhook-validator workload graph: the
# the webhook validation chain fmod, which watches /webhooks/ in the control-plane store, validates each Webhook's spec, and writes /webhook-status/. No platform
# network module and no wiring — its I/O is provider_call to the store
# surface, not channels.
target: linux
tick_us: 1000

# The self-edge below (change-sink allocator) is a deliberate 1-node cycle.
scheduler:
  accept_cycles: true

modules:
  # Webhook validation is PARAMS: five comparisons in spec order and one status
  # string. `/webhooks/` records are FLAT (`k=v;k=v`), not JSON, so `flat = 1`.
  # Params from modules/app/_chronicle/webhook_validator.uproc.
  - name: wh_source
    type: store_source
    prefix: "/webhooks/"
    flat: 1
    paths: "path,has_secret,secret_name,secret_key,hmac,containers"
  - name: wh_check
    type: decision
    params:
      # chronicle-source: modules/app/_chronicle/webhook_validator.uproc check
      decision: ""
  - name: wh_status
    type: store_effect
    key_prefix: "/webhook-status/"

wiring:
  # The change sink (self-edge allocation) — the store pushes namespace.change
  # here and the source re-emits the set.
  - from: wh_source.status
    to: wh_source.changes
  - from: wh_source.record_out
    to: wh_check.record_in
  - from: wh_check.result_out
    to: wh_status.request_in
    buffer_group: 1
