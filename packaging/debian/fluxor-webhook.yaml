# webhook-validator workload graph: the
# webhook_validator fmod, which watches /webhooks/ in the control-plane store, validates each Webhook's spec, and writes /webhook-status/. No platform
# network module and no wiring — its I/O is provider_call to the store
# surface, not channels.
target: linux
tick_us: 1000

# The self-edge below (change-sink allocator) is a deliberate 1-node cycle.
scheduler:
  accept_cycles: true

modules:
  - name: webhook_validator

# Self-edge: the validator's own output feeds its `changes` input, allocating a
# module-owned channel the store's namespace.change SUBSCRIBE pushes onto. The
# module never writes this output; it drains pushed events from the input.
wiring:
  - from: webhook_validator.status
    to: webhook_validator.changes
