# Admission over the store seam, as params: /admit-req/<id> (JSON: verb,
# resource, ns, obj) through admission.uproc to /admit-resp/<id> =
# "<status>;<object as admitted | reason>". The request chain runs the same
# three stages inline (fluxor-apiplane.yaml).
target: linux
tick_us: 1000

scheduler:
  accept_cycles: true

modules:
  - name: adm_src
    type: store_source
    prefix: "/admit-req/"
    paths: "verb,resource,ns,obj"
    unless: "/admit-resp/"
  - name: adm_in
    type: decision
    params:
      # chronicle-source: modules/app/_chronicle/admission_seam.uproc seam_in
      decision: {hex: ""}
  - name: ad_pol
    type: store_effect
    # chronicle-source: modules/app/_chronicle/admission.uproc ad_pol
    decision: {hex: ""}
    key_prefix: "/admission-policy/"
    flat: 1
    paths: "required,defaults,quota"
    ints: "quota"
    echo: "60,61,62,63"
  - name: ad_cnt
    type: store_effect
    # chronicle-source: modules/app/_chronicle/admission.uproc ad_cnt
    decision: {hex: ""}
    key_prefix: "/"
    echo: "40,41,42,50,60,63,64"
  - name: ad_dec
    type: pipeline
    params:
      # The policy applied (admission.rd): defaults into the object, then each
      # required path looked up in it; ad_ver gives the verdict (`ad`).
      # rd-source: modules/app/_chronicle/admission.rd
      decode: {hex: ""}
      # chronicle-source: modules/app/_chronicle/admission.uproc ad_dec
      ir_stages: {hex: ""}
  - name: ad_ver
    type: decision
    params:
      # chronicle-source: modules/app/_chronicle/admission.uproc ad_dec
      decision: {hex: ""}
  - name: adm_out
    type: store_effect
    # chronicle-source: modules/app/_chronicle/admission_seam.uproc seam_out
    decision: {hex: "001100000048000100021e000000400100000010030000000000000040020000000100022000000040030000000100020200000040040000001201003b400500000001000203000000400600000041"}
    key_prefix: "/admit-resp/"

wiring:
  - from: adm_src.record_out
    to: adm_in.record_in
  - from: adm_in.result_out
    to: ad_pol.request_in
  - from: ad_pol.response_out
    to: ad_cnt.request_in
  - from: ad_cnt.response_out
    to: ad_dec.record_in
    # A decode-mode pipeline reads one protocol unit per read: a byte
    # stream would hand it two requests' frames at once and lose the second.
    buffer_group: 15
  - from: ad_dec.result_out
    to: ad_ver.record_in
  - from: ad_ver.result_out
    to: adm_out.request_in
