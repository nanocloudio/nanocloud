# workload-lifecycle graph: the desired-state chain plus the ownerRef cascade,
# as Chronicle params. A Deployment becomes a ReplicaSet becomes Pods; deleting
# the Deployment leaves them orphaned, and the `gc_` chain collects what no
# owner resolves for. Same nodes and params fluxor-controlplane.yaml ships.
target: linux
tick_us: 1000

# Every self-edge below is a source's change sink — a deliberate 1-node cycle.
scheduler:
  accept_cycles: true

modules:
  - name: dp_source
    type: store_source
    prefix: "/deployments.apps/"
    paths: "spec,spec.replicas"
    hash: "spec.template"
  - name: dp_read
    type: decision
    params:
      # chronicle-source: modules/app/_chronicle/deployment.uproc rd
      decision: ""
  - name: dp_current
    type: store_effect
    key_prefix: "/replicasets.apps/"
    paths: "metadata.labels.pod-template-hash,spec"
  - name: dp_archive
    type: decision
    params:
      # chronicle-source: modules/app/_chronicle/deployment.uproc arch
      decision: ""
  - name: dp_history
    type: store_effect
    key_prefix: "/controllerrevisions.apps/"
  - name: dp_write
    type: decision
    params:
      # chronicle-source: modules/app/_chronicle/deployment.uproc wr
      decision: ""
  - name: dp_apply
    type: store_effect
    key_prefix: "/replicasets.apps/"
  - name: dp_record
    type: decision
    params:
      # chronicle-source: modules/app/_chronicle/deployment.uproc rec
      decision: ""
  - name: dp_events
    type: store_effect
    key_prefix: "/events/"
  # ReplicaSet convergence is PARAMS, not a module: the nine nodes below are
  # Chronicle's generic engines carrying params compiled from
  # `modules/app/_chronicle/replicaset.uproc`. Names are `rs_`-prefixed because
  # this graph holds twenty-five modules and `act`/`record` are not distinctive.
  #
  # The params are BAKED because a deb ships no compiler; each carries a
  # provenance marker that `scripts/chronicle-param-drift-e2e.sh` recompiles and
  # compares. A stale decision does not error — it decides something else.
  - name: rs_source
    type: store_source
    prefix: "/replicasets.apps/"
    paths: "spec.template.spec,metadata.labels.pod-template-hash"
    expand: "spec.replicas"
    # One past the desired count, so the first surplus ordinal is probed and
    # collected on the same pass that scales down.
    expand_tail: 4
    # ...and past the highest EXISTING child, whatever the count: a surplus far
    # above the count (scale 10 -> 1) is otherwise never probed, and orphaned.
    expand_over: "/pods/"
    # Watch the children too: a rolled Pod is DELETED and recreated on a later
    # pass, and without this nothing would wake the ReplicaSet to do it.
    watch: "/pods/"
  # Stage 1 — the PREDECESSOR, so a rollout proceeds strictly in ordinal order.
  # Roll ordinal i only when i is stale and i-1 is already fresh: that is what
  # maxUnavailable = 1 means, with no budget to spend.
  - name: rs_prev
    type: decision
    params:
      # chronicle-source: modules/app/_chronicle/replicaset.uproc prev
      decision: ""
  - name: rs_prevget
    type: store_effect
    key_prefix: "/pods/"
    paths: "metadata.labels.pod-template-hash"
  # Stage 2 — THIS ordinal, carrying the predecessor verdict.
  - name: rs_probe
    type: decision
    params:
      # chronicle-source: modules/app/_chronicle/replicaset.uproc ask
      decision: ""
  - name: rs_selfget
    type: store_effect
    key_prefix: "/pods/"
    paths: "metadata.labels.pod-template-hash"
  # Stage 3 — create, delete, roll, or nothing.
  - name: rs_act
    type: decision
    params:
      # chronicle-source: modules/app/_chronicle/replicaset.uproc act
      decision: ""
  - name: rs_apply
    type: store_effect
    key_prefix: "/pods/"
  # Stage 4 — record what stage 3 did. The write's own reply carries the tag
  # saying which branch fired, so the event is decided from the effect that
  # produced it rather than guessed from a second read of the store.
  - name: rs_record
    type: decision
    params:
      # chronicle-source: modules/app/_chronicle/replicaset.uproc rec
      decision: ""
  - name: rs_events
    type: store_effect
    key_prefix: "/events/"
  # DaemonSet is PARAMS, not a module. Thirteen ds_* nodes carry the readiness
  # projection (/nodes/ -> /ready-nodes/),
  # the placement (DaemonSets JOIN ready Nodes -> create-if-absent, node-pinned),
  # and the prune (a DaemonSet Pod whose Node is no longer ready). The cross
  # product is the source's — `join` — as the count was for ReplicaSet.
  # Params compiled from modules/app/_chronicle/daemonset.uproc.
  - name: gc_pod_source
    type: store_source
    prefix: "/pods/"
    paths: "metadata.ownerReferences.0.name"
    # The cascade: when an owner is collected its children are orphans NOW,
    # and nothing under the children's prefix changed to say so.
    watch: "/replicasets.apps/"
  - name: gc_pod_probe
    type: decision
    params:
      # chronicle-source: modules/app/_chronicle/gc.uproc ask
      decision: ""
  - name: gc_pod_owner
    type: store_effect
    key_prefix: "/replicasets.apps/"
  - name: gc_pod_sweep
    type: decision
    params:
      # chronicle-source: modules/app/_chronicle/gc.uproc act
      decision: ""
  - name: gc_pod_collect
    type: store_effect
    key_prefix: "/pods/"
  - name: gc_rs_source
    type: store_source
    prefix: "/replicasets.apps/"
    paths: "metadata.ownerReferences.0.name"
    # The cascade: when an owner is collected its children are orphans NOW,
    # and nothing under the children's prefix changed to say so.
    watch: "/deployments.apps/"
  - name: gc_rs_probe
    type: decision
    params:
      # chronicle-source: modules/app/_chronicle/gc.uproc ask
      decision: ""
  - name: gc_rs_owner
    type: store_effect
    key_prefix: "/deployments.apps/"
  - name: gc_rs_sweep
    type: decision
    params:
      # chronicle-source: modules/app/_chronicle/gc.uproc act
      decision: ""
  - name: gc_rs_collect
    type: store_effect
    key_prefix: "/replicasets.apps/"
  - name: gc_ev_source
    type: store_source
    prefix: "/events/"
    count: 1
  - name: gc_ev_cap
    type: decision
    params:
      # chronicle-source: modules/app/_chronicle/gc.uproc evcap
      decision: "01080000001a000100021400000010c800000000000000500100021600000022000900000027000100020100000040010000001004000000000000004002000000010002030000004003000000410800000023000100020100000040010000001000000000000000004002000000120000400300000041"
  - name: gc_ev_collect
    type: store_effect
    key_prefix: "/events/"
  # Namespace teardown is PARAMS: a JOIN scoped to the namespace across every
  # namespaced tree — one record per object it contains — DELETEd while it is
  # Terminating; then count_children over the same trees, and at zero the
  # namespace record goes. Params from modules/app/_chronicle/namespace.uproc.

wiring:
  - from: dp_source.status
    to: dp_source.changes
  - from: dp_source.record_out
    to: dp_read.record_in
  - from: dp_read.result_out
    to: dp_current.request_in
    buffer_group: 15
  - from: dp_current.response_out
    to: dp_archive.record_in
  - from: dp_archive.result_out
    to: dp_history.request_in
    buffer_group: 16
  - from: dp_history.response_out
    to: dp_write.record_in
  - from: dp_write.result_out
    to: dp_apply.request_in
    buffer_group: 17
  - from: dp_apply.response_out
    to: dp_record.record_in
  - from: dp_record.result_out
    to: dp_events.request_in
    buffer_group: 18
  - from: rs_source.status
    to: rs_source.changes
  - from: rs_source.record_out
    to: rs_prev.record_in
  # Engine edges are byte FIFOs; the store_effect request edges are MAILBOXES
  # (a non-zero buffer_group), because one write must be one whole envelope.
  # Chronicle's engines self-frame and must NOT be mailboxed — `admit_frame`
  # peeks then reads exactly the frame length, illegal on a mailbox channel.
  - from: rs_prev.result_out
    to: rs_prevget.request_in
    buffer_group: 11
  - from: rs_prevget.response_out
    to: rs_probe.record_in
  - from: rs_probe.result_out
    to: rs_selfget.request_in
    buffer_group: 12
  - from: rs_selfget.response_out
    to: rs_act.record_in
  - from: rs_act.result_out
    to: rs_apply.request_in
    buffer_group: 13
  - from: rs_apply.response_out
    to: rs_record.record_in
  - from: rs_record.result_out
    to: rs_events.request_in
    buffer_group: 14
  - from: gc_pod_source.status
    to: gc_pod_source.changes
  - from: gc_pod_source.record_out
    to: gc_pod_probe.record_in
  - from: gc_pod_probe.result_out
    to: gc_pod_owner.request_in
    buffer_group: 21
  - from: gc_pod_owner.response_out
    to: gc_pod_sweep.record_in
  - from: gc_pod_sweep.result_out
    to: gc_pod_collect.request_in
    buffer_group: 22
  - from: gc_rs_source.status
    to: gc_rs_source.changes
  - from: gc_rs_source.record_out
    to: gc_rs_probe.record_in
  - from: gc_rs_probe.result_out
    to: gc_rs_owner.request_in
    buffer_group: 23
  - from: gc_rs_owner.response_out
    to: gc_rs_sweep.record_in
  - from: gc_rs_sweep.result_out
    to: gc_rs_collect.request_in
    buffer_group: 24
  - from: gc_ev_source.status
    to: gc_ev_source.changes
  - from: gc_ev_source.record_out
    to: gc_ev_cap.record_in
  - from: gc_ev_cap.result_out
    to: gc_ev_collect.request_in
    buffer_group: 25
