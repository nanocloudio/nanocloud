# The node's image plane: pull, assembly and image GC as Chronicle params
# (image.uproc, image_back.uproc, image_asm.uproc, image_heal.uproc,
# image_auth.uproc, image_gc*.uproc) over the `http_fetch` connector. A
# /image-requests/<rk> (reg, repo, tag, pin) becomes /image-digests/<rk> —
# the manifest digest it names (through an index when the tag names one: the
# entry for linux and the node's `kubernetes.io/arch`, from `facts`) — then a
# recorded manifest, a recorded runtime config, every layer a sha256-verified
# file in the blob cache with its /image-blobs/ marker, all keyed by that
# digest, and — once every layer is present — an assembly job whose verdict
# is /image-rootfs/<hex> state=ready. A reference naming another registry is
# asked of that registry, by its name. A GET that fails, and an assembly that
# fails, is asked again with a growing delay (10 s doubling to 300 s), and
# /image-pull-failed/<pull> says so to the Pods waiting on it. A cached
# layer a Pod's CREATE (or the assembly) finds missing, short or not its
# digest is dropped and fetched again (image_heal.uproc). A registry's
# challenge is answered with the imagePullSecrets of the Pods a pull serves
# (/image-pull-auth/, image_auth.uproc), then the node's credentials. An
# image no Pod uses is removed past /config/image's limits, least recently
# used first (image_gc*.uproc; its rootfs through `im_rm`, an fs_effect
# bounded to the rootfs directory).
#
# A fragment: nanocloud-graph.sh splices it into a node's graph (installed as
# /etc/nanocloud.io/fluxor/image.yaml) with the node's registry from its
# cluster.env — `authority` (where it dials), `label` (the registry a bare
# reference means), the credentials key, the blob directory, the node's
# labels (`__NODE_FACTS__`, rendered with the rest) — and puts the `tls`
# client the registry is authenticated through between `fetch` and the
# network (fetch_tls: the registry's CA from the node's config, by path,
# never in the graph). As written here it is plaintext, http_fetch straight
# to linux_net: what the E2Es splice against a local registry stub.
target: linux
tick_us: 1000

platform:
  net: {}

scheduler:
  accept_cycles: true

modules:
  - name: fetch
    type: http_fetch
    authority: "registry.nanocloud.io:5000"
    dir: "/var/lib/nanocloud.io/image/blobs"
    chunk_bytes: 0
    # A registry that asks credentials (a Bearer token from its realm, or
    # Basic) is offered, in order: the imagePullSecrets of the Pods the pull
    # serves (/image-pull-auth/<uid> names them for its pull; each Secret's
    # `auths` entry for the registry), then the node's own `user:password`
    # at this store key when the operator wrote one, then none — the next
    # on each refusal. Secrets are store values, never config.
    credentials: "/registry-auth/registry.nanocloud.io"
    pull_auth: "/image-pull-auth/"
    boot_delay_ms: 200
  # ── the queue writers ────────────────────────────────────────────────
  - name: im_req
    type: store_source
    prefix: "/image-requests/"
    flat: 1
    paths: "reg,repo,tag,pin"
    # This node's registry: what a bare reference means (one naming another
    # registry is asked of that registry, by its name).
    label: "registry.nanocloud.io:5000"
    related: "/image-index/:digest"
    unless: "/image-digests/"
    watch: "/image-"
  - name: im_qm
    type: store_effect
    # chronicle-source: modules/app/_chronicle/image.uproc im_qm
    decision: {hex: ""}
  - name: im_cfg
    type: store_source
    prefix: "/image-manifests/"
    flat: 1
    paths: "repo,config,configsize,host,reg,auth"
    unless: "/image-config/"
    watch: "/image-"
  - name: im_qc
    type: store_effect
    # chronicle-source: modules/app/_chronicle/image.uproc im_qc
    decision: {hex: ""}
  - name: im_lay
    type: store_source
    prefix: "/image-manifests/"
    flat: 1
    expand: "layers[]"
    paths: "repo,layers.#,sizes.#,host,reg,auth"
    # Not an image GC is removing (image_gc.uproc).
    unless: "/image-gc/"
    watch: "/image-"
  - name: im_lm
    type: store_effect
    # chronicle-source: modules/app/_chronicle/image.uproc im_lm
    decision: {hex: ""}
  - name: im_le
    type: store_effect
    # chronicle-source: modules/app/_chronicle/image.uproc im_le
    decision: {hex: ""}
  - name: im_lr
    type: store_effect
    # chronicle-source: modules/app/_chronicle/image.uproc im_lr
    decision: {hex: ""}
  # ── the fetch ────────────────────────────────────────────────────────
  - name: im_q
    type: store_source
    prefix: "/image-fetch-q/"
    flat: 1
    paths: "kind,name,path,digest,repo,size,of,host,reg,auth"
    ints: "size,fails,due"
    # The node's labels: an image index is read for its architecture.
    facts: '__NODE_FACTS__'
    # A row that failed backs off until its `due` (image_back.uproc): the
    # clock on every record, and a timer for the earliest deadline ahead.
    now: 1
    due: "due"
    watch: "/image-"
  - name: im_fq
    type: decision
    params:
      # chronicle-source: modules/app/_chronicle/image.uproc im_fq
      decision: {hex: ""}
  - name: im_ans
    type: store_effect
    # chronicle-source: modules/app/_chronicle/image.uproc im_ans
    decision: {hex: ""}
  # The request resolved, once the manifest it names is recorded.
  - name: im_tag
    type: store_effect
    # chronicle-source: modules/app/_chronicle/image.uproc im_tg
    decision: {hex: ""}
  # A GET that failed: its row backs off, and the pull says so to the Pods
  # waiting on it (/image-pull-failed/).
  - name: im_bo
    type: store_effect
    # chronicle-source: modules/app/_chronicle/image_back.uproc im_bo
    decision: {hex: ""}
  - name: im_bf
    type: store_effect
    # chronicle-source: modules/app/_chronicle/image_back.uproc im_bf
    decision: {hex: ""}
  # ── a cached layer the node could not use (image_heal.uproc) ─────────
  # /image-blob-bad/<uid> (pi_bad, the pod plane) -> each layer's marker and
  # layer-ok dropped, the pack's readiness dropped, the Pod's event, the
  # report consumed: the pull fetches the layers again.
  - name: im_hsrc
    type: store_source
    prefix: "/image-blob-bad/"
    flat: 1
    expand: "layers[]"
    paths: "pack,layers.#,at.#,code"
    related: "/pod-specs/:pod"
  - name: im_h1
    type: store_effect
    # chronicle-source: modules/app/_chronicle/image_heal.uproc hl_1
    decision: {hex: ""}
  - name: im_h2
    type: store_effect
    # chronicle-source: modules/app/_chronicle/image_heal.uproc hl_2
    decision: {hex: ""}
  - name: im_h3
    type: store_effect
    # chronicle-source: modules/app/_chronicle/image_heal.uproc hl_3
    decision: {hex: ""}
  - name: im_h4
    type: store_effect
    # chronicle-source: modules/app/_chronicle/image_heal.uproc hl_4
    decision: {hex: ""}
  - name: im_h5
    type: store_effect
    # chronicle-source: modules/app/_chronicle/image_heal.uproc hl_5
    decision: {hex: ""}
  # ── a Pod's pull credentials (image_auth.uproc) ──────────────────────
  # /pod-specs/<uid> -> its imagePullSecrets (or its ServiceAccount's) ->
  # /image-pull-auth/<uid> naming them for its pull, which `fetch` offers a
  # registry's challenge; a changed record clears that pull's backoff.
  - name: im_ps
    type: store_source
    prefix: "/pod-specs/"
    flat: 1
    paths: "image,image!ikey,image!tag,image!pin,pull,pod,desired,rootfs"
  - name: im_pa1
    type: store_effect
    paths: "spec.imagePullSecrets[].name,spec.serviceAccountName"
    # chronicle-source: modules/app/_chronicle/image_auth.uproc ia_1
    decision: {hex: ""}
  - name: im_pa2
    type: store_effect
    paths: "imagePullSecrets[].name"
    # chronicle-source: modules/app/_chronicle/image_auth.uproc ia_2
    decision: {hex: ""}
  - name: im_pa3
    type: store_effect
    # chronicle-source: modules/app/_chronicle/image_auth.uproc ia_3
    decision: {hex: ""}
  - name: im_pa4
    type: store_effect
    revision: 1
    # chronicle-source: modules/app/_chronicle/image_auth.uproc ia_4
    decision: {hex: ""}
  - name: im_pa5
    type: store_effect
    # chronicle-source: modules/app/_chronicle/image_auth.uproc ia_5
    decision: {hex: ""}
  # ── assembly ─────────────────────────────────────────────────────────
  # Every layer cached -> the assembly job -> /image-rootfs/ ready; a failed
  # assembly is asked again with a growing delay and said to the Pods
  # waiting on it, a corrupt cache fetched again (image_asm.uproc).
  - name: im_asm
    type: store_source
    prefix: "/image-manifests/"
    flat: 1
    paths: "layers!argv,kind,layers"
    ints: "n"
    now: 1
    count_children: "/image-layer-ok/"
    related: "/image-rootfs/:state,fails#;/sandbox-status/img-asm-:state,code;/config/image^9:script,rootfs,blobs"
    watch: "/image-,/sandbox-status/,/config/"
  - name: im_as1
    type: store_effect
    # chronicle-source: modules/app/_chronicle/image_asm.uproc im_as1
    decision: {hex: ""}
  - name: im_as2
    type: store_effect
    # chronicle-source: modules/app/_chronicle/image_asm.uproc im_as2
    decision: {hex: ""}
  - name: im_as3
    type: store_effect
    # chronicle-source: modules/app/_chronicle/image_asm.uproc im_as3
    decision: {hex: ""}
  - name: im_as4
    type: store_effect
    # chronicle-source: modules/app/_chronicle/image_asm.uproc im_as4
    decision: {hex: ""}
  # A failed assembly's delay: the timer for its `due`, then `state=retry`.
  - name: im_aretry
    type: store_source
    prefix: "/image-rootfs/"
    flat: 1
    paths: "state"
    ints: "fails,due"
    now: 1
    due: "due"
  - name: im_ar
    type: store_effect
    # chronicle-source: modules/app/_chronicle/image_asm.uproc im_ar
    decision: {hex: ""}
  # ── image GC (image_gc.uproc, image_gcd.uproc, image_gcl.uproc) ──────
  # The LRU index: an image no Pod resolved to, ready, keyed by when it
  # went unused (/image-lru/<at>/<m>).
  - name: im_gu
    type: store_source
    prefix: "/image-rootfs/"
    flat: 1
    paths: "state"
    related: "/image-lru-of/:at"
    watch: "/image-,/pod-resolved/"
  - name: im_gu1
    type: store_effect
    flat: 1
    paths: "digest"
    # chronicle-source: modules/app/_chronicle/image_gc.uproc gc_u1
    decision: {hex: ""}
    # chronicle-source: modules/app/_chronicle/image_gc.uproc gc_cw_ref
    count_where: {hex: "01060000001000010002280000000100021e0000002000030000000f0010010000000000000040010000004101000000010041"}
  - name: im_gu2
    type: store_effect
    wall: 1
    # chronicle-source: modules/app/_chronicle/image_gc.uproc gc_u2
    decision: {hex: ""}
  - name: im_gu3
    type: store_effect
    # chronicle-source: modules/app/_chronicle/image_gc.uproc gc_u3
    decision: {hex: ""}
  # The decision: past /config/image gc_high images, the oldest unused ones
  # (gc_min old) are marked for removal, down to gc_low; past gc_max, any.
  - name: im_gc
    type: store_source
    prefix: "/image-lru/"
    flat: 1
    count: 1
    empty: 1
    ints: "at"
    related: "/config/image^9:gc_high#,gc_low#,gc_min#,gc_max#;/image-gc-run^9:on"
    watch: "/image-,/config/"
  - name: im_gc1
    type: store_effect
    flat: 1
    paths: "state"
    # chronicle-source: modules/app/_chronicle/image_gc.uproc gc_c1
    decision: {hex: ""}
  - name: im_gc2
    type: store_effect
    # chronicle-source: modules/app/_chronicle/image_gc.uproc gc_c2
    decision: {hex: "000e0000004900010002010000004001000000100c000000000000004002000000120e002f696d6167652d726f6f7466732f4003000000010002280000004026000000010002fe00000040fe00000041"}
  - name: im_gc3
    type: store_effect
    wall: 1
    # chronicle-source: modules/app/_chronicle/image_gc.uproc gc_c3
    decision: {hex: ""}
  - name: im_gc4
    type: store_effect
    # chronicle-source: modules/app/_chronicle/image_gc.uproc gc_c4
    decision: {hex: ""}
  # The removal, phase by phase; the rootfs directory through the fs
  # contract (im_rm: only a direct child of its root is removed).
  - name: im_gd
    type: store_source
    prefix: "/image-gc/"
    flat: 1
    paths: "phase,layers,path"
    related: "/image-manifests/:layers;/image-rootfs/:path;/image-lru-of/:at"
    count_children: "/image-layer-ok/"
    watch: "/image-"
  - name: im_gd1
    type: store_effect
    flat: 1
    paths: "digest"
    # chronicle-source: modules/app/_chronicle/image_gcd.uproc gc_d1
    decision: {hex: ""}
    # chronicle-source: modules/app/_chronicle/image_gc.uproc gc_cw_ref
    count_where: {hex: "01060000001000010002280000000100021e0000002000030000000f0010010000000000000040010000004101000000010041"}
  - name: im_gd2
    type: store_effect
    # chronicle-source: modules/app/_chronicle/image_gcd.uproc gc_d2
    decision: {hex: ""}
  - name: im_gd3
    type: store_effect
    # chronicle-source: modules/app/_chronicle/image_gcd.uproc gc_d3
    decision: {hex: ""}
  - name: im_gd4
    type: store_effect
    # chronicle-source: modules/app/_chronicle/image_gcd.uproc gc_d4
    decision: {hex: ""}
  - name: im_gd5
    type: decision
    params:
      # chronicle-source: modules/app/_chronicle/image_gcd.uproc gc_d5
      decision: {hex: ""}
  - name: im_rm
    type: fs_effect
    root: "/var/lib/nanocloud.io/image/rootfs"
  - name: im_gd6
    type: store_effect
    # chronicle-source: modules/app/_chronicle/image_gcd.uproc gc_d6
    decision: {hex: ""}
  # The requests naming an image being removed, removed with it.
  - name: im_gj
    type: store_source
    prefix: "/image-digests/"
    flat: 1
    paths: "digest"
    join: "/image-gc/"
    watch: "/image-"
  - name: im_gj1
    type: store_effect
    # chronicle-source: modules/app/_chronicle/image_gcl.uproc gc_j1
    decision: {hex: ""}
  - name: im_gj2
    type: store_effect
    # chronicle-source: modules/app/_chronicle/image_gcl.uproc gc_j2
    decision: {hex: ""}
  - name: im_gj3
    type: store_effect
    # chronicle-source: modules/app/_chronicle/image_gcl.uproc gc_j3
    decision: {hex: ""}
  # Its layers: a blob no other image holds dropped through the pull's
  # queue (/image-fetch-q/d-<hex>), then the image's mark for it.
  - name: im_gl
    type: store_source
    prefix: "/image-gc/"
    flat: 1
    expand: "layers[]"
    paths: "layers.#,phase"
    watch: "/image-"
  - name: im_gl1
    type: store_effect
    flat: 1
    paths: "hex"
    # chronicle-source: modules/app/_chronicle/image_gcl.uproc gc_l1
    decision: {hex: ""}
    # chronicle-source: modules/app/_chronicle/image_gcl.uproc gc_cw_layer
    count_where: {hex: "01130000002a00010002280000000100021f00000020010002030000000100021e0000001201002d531f00530300323000030000000f0010010000000000000040010000004101000000010041"}
  - name: im_gl2
    type: store_effect
    # chronicle-source: modules/app/_chronicle/image_gcl.uproc gc_l2
    decision: {hex: ""}
  - name: im_gl3
    type: store_effect
    # chronicle-source: modules/app/_chronicle/image_gcl.uproc gc_l3
    decision: {hex: ""}

wiring:
  - from: linux_net.net_out
    to: fetch.net_in
  - from: fetch.net_out
    to: linux_net.net_in
  - from: im_req.status
    to: im_req.changes
  - from: im_req.record_out
    to: im_qm.request_in
  - from: im_cfg.status
    to: im_cfg.changes
  - from: im_cfg.record_out
    to: im_qc.request_in
  - from: im_lay.status
    to: im_lay.changes
  - from: im_lay.record_out
    to: im_lm.request_in
  - from: im_lm.response_out
    to: im_le.request_in
  - from: im_le.response_out
    to: im_lr.request_in
  - from: im_q.status
    to: im_q.changes
  - from: im_q.record_out
    to: im_fq.record_in
  - from: im_fq.result_out
    to: fetch.request_in
  - from: fetch.response_out
    to: im_ans.request_in
  - from: im_ans.response_out
    to: im_tag.request_in
  - from: im_tag.response_out
    to: im_bo.request_in
  - from: im_bo.response_out
    to: im_bf.request_in
  - from: im_ps.status
    to: im_ps.changes
  - from: im_ps.record_out
    to: im_pa1.request_in
  - from: im_pa1.response_out
    to: im_pa2.request_in
  - from: im_pa2.response_out
    to: im_pa3.request_in
  - from: im_pa3.response_out
    to: im_pa4.request_in
  - from: im_pa4.response_out
    to: im_pa5.request_in
  - from: im_asm.status
    to: im_asm.changes
  - from: im_asm.record_out
    to: im_as1.request_in
  - from: im_as1.response_out
    to: im_as2.request_in
  - from: im_as2.response_out
    to: im_as3.request_in
  - from: im_as3.response_out
    to: im_as4.request_in
  - from: im_aretry.status
    to: im_aretry.changes
  - from: im_aretry.record_out
    to: im_ar.request_in
  - from: im_hsrc.status
    to: im_hsrc.changes
  - from: im_hsrc.record_out
    to: im_h1.request_in
  - from: im_h1.response_out
    to: im_h2.request_in
  - from: im_h2.response_out
    to: im_h3.request_in
  - from: im_h3.response_out
    to: im_h4.request_in
  - from: im_h4.response_out
    to: im_h5.request_in
  - from: im_gu.status
    to: im_gu.changes
  - from: im_gu.record_out
    to: im_gu1.request_in
  - from: im_gu1.response_out
    to: im_gu2.request_in
  - from: im_gu2.response_out
    to: im_gu3.request_in
  - from: im_gc.status
    to: im_gc.changes
  - from: im_gc.record_out
    to: im_gc1.request_in
  - from: im_gc1.response_out
    to: im_gc2.request_in
  - from: im_gc2.response_out
    to: im_gc3.request_in
  - from: im_gc3.response_out
    to: im_gc4.request_in
  - from: im_gd.status
    to: im_gd.changes
  - from: im_gd.record_out
    to: im_gd1.request_in
  - from: im_gd1.response_out
    to: im_gd2.request_in
  - from: im_gd2.response_out
    to: im_gd3.request_in
  - from: im_gd3.response_out
    to: im_gd4.request_in
  - from: im_gd4.response_out
    to: im_gd5.record_in
  - from: im_gd5.result_out
    to: im_rm.request_in
  - from: im_rm.response_out
    to: im_gd6.request_in
  - from: im_gj.status
    to: im_gj.changes
  - from: im_gj.record_out
    to: im_gj1.request_in
  - from: im_gj1.response_out
    to: im_gj2.request_in
  - from: im_gj2.response_out
    to: im_gj3.request_in
  - from: im_gl.status
    to: im_gl.changes
  - from: im_gl.record_out
    to: im_gl1.request_in
  - from: im_gl1.response_out
    to: im_gl2.request_in
  - from: im_gl2.response_out
    to: im_gl3.request_in
