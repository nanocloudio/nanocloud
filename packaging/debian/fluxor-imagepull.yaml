# Image pull and assembly as Chronicle params (image.uproc, image_asm.uproc)
# over the `http_fetch` connector. A /image-requests/<n> (repo, tag) becomes a
# recorded manifest (through an index when the tag names one: arm64/linux), a
# recorded runtime config, every layer a sha256-verified file in the blob cache
# with its /blobs/ marker, and — once every layer is present — an assembly job
# whose verdict is /image-rootfs/<n> state=ready|failed.
#
# Plaintext here (http_fetch straight to linux_net); fluxor-image-fetch.yaml
# carries the same chains behind `tls` for a CA-pinned registry.
target: linux
tick_us: 1000

platform:
  net: {}

scheduler:
  accept_cycles: true

modules:
  - name: fetch
    type: http_fetch
    authority: "registry.nanocloud.io:5000"
    dir: "/var/lib/nanocloud.io/image/blobs"
    chunk_bytes: 0
    boot_delay_ms: 200
  # ── the queue writers ────────────────────────────────────────────────
  - name: im_req
    type: store_source
    prefix: "/image-requests/"
    flat: 1
    paths: "repo,tag"
    related: "/image-index/:digest"
    unless: "/image-manifests/"
    watch: "/image-index/,/image-manifests/"
  - name: im_qm
    type: store_effect
    # chronicle-source: modules/app/_chronicle/image.uproc im_qm
    decision: ""
  - name: im_cfg
    type: store_source
    prefix: "/image-manifests/"
    flat: 1
    paths: "repo,config,configsize"
    unless: "/image-config/"
    watch: "/image-config/"
  - name: im_qc
    type: store_effect
    # chronicle-source: modules/app/_chronicle/image.uproc im_qc
    decision: ""
  - name: im_lay
    type: store_source
    prefix: "/image-manifests/"
    flat: 1
    expand: "layers[]"
    paths: "repo,layers.#,sizes.#"
    watch: "/blobs/"
  - name: im_le
    type: store_effect
    # chronicle-source: modules/app/_chronicle/image.uproc im_le
    decision: ""
  - name: im_lr
    type: store_effect
    # chronicle-source: modules/app/_chronicle/image.uproc im_lr
    decision: ""
  # ── the fetch ────────────────────────────────────────────────────────
  - name: im_q
    type: store_source
    prefix: "/fetch-q/"
    flat: 1
    paths: "kind,name,path,digest,repo,size"
    ints: "size"
    watch: "/image-manifests/,/image-config/,/blobs/,/image-index/"
  - name: im_fq
    type: decision
    params:
      # chronicle-source: modules/app/_chronicle/image.uproc im_fq
      decision: ""
  - name: im_ans
    type: store_effect
    # chronicle-source: modules/app/_chronicle/image.uproc im_ans
    decision: ""
  # ── assembly ─────────────────────────────────────────────────────────
  - name: im_asm
    type: store_source
    prefix: "/image-manifests/"
    flat: 1
    paths: "layers!argv"
    ints: "n"
    count_children: "/image-layer-ok/"
    related: "/image-rootfs/:state;/sandbox-status/img-asm-:state,code;/config/image^9:script,rootfs,blobs"
    watch: "/image-layer-ok/,/image-rootfs/,/sandbox-status/,/config/"
  - name: im_as1
    type: store_effect
    # chronicle-source: modules/app/_chronicle/image_asm.uproc im_as1
    decision: ""
  - name: im_as2
    type: store_effect
    # chronicle-source: modules/app/_chronicle/image_asm.uproc im_as2
    decision: ""

wiring:
  - from: linux_net.net_out
    to: fetch.net_in
  - from: fetch.net_out
    to: linux_net.net_in
  - from: im_req.status
    to: im_req.changes
  - from: im_req.record_out
    to: im_qm.request_in
  - from: im_cfg.status
    to: im_cfg.changes
  - from: im_cfg.record_out
    to: im_qc.request_in
  - from: im_lay.status
    to: im_lay.changes
  - from: im_lay.record_out
    to: im_le.request_in
  - from: im_le.response_out
    to: im_lr.request_in
  - from: im_q.status
    to: im_q.changes
  - from: im_q.record_out
    to: im_fq.record_in
  - from: im_fq.result_out
    to: fetch.request_in
  - from: fetch.response_out
    to: im_ans.request_in
  - from: im_asm.status
    to: im_asm.changes
  - from: im_asm.record_out
    to: im_as1.request_in
  - from: im_as1.response_out
    to: im_as2.request_in
