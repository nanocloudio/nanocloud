# The node's image plane: pull and assembly as Chronicle params (image.uproc,
# image_asm.uproc) over the `http_fetch` connector. A /image-requests/<rk>
# (reg, repo, tag, pin) becomes /image-digests/<rk> — the manifest digest it
# names (through an index when the tag names one: arm64/linux), or refused=
# for another registry than this node's — then a recorded manifest, a
# recorded runtime config, every layer a sha256-verified file in the blob
# cache with its /image-blobs/ marker, all keyed by that digest, and — once
# every layer is present — an assembly job whose verdict is /image-rootfs/
# <hex> state=ready|failed. A GET that fails is asked again with a growing
# delay (10 s doubling to 300 s), and /image-pull-failed/<pull> says so to the
# Pods waiting on it. A cached layer a Pod's CREATE finds missing, short or
# not its digest is dropped and fetched again (image_heal.uproc).
#
# A fragment: nanocloud-graph.sh splices it into a node's graph (installed as
# /etc/nanocloud.io/fluxor/image.yaml) with the node's registry from its
# cluster.env — `authority` (where it dials), `label` (the registry a bare
# reference means, and the only one pulled from), the credentials key, the
# blob directory — and puts the `tls` client the registry is authenticated
# through between `fetch` and the network (fetch_tls: the registry's CA from
# the node's config, by path, never in the graph). As written here it is
# plaintext, http_fetch straight to linux_net: what the E2Es splice against
# a local registry stub.
target: linux
tick_us: 1000

platform:
  net: {}

scheduler:
  accept_cycles: true

modules:
  - name: fetch
    type: http_fetch
    authority: "registry.nanocloud.io:5000"
    dir: "/var/lib/nanocloud.io/image/blobs"
    chunk_bytes: 0
    # A registry that asks a Bearer token (OCI token auth) is answered from
    # its realm; `user:password` for the realm is this store key's value
    # when the operator wrote one, never config. Absent: anonymous.
    credentials: "/registry-auth/registry.nanocloud.io"
    boot_delay_ms: 200
  # ── the queue writers ────────────────────────────────────────────────
  - name: im_req
    type: store_source
    prefix: "/image-requests/"
    flat: 1
    paths: "reg,repo,tag,pin"
    # This node's registry: what a bare reference means, and the one
    # registry a reference may name (another is refused, not pulled here).
    label: "registry.nanocloud.io:5000"
    related: "/image-index/:digest"
    unless: "/image-digests/"
    watch: "/image-"
  - name: im_qm
    type: store_effect
    # chronicle-source: modules/app/_chronicle/image.uproc im_qm
    decision: {hex: ""}
  - name: im_cfg
    type: store_source
    prefix: "/image-manifests/"
    flat: 1
    paths: "repo,config,configsize"
    unless: "/image-config/"
    watch: "/image-"
  - name: im_qc
    type: store_effect
    # chronicle-source: modules/app/_chronicle/image.uproc im_qc
    decision: {hex: ""}
  - name: im_lay
    type: store_source
    prefix: "/image-manifests/"
    flat: 1
    expand: "layers[]"
    paths: "repo,layers.#,sizes.#"
    watch: "/image-"
  - name: im_le
    type: store_effect
    # chronicle-source: modules/app/_chronicle/image.uproc im_le
    decision: {hex: ""}
  - name: im_lr
    type: store_effect
    # chronicle-source: modules/app/_chronicle/image.uproc im_lr
    decision: {hex: ""}
  # ── the fetch ────────────────────────────────────────────────────────
  - name: im_q
    type: store_source
    prefix: "/image-fetch-q/"
    flat: 1
    paths: "kind,name,path,digest,repo,size,of"
    ints: "size,fails,due"
    # A row that failed backs off until its `due` (image_back.uproc): the
    # clock on every record, and a timer for the earliest deadline ahead.
    now: 1
    due: "due"
    watch: "/image-"
  - name: im_fq
    type: decision
    params:
      # chronicle-source: modules/app/_chronicle/image.uproc im_fq
      decision: {hex: ""}
  - name: im_ans
    type: store_effect
    # chronicle-source: modules/app/_chronicle/image.uproc im_ans
    decision: {hex: ""}
  # The request resolved, once the manifest it names is recorded.
  - name: im_tag
    type: store_effect
    # chronicle-source: modules/app/_chronicle/image.uproc im_tg
    decision: {hex: ""}
  # A GET that failed: its row backs off, and the pull says so to the Pods
  # waiting on it (/image-pull-failed/).
  - name: im_bo
    type: store_effect
    # chronicle-source: modules/app/_chronicle/image_back.uproc im_bo
    decision: {hex: ""}
  - name: im_bf
    type: store_effect
    # chronicle-source: modules/app/_chronicle/image_back.uproc im_bf
    decision: {hex: ""}
  # ── a cached layer the node could not use (image_heal.uproc) ─────────
  # /image-blob-bad/<uid> (pi_bad, the pod plane) -> each layer's marker and
  # layer-ok dropped, the pack's readiness dropped, the Pod's event, the
  # report consumed: the pull fetches the layers again.
  - name: im_hsrc
    type: store_source
    prefix: "/image-blob-bad/"
    flat: 1
    expand: "layers[]"
    paths: "pack,layers.#,at.#,code"
    related: "/pod-specs/:pod"
  - name: im_h1
    type: store_effect
    # chronicle-source: modules/app/_chronicle/image_heal.uproc hl_1
    decision: {hex: ""}
  - name: im_h2
    type: store_effect
    # chronicle-source: modules/app/_chronicle/image_heal.uproc hl_2
    decision: {hex: ""}
  - name: im_h3
    type: store_effect
    # chronicle-source: modules/app/_chronicle/image_heal.uproc hl_3
    decision: {hex: ""}
  - name: im_h4
    type: store_effect
    # chronicle-source: modules/app/_chronicle/image_heal.uproc hl_4
    decision: {hex: ""}
  - name: im_h5
    type: store_effect
    # chronicle-source: modules/app/_chronicle/image_heal.uproc hl_5
    decision: {hex: ""}
  # ── assembly ─────────────────────────────────────────────────────────
  - name: im_asm
    type: store_source
    prefix: "/image-manifests/"
    flat: 1
    paths: "layers!argv,kind"
    ints: "n"
    count_children: "/image-layer-ok/"
    related: "/image-rootfs/:state;/sandbox-status/img-asm-:state,code;/config/image^9:script,rootfs,blobs"
    watch: "/image-,/sandbox-status/,/config/"
  - name: im_as1
    type: store_effect
    # chronicle-source: modules/app/_chronicle/image_asm.uproc im_as1
    decision: {hex: ""}
  - name: im_as2
    type: store_effect
    # chronicle-source: modules/app/_chronicle/image_asm.uproc im_as2
    decision: {hex: ""}

wiring:
  - from: linux_net.net_out
    to: fetch.net_in
  - from: fetch.net_out
    to: linux_net.net_in
  - from: im_req.status
    to: im_req.changes
  - from: im_req.record_out
    to: im_qm.request_in
  - from: im_cfg.status
    to: im_cfg.changes
  - from: im_cfg.record_out
    to: im_qc.request_in
  - from: im_lay.status
    to: im_lay.changes
  - from: im_lay.record_out
    to: im_le.request_in
  - from: im_le.response_out
    to: im_lr.request_in
  - from: im_q.status
    to: im_q.changes
  - from: im_q.record_out
    to: im_fq.record_in
  - from: im_fq.result_out
    to: fetch.request_in
  - from: fetch.response_out
    to: im_ans.request_in
  - from: im_ans.response_out
    to: im_tag.request_in
  - from: im_tag.response_out
    to: im_bo.request_in
  - from: im_bo.response_out
    to: im_bf.request_in
  - from: im_asm.status
    to: im_asm.changes
  - from: im_asm.record_out
    to: im_as1.request_in
  - from: im_as1.response_out
    to: im_as2.request_in
  - from: im_hsrc.status
    to: im_hsrc.changes
  - from: im_hsrc.record_out
    to: im_h1.request_in
  - from: im_h1.response_out
    to: im_h2.request_in
  - from: im_h2.response_out
    to: im_h3.request_in
  - from: im_h3.response_out
    to: im_h4.request_in
  - from: im_h4.response_out
    to: im_h5.request_in
