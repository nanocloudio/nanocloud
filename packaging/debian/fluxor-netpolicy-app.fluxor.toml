# Workload source manifest for the netpolicy bundle. postinst emits it and
# publishes it into the node's OCI store, so `netpolicy:1.0.0` resolves offline.
# Portless — the chains and net_apply drive the store and net.policy providers
# via provider_call, not a socket. The graph (linux.yaml, staged beside this
# file) is packaging/debian/fluxor-netpolicy.yaml: netpolicy.uproc params plus
# net_apply.
[workload]
name = "netpolicy"
version = "1.0.0"
role = "service"

[[implementation]]
target = "linux"
graph = "linux.yaml"

[resources]
state_bytes = 65536
buffer_bytes = 16384
