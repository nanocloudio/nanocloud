# Workload source manifest for the webhook-validator bundle. postinst emits it and
# publishes it into the node's OCI store, so `webhook-validator:1.0.0` resolves offline.
# Portless — the validator drives the store provider via provider_call, not a
# socket. The graph (linux.yaml, staged beside this file) runs the
# webhook_validator module.
[workload]
name = "webhook-validator"
version = "1.0.0"
role = "service"

[[implementation]]
target = "linux"
graph = "linux.yaml"

[resources]
state_bytes = 65536
buffer_bytes = 16384
