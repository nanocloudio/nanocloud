# cluster graph: the control plane's reconcilers as Chronicle params — the
# desired-state chain (`dp_`, `rs_`), the scheduler (`sc_`) and the DaemonSet
# chain (`ds_`), on one shared store. Same nodes and params
# fluxor-controlplane.yaml ships, without the API plane in front.
target: linux
tick_us: 1000

scheduler:
  accept_cycles: true

modules:
  - name: dp_source
    type: store_scan
    prefix: "/deployments.apps/"
    paths: "spec!hash,spec.replicas,metadata.uid"
    hash: "spec.template"
  - name: dp_current
    type: store_stamped
    # chronicle-source: modules/app/_chronicle/deployment.uproc rd
    decision: {hex: ""}
    key_prefix: "/replicasets.apps/"
    paths: "metadata.labels.pod-template-hash,spec!hash"
  - name: dp_history
    type: store_big
    # chronicle-source: modules/app/_chronicle/deployment.uproc arch
    decision: {hex: ""}
    key_prefix: "/controllerrevisions.apps/"
  - name: dp_apply
    type: store_big
    # Objects this controller creates get their identity as the API's do:
    # a uid and creationTimestamp stamped when created, kept when rewritten.
    stamp: 1
    schema: "create=metadata.uid:uuid,metadata.creationTimestamp:now;keep=metadata.uid,metadata.creationTimestamp"
    # chronicle-source: modules/app/_chronicle/deployment.uproc wr
    decision: {hex: ""}
    key_prefix: "/replicasets.apps/"
  - name: dp_events
    type: store_effect
    # chronicle-source: modules/app/_chronicle/deployment.uproc rec
    decision: {hex: ""}
    key_prefix: "/events/"
  # ReplicaSet convergence is PARAMS, not a module: the nine nodes below are
  # Chronicle's generic engines carrying params compiled from
  # `modules/app/_chronicle/replicaset.uproc`. Names are `rs_`-prefixed because
  # this graph holds twenty-five modules and `act`/`record` are not distinctive.
  #
  # The params are BAKED because a deb ships no compiler; each carries a
  # provenance marker that `scripts/chronicle-param-drift-e2e.sh` recompiles and
  # compares. A stale decision does not error — it decides something else.
  - name: rs_source
    type: store_scan
    prefix: "/replicasets.apps/"
    paths: "metadata.labels.pod-template-hash,metadata.uid"
    expand: "spec.replicas"
    # One past the desired count, so the first surplus ordinal is probed and
    # collected on the same pass that scales down.
    expand_tail: 4
    # ...and past the highest EXISTING child, whatever the count: a surplus far
    # above the count (scale 10 -> 1) is otherwise never probed, and orphaned.
    expand_over: "/pods/"
    # Watch the children too: a rolled Pod is DELETED and recreated on a later
    # pass, and without this nothing would wake the ReplicaSet to do it.
    watch: "/pods/"
  # Stage 1 — the PREDECESSOR, so a rollout proceeds strictly in ordinal order.
  # Roll ordinal i only when i is stale and i-1 is already fresh: that is what
  # maxUnavailable = 1 means, with no budget to spend.
  - name: rs_prevget
    type: store_stamped
    # chronicle-source: modules/app/_chronicle/replicaset.uproc prev
    decision: {hex: ""}
    key_prefix: "/pods/"
    paths: "metadata.labels.pod-template-hash"
  # Stage 2 — THIS ordinal, carrying the predecessor verdict.
  - name: rs_selfget
    type: store_stamped
    # chronicle-source: modules/app/_chronicle/replicaset.uproc ask
    decision: {hex: ""}
    key_prefix: "/pods/"
    paths: "metadata.labels.pod-template-hash"
  # Stage 3 — create, delete, roll, or nothing.
  - name: rs_apply
    type: store_big
    # Objects this controller creates get their identity as the API's do:
    # a uid and creationTimestamp stamped when created, kept when rewritten.
    stamp: 1
    schema: "create=metadata.uid:uuid,metadata.creationTimestamp:now;keep=metadata.uid,metadata.creationTimestamp"
    # chronicle-source: modules/app/_chronicle/replicaset.uproc act
    decision: {hex: ""}
    key_prefix: "/pods/"
  # Stage 4 — record what stage 3 did. The write's own reply carries the tag
  # saying which branch fired, so the event is decided from the effect that
  # produced it rather than guessed from a second read of the store.
  - name: rs_events
    type: store_effect
    # chronicle-source: modules/app/_chronicle/replicaset.uproc rec
    decision: {hex: ""}
    key_prefix: "/events/"
  # DaemonSet is PARAMS, not a module. Thirteen ds_* nodes carry the readiness
  # projection (/nodes/ -> /ready-nodes/),
  # the placement (DaemonSets JOIN ready Nodes -> create-if-absent, node-pinned),
  # and the prune (a DaemonSet Pod whose Node is no longer ready). The cross
  # product is the source's — `join` — as the count was for ReplicaSet.
  # Params compiled from modules/app/_chronicle/daemonset.uproc.
  - name: ds_nodes
    type: store_source
    prefix: "/nodes/"
    paths: "status.ready"
  - name: ds_mark
    type: store_effect
    # chronicle-source: modules/app/_chronicle/daemonset.uproc rdy
    decision: {hex: "01050000001000010002040000001204007472756520000b00000030000100020100000040010000001003000000000000004002000000010002030000004003000000120100314004000000410b0000002f000100020100000040010000001004000000000000004002000000010002030000004003000000120000400400000041"}
    key_prefix: "/ready-nodes/"
  - name: ds_source
    type: store_scan
    # A DaemonSet carries its users' template: read whole (store_scan). Its
    # digest is the Pods' controller-revision-hash; the template itself is
    # SPLICED by ds_apply from the stored DaemonSet, never carried.
    hash: "spec.template"
    prefix: "/daemonsets.apps/"
    paths: "metadata.uid"
    join: "/ready-nodes/"
    watch: "/ready-nodes/,/pods/"
  - name: ds_exists
    type: store_effect
    # chronicle-source: modules/app/_chronicle/daemonset.uproc prb
    decision: {hex: "00230000006e0001000201000000400100000010020000000000000040020000000100021800000040030000000100021800000001000203000000010002150000000100021c0000000100021d000000010002040000000100021b0000000100021a00000042081e1f20222324252740fe00000041"}
    key_prefix: "/pods/"
  - name: ds_apply
    type: store_big
    # Objects this controller creates get their identity as the API's do:
    # a uid and creationTimestamp stamped when created, kept when rewritten.
    stamp: 1
    schema: "create=metadata.uid:uuid,metadata.creationTimestamp:now;keep=metadata.uid,metadata.creationTimestamp"
    # chronicle-source: modules/app/_chronicle/daemonset.uproc mk
    decision: {hex: ""}
    key_prefix: "/pods/"
  - name: ds_pods
    type: store_scan
    prefix: "/pods/"
    paths: "metadata.ownerReferences.0.kind,spec.nodeName"
    watch: "/ready-nodes/"
  - name: ds_known
    type: store_effect
    # chronicle-source: modules/app/_chronicle/daemonset.uproc ask_p
    decision: {hex: ""}
    key_prefix: "/ready-nodes/"
  - name: ds_collect
    type: store_effect
    # chronicle-source: modules/app/_chronicle/daemonset.uproc prn
    decision: {hex: "010500000012000100020200000010940100000000000020000a0000002c000100020100000040010000001004000000000000004002000000010002fe000000021e0000004003000000410800000023000100020100000040010000001000000000000000004002000000120000400300000041"}
    key_prefix: "/pods/"
  # StatefulSet is PARAMS: the ReplicaSet chain with the gate asked of the
  # NEIGHBOUR that matters — the predecessor's readiness in range, the
  # successor's absence for a surplus — so bring-up is ordered and teardown is
  # highest-first without a budget. Params from modules/app/_chronicle/statefulset.uproc.
  # The scheduler is PARAMS (scheduler.uproc) over the source's pick
  # (store_source `sched`, _shared/sched.rs): each pending Pod judged against
  # the ready nodes as upstream's default profile judges it — cordon,
  # nodeSelector and node affinity, taints and tolerations, requests within
  # allocatable, pod (anti-)affinity, topology spread — and scored; position
  # 0 (bound this pass) to the first placeable Pod of the highest priority;
  # a Pod nothing fits gets PodScheduled=False/Unschedulable and a
  # FailedScheduling event; the first unplaceable Pod of the highest
  # priority may preempt lower-priority Pods (PodDisruptionBudgets honoured
  # as far as they can be). One bind per pass, the load measured from the
  # Pods themselves at pick time. Reads /ready-nodes/ from the DaemonSet
  # chain's projection.
  - name: sc_unbound
    type: store_scan
    prefix: "/pods/"
    where: "spec.nodeName="
    count: 1
    join: "/ready-nodes/"
    paths: "metadata.uid"
    sched: "/nodes/:/pods/:/poddisruptionbudgets/"
    sched_preempt: 1
    watch: "/ready-nodes/,/nodes/,/poddisruptionbudgets/"
  - name: sc_victim
    type: store_stamped
    # chronicle-source: modules/app/_chronicle/scheduler.uproc vict_p
    decision: {hex: ""}
    key_prefix: "/"
    # A preempted Pod leaves its tomb: its node learns of the delete.
    tomb: "/~tomb"
  - name: sc_patch
    type: store_big
    # chronicle-source: modules/app/_chronicle/scheduler.uproc bind_p
    decision: {hex: ""}
    key_prefix: "/pods/"
  - name: sc_events
    type: store_effect
    # chronicle-source: modules/app/_chronicle/scheduler.uproc record_p
    decision: {hex: ""}
    key_prefix: "/events/"
wiring:
  - from: dp_source.record_out
    to: dp_current.request_in
  - from: dp_current.response_out
    to: dp_history.request_in
  - from: dp_history.response_out
    to: dp_apply.request_in
  - from: dp_apply.response_out
    to: dp_events.request_in
  - from: rs_source.record_out
    to: rs_prevget.request_in
  # Engine edges are byte FIFOs; the store_effect request edges are MAILBOXES
  # (a non-zero buffer_group), because one write must be one whole envelope.
  # Chronicle's engines self-frame and must NOT be mailboxed — `admit_frame`
  # peeks then reads exactly the frame length, illegal on a mailbox channel.
  - from: rs_prevget.response_out
    to: rs_selfget.request_in
  - from: rs_selfget.response_out
    to: rs_apply.request_in
  - from: rs_apply.response_out
    to: rs_events.request_in
  - from: ds_nodes.record_out
    to: ds_mark.request_in
  - from: ds_source.record_out
    to: ds_exists.request_in
  - from: ds_exists.response_out
    to: ds_apply.request_in
  - from: ds_pods.record_out
    to: ds_known.request_in
  - from: ds_known.response_out
    to: ds_collect.request_in
  - from: sc_unbound.record_out
    to: sc_victim.request_in
  - from: sc_victim.response_out
    to: sc_patch.request_in
  - from: sc_patch.response_out
    to: sc_events.request_in
