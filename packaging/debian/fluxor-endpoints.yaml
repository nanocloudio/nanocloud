# endpoints workload graph: the endpoints controller
# as Chronicle params — Services joined to Pods by label selector, the probe
# runner's readiness folded in, per-pod rows with the EndpointSlice
# conditions (ready / notready / serving / terminating), a drain-first
# removal expired by its grace, /endpoint-lists/<ns>/<svc> folded from the
# rows, and the API's discovery.k8s.io/v1 EndpointSlice and v1 Endpoints
# rendered from them. The store I/O is the connectors'.

target: linux
tick_us: 1000

scheduler:
  accept_cycles: true

modules:
  # Endpoints is PARAMS: Services JOIN the namespace's Pods with the label
  # selector as the join predicate and the probe runner's readiness overriding
  # the static field; the Pod is read for its grace, its node for its zone,
  # and the row it has for its generation and its drain ->
  # /endpoint-rows/<ns>/<svc>/<pod> = ip=…;state=…;zone=…;node=…;gen=…;af=…;
  # uid=…[;at=…;grace=…]; a row whose Pod is gone drains (terminating, 30 s)
  # and expires (a notready one goes at once); list_children over the rows
  # materialises /endpoint-lists/<ns>/<svc> = "<pod>=<value>,…" — a fold
  # bounded by one record (a Service of more than about 100 rows is folded
  # CUT at a whole entry, and the log says so), so it is a summary for
  # people and tests: every reader that needs the whole set walks the rows
  # (cluster_dns pages /endpoint-rows/<ns>/<svc>/, the proxy and the route
  # compiler join them, EP_DOCS reads them for the API's documents); and the
  # API's documents, /endpointslices/<ns>/<svc> (discovery.k8s.io/v1
  # EndpointSlice) and /endpoints/<ns>/<svc> (v1 Endpoints), are rendered
  # from the Service and its rows. Params from
  # modules/app/_chronicle/endpoints.plan (the rows) and endpoints_doc.plan
  # (the fold and the documents).
  - name: ep_pairs
    type: store_scan
    # store_scan: a joined Pod past the stack (a real template) is read whole
    # on the heap, or it would match no selector.
    prefix: "/services/"
    paths: "spec.selector"
    join: "/pods/"
    join_scoped: 2
    join_match: "metadata.labels:spec.selector"
    join_paths: "status.conditions[type=Ready].status,status.podIP,metadata.uid,spec.nodeName,metadata.deletionTimestamp"
    watch: "/pods/,/probe-status/,/pod-probes/,/nodes/"
  - name: ep_probe
    type: store_effect
    # chronicle-source: modules/app/_chronicle/endpoints.plan ak
    decision: {hex: ""}
    key_prefix: "/probe-status/"
    flat: 1
    paths: "ready"
  # A readiness probe declared on this node with no verdict yet: not ready.
  - name: ep_declared
    type: store_effect
    # chronicle-source: modules/app/_chronicle/endpoints.plan dl
    decision: {hex: ""}
    key_prefix: "/pod-probes/"
    flat: 1
    paths: "rp_cmd"
  # The Pod, for its grace: the deleter's deletionGracePeriodSeconds, else
  # the spec's terminationGracePeriodSeconds (else 30 s, decided in the plan).
  - name: ep_pod
    # store_stamped: its small heap reads a Pod past a record (a real
    # template) whole, where a plain store_effect is refused.
    type: store_stamped
    # chronicle-source: modules/app/_chronicle/endpoints.plan pd
    decision: {hex: ""}
    key_prefix: "/pods/"
    ints: "spec.terminationGracePeriodSeconds,metadata.deletionGracePeriodSeconds"
  # Its node, for its zone (`topology.kubernetes.io/zone`).
  - name: ep_node
    type: store_effect
    # chronicle-source: modules/app/_chronicle/endpoints.plan nd
    decision: {hex: ""}
    key_prefix: "/nodes/"
    paths: "metadata.labels.\"topology.kubernetes.io/zone\""
  # The row as it stands: its generation, and the drain it may be in.
  - name: ep_prev
    type: store_effect
    # chronicle-source: modules/app/_chronicle/endpoints.plan pv
    decision: {hex: ""}
    key_prefix: "/endpoint-rows/"
    flat: 1
    paths: "ip,state,uid,at"
    ints: "gen,grace"
  # The row decided; `wall: 2` hands the plan the moment now, recorded as
  # `at=` when a drain begins.
  - name: ep_slices
    type: store_effect
    # chronicle-source: modules/app/_chronicle/endpoints.plan sl
    decision: {hex: ""}
    key_prefix: "/endpoint-rows/"
    wall: 2
  - name: ep_sl_source
    type: store_source
    prefix: "/endpoint-rows/"
    flat: 1
    paths: "ip,state,zone,node,gen,af,uid,at,grace"
    related: "/services/^1!json:metadata.name,spec.selector"
    watch: "/pods/,/services/"
  - name: ep_podexists
    type: store_effect
    # chronicle-source: modules/app/_chronicle/endpoints.plan ex
    decision: {hex: ""}
    key_prefix: "/pods/"
  # A gone Pod's row drains (terminating, the moment now, 30 s unless a
  # grace is recorded; a notready one goes); a gone Service's goes.
  - name: ep_collect
    type: store_effect
    # chronicle-source: modules/app/_chronicle/endpoints.plan pr
    decision: {hex: ""}
    key_prefix: "/endpoint-rows/"
    wall: 2
  # The drain's end: a row's `at` plus its `grace` arms the timer; the
  # record arrives with now past it and ttl.plan deletes the row. Nothing
  # polls. A moment of another boot is re-based to the grace's length.
  - name: ep_expiry_src
    type: store_source
    prefix: "/endpoint-rows/"
    flat: 1
    ints: "at!due+grace"
    now: 1
    due: "at!due+grace"
  - name: ep_expire
    type: store_effect
    # chronicle-source: modules/app/_chronicle/ttl.plan ex
    decision: {hex: "010b000000220001000232000000100000000000000000240100023a000000010002320000002530000900000027000100020100000040010000001004000000000000004002000000010002030000004003000000410800000023000100020100000040010000001000000000000000004002000000120000400300000041"}
    key_prefix: "/endpoint-rows/"
  - name: ep_svcs
    type: store_source
    prefix: "/services/"
    paths: "spec.selector"
    list_children: "/endpoint-rows/"
    child_sep: "/"
    watch: "/endpoint-rows/"
  - name: ep_write
    type: store_effect
    # chronicle-source: modules/app/_chronicle/endpoints_doc.plan dc
    decision: {hex: ""}
    key_prefix: "/endpoint-lists/"
  # A deleted Service's /endpoint-lists/ fold goes with it (its rows are
  # pruned above).
  - name: ep_docs
    type: store_source
    rev: 1
    prefix: "/endpoint-lists/"
    related: "/services/:metadata.name"
    watch: "/services/"
  - name: ep_gone
    type: store_effect
    # chronicle-source: modules/app/_chronicle/endpoints_doc.plan gn
    decision: {hex: "01050000000c000100024600000012000020000c0000003300010002010000004001000000100400000000000000400200000001000203000000400300000001000202000000401c000000410a000000310001000201000000400100000010000000000000000040020000001200004003000000100000000000000000401c00000041"}
    key_prefix: "/endpoint-lists/"
  # The API's documents: every Service's EndpointSlice and Endpoints,
  # rendered from it and its rows by store_stamped's EP_DOCS (on its heap:
  # a Service past a record, a Pod read for a named targetPort) and written
  # put-if-changed; a Service with no selector and no rows has this
  # controller's deleted. store_scan: a Service past the stack is read whole.
  - name: ep_api_src
    type: store_scan
    prefix: "/services/"
    watch: "/endpoint-rows/"
  - name: ep_api
    type: store_stamped
    # chronicle-source: modules/app/_chronicle/endpoints_doc.plan ad
    decision: {hex: "00090000002700010002010000004001000000101500000000000000400200000001000203000000400300000041"}
    ep_docs: "/services/|/endpoint-rows/|/pods/|/endpointslices/|/endpoints/"
    tomb: "/~tomb"
  # A managed EndpointSlice or Endpoints whose Service is gone: EP_DOCS
  # deletes it (and only one whose managed-by label is this controller's).
  - name: ep_api_slices
    type: store_scan
    prefix: "/endpointslices/"
    paths: "metadata.labels.\"endpointslice.kubernetes.io/managed-by\""
    related: "/services/:metadata.name"
    watch: "/services/"
  - name: ep_api_sgone
    type: store_stamped
    # chronicle-source: modules/app/_chronicle/endpoints_doc.plan ag
    decision: {hex: "010a00000018000100024600000012000020010002040000001200002130000900000027000100020100000040010000001015000000000000004002000000010002030000004003000000410800000023000100020100000040010000001000000000000000004002000000120000400300000041"}
    ep_docs: "/services/|/endpoint-rows/|/pods/|/endpointslices/|/endpoints/"
    tomb: "/~tomb"
  - name: ep_api_eps
    type: store_scan
    prefix: "/endpoints/"
    paths: "metadata.labels.\"endpoints.kubernetes.io/managed-by\""
    related: "/services/:metadata.name"
    watch: "/services/"
  - name: ep_api_egone
    type: store_stamped
    # chronicle-source: modules/app/_chronicle/endpoints_doc.plan ag
    decision: {hex: "010a00000018000100024600000012000020010002040000001200002130000900000027000100020100000040010000001015000000000000004002000000010002030000004003000000410800000023000100020100000040010000001000000000000000004002000000120000400300000041"}
    ep_docs: "/services/|/endpoint-rows/|/pods/|/endpointslices/|/endpoints/"
    tomb: "/~tomb"

wiring:
  - from: ep_pairs.record_out
    to: ep_probe.request_in
  - from: ep_probe.response_out
    to: ep_declared.request_in
  - from: ep_declared.response_out
    to: ep_pod.request_in
  - from: ep_pod.response_out
    to: ep_node.request_in
  - from: ep_node.response_out
    to: ep_prev.request_in
  - from: ep_prev.response_out
    to: ep_slices.request_in
  - from: ep_sl_source.record_out
    to: ep_podexists.request_in
  - from: ep_podexists.response_out
    to: ep_collect.request_in
  - from: ep_expiry_src.record_out
    to: ep_expire.request_in
  - from: ep_svcs.record_out
    to: ep_write.request_in
  - from: ep_docs.record_out
    to: ep_gone.request_in
  - from: ep_api_src.record_out
    to: ep_api.request_in
  - from: ep_api_slices.record_out
    to: ep_api_sgone.request_in
  - from: ep_api_eps.record_out
    to: ep_api_egone.request_in
