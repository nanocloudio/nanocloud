# endpoints workload graph: the endpoints controller
# as Chronicle params — Services joined to Pods by label selector, the probe
# runner's readiness folded in, per-pod slices, and /endpoints/<ns>/<svc>
# materialised from them. The store I/O is the connectors'.
target: linux
tick_us: 1000

scheduler:
  accept_cycles: true

modules:
  # Endpoints is PARAMS: Services JOIN the namespace's Pods with the label
  # selector as the join predicate and the probe runner's readiness overriding
  # the static field -> /endpointslices/<ns>/<svc>/<pod>; a slice whose Pod is
  # gone is pruned; and list_children over the slices materialises
  # /endpoints/<ns>/<svc> = "<pod>=<ip>,…" — the document the consumers parse,
  # unchanged. Params from modules/app/_chronicle/endpoints.uproc.
  - name: ep_pairs
    type: store_scan
    # store_scan: a joined Pod past the stack (a real template) is read whole
    # on the heap, or it would match no selector.
    prefix: "/services/"
    paths: "spec.selector"
    join: "/pods/"
    join_scoped: 2
    join_match: "metadata.labels:spec.selector"
    join_paths: "status.conditions[type=Ready].status,status.podIP,metadata.uid"
    watch: "/pods/,/probe-status/"
  - name: ep_probe
    type: store_effect
    # chronicle-source: modules/app/_chronicle/endpoints.uproc ak
    decision: {hex: ""}
    key_prefix: "/probe-status/"
    flat: 1
    paths: "ready"
  - name: ep_slices
    type: store_effect
    # chronicle-source: modules/app/_chronicle/endpoints.uproc sl
    decision: {hex: ""}
    key_prefix: "/endpointslices/"
  - name: ep_sl_source
    type: store_source
    prefix: "/endpointslices/"
    related: "/services/^1:metadata.name,spec.selector"
    watch: "/pods/,/services/"
  - name: ep_podexists
    type: store_effect
    # chronicle-source: modules/app/_chronicle/endpoints.uproc ex
    decision: {hex: ""}
    key_prefix: "/pods/"
  - name: ep_collect
    type: store_effect
    # chronicle-source: modules/app/_chronicle/endpoints.uproc pr
    decision: {hex: ""}
    key_prefix: "/endpointslices/"
  - name: ep_svcs
    type: store_source
    prefix: "/services/"
    paths: "spec.selector"
    list_children: "/endpointslices/"
    child_sep: "/"
    watch: "/endpointslices/"
  - name: ep_write
    type: store_effect
    # chronicle-source: modules/app/_chronicle/endpoints.uproc dc
    decision: {hex: ""}
    key_prefix: "/endpoints/"
  # A deleted Service's /endpoints/ document goes with it (its slices are
  # pruned above).
  - name: ep_docs
    type: store_source
    rev: 1
    prefix: "/endpoints/"
    related: "/services/:metadata.name"
    watch: "/services/"
  - name: ep_gone
    type: store_effect
    # chronicle-source: modules/app/_chronicle/endpoints.uproc gn
    decision: {hex: "01050000000c000100024600000012000020000c0000003300010002010000004001000000100400000000000000400200000001000203000000400300000001000202000000401c000000410a000000310001000201000000400100000010000000000000000040020000001200004003000000100000000000000000401c00000041"}
    key_prefix: "/endpoints/"

wiring:
  - from: ep_pairs.record_out
    to: ep_probe.request_in
  - from: ep_probe.response_out
    to: ep_slices.request_in
  - from: ep_sl_source.record_out
    to: ep_podexists.request_in
  - from: ep_podexists.response_out
    to: ep_collect.request_in
  - from: ep_svcs.record_out
    to: ep_write.request_in
  - from: ep_docs.record_out
    to: ep_gone.request_in
