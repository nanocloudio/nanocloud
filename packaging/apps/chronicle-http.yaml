# Chronicle as a workload image: wave's `http` terminating HTTP/1.1 on the
# node's network through a lane of the Pod's own (`net:0`), and a Chronicle
# `pipeline` answering every request — the http_bench one-node page
# (chronicle/examples/http_bench/one_node.yaml), its programs as blob params.
#
# Plain HTTP: a published image carries no key. TLS for a Pod's listener is
# the node's to certify (a vault-born key and the cluster's authority), which
# this image does not presume.
#
#   fluxor build packaging/apps/chronicle-http.yaml --emit=workload -o <dir>
#   fluxor publish workload <dir>     (registry.nanocloud.io/nanocloud/chronicle-http)
target: linux
tick_us: 1000
modules: []
wiring: []
workloads:
  - modules:
      - name: http
        type: http
        port: 8080
        routes:
          - path: "/"
            app: true
      - name: engine
        type: pipeline
        params:
          id_field: 1
          method_field: 2
          target_field: 3
          status_field: 4
          content_type: "text/html"
          answer: 1
          ir_stages: {hex: "01ff1b0005000101000000120100000001c800000000000000120400000013"}
          # The body: the same literal page the baseline route serves.
          encode: {hex: ""}
    wiring:
      # The node's network, through the Pod's lane 0.
      - from: "net:0"
        to: http
      - from: http
        to: "net:0"
      # http.request_out (6) -> engine.request_in (2); engine.response_out
      # (2) -> http.response_in (6): each request an exchange, answered once.
      - from: http
        from_port: 6
        to: engine
        to_port: 2
      - from: engine
        from_port: 2
        to: http
        to_port: 6
