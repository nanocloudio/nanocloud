# Chronicle as a workload image: wave's `http` terminating HTTP/1.1 on the
# node's network through a lane of the Pod's own (its `linux_net` wires), and
# a Chronicle `pipeline` answering every request — the http_bench one-node page
# (chronicle/examples/http_bench/one_node.yaml), its programs as blob params.
#
# Plain HTTP: a published image carries no key. TLS for a Pod's listener is
# the node's to certify (a vault-born key and the cluster's authority), which
# this image does not presume.
#
#   fluxor build packaging/apps/chronicle-http.yaml --emit=workload -o <dir>
#   fluxor publish workload <dir>     (registry.nanocloud.io/nanocloud/chronicle-http)
target: linux
tick_us: 1000
modules: []
wiring: []
workloads:
  - modules:
      - name: http
        type: http
        port: 8080
        routes:
          - path: "/"
            app: true
      - name: engine
        type: pipeline
        params:
          id_field: 1
          method_field: 2
          target_field: 3
          status_field: 4
          content_type: "text/html"
          answer: 1
          ir_stages: {hex: "01ff1b0005000101000000120100000001c800000000000000120400000013"}
          # The body: the same literal page the baseline route serves.
          encode: {hex: ""}
    wiring:
      # The node's network, through the Pod's own lane.
      - from: linux_net.net_out
        to: http.net_in
      - from: http.net_out
        to: linux_net.net_in
      # Each request an exchange, answered once.
      - from: http.request_out
        to: engine.request_in
      - from: engine.response_out
        to: http.response_in
