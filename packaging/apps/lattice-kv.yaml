# Lattice as a workload image: a standalone key-value node speaking RESP —
# redis_edge_anchor on the node's network through a lane of the Pod's own
# (its `linux_net` wires), kv_request_router, the state machine with its disk
# store and command log (`state_store: 1`, `command_log: 1`), and the TTL
# clock: lattice's configs/single-minimal-disk-log.yaml, derived by
# scripts/support/to-workload.py.
#
# Its store lives in the workload's own storage, rooted at its owner
# (fluxor 812bdbe9 — $FLUXOR_OWNER_ROOT/<identity>/), which a node restart
# keeps and only the workload's DESTROY removes. A Pod's identity is its UID,
# so that storage is ephemeral, as an emptyDir is upstream: a power cut keeps
# it, a delete ends it, and a Pod made again (rescheduled, rolled, a new UID)
# starts empty. Data that must outlive the Pod belongs in a
# PersistentVolumeClaim.
#
#   fluxor build packaging/apps/lattice-kv.yaml --emit=workload -o <dir>
#   fluxor publish workload <dir>     (registry.nanocloud.io/nanocloud/lattice-kv)
target: linux
tick_us: 1000
modules: []
wiring: []
workloads:
- modules:
  - name: redis_edge_anchor
    params:
      listen_port: 6379
    type: redis_edge_anchor
  - name: kv_request_router
    type: kv_request_router
  - name: kv_state_worker
    params:
      state_store: 1
      command_log: 1
      # The store at the root of the Pod's own files (as on a board's FAT32):
      # nothing pre-creates a `lattice/` directory inside a workload.
      root_path: 1
    type: kv_state_worker
  - name: ttl_scheduler
    params:
      propose_wrap: 0
    type: ttl_scheduler
  wiring:
  - from: linux_net.net_out
    to: redis_edge_anchor.net_in
  - from: redis_edge_anchor.net_out
    to: linux_net.net_in
  - from: redis_edge_anchor.kv_out
    to: kv_request_router.redis_in
  - from: kv_request_router.redis_out
    to: redis_edge_anchor.kv_in
  - from: kv_request_router.kv_out
    to: kv_state_worker.commands
  - from: kv_state_worker.responses
    to: kv_request_router.kv_in
  - from: ttl_scheduler.propose_out
    to: kv_state_worker.commands
  - from: ttl_scheduler.propose_out
    to: ttl_scheduler.tick_in
  - from: kv_state_worker.expiry_out
    to: ttl_scheduler.kv_expiry
  - from: kv_state_worker.sweep_out
    to: kv_state_worker.commands
  - from: ttl_scheduler.expire_out
    to: kv_state_worker.expire
