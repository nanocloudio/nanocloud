# Nanocloud project config consumed by the `fluxor` CLI. See
# ~/Development/nanocloudio/standards/{ci,fluxor-modules,tests,lints,dependencies}.md
# for the schema each table belongs to.

# Project identity (standards/dependencies.md §2.1).
[project]
name    = "nanocloud"
version = "0.0.1"

# Cross-project dependencies (standards/dependencies.md §2.2). Resolves
# fluxor's published source crates and fmod palette via the local registry.
# PIC modules in `modules/app/*/mod.rs` consume the materialised SDK source
# at `target/fluxor/fluxor-abi/sdk/<file>.rs` (populated by `fluxor sync`).
[dependencies]
fluxor = "0.0.1"
wave = "0.0.1"
chronicle = "0.0.1"
# kagi owns the identity protocols, and nanocloud's connectors speak them rather
# than reimplementing them: `authn` compiles kagi's own `kagi-common` fragments
# (`jose`, `verify_keyset`, `auth_wire`, `b64`) to decide whether a credential
# is genuine, and ServiceAccount tokens are minted by kagi's `token_mint` in its
# wire format. What nanocloud keeps is the question "is this caller allowed to
# do this" — not the cryptography behind the answer.
kagi = "0.0.1"
# lattice's storage engine is the control plane's store: its state worker
# serves fluxor's storage.object / storage.namespace contracts
# (`kv_state_worker_store`), durable on its own command log.
lattice = "0.0.1"
# loam owns the volume protocols: the encrypted-volume connectors compile its
# own admin wire and volume-map codec (`loam-common`) to drive a volume's
# lease, creation, snapshots and deletion, rather than restating them.
loam = "0.0.1"
# clustor replicates that store: its consensus, durability and peer links
# carry every write through one log, so the control plane (the voter) and
# each node (a learner) hold the same store, and a node's writes are decided
# by the control plane.
clustor = "0.0.1"

# Bundles the e2e scripts run by name, which no graph names: loam's admin
# plane (`fluxor run loam-admin`, scripts/support/loam-admin.sh) and its
# operator applet (`fluxor install loam`). `fluxor update` pins each from
# loam's published index.
[uses]
bundles = ["loam-admin", "loam"]

[ci]
# Module targets to build in CI. Nanocloud nodes are Pi 5; the deb
# ships `bcm2712` `.fmod` artefacts run as PIC on linux/aarch64.
targets = ["bcm2712"]

[ci.test]
# The runtime test gate: graph E2Es that boot the built `.fmod` artefacts and
# drive them (real HTTP, the store seam, mTLS). `fluxor ci` runs each after the
# strict module build, so `make ci` is the full gate (lint + build +
# behaviour), not lint/build alone. `make test` runs the same scripts
# standalone. The shared no_std cores (`modules/app/_shared/`) are also tested
# on the host: `tests/harness` (shadow-tracked) mounts them, and `fluxor ci`'s
# `cargo-test (harness)` phase runs it.
scripts = ["scripts/*-e2e.sh"]

[ci.hygiene]
# nanocloud is fluxor-only — no host `src/` crate. Every PIC fmod under
# `modules/` is `no_std`, where an inline `#[cfg(test)]` block compiles away
# silently and a green run would mean nothing, so inline tests are banned there.
# Behaviour is proven by the graph E2Es (`scripts/*-e2e.sh`, `make test`) and
# the shared cores by `tests/harness`.
forbid_inline_tests = ["modules"]

# Every module mounts the SDK wholesale: `include!` of `runtime.rs` and a
# `#[path]` mod of `abi.rs` put the ENTIRE ABI surface into each compile —
# every contract, every platform, including targets this module never runs on.
# One module uses a handful of it, so a compile without the suppression carries
# ~1100 dead-code warnings, all but a couple of them from the mounted source
# rather than from the module. There is no item to move an attribute onto,
# which is what this declaration is for.
[[ci.hygiene.allow_crate_root]]
prefix = "modules/"
reason = """PIC modules mount the SDK wholesale via include!, so each compile sees the entire surface and uses a subset."""

[[ci.hygiene.allow_crate_root]]
prefix = "tests/harness/"
reason = """The harness suites mount the modules' shared cores (`modules/app/_shared/*.rs`) via include! — the code under test is the code that ships — and each suite uses a subset of what it mounts. Shadow-tracked (../standards/test-tracking.md §1)."""
